# media recipe: GStreamer good plug-ins for common containers, codecs and audio output.
# VP8/VP9 and Vorbis/Opus are provided by separately packaged codec libraries.
[package]
name = "gst-plugins-good"
version = "1.28.9"
rel = 1
arch = ["x86_64"]
summary = "GStreamer good plug-ins for common audio and video formats"
license = ["LGPL-2.1-or-later"]
source = "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-%{version}.tar.xz"
sha256 = "e518cd97483706a252e95e60312a22d23dec6f5e7673af6f5bde719c3a9ca7f4"
source_dir = "gst-plugins-good-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "gstreamer", "gst-plugins-base", "gdk-pixbuf", "libjpeg-turbo", "libpng", "libpulse", "libvpx"]
run = ["gstreamer", "gst-plugins-base", "gdk-pixbuf", "libjpeg-turbo", "libpng", "libpulse", "libvpx"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nodownload -Dauto_features=disabled -Dtests=disabled -Dexamples=disabled -Dintrospection=disabled -Ddoc=disabled -Dnls=disabled -Dorc=disabled -Davi=enabled -Dflv=enabled -Disomp4=enabled -Dmatroska=enabled -Daudioparsers=enabled -Dwavparse=enabled -Dwavenc=enabled -Did3demux=enabled -Drtp=enabled -Drtpmanager=enabled -Drtsp=enabled -Dudp=enabled -Dgdk-pixbuf=enabled -Djpeg=enabled -Dpng=enabled -Dpulse=enabled -Dvpx=enabled -Dgtk3=disabled -Dqt5=disabled -Dsoup=disabled -Dflac=disabled -Dmpg123=disabled -Dv4l2=disabled"
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build
for plugin in isomp4 matroska vpx pulse; do
    test -e "%{pkgdir}/usr/lib/gstreamer-1.0/libgst${plugin}.so" || {
        echo "gst-plugins-good: missing libgst${plugin}.so" >&2
        exit 1
    }
done'''
