# mate recipe: atril — MATE document viewer
# PDF, PostScript, comics, and image documents. AUTOTOOLS, not meson: the
# meson.build in the tarball falls back to a git fetch of mate-submodules,
# which is forbidden offline. PDF support stays ON via poppler (without it
# atril builds crippled, comics backend only). Introspection defaults off
# in configure.ac, and the Caja extension stays on (caja is built in this
# same category). The djvu, dvi, XPS, and PostScript backends auto-disable:
# libspectre, djvulibre, libgxps, and kpathsea have no recipes.
[package]
name = "atril"
version = "1.28.7"
rel = 2
arch = ["x86_64"]
summary = "MATE document viewer (PDF, PostScript, comics, and more)"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "atril"
url = "https://github.com/mate-desktop/atril/releases/download/v%{version}/atril-%{version}.tar.xz"
sha256 = "91942545e858cb0036b52e2f5d4372cdea813d9fde9702daefdf84854e6bb667"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool", "pkgconf", "gettext", "glib", "gtk3", "cairo", "libxml2", "mate-desktop", "libX11", "zlib", "libSM", "libICE", "libsecret", "caja", "poppler", "libarchive"]
run = ["glib", "gtk3", "cairo", "libxml2", "mate-desktop", "libX11", "libSM", "libICE", "libsecret", "caja", "poppler", "libarchive", "zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --enable-pdf"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
