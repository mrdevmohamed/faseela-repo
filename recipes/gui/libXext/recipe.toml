# gui recipe: libXext — X11 miscellaneous extensions library
[package]
name = "libXext"
version = "1.3.6"
rel = 2
arch = ["x86_64"]
summary = "X11 miscellaneous extensions library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libxext"
url = "https://xorg.freedesktop.org/archive/individual/lib/libXext-%{version}.tar.xz"
sha256 = "edb59fa23994e405fdc5b400afdf5820ae6160b94f35e3dc3da4457a16e89753"
strip_components = 1

[depends]
build = ["pkgconf", "xorgproto", "libX11"]
run = ["libX11"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
