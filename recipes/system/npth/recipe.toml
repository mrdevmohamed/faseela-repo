# system recipe: npth — portable threading library used by GnuPG.
[package]
name = "npth"
version = "1.8"
rel = 1
arch = ["x86_64"]
summary = "New GNU Portable Threads library"
license = ["LGPL-2.1-or-later"]
source = "https://gnupg.org/ftp/gcrypt/npth/npth-%{version}.tar.bz2"
sha256 = "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
