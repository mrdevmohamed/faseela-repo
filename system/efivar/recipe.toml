# system recipe: efivar — UEFI variable libraries and utilities
[package]
name = "efivar"
version = "39"
rel = 1
arch = ["x86_64"]
summary = "Libraries and tools to manage UEFI variables"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/rhboot/efivar/archive/%{version}.tar.gz"
sha256 = "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6"

[depends]
build = ["pkgconf"]
run = []

[build]
# The upstream default is lib64; Faseela uses /usr/lib.
compile = "make -j%{jobs} ENABLE_DOCS=0 LIBDIR=/usr/lib"
install = "make DESTDIR=%{pkgdir} ENABLE_DOCS=0 LIBDIR=/usr/lib install"
