# system recipe: wpa_supplicant — Wi-Fi authentication, driven with wpa_cli.
# nl80211 + D-Bus control interface for NetworkManager integration.
# Unit is available but not enabled: systemctl enable --now wpa_supplicant@wlan0
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r wpa_supplicant` pins it.
[package]
name = "wpa_supplicant"
version = "2.12"
rel = 5
arch = ["x86_64"]
summary = "WPA/WPA2/WPA3 supplicant for Wi-Fi (nl80211, OpenSSL, D-Bus control interface)"
license = ["BSD-3-Clause"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "wpa_supplicant"
url = "https://w1.fi/releases/wpa_supplicant-%{version}.tar.gz"
sha256 = "08e23937e16d0155e55cab2b51f51fbe10d80a1aa91c4e15442645059b737ef6"
strip_components = 1

[depends]
build = ["libnl", "openssl", "readline", "pkgconf", "dbus"]
run = ["libnl", "openssl", "readline", "dbus-system"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''
cd wpa_supplicant
cp defconfig .config
# nl80211 through libnl3, wpa_cli with readline
sed -i -e 's/^#CONFIG_LIBNL32=y/CONFIG_LIBNL32=y/' -e 's/^#CONFIG_READLINE=y/CONFIG_READLINE=y/' .config
# D-Bus control interface ON: NetworkManager drives wpa_supplicant through it
sed -i -e 's/^#CONFIG_CTRL_IFACE_DBUS_NEW=y/CONFIG_CTRL_IFACE_DBUS_NEW=y/' .config
grep -q '^CONFIG_LIBNL32=y' .config
grep -q '^CONFIG_DRIVER_NL80211=y' .config
'''
compile = "cd wpa_supplicant && make -j%{jobs} BINDIR=/usr/bin LIBDIR=/usr/lib"
install = '''
cd wpa_supplicant
install -Dm755 wpa_supplicant %{pkgdir}/usr/bin/wpa_supplicant
install -Dm755 wpa_cli        %{pkgdir}/usr/bin/wpa_cli
install -Dm755 wpa_passphrase %{pkgdir}/usr/bin/wpa_passphrase
# pre-generated man pages in the release tarball
for m in wpa_supplicant.8:man8 wpa_cli.8:man8 wpa_passphrase.8:man8 wpa_supplicant.conf.5:man5; do
    f=doc/docbook/${m%%:*}; d=${m##*:}
    [ -f "$f" ] && install -Dm644 "$f" %{pkgdir}/usr/share/man/$d/${m%%:*}
done
install -d -m755 %{pkgdir}/usr/share/dbus-1/system.d %{pkgdir}/usr/share/dbus-1/system-services %{pkgdir}/etc/wpa_supplicant
cat > %{pkgdir}/etc/wpa_supplicant/wpa_supplicant.conf <<'CONF'
# /etc/wpa_supplicant/wpa_supplicant.conf
# Add networks with wpa_cli (as root or in group wheel):
#   wpa_cli add_network / set_network 0 ssid '"name"' / set_network 0 psk '"pass"'
#   wpa_cli enable_network 0 && wpa_cli save_config
ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1
CONF
chmod 0600 %{pkgdir}/etc/wpa_supplicant/wpa_supplicant.conf
install -Dm644 dbus/dbus-wpa_supplicant.conf %{pkgdir}/usr/share/dbus-1/system.d/wpa_supplicant.conf
install -Dm644 dbus/fi.w1.wpa_supplicant1.service %{pkgdir}/usr/share/dbus-1/system-services/fi.w1.wpa_supplicant1.service
install -d -m755 %{pkgdir}/usr/lib/systemd/system
# One instance per wireless interface: systemctl enable --now wpa_supplicant@wlan0
# (networkd then configures the address, see systemd-units). NetworkManager starts
# its own wpa_supplicant through the D-Bus activation file installed above, so do
# not enable an instance for an interface that NetworkManager manages.
cat > %{pkgdir}/usr/lib/systemd/system/wpa_supplicant@.service <<'EOF'
[Unit]
Description=WPA supplicant for %I
Requires=sys-subsystem-net-devices-%i.device
After=sys-subsystem-net-devices-%i.device
Before=network.target
Wants=network.target

[Service]
Type=simple
ExecStart=/usr/bin/wpa_supplicant -c /etc/wpa_supplicant/wpa_supplicant.conf -i %I
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF
'''

[hooks]
post_install = '''
echo "wpa_supplicant: enable per interface with  systemctl enable --now wpa_supplicant@wlan0  (networkd then gets the address)"
'''
