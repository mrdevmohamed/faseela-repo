# cosmic recipe: cosmic-osk — COSMIC on-screen keyboard for accessibility
# and touch-first input. Built from the coordinated Epoch 1.11.0 source tag.
[package]
name = "cosmic-osk"
version = "1.11.0"
rel = 1
arch = ["x86_64"]
summary = "COSMIC on-screen keyboard"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-osk"
url = "https://codeload.github.com/pop-os/cosmic-osk/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "bdb94386f451e672c2512ddb65bd0c8691921d5488595d0988fd935ce7e43bb6"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon", "systemd", "mesa"]
run = ["wayland", "libxkbcommon", "systemd", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-osk"
install = '''
install -Dm755 target/release/cosmic-osk %{pkgdir}/usr/bin/cosmic-osk
'''
