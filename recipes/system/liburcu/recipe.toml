# system recipe: Userspace RCU (read-copy-update) library.
# Required by current BIND 9.20 utilities for lock-free data structures.
[package]
name = "liburcu"
version = "0.15.7"
rel = 1
arch = ["x86_64"]
summary = "Userspace RCU (read-copy-update) library"
license = ["LGPL-2.1-or-later"]
source = "https://lttng.org/files/urcu/userspace-rcu-%{version}.tar.bz2"
sha256 = "2556b83adc0f9b3ac8024e613e17d014d04c4c49110604ce55fcb14eae32edd3"
source_dir = "userspace-rcu-%{version}"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
