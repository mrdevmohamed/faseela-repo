# gui recipe: libXau — X11 authorization protocol library
[package]
name = "libXau"
version = "1.0.11"
rel = 1
arch = ["x86_64"]
summary = "X11 authorization protocol library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXau-%{version}.tar.xz"
sha256 = "f3fa3282f5570c3f6bd620244438dbfbdd580fc80f02f549587a0f8ab329bbeb"

[depends]
build = ["pkgconf", "xorgproto"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
