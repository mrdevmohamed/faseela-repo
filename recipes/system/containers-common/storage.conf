# Faseela container storage defaults.
# Native OverlayFS is preferred. containers/storage can discover fuse-overlayfs
# automatically when the kernel/filesystem cannot provide rootless overlay.
#
# graphroot and runroot are intentionally NOT set. Podman 6.x applies a
# configured graphroot to rootless users too, which breaks them with
# "mkdir /var/lib/containers/storage: permission denied". Leaving them unset
# lets the built-in defaults pick /var/lib/containers/storage and
# /run/containers/storage for root, and per-user paths under
# ~/.local/share/containers/storage for unprivileged users.
# rootless_storage_path is deprecated and must not be used.

[storage]
driver = "overlay"

[storage.options.overlay]
mountopt = "nodev"
