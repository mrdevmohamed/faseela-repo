# unity recipe: perl-file-sharedir-install — build-time helper XML::Parser's Makefile.PL loads
[package]
name = "perl-file-sharedir-install"
version = "0.14"
rel = 2
arch = ["x86_64"]
summary = "Install shared files with ExtUtils::MakeMaker (pure Perl)"
license = ["Artistic-1.0-Perl", "GPL-1.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "perl-file-sharedir-install"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/libf/libfile-sharedir-install-perl/libfile-sharedir-install-perl_%{version}.orig.tar.gz"
sha256 = "8f9533b198f2d4a9a5288cbc7d224f7679ad05a7a8573745599789428bc5aea0"
strip_components = 1

[depends]
build = ["perl"]
run = ["perl"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "perl Makefile.PL INSTALLDIRS=vendor"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
find %{pkgdir} -name perllocal.pod -delete
test -n "$(find %{pkgdir}/usr -name Install.pm -path '*File/ShareDir*')"
'''
