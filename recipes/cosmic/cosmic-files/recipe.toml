# cosmic recipe: cosmic-files — COSMIC file manager.
# Default features enable gvfs (glib/gio for mount and trash monitoring),
# bzip2 archive support and the wgpu renderer fallback; gio volume monitoring
# is completed at runtime by GVfs talking to UDisks2.
[package]
name = "cosmic-files"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC file manager"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-files"
url = "https://codeload.github.com/pop-os/cosmic-files/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "83d30eb99c5888bab4322361553796efee34b6f3af71a0845396378106d66e83"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "glib", "bzip2", "wayland", "libxkbcommon"]
run = ["glib", "bzip2", "wayland", "mesa", "libxkbcommon", "gvfs", "udisks2", "cosmic-icons", "hicolor-icon-theme", "shared-mime-info", "dbus", "xdg-desktop-portal-cosmic"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-files --bin cosmic-files-applet"
install = '''
install -Dm755 target/release/cosmic-files %{pkgdir}/usr/bin/cosmic-files
install -Dm755 target/release/cosmic-files-applet %{pkgdir}/usr/bin/cosmic-files-applet
install -Dm644 target/xdgen/com.system76.CosmicFiles.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicFiles.desktop
install -Dm644 target/xdgen/com.system76.CosmicFiles.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicFiles.metainfo.xml
if [ -d res/icons/hicolor ]; then
    find res/icons/hicolor -type f | while read -r f; do
        rel=${f#res/icons/hicolor/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
