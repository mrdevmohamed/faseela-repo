# creative recipe: pdfcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "pdfcraft"
version = "0.17.0"
rel = 1
arch = ["x86_64"]
summary = "Native PDF reader, editor, forms and signing workbench"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/pdfcraft/releases/download/v0.17.0/pdfcraft-0.17.0-linux-x86_64.tar.gz"
sha256 = "f9814a7a0af77b905adba1c3079caedee537586797043cf5af9503914f6abec5"
source_dir = "pdfcraft-0.17.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland"]

[build]
install = """
set -eu
if [ ! -d usr/bin ]; then
    echo "pdfcraft: upstream archive has no usr/bin directory" >&2
    exit 1
fi
install -d -m755 "%{pkgdir}/usr"
cp -a usr/. "%{pkgdir}/usr/"
"""
