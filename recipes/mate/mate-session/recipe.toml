# mate recipe: mate-session — MATE desktop session: LightDM + Xorg, MATE 1.28 core and apps
# meta package in the gui-session style: no upstream source, only
# configuration and service wiring on top of the real packages.
# NOTE: LightDM is packaged but NOT pre-enabled here (same as xfce-session):
# the graphical login stays a manual step until the Xorg privilege path is
# validated for MATE.
[package]
name = "mate-session"
version = "0.1"
rel = 2
arch = ["x86_64"]
source_date_epoch = 1767225600
summary = "MATE 1.28 X11 session integration and core desktop components"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[depends]
build = []
run = ["marco", "mate-session-manager", "mate-settings-daemon", "mate-desktop", "mate-menus", "caja", "mate-terminal", "engrampa", "mate-screensaver", "mate-power-manager", "mate-panel", "mate-control-center", "atril", "eom", "pluma", "mate-media", "mate-system-monitor", "mate-polkit", "polkit", "network-manager", "network-manager-applet", "bluez", "udisks2", "gvfs", "xdg-desktop-portal", "xdg-desktop-portal-gtk", "faseela-branding", "audio-session", "xorg-server", "xkeyboard-config", "xkbcomp", "xorg-setxkbmap", "mesa", "dejavu-fonts", "noto-fonts", "noto-fonts-arabic"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = '''
# --- Xorg keyboard layout: US + Arabic, Alt+Shift toggles --------------------
# Xorg reads /etc/X11/xorg.conf.d/*.conf at server start; this mirrors the
# gui-session sway drop-in so both desktops behave the same.
install -d -m755 %{pkgdir}/etc/X11/xorg.conf.d
cat > %{pkgdir}/etc/X11/xorg.conf.d/00-faseela-keyboard.conf <<'KBD'
Section "InputClass"
    Identifier "faseela-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us,ara"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
KBD
chmod 644 %{pkgdir}/etc/X11/xorg.conf.d/00-faseela-keyboard.conf

# MATE's XDG autostart launches the shared per-user audio supervisor.
install -d -m755 %{pkgdir}/etc/xdg/autostart
cat > %{pkgdir}/etc/xdg/autostart/faseela-audio-session.desktop <<'DESKTOP'
[Desktop Entry]
Type=Application
Name=Faseela Audio Session
Comment=Start PipeWire audio services for this desktop session
Exec=/usr/bin/faseela-audio-session
TryExec=/usr/bin/faseela-audio-session
OnlyShowIn=MATE;
NoDisplay=true
X-GNOME-Autostart-enabled=true
DESKTOP
chmod 644 %{pkgdir}/etc/xdg/autostart/faseela-audio-session.desktop
'''

[hooks]
post_install = '''
for socket_dir in /tmp/.X11-unix /tmp/.ICE-unix; do
    mkdir -p "$socket_dir"
    chown root:root "$socket_dir"
    chmod 1777 "$socket_dir"
done

for group in video render input audio; do
    /usr/libexec/faseela/ensure-system-account group "$group"
done

echo "mate-session: add your user to video,render,input,audio for Xorg device access."
echo "mate-session: LightDM is optional; install lightdm and lightdm-gtk-greeter for a graphical login."
'''
