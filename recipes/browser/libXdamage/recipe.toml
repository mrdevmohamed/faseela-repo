# browser recipe: libXdamage — X Damage extension client library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXdamage"
version = "1.1.6"
rel = 1
arch = ["x86_64"]
summary = "X Damage extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXdamage-%{version}.tar.xz"
sha256 = "52733c1f5262fca35f64e7d5060c6fcd81a880ba8e1e65c9621cf0727afb5d11"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXfixes"]
run = ["libX11", "libXfixes"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
