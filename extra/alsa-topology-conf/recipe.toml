# extra recipe: alsa-topology-conf — ALSA topology configuration files.
# alsa-lib's topology API (used by SOF and ASoC tooling) reads these. Data only.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r alsa-topology-conf` pins it.
[package]
name = "alsa-topology-conf"
version = "1.2.5.1"
rel = 1
arch = ["x86_64"]
summary = "ALSA topology configuration files"
license = ["BSD-3-Clause"]
source = "https://www.alsa-project.org/files/pub/lib/alsa-topology-conf-%{version}.tar.bz2"
sha256 = "f7c5bae1545abcd73824bc97f4e72c340e11abea188ba0f1c06f5e0ad776b179"

[depends]
build = []
run = []

[build]
install = '''
install -d -m755 %{pkgdir}/usr/share/alsa
cp -a topology %{pkgdir}/usr/share/alsa/
'''
