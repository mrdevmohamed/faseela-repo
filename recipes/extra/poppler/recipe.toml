# extra recipe: poppler — PDF rendering library
[package]
name = "poppler"
version = "26.11.0"
rel = 2
arch = ["x86_64"]
summary = "PDF rendering library"
license = ["GPL-2.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "poppler"
url = "https://poppler.freedesktop.org/poppler-%{version}.tar.xz"
sha256 = "41c32680160addf5a8dd7a830e4869c01e9f6bee1abb91e44fabd1ba9d7828fb"
strip_components = 1

[depends]
build = ["cmake", "ninja", "pkgconf", "glib", "cairo", "freetype", "fontconfig", "libjpeg-turbo", "libpng", "zlib", "curl", "nss", "lcms2"]
run = ["glib", "cairo", "freetype", "fontconfig", "libjpeg-turbo", "libpng", "zlib", "curl", "nss", "lcms2"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DENABLE_GLIB=ON -DENABLE_QT5=OFF -DENABLE_QT6=OFF -DENABLE_LIBTIFF=OFF -DENABLE_GPGME=OFF -DENABLE_GOBJECT_INTROSPECTION=OFF -DENABLE_NSS3=ON -DENABLE_CPP=ON -DENABLE_UTILS=ON -DENABLE_UNSTABLE_API_ABI_HEADERS=OFF -DBUILD_GTK_TESTS=OFF -DBUILD_CPP_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF -DENABLE_ZLIB=ON -DENABLE_LIBCURL=ON -DENABLE_LIBOPENJPEG=OFF -DENABLE_CMS=ON -DENABLE_DCTDECODER=OFF -DENABLE_RELOCATABLE=OFF -DUSE_FIXEDPOINT=OFF -DUSE_FLOAT=ON"
compile = "cmake --build build -j%{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
