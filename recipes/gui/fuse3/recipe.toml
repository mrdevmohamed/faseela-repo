# gui recipe: fuse3 — Filesystem in Userspace library and helper.
[package]
name = "fuse3"
version = "3.18.3"
rel = 4
arch = ["x86_64"]
summary = "Filesystem in Userspace library and mount helper"
license = ["LGPL-2.1-or-later", "GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "fuse3"
url = "https://github.com/libfuse/libfuse/releases/download/fuse-%{version}/fuse-%{version}.tar.gz"
sha256 = "bcd19582c5e30f7fe45dd86a5540e998590aa01903afc7ebcbeea6c8ac5421ee"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "sed -i '/mknod .*dev\\/fuse/d' util/install_helper.sh && meson setup build --prefix=/usr --libdir=lib --buildtype=release -D utils=true -D examples=false -D tests=false -D udevrulesdir=/usr/lib/udev/rules.d -D initscriptdir= -D useroot=true"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"

[hooks]
# fusermount3 must remain a setuid-root helper after Nawa's install/slim phase.
# This is the privilege boundary required for unprivileged FUSE mounts.
post_install = '''
test -x /usr/bin/fusermount3 || {
    echo "fuse3: /usr/bin/fusermount3 is missing" >&2
    exit 1
}
chown root:root /usr/bin/fusermount3
chmod 4755 /usr/bin/fusermount3
'''
