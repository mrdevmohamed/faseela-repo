# gui recipe: libxshmfence — shared memory fence synchronization library
# The DRI3 extension's swap barrier primitive. Xwayland links it for GLX and
# DRI3; it has no dependencies beyond glibc itself.
[package]
name = "libxshmfence"
version = "1.3.3"
rel = 1
arch = ["x86_64"]
summary = "libxshmfence — the X11 shared-memory fence library (Xwayland DRI3 dependency)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libxshmfence-%{version}.tar.xz"
sha256 = "d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10"
source_dir = "libxshmfence-%{version}"

[depends]
build = ["pkgconf", "xorgproto"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-docs --disable-devel-docs"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
