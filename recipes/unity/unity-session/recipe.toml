# unity recipe: unity-session — LightDM session entry and systemd user session for Unity 7
# Native Ubuntu tarball (data files only). Ubuntu's unity-session.service starts
# cinnamon-session as the session leader; Faseela does not ship cinnamon, so the
# unit instead keeps a plain `sleep infinity` as leader. Logging out stops that
# unit (systemctl --user stop unity-session.service), which tears the session down.
[package]
name = "unity-session"
version = "49.4"
rel = 2
arch = ["x86_64"]
summary = "Unity 7 session files for LightDM (systemd user session)"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "unity-session"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/u/unity-session/unity-session_49.4.tar.xz"
sha256 = "07d4d03eabd1af911323e5c8c378037319874bb4e19286d8408e81ed67240966"
strip_components = 1

[depends]
build = ["glib"]
run = ["unity", "unity-settings-daemon", "systemd", "dbus", "gsettings-desktop-schemas", "coreutils"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[hooks]
post_install = "glib-compile-schemas /usr/share/glib-2.0/schemas"
post_remove = "glib-compile-schemas /usr/share/glib-2.0/schemas"

[build]
configure = "true"
compile = "true"
install = '''set -eu
# session entry point: import the login environment into the systemd/D-Bus user
# manager first (Ubuntu does this from Xsession.d), then run the target
install -d %{pkgdir}/usr/bin
cat > %{pkgdir}/usr/bin/unity-session <<'ENTRY'
#!/bin/sh
export XDG_CURRENT_DESKTOP="Unity:Unity7"
export XDG_SESSION_DESKTOP=unity
export XDG_SESSION_TYPE=x11
export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"
dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_SESSION_ID XDG_SEAT XDG_VTNR
exec /usr/libexec/run-systemd-session unity-session.target "$@"
ENTRY
chmod 0755 %{pkgdir}/usr/bin/unity-session
install -D -m 0755 run-systemd-session %{pkgdir}/usr/libexec/run-systemd-session
install -D -m 0644 unity-session.target %{pkgdir}/usr/lib/systemd/user/unity-session.target
install -D -m 0644 unity.desktop %{pkgdir}/usr/share/xsessions/unity.desktop
install -D -m 0644 50-unity.conf %{pkgdir}/usr/share/lightdm/lightdm.conf.d/50-unity.conf
# session leader without cinnamon-session
cat > %{pkgdir}/usr/lib/systemd/user/unity-session.service <<'UNIT'
[Unit]
Description=Unity Session Manager
PartOf=graphical-session.target

[Service]
ExecStart=/usr/bin/sleep infinity
UNIT
# only the keybinding overrides: org.onboard is not part of Faseela
install -d %{pkgdir}/usr/share/glib-2.0/schemas
sed -e '/^\[org.onboard:Unity\]$/,/^$/d' 21_ubuntu-unity.gschema.override > %{pkgdir}/usr/share/glib-2.0/schemas/21_ubuntu-unity.gschema.override
grep -q 'org.gnome.desktop.wm.keybindings:Unity' %{pkgdir}/usr/share/glib-2.0/schemas/21_ubuntu-unity.gschema.override
test -x %{pkgdir}/usr/bin/unity-session
'''
