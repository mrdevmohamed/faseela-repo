# system recipe: keyutils — kernel key-retention library and utilities.
# Supplies keyutils.h and libkeyutils for libblockdev's crypto plugin.
[package]
name = "keyutils"
version = "1.6.3"
rel = 1
arch = ["x86_64"]
summary = "Linux kernel key retention utilities and library"
license = ["LGPL-2.1-or-later"]
source = "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/snapshot/keyutils-%{version}.tar.gz"
sha256 = "a61d5706136ae4c05bd48f86186bcfdbd88dd8bd5107e3e195c924cfc1b39bb4"

[depends]
build = []
run = []

[build]
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} NO_ARLIB=1 LIBDIR=/usr/lib BINDIR=/usr/bin SBINDIR=/usr/sbin install"
