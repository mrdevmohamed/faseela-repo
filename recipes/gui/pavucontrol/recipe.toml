# gui recipe: pavucontrol — PulseAudio volume control (GTK)
# The volume mixer gui-session installs: speaks to pipewire-pulse through
# libpulse. 5.0 is the last release on the gtkmm 3 stack (6.x needs GTK 4,
# which this tree does not package). intltool needs perl's XML::Parser to
# merge translations into the desktop file; neither perl modules nor
# intltool itself are packaged, so the install script writes the desktop
# file directly from the .in template instead of going through the
# INTLTOOL_DESKTOP_RULE, and _RAWDATADIR_ etc. are substituted by hand the
# same way intltool-merge would. NLS stays off.
[package]
name = "pavucontrol"
version = "5.0"
rel = 1
arch = ["x86_64"]
summary = "pavucontrol — PulseAudio volume control for the PipeWire compatibility server"
license = ["GPL-2.0-or-later"]
source = "https://deb.debian.org/debian/pool/main/p/pavucontrol/pavucontrol_5.0.orig.tar.xz"
sha256 = "7aea10913916b98f369e20254398e12149a57c971d61018ba826430a0623c56b"
source_dir = "pavucontrol-%{version}"

[depends]
build = ["pkgconf", "gtkmm", "gtk3", "libsigc++", "glibmm", "json-glib", "libcanberra", "libpulse"]
run = ["gtkmm", "glibmm", "json-glib", "libcanberra", "libpulse"]

[build]
configure = '''
# configure.ac's IT_PROG_INTLTOOL runs even with --disable-nls: it calls
# `intltool-update --version` (the real intltool is not packaged, so the check
# fails with "Your intltool is too old") and then requires perl XML::Parser.
# Neither is used for the build, so satisfy the checks with tiny stand-ins
# that live only in the source tree.
stub=$PWD/.intltool-stub
mkdir -p $stub/XML
printf '#!/bin/sh\necho "intltool-update (intltool) 0.51.0"\n' > $stub/intltool-update
chmod +x $stub/intltool-update
printf 'package XML::Parser;\n$VERSION = "2.47";\n1;\n' > $stub/XML/Parser.pm
PATH=$stub:$PATH PERL5LIB=$stub ./configure --prefix=/usr --disable-nls --disable-static
# Write the desktop file now and make it newer than its .in, so make never
# tries to regenerate it through intltool-merge (install reuses the same sed).
sed -e 's|^_Name=.*|Name=Volume Control|' \
    -e 's|@bindir@|/usr/bin|g' \
    src/pavucontrol.desktop.in > src/pavucontrol.desktop
touch src/pavucontrol.desktop
'''
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# intltool's desktop-file merge needs perl XML::Parser (not packaged); the
# .in template only carries one translatable field, so it is substituted by
# hand: upstream's own msgid for Name is "Volume Control".
install -d %{pkgdir}/usr/share/applications
sed -e 's|^_Name=.*|Name=Volume Control|' \
    -e 's|@bindir@|/usr/bin|g' \
    src/pavucontrol.desktop.in > %{pkgdir}/usr/share/applications/pavucontrol.desktop
'''
