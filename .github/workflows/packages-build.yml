name: Build packages (shard or final job)

# Called by packages.yml; not meant to be started by hand.
#
# mode: shard     builds the packages of ONE shard (or, with shard_id "tc", the
#                 Bootstrap Toolchain targets). It downloads only the archives of
#                 its dependency closure: published ones from the package
#                 repository, the ones earlier waves built from the draft build
#                 cache. Everything it builds is saved to that cache (see
#                 scripts/pr-shard-cache.py) even when a package failed.
# mode: finalize  starts when every wave is done: it gathers the complete set of
#                 archives, checks them and (outside pull requests) publishes the
#                 signed index. Nothing here is built.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      shard_id:
        type: string
        default: ""
      shard_pkgs:
        description: "Packages built by this shard"
        type: string
        default: ""
      shard_needs:
        description: "Every transitive dependency of the shard (archives it must have)"
        type: string
        default: ""
      shard_waits:
        description: "Selected packages built by EARLIER waves that this shard depends on"
        type: string
        default: ""
      pkgs:
        description: "The whole package selection (final job)"
        type: string
        default: ""
      toolchain_pkgs:
        type: string
        default: ""
      toolchain_all:
        type: string
        default: ""
      rootfs_kind:
        type: string
        default: auto
      rootfs_requested:
        type: string
        default: auto
      isolation:
        type: string
        default: sandbox
      budget:
        type: string
        default: "270"
      keep_going:
        type: string
        default: "1"
      auto_continue:
        type: string
        default: "1"
      prune:
        type: string
        default: "1"
      cache_prefix:
        description: "Draft-release prefix of the build cache shared by all jobs of this run"
        type: string
        required: true
      build_ok:
        description: "true when no wave job failed (final job)"
        type: string
        default: "true"

jobs:
  build:
    name: ${{ inputs.mode == 'finalize' && 'publish' || format('shard {0}', inputs.shard_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write # draft build cache and (final job) the package releases
      actions: write # lets the final job start its own continuation
    env:
      T: /mnt/pkgroot
      MODE: ${{ inputs.mode }}
      SHARD_ID: ${{ inputs.shard_id }}
      # The packages this job needs to know about: its shard, or the whole
      # selection in the final job (nawa bootstrap, relation archives).
      PKGS: ${{ inputs.mode == 'shard' && inputs.shard_pkgs || inputs.pkgs }}
      BUILD_PKGS: ${{ inputs.mode == 'shard' && inputs.shard_pkgs || '' }}
      SHARD_NEEDS: ${{ inputs.shard_needs }}
      SHARD_WAITS: ${{ inputs.shard_waits }}
      TOOLCHAIN_PKGS: ${{ inputs.toolchain_pkgs }}
      TOOLCHAIN_ALL: ${{ inputs.toolchain_all }}
      TC_BUILD: ${{ inputs.mode == 'shard' && inputs.shard_id == 'tc' }}
      CACHE_PREFIX: ${{ inputs.cache_prefix }}
      BT: /mnt/faseela-bootstrap
      ISOLATION: ${{ inputs.isolation }}
      ROOTFS_KIND: ${{ inputs.rootfs_kind }}
      BUDGET_MIN: ${{ inputs.budget }}
      KEEP_GOING: ${{ inputs.keep_going }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      PRUNE: ${{ inputs.prune }}
      PKG_REPO: ${{ github.repository }}
      PKG_TAG: ${{ vars.PKG_TAG || 'stable' }}
      PKG_V3_TAG: ${{ vars.PKG_V3_TAG || 'stable-v3' }}
      NAWA_TRANSITION_TAG: ${{ vars.NAWA_TRANSITION_TAG || 'nawa-transition' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the COSMIC updater needs the PR head so it can push verified source
          # hashes back. Other PRs keep the normal synthetic merge checkout.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feat/cosmic-desktop-support' || github.event.pull_request.head.ref == 'fix/cosmic-shortcuts-layout-switch') && github.event.pull_request.head.sha || github.sha }}

      - name: Update and verify COSMIC and pop-launcher source pins
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feat/cosmic-desktop-support' || github.event.pull_request.head.ref == 'fix/cosmic-shortcuts-layout-switch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 -I scripts/update-cosmic-epoch.py
          python3 -I scripts/check-recipes.py cosmic-desktop
          python3 -I scripts/test-cosmic-integration.py
          git diff --check
          if ! git diff --quiet -- recipes/cosmic recipes/greeter/cosmic-greeter recipes/gui/pop-launcher; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recipes/cosmic recipes/greeter/cosmic-greeter recipes/gui/pop-launcher
            git commit -m "Update COSMIC and pop-launcher source pins"
            # Every job derives the same pins; only the final job pushes them.
            if [[ "$MODE" == finalize ]]; then
              git push origin "HEAD:$PR_HEAD_REF"
            fi
          else
            echo "All COSMIC source archives already match Epoch 1.11.0."
          fi

      # The chroot helpers (enter-root.sh, sync-repo.sh, build-packages-inner.sh),
      # profiles/ and fetch-rootfs-seed.sh belong to the distribution and are
      # shared with its ISO build, so they are not copied here.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DISTRO_REPO || 'mrdevmohamed/faseela' }}
          ref: ${{ vars.DISTRO_REF || 'master' }}
          path: distro

      # The distribution tooling expects its tree to have a recipes/ directory:
      # give it THIS repository's recipes (the commit being built).
      - name: Assemble the build tree (distribution tooling + these recipes)
        run: |
          set -euo pipefail
          rm -rf distro/recipes
          cp -a recipes distro/recipes
          cp -a flavors.toml distro/flavors.toml
          # stage-set.sh resolves the bootstrap flavor through this script.
          # Copy it too: otherwise Stage 2 silently falls back to the full
          # recipe graph and then drops GUI dependencies such as glib.
          install -D -m 0644 scripts/flavor.py distro/scripts/flavor.py
          python3 -I distro/scripts/flavor.py --flavors distro/flavors.toml resolve bootstrap --recipes distro/recipes > "$RUNNER_TEMP/bootstrap-packages.txt"
          test -s "$RUNNER_TEMP/bootstrap-packages.txt"
          echo "Bootstrap flavor: $(wc -l < "$RUNNER_TEMP/bootstrap-packages.txt") packages" >> "$GITHUB_STEP_SUMMARY"
          cp -a groups.toml distro/groups.toml
          # Nawa's package recipe is the sole source pin for Bootstrap and package builds.
          # Reject an older DISTRO_REF that still keeps a separate Bootstrap Nawa pin.
          # shellcheck disable=SC2016
          grep -Fq 'RECIPE="$REPO/recipes/base/nawa/recipe.toml"' distro/bootstrap/fetch-nawa.sh || {
            echo "::error::DISTRO_REF must use recipe-driven Nawa fetching (update Faseela to the revision containing bootstrap/fetch-nawa.sh's recipe pin support)"
            exit 1
          }
          echo "tooling: ${{ vars.DISTRO_REPO || 'mrdevmohamed/faseela' }}@$(git -C distro rev-parse --short HEAD)  recipes: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the publishing setup
        if: ${{ inputs.mode == 'finalize' && github.event_name != 'pull_request' && github.ref != 'refs/heads/feat/cosmic-desktop-support' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_KEY: ${{ secrets.NAWA_SIGN_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          [[ "$HAVE_KEY" == true ]]     || { echo "::error::secret NAWA_SIGN_KEY_B64 is not set"; exit 1; }
          [[ "$BUDGET_MIN" =~ ^[0-9]+$ ]] || { echo "::error::budget must be a number of minutes"; exit 1; }
          [[ "$PKG_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid PKG_TAG"; exit 1; }
          [[ "$PKG_V3_TAG" =~ ^[A-Za-z0-9._-]+$ && "$PKG_V3_TAG" != "$PKG_TAG" ]] || {
            echo "::error::PKG_V3_TAG must be a safe, distinct release tag"; exit 1;
          }
          [[ "$NAWA_TRANSITION_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid NAWA_TRANSITION_TAG"; exit 1; }
          if ! gh release view "$PKG_V3_TAG" --repo "$PKG_REPO" >/dev/null 2>&1; then
            gh release create "$PKG_V3_TAG" --repo "$PKG_REPO" \
              --title "Nawa schema-v3 repository" \
              --notes "Signed schema-v3 index only. Package and recipe archives are stored in packages-NNNN releases. Written by CI, do not edit."
          fi

      - name: Download the build rootfs from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ vars.DISTRO_REPO || 'mrdevmohamed/faseela' }}
          ROOTFS_REQUESTED: ${{ inputs.rootfs_requested }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rootfs"
          fetch() {   # $1 = min | seed -> sets asset; returns fetch-rootfs-seed.sh's status
            asset=faseela-x86_64-rootfs-min.tar.zst
            legacy=mydistro-x86_64-rootfs-min.tar.zst   # releases made before the rename
            if [[ "$1" == seed ]]; then
              asset=faseela-x86_64-rootfs.tar.zst
              legacy=mydistro-x86_64-rootfs.tar.zst
            fi
            rc=0
            # verifies the .sha256 sidecar; exit 3 = no release carries the asset
            ROOTFS_ASSET="$asset" ROOTFS_LEGACY_ASSET="$legacy" bash distro/scripts/fetch-rootfs-seed.sh "$dir" > /dev/null || rc=$?
          }
          fetch "$ROOTFS_KIND"
          # `auto` picked the small rootfs, but it is a FLAVOR (rootfs-min) that only exists
          # once the packages are published: before that, the seed rootfs (the bootstrap core
          # every release carries) is a build environment too.
          if [[ $rc -eq 3 && "$ROOTFS_KIND" == min && "$ROOTFS_REQUESTED" == auto ]]; then
            echo "::notice::no release carries the small rootfs yet - building in the seed rootfs instead"
            ROOTFS_KIND=seed
            fetch seed
          fi
          if [[ $rc -eq 3 ]]; then
            echo "::error::no release of $GH_REPO carries $asset. Publish one without a tag: faseela > Actions > Build ISO (CD) > Run workflow with outputs=core and release ticked, then re-run this workflow."
            exit 1
          elif [[ $rc -ne 0 ]]; then
            echo "::error::could not fetch/verify $asset (fetch-rootfs-seed.sh exit $rc)"
            exit "$rc"
          fi
          sudo mkdir -p "$T"
          sudo tar -I zstd -xpf "$dir/$asset" -C "$T" --numeric-owner
          rm -rf "$dir"
          df -h /mnt
          # the build runs /usr/bin/nawa inside this root. A rootfs from a
          # release made before the dpm -> nawa rename ships /usr/bin/dpm
          # instead and uses another database layout, so it cannot build.
          if [[ ! -x "$T/usr/bin/nawa" ]]; then
            if [[ -x "$T/usr/bin/dpm" ]]; then
              echo "::error::$asset of the newest release was built before the dpm -> nawa rename (it has /usr/bin/dpm, no /usr/bin/nawa). Publish a new release first: run 'Build ISO (CD)' on a new v* tag - it builds nawa from the pinned source and publishes a rootfs that has it - then re-run this workflow."
            else
              echo "::error::$asset of the newest release has no /usr/bin/nawa, so it cannot build packages"
            fi
            exit 1
          fi


      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Prepare the build root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # network for source downloads inside the root
          sudo rm -f "$T/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$T/etc/resolv.conf"
          sudo bash distro/bootstrap/sync-repo.sh "$T"   # recipes + profiles + bootstrap -> $T/faseela

          # sync-repo.sh copies the distribution build inputs, but groups.toml
          # belongs to this package repository and is assembled beside recipes.
          # repo-create runs inside the chroot and reads this exact path.
          [[ -s distro/groups.toml ]] || {
            echo "::error::the assembled package repository has no groups.toml"
            exit 1
          }
          sudo install -D -m 0644 distro/groups.toml "$T/faseela/groups.toml"
          sudo cmp -s distro/groups.toml "$T/faseela/groups.toml" || {
            echo "::error::groups.toml was not copied intact to $T/faseela/groups.toml"
            exit 1
          }
          echo "Verified signed group catalog at $T/faseela/groups.toml."

          sudo bash distro/bootstrap/ensure-chroot-mounts.sh "$T"

          # Build the pinned Nawa client from the seed source before asking
          # any Nawa binary to parse its own multi-source / Cargo-fetch recipe.
          # Schema-v3 repo support alone does not imply recipe-schema support.
          if [[ " $PKGS " == *" nawa "* ]]; then
            [[ "$ROOTFS_KIND" == seed ]] || {
              echo "::error::building nawa requires the seed rootfs (Rust/Cargo)"
              exit 1
            }
            # The seed rootfs is derived from stage 3, which deletes /opt/cargo:
            # Rust is the db-owned `rust` package there, not part of the seed.
            # Put the same pinned upstream toolchain the rust recipe installs
            # (sha256 from the recipe) under /opt/cargo, where this step looks
            # for it. It lives only in this throwaway build root; package
            # builds get Rust through the `rust` build dependency.
            has_cargo() {
              sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/env \
                PATH=/opt/cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin /bin/sh -c 'command -v cargo' >/dev/null 2>&1
            }
            if ! has_cargo; then
              rust_dir="$RUNNER_TEMP/rust-bootstrap"
              rm -rf "$rust_dir"
              mkdir -p "$rust_dir"
              read -r rust_version rust_sha256 rust_url < <(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path
          p = tomllib.loads(Path("recipes/base/rust/recipe.toml").read_text(encoding="utf-8"))["package"]
          s = p["sources"][0]
          print(p["version"], s["sha256"], s["url"].replace("%{version}", p["version"]))
          PY
              )
              echo "The seed rootfs has no cargo: installing the pinned Rust $rust_version under /opt/cargo."
              curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
                --output "$rust_dir/rust.tar.xz" "$rust_url"
              echo "$rust_sha256  $rust_dir/rust.tar.xz" | sha256sum --check --status || {
                echo "::error::the downloaded Rust toolchain does not match the sha256 pinned in recipes/base/rust/recipe.toml"
                exit 1
              }
              tar -xJf "$rust_dir/rust.tar.xz" -C "$rust_dir"
              sudo bash "$rust_dir/rust-$rust_version-x86_64-unknown-linux-gnu/install.sh" \
                --prefix=/opt/cargo --destdir="$T" --disable-ldconfig \
                --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu > /dev/null
              rm -rf "$rust_dir"
              has_cargo || {
                echo "::error::cargo still does not run inside the build root after installing the pinned Rust toolchain"
                exit 1
              }
              echo "Rust $rust_version installed under /opt/cargo in the seed build root to bootstrap Nawa." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Bootstrapping the selected Nawa source with the seed Rust toolchain."
            sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/env HOME=/root PATH=/opt/cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin CARGO_HOME=/root/.cargo /bin/bash -c '
                set -euo pipefail
                cd /faseela/nawa
                [[ -s Cargo.toml && -s Cargo.lock ]] || {
                  echo "pinned Nawa source is missing Cargo.toml or Cargo.lock" >&2
                  exit 1
                }
                cargo fetch --locked
                CARGO_NET_OFFLINE=true cargo build --release --offline --locked

                candidate=/usr/bin/.nawa-bootstrap-new
                rm -f "$candidate"
                install -m 0755 target/release/nawa "$candidate"
                "$candidate" --version
                # This loads and validates recipes/base/nawa/recipe.toml,
                # including package.sources and [fetch.cargo], without building.
                "$candidate" --recipes /faseela/recipes deps nawa >/dev/null
                "$candidate" repo-create --help | grep -q -- --index-version
                mv -f "$candidate" /usr/bin/nawa
                /usr/bin/nawa --version
              '
            echo "Pinned Nawa source compiled with seed Rust and installed before package builds." >> "$GITHUB_STEP_SUMMARY"
          fi

          supports_schema_v3() {
            local repo_help
            repo_help="$(sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa repo-create --help)" || return 1
            for option in --index-version --locations --recipes-rev --groups; do
              grep -q -- "$option" <<< "$repo_help" || return 1
            done
          }

          # Index-v3 support and recipe-schema support are independent. Load
          # the real Nawa recipe (multi-source + Cargo fetch) to verify that
          # this binary understands and validates the current recipe schema.
          supports_recipe_schema() {
            local output
            output="$(sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa \
              --recipes /faseela/recipes recipe check nawa 2>&1)" || return 1
            # recipe check exits zero for warnings on old implementations;
            # require the current schema's known tables/keys with no warnings.
            grep -Fq 'nawa: recipe check: 1 recipe(s), 0 warning(s)' <<< "$output"
          }

          supports_nawa_features() {
            supports_schema_v3 && supports_recipe_schema
          }

          # Older rootfs releases can carry a Nawa client that predates the
          # current recipe schema even when its repository-index support is
          # already up to date. Upgrade locally before package builds.
          if ! supports_nawa_features; then
            nawa_archive="$(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path
          p = tomllib.loads(Path("recipes/base/nawa/recipe.toml").read_text(encoding="utf-8"))["package"]
          print(f"{p['name']}-{p['version']}-{p['rel']}.nawa.tar.zst")
          PY
          )"
            transition_dir="$RUNNER_TEMP/nawa-transition"
            rm -rf "$transition_dir"
            mkdir -p "$transition_dir"
            if ! gh release download "$NAWA_TRANSITION_TAG" --repo "$PKG_REPO" \
                 --pattern "$nawa_archive" --pattern "$nawa_archive.sig" \
                 --dir "$transition_dir"; then
              echo "::error::the rootfs has an old Nawa and $NAWA_TRANSITION_TAG does not provide the signed $nawa_archive transition package. Run the Nawa transition build first."
              exit 1
            fi
            [[ -s "$transition_dir/$nawa_archive" && -s "$transition_dir/$nawa_archive.sig" ]] || {
              echo "::error::the Nawa transition release is missing $nawa_archive or its detached signature"
              exit 1
            }

            sudo install -d -m 0755 "$T/tmp/nawa-transition"
            sudo install -m 0644 "$transition_dir/$nawa_archive" "$T/tmp/nawa-transition/$nawa_archive"
            sudo install -m 0644 "$transition_dir/$nawa_archive.sig" "$T/tmp/nawa-transition/$nawa_archive.sig"

            # nawa install verifies the detached signature with the
            # Faseela key already trusted by the build root.
            sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa install --yes \
              "/tmp/nawa-transition/$nawa_archive"
            sudo rm -rf "$T/tmp/nawa-transition"
            rm -rf "$transition_dir"

            supports_nawa_features || {
              echo "::error::installed Nawa still lacks schema-v3 repository support or current recipe-schema support (nawa recipe check nawa)"
              exit 1
            }
            echo "Nawa upgraded from the signed $NAWA_TRANSITION_TAG transition package before the build." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Keep one small metadata request; archive bytes are fetched from the
      # public browser URLs, not the per-asset API endpoint (which burns the
      # installation token's request budget).
      - name: Read package release metadata
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$PKG_REPO/releases?per_page=100" > "$RUNNER_TEMP/package-releases.json"
          python3 -I scripts/distributed-releases.py list \
            --releases-json "$RUNNER_TEMP/package-releases.json" \
            --stable-tag "$PKG_TAG" > "$RUNNER_TEMP/published.tsv"

      - name: Fetch the packages already published
        id: published
        env:
          PACKAGE_DOWNLOAD_JOBS: ${{ vars.PACKAGE_DOWNLOAD_JOBS || '4' }}
          GH_TOKEN: ${{ github.token }} # only used by the last-resort API round
        run: |
          set -euo pipefail
          sudo mkdir -p "$T/build/out"
          sudo chown "$(id -u):$(id -g)" "$T/build/out"

          # Validate the release manifest before starting any download. The
          # final job fetches the COMPLETE set: repo-create and the cross-flavor
          # file-conflict check need it, and a partial set would silently
          # publish an incomplete repository index.
          manifest="$RUNNER_TEMP/package-downloads.nul"
          : > "$manifest"
          n=0
          listing="$RUNNER_TEMP/published.tsv"
          if [[ "$MODE" == shard ]]; then
            # A shard needs the archives of its dependency closure, nothing else
            # (the final job downloads the complete set for the index).
            python3 -I scripts/plan-build-shards.py assets --recipes recipes --names "$SHARD_NEEDS" \
              | sort -u > "$RUNNER_TEMP/shard-assets.txt"
            awk -F '\t' 'NR == FNR { want[$0] = 1; next } ($2 in want)' \
              "$RUNNER_TEMP/shard-assets.txt" "$RUNNER_TEMP/published.tsv" > "$RUNNER_TEMP/published.shard.tsv"
            listing="$RUNNER_TEMP/published.shard.tsv"
          fi
          while IFS=$'\t' read -r tag asset; do
            [[ -n "$asset" ]] || continue
            [[ "$tag" == "$PKG_TAG" || "$tag" =~ ^packages-[0-9]{4,}$ ]] || {
              echo "::error::unexpected package storage release: $tag"; exit 1;
            }
            [[ "$asset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*[.]nawa[.]tar[.]zst$ ]] || {
              echo "::error::unexpected package archive name: $asset"; exit 1;
            }
            printf '%s\0%s\0' "$tag" "$asset" >> "$manifest"
            n=$((n + 1))
          done < "$listing"

          workers="${PACKAGE_DOWNLOAD_JOBS:-12}"
          [[ "$workers" =~ ^[0-9]+$ ]] || {
            echo "::error::PACKAGE_DOWNLOAD_JOBS must be an integer from 1 to 32"; exit 1;
          }
          workers=$((10#$workers))
          (( workers >= 1 && workers <= 32 )) || {
            echo "::error::PACKAGE_DOWNLOAD_JOBS must be an integer from 1 to 32"; exit 1;
          }
          # GitHub's public release CDN has returned widespread HTTP 504s
          # under the previous 12-way fan-out. Keep the effective concurrency
          # conservative even when the repository variable is set higher.
          if (( workers > 4 )); then
            echo "Capping PACKAGE_DOWNLOAD_JOBS from $workers to 4 to avoid release-CDN overload."
            workers=4
          fi

          # One asset answering HTTP 500 must not sink the whole run: the CDN
          # sometimes fails a single file for longer than curl's retry window.
          # Workers therefore never abort the pool; failed assets are queued
          # and retried serially after a pause, and the last round goes through
          # the authenticated API instead of the browser URL. Only assets that
          # still fail after that are fatal, and they are named.
          pending="$RUNNER_TEMP/package-downloads.pending"
          cp "$manifest" "$pending"
          if (( n > 0 )); then
            round=0
            max_rounds=3
            while [[ -s "$pending" ]]; do
              jobs="$workers"
              unset FETCH_VIA_API
              if (( round > 0 )); then
                jobs=1
                left=$(( $(tr -cd '\0' < "$pending" | wc -c) / 2 ))
                if (( round == max_rounds )); then
                  export FETCH_VIA_API=1
                  echo "Final round: fetching $left asset(s) via the authenticated API."
                else
                  delay=$(( round * 30 ))
                  echo "Retry round $round/$max_rounds: $left asset(s) failed, waiting ${delay}s."
                  sleep "$delay"
                fi
              fi
              failed="$RUNNER_TEMP/package-downloads.failed"
              : > "$failed"
              export failed
              # shellcheck disable=SC2016
              xargs -0 -r -n 2 -P "$jobs" bash -c '
                bash scripts/fetch-published-package.sh "$1" "$2" \
                  || printf "%s\0%s\0" "$1" "$2" >> "$failed"
              ' _ < "$pending"
              mv -f "$failed" "$pending"
              (( round < max_rounds )) || break
              round=$((round + 1))
            done
            unset FETCH_VIA_API

            if [[ -s "$pending" ]]; then
              echo "::error::could not download these published packages after $max_rounds retry rounds:"
              tr '\0' '\n' < "$pending" | paste - - | while IFS=$'\t' read -r t a; do
                echo "::error::  $a ($t)"
              done
              exit 1
            fi
          fi

          echo "published=$n" >> "$GITHUB_OUTPUT"
          echo "$n archive(s) already published across $PKG_REPO releases"
          echo "Fetched $n package archives with $workers parallel workers." >> "$GITHUB_STEP_SUMMARY"
          # Everything newer than this file was built by THIS run.
          sleep 2
          sudo touch "$T/build/.run-start"

      - name: Restore the archives of earlier waves from the draft build cache
        if: ${{ steps.published.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Old stable-v3 archives may have the same filename as a relation-
          # bearing v5 rebuild. Remove those first so build-packages-inner.sh
          # cannot classify the legacy payload as already current. A shard also
          # invalidates the selected packages it waits for: if an earlier wave
          # failed to build one, its dependents are skipped, not built on a
          # legacy archive.
          if [[ "$MODE" == shard ]]; then
            python3 -I scripts/pr-build-cache.py invalidate-relations \
              --recipes recipes --out-dir "$T/build/out" \
              --names "$BUILD_PKGS $SHARD_WAITS $TOOLCHAIN_PKGS"
            args=(--names "$SHARD_NEEDS")
            if [[ -n "$TOOLCHAIN_PKGS" && "$TC_BUILD" != true ]]; then
              # Bootstrap (wave 0) built these; they replace the rootfs toolchain.
              args+=(--with-toolchain --toolchain-list "$RUNNER_TEMP/toolchain-restored.txt")
            fi
          else
            python3 -I scripts/pr-build-cache.py invalidate-relations \
              --recipes recipes --out-dir "$T/build/out" \
              --names "$PKGS $TOOLCHAIN_PKGS"
            args=(--all)
          fi
          python3 -I scripts/pr-shard-cache.py restore \
            --repo "$PKG_REPO" --prefix "$CACHE_PREFIX" \
            --recipes recipes --out-dir "$T/build/out" "${args[@]}"

      # The Stage 1/2/3 bootstrap is a pure function of the tooling revision and
      # the bootstrap/toolchain recipe trees, so its final archives are cached
      # under a key derived from exactly those inputs (see
      # scripts/toolchain-cache-key.py; refreshed weekly). A full Toolchain run
      # (TOOLCHAIN_ALL) never uses the cache: its self-hosting proofs are the
      # point. Set the repository variable TOOLCHAIN_CACHE=off to disable it.
      - name: Compute the Bootstrap Toolchain cache key
        id: tc_key
        if: ${{ env.TC_BUILD == 'true' && env.TOOLCHAIN_ALL != 'true' && vars.TOOLCHAIN_CACHE != 'off' }}
        run: |
          set -euo pipefail
          key="$(python3 -I scripts/toolchain-cache-key.py \
            --recipes recipes --flavors flavors.toml \
            --bootstrap-list "$RUNNER_TEMP/bootstrap-packages.txt" \
            --toolchain-packages "$TOOLCHAIN_PKGS" \
            --tooling-rev "$(git -C distro rev-parse HEAD)" \
            --isolation "$ISOLATION" --week "$(date -u +%G-W%V)")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Bootstrap Toolchain outputs from the cache
        id: tc_restore
        if: ${{ steps.tc_key.outputs.key != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/toolchain-cache
          key: ${{ steps.tc_key.outputs.key }}

      - name: Build this shard (Bootstrap Toolchain targets in wave 0, packages otherwise)
        id: build
        if: ${{ inputs.mode == 'shard' }}
        timeout-minutes: 320 # leaves ~35 min of the 355 for saving and logs
        env:
          TC_CACHE_DIR: ${{ runner.temp }}/toolchain-cache
          TC_CACHE_KEY: ${{ steps.tc_key.outputs.key }}
          TC_CACHE_HIT: ${{ steps.tc_restore.outputs.cache-hit }}
        run: |
          set -euo pipefail

          # The PR cache covers ordinary and Bootstrap Stage 3 recipe outputs.
          # build-packages-inner.sh writes BUILT records for regular packages;
          # Stage 3 records are appended after that script so the same cache
          # can represent the complete recipe set.
          toolchain_built="$RUNNER_TEMP/toolchain-built.txt"
          : > "$toolchain_built"
          # The rootfs build directory is root-owned after extraction.
          # Create the report as root, then grant the runner write access so
          # Bootstrap/ordinary build reporting can append to the same file.
          sudo install -d -m 0755 "$T/build"
          sudo touch "$T/build/report.txt"
          sudo chown "$(id -u):$(id -g)" "$T/build/report.txt"

          # Toolchain recipes are never sent to build-packages-inner.sh.
          # Rebuild them through the distribution Stage 1/2/3 bootstrap pipeline.
          if [[ "$TC_BUILD" == true ]]; then
            # A cache hit is only trusted when it is complete, belongs to this
            # exact key and every archive matches its recorded checksum;
            # anything else falls back to a normal bootstrap build.
            tc_dir="$TC_CACHE_DIR"
            use_cache=false
            if [[ "${TC_CACHE_HIT:-}" == true ]]; then
              if [[ "$(cat "$tc_dir/complete" 2>/dev/null || true)" == "$TC_CACHE_KEY" \
                    && -s "$tc_dir/stage3-toolchain-packages.resolved" ]] \
                 && (cd "$tc_dir/out" && sha256sum --check --quiet ../SHA256SUMS); then
                use_cache=true
              else
                echo "::warning::cached Bootstrap Toolchain outputs failed verification; rebuilding"
                rm -rf "$tc_dir"
              fi
            fi

            if [[ "$use_cache" == true ]]; then
              echo "== Bootstrap Toolchain: reusing cached Stage 3 outputs for $TOOLCHAIN_PKGS"
              resolved="$tc_dir/stage3-toolchain-packages.resolved"
              out_dir="$tc_dir/out"
            else
              echo "== Bootstrap Toolchain build: $TOOLCHAIN_PKGS"
              sudo rm -rf "$BT" /mnt/.faseela-bootstrap.build
              stage3_packages="$TOOLCHAIN_PKGS"
              if [[ "$TOOLCHAIN_ALL" == true ]]; then
                stage3_packages=""
                echo "Full Toolchain selected: Stage 3 will rebuild the complete set and run self-hosting proofs."
              fi
              sudo env STAGE3_PACKAGES="$stage3_packages" STAGE_SET=bootstrap NAWA_JOBS="$(nproc)" \
                bash distro/bootstrap/build-all.sh --isolation "$ISOLATION" --no-iso --no-rootfs "$BT"
              resolved="$BT/build3/stage3-toolchain-packages.resolved"
              out_dir="$BT/build3/out"
            fi
            [[ -s "$resolved" ]] || {
              echo "::error::Bootstrap did not record its Stage 3 Toolchain output set"
              exit 1
            }
            # Stage a fresh cache entry while importing (saved by a later step).
            save_cache=false
            if [[ "$use_cache" != true && -n "${TC_CACHE_KEY:-}" ]]; then
              save_cache=true
              rm -rf "$tc_dir"
              mkdir -p "$tc_dir/out"
            fi
            while IFS= read -r package; do
              [[ -n "$package" ]] || continue
              archive="$(find "$out_dir" -maxdepth 1 -type f \
                -name "$package-[0-9]*.nawa.tar.zst" -print | sort -V | tail -n 1)"
              [[ -n "$archive" && -s "$archive" ]] || {
                echo "::error::Stage 3 did not produce the expected archive for $package"
                exit 1
              }
              archive_name="$(basename "$archive")"
              sudo install -m 0644 "$archive" "$T/build/out/$archive_name"
              printf '%s\n' "${archive_name%.nawa.tar.zst}" >> "$toolchain_built"
              # Install Stage 3 outputs into the package-build root as well:
              # subsequent ordinary packages must use the updated Toolchain.
              sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa install \
                --force --allow-unsigned "/build/out/$archive_name"
              echo "Imported Stage 3 Toolchain archive: $archive_name"
              if [[ "$save_cache" == true ]]; then
                sudo install -m 0644 -o "$(id -u)" -g "$(id -g)" "$archive" "$tc_dir/out/$archive_name"
              fi
            done < "$resolved"
            if [[ "$save_cache" == true ]]; then
              install -m 0644 "$resolved" "$tc_dir/stage3-toolchain-packages.resolved"
              (cd "$tc_dir/out" && sha256sum -- *.nawa.tar.zst > ../SHA256SUMS)
              # The sentinel is written last: a partial directory is never reused.
              printf '%s' "$TC_CACHE_KEY" > "$tc_dir/complete"
              echo "tc_cache_save=true" >> "$GITHUB_OUTPUT"
            fi
            {
              echo "### Bootstrap Toolchain outputs"
              [[ "$use_cache" != true ]] || echo "_Restored from the Bootstrap Toolchain cache; Stage 1/2/3 were not rebuilt._"
              sed 's/^/- /' "$resolved"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Later waves use the Toolchain wave 0 built: install its archives
          # (restored from the cache) before any ordinary package is built.
          if [[ -s "$RUNNER_TEMP/toolchain-restored.txt" ]]; then
            while IFS= read -r archive_name; do
              [[ -n "$archive_name" ]] || continue
              sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa install \
                --force --allow-unsigned "/build/out/$archive_name"
              echo "Installed Bootstrap Toolchain archive from wave 0: $archive_name"
            done < "$RUNNER_TEMP/toolchain-restored.txt"
          fi

          # Ordinary packages run only after any requested Toolchain update
          # has been installed into their build root.
          if [[ -n "$BUILD_PKGS" ]]; then
            # A package whose dependency was supposed to come from an earlier
            # wave but is missing there (that wave failed it) is skipped, not
            # compiled again on top of a broken dependency.
            skipped="$RUNNER_TEMP/shard-skipped.txt"
            : > "$skipped"
            run_pkgs="$(python3 -I scripts/plan-build-shards.py runnable \
              --recipes recipes --pkgs "$BUILD_PKGS" --waits "$SHARD_WAITS" \
              --out-dir "$T/build/out" --report "$skipped")"
            if [[ -n "$run_pkgs" ]]; then
              inner_rc=0
              sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/env -i \
                HOME=/root TERM=dumb NAWA_JOBS="$(nproc)" PKGS="$run_pkgs" ISOLATION="$ISOLATION" \
                BUDGET_MIN="$BUDGET_MIN" KEEP_GOING="$KEEP_GOING" \
                bash /faseela/bootstrap/build-packages-inner.sh || inner_rc=$?
            else
              inner_rc=0
              echo "Nothing in this shard can be built: every package waits for a dependency that failed earlier."
              : > "$T/build/report.txt"
              printf 'BUILT=0\nFAILED=0\nSKIPPED=0\nUPTODATE=0\nINCOMPLETE=0\n' | sudo tee "$T/build/status" > /dev/null
            fi
            if [[ -s "$skipped" ]]; then
              cat "$skipped" >> "$T/build/report.txt"
              inner_rc=1
            fi
            exit "$inner_rc"
          fi
          # A shard without ordinary packages (the Toolchain job) still leaves a status.
          [[ -e "$T/build/status" ]] || printf 'BUILT=0\nFAILED=0\nSKIPPED=0\nUPTODATE=0\nINCOMPLETE=0\n' | sudo tee "$T/build/status" > /dev/null

      # Save even when a later ordinary package failed: the Toolchain work is
      # done and valid, and losing it would cost the next retry another hour.
      - name: Save Bootstrap Toolchain outputs to the cache
        if: ${{ always() && steps.build.outputs.tc_cache_save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/toolchain-cache
          key: ${{ steps.tc_key.outputs.key }}

      - name: Detect schema-v5-only package selections
        id: schema_v5_policy
        if: ${{ inputs.mode == 'finalize' && always() && steps.published.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          relation_packages="$(python3 -I - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          selected = set(os.environ.get("PKGS", "").split())
          selected.update(os.environ.get("TOOLCHAIN_PKGS", "").split())
          relation_packages = []
          for path in sorted(Path("recipes").glob("*/*/recipe.toml")):
              doc = tomllib.loads(path.read_text(encoding="utf-8"))
              package = doc.get("package", {})
              name = package.get("name")
              if name in selected and "relations" in doc:
                  relation_packages.append(name)

          print(" ".join(sorted(relation_packages)))
          PY
          )"
          if [[ -n "$relation_packages" ]]; then
            echo "schema_v5_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stable-v3 publication for relation-bearing packages: $relation_packages"
          else
            echo "schema_v5_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify built Nawa transition archive is schema-v3 indexable
        if: ${{ inputs.mode == 'finalize' && always() && inputs.build_ok == 'true' && steps.published.conclusion == 'success' && steps.schema_v5_policy.outputs.schema_v5_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ " $PKGS " != *" nawa "* ]]; then
            echo "Nawa was not selected; schema-v3 transition smoke test is not applicable."
            exit 0
          fi

          identity="$(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path
          p = tomllib.loads(Path("recipes/base/nawa/recipe.toml").read_text())["package"]
          print(f"{p['name']}-{p['version']}-{p['rel']}.nawa.tar.zst")
          PY
          )"
          archive="$T/build/out/$identity"
          [[ -s "$archive" ]] || {
            echo "::error::the selected Nawa recipe did not produce $identity"
            exit 1
          }

          smoke="$T/tmp/nawa-v3-smoke"
          sudo rm -rf "$smoke"
          sudo install -d -m 0755 "$smoke"
          sudo install -m 0644 "$archive" "$smoke/$identity"
          sudo tee "$smoke/locations.toml" >/dev/null <<EOF
          schema = 1

          [package_urls]
          "$identity" = "https://example.invalid/$identity"
          EOF

          # Schema-v2+ indexes must be signed. Generate an ephemeral test-only
          # keypair inside the throwaway build root; never read the production
          # NAWA_SIGN_KEY_B64 secret during a pull-request build.
          sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa keygen \
            --out /tmp/nawa-v3-smoke/keys
          sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa repo-create \
            /tmp/nawa-v3-smoke --out /tmp/nawa-v3-smoke/index.toml \
            --index-version 3 --locations /tmp/nawa-v3-smoke/locations.toml \
            --sign --key /tmp/nawa-v3-smoke/keys/nawa.sec
          sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa verify \
            /tmp/nawa-v3-smoke/index.toml --key /tmp/nawa-v3-smoke/keys/nawa.pub

          python3 -I - "$smoke/index.toml" "$identity" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          index = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          identity = sys.argv[2]
          if index.get("repository", {}).get("schema") != 3:
              raise SystemExit("Nawa transition smoke test did not produce schema-v3 metadata")
          matches = [entry for entry in index.get("package", []) if entry.get("file") == identity]
          if len(matches) != 1:
              raise SystemExit(f"schema-v3 index does not contain exactly one {identity}")
          if matches[0].get("relations") is not None:
              raise SystemExit("schema-v3 transition index unexpectedly contains package relations")
          print(f"schema-v3 transition index accepted {identity}")
          PY

      # Every shard saves its own archives and a record (entries-<shard>.json) of
      # what it built or failed. Nothing another shard writes is touched, so
      # shards run in parallel; the next wave and a re-run read these files.
      # Saved even when a package failed or time ran out: finished work is kept.
      - name: Save this shard's archives to the draft build cache
        if: ${{ inputs.mode == 'shard' && always() && steps.published.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stage 3 output can be complete even when a later ordinary package
          # fails: record each imported Toolchain archive as built.
          toolchain_stems=""
          if [[ -s "$RUNNER_TEMP/toolchain-built.txt" ]]; then
            touch "$T/build/report.txt"
            while IFS= read -r stem; do
              [[ -n "$stem" ]] || continue
              printf 'BUILT    %s  (Bootstrap Stage 3)\n' "$stem" >> "$T/build/report.txt"
            done < "$RUNNER_TEMP/toolchain-built.txt"
            toolchain_stems="$(tr '\n' ' ' < "$RUNNER_TEMP/toolchain-built.txt")"
          fi
          python3 -I scripts/pr-shard-cache.py save \
            --repo "$PKG_REPO" --prefix "$CACHE_PREFIX" --recipes recipes \
            --shard "$SHARD_ID" --run-id "$GITHUB_RUN_ID" \
            --out-dir "$T/build/out" --since "$T/build/.run-start" \
            --report "$T/build/report.txt" --status "$T/build/status" \
            --toolchain-stems "$toolchain_stems"

      # The shards' records are merged into the legacy manifest.json/candidate.json
      # (what the PR verification and publish-schema-v5.py read) and the run learns
      # whether any shard ran out of time.
      - name: Merge the shard records
        id: merge
        if: ${{ inputs.mode == 'finalize' && always() && steps.published.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_PACKAGES_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/pr-shard-cache.py merge \
            --repo "$PKG_REPO" --prefix "$CACHE_PREFIX" --recipes recipes \
            --run-id "$GITHUB_RUN_ID" --head-sha "$PR_PACKAGES_HEAD_SHA" | tee "$RUNNER_TEMP/merge.txt"
          echo "incomplete=$(sed -n 's/^INCOMPLETE=//p' "$RUNNER_TEMP/merge.txt" | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Fail PR verification when the build time budget is exhausted
        if: ${{ inputs.mode == 'finalize' && github.event_name == 'pull_request' && steps.merge.outputs.incomplete == '1' }}
        run: |
          echo "::error::PR package verification: a shard reached its time budget before every changed package was built (see the DEFERRED lines in that shard's report)."
          exit 1

      # nawa refuses to install a package that ships a file another one owns, and
      # an image build only finds out one package at a time. Look at the archives
      # (the ones just built AND the ones fetched from the release) for every
      # flavor now. Publishing is not held back (the other packages are fine and
      # the build took hours), but the run turns red and names the files.
      - name: No two packages of a flavor may ship the same file
        if: ${{ inputs.mode == 'finalize' && always() && steps.published.conclusion == 'success' }}
        run: |
          python3 -I scripts/test-file-conflicts.py
          python3 -I scripts/check-file-conflicts.py "$T/build/out"

      # Publish package and recipe archives to immutable storage shards, then
      # Upload shard archives first; keep the old schema-v1 stable index untouched.
      # The shard limit is deliberately below GitHub's 1,000-asset release cap.
      - name: Publish to the distributed package repository
        id: publish
        if: ${{ inputs.mode == 'finalize' && github.event_name != 'pull_request' && github.ref != 'refs/heads/feat/cosmic-desktop-support' && always() && steps.published.conclusion == 'success' && steps.schema_v5_policy.outputs.schema_v5_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_KEY_B64: ${{ secrets.NAWA_SIGN_KEY_B64 }}
          BUILD_OK: ${{ inputs.build_ok }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$T/build/out"
          new=()
          while IFS= read -r -d '' f; do new+=("$f"); done \
            < <(find "$out" -maxdepth 1 -name '*.nawa.tar.zst' -newer "$T/build/.run-start" -print0)
          echo "new archives: ${#new[@]}"
          echo "built=${#new[@]}" >> "$GITHUB_OUTPUT"

          repo="$T/repo"
          sudo rm -rf "$repo"; sudo mkdir -p "$repo"
          sudo cp -al "$out"/*.nawa.tar.zst "$repo/"
          sudo chown -R "$(id -u):$(id -g)" "$repo"
          stale=()
          # Never remove the last published archive for a package whose new
          # recipe failed to build. Partial publication is allowed, but pruning
          # is only safe after every selected build completed successfully.
          if [[ "$PRUNE" == 1 && "$BUILD_OK" == "true" ]]; then
            mapfile -t stale < <(python3 scripts/recipe-ids.py --stale "$repo" recipes)
            for s in "${stale[@]}"; do rm -f "$repo/$s"; done
            if (( ${#stale[@]} )); then printf 'superseded: %s\n' "${stale[@]}"; fi
          elif [[ "$PRUNE" == 1 ]]; then
            echo "::warning::Skipping stale-package pruning because at least one selected package failed to build; preserving last-known-good archives."
          fi

          rev="${GITHUB_SHA}"
          rfile="recipes-${rev}.recipes.tar.zst"
          plan="$RUNNER_TEMP/distributed-release-plan.json"
          locations="$repo/locations.toml"
          python3 -I scripts/distributed-releases.py plan \
            --releases-json "$RUNNER_TEMP/package-releases.json" \
            --repo-dir "$repo" --repository "$PKG_REPO" --stable-tag "$PKG_TAG" \
            --recipe-file "$rfile" --max-assets 900 \
            --output "$plan" --manifest "$locations"

          # Create any shard tags before uploading assets to them.
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if ! gh release view "$tag" --repo "$PKG_REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$PKG_REPO" --title "Faseela package storage $tag" \
                --notes "Storage shard for the signed Nawa schema-v3 package repository. Do not edit."
            fi
          done < <(python3 -I scripts/distributed-releases.py create --plan "$plan")

          printf '%s' "$SIGN_KEY_B64" | base64 -d | sudo install -m 600 /dev/stdin "$T/root/nawa.sec"
          sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa repo-create /repo \
            --out index.toml --index-version 3 --locations /repo/locations.toml \
            --sign --key /root/nawa.sec \
            --recipes /faseela/recipes --recipes-rev "$rev" \
            --groups /faseela/groups.toml
          sudo chown -R "$(id -u):$(id -g)" "$repo"
          [[ -s "$repo/$rfile" && -s "$repo/groups.toml" && -s "$repo/index.toml" && -s "$repo/index.toml.sig" ]] \
            || { echo "::error::repo-create did not produce the recipe snapshot and signed schema-v3 index"; exit 1; }

          upload() {
            local tag="$1"; shift
            local n
            for n in 1 2 3; do
              gh release upload "$tag" --repo "$PKG_REPO" --clobber "$@" && return 0
              echo "upload to $tag attempt $n failed" >&2; sleep $((n * 20))
            done
            return 1
          }

          # Upload every newly assigned archive before publishing its index URL.
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            mapfile -t files < <(python3 -I scripts/distributed-releases.py uploads \
              --plan "$plan" --repo-dir "$repo" --tag "$tag")
            (( ${#files[@]} )) || continue
            for f in "${files[@]}"; do
              [[ -s "$f" ]] || { echo "::error::missing planned archive $f"; exit 1; }
            done
            echo "Uploading ${#files[@]} asset(s) to $tag"
            upload "$tag" "${files[@]}"
          done < <(python3 -I - "$plan" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          tags = set(plan["create_releases"]) | set(plan["uploads"])
          for tag in sorted(tags):
              print(tag)
          PY
          )

          # Keep the Nawa client itself installable by old schema-v1 clients.
          # This separate signed archive can be installed locally without
          # asking the old client to parse either remote repository index.
          nawa_archive="$(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path
          p = tomllib.loads(Path("recipes/base/nawa/recipe.toml").read_text(encoding="utf-8"))["package"]
          print(f"{p['name']}-{p['version']}-{p['rel']}.nawa.tar.zst")
          PY
          )"
          [[ -s "$repo/$nawa_archive" ]] || {
            echo "::error::missing $nawa_archive; the first transition run must build the nawa recipe from the seed rootfs"
            exit 1
          }
          sudo bash distro/bootstrap/enter-root.sh "$T" /usr/bin/nawa sign \
            "/repo/$nawa_archive" --key /root/nawa.sec
          sudo chown "$(id -u):$(id -g)" "$repo/$nawa_archive.sig"
          if ! gh release view "$NAWA_TRANSITION_TAG" --repo "$PKG_REPO" >/dev/null 2>&1; then
            gh release create "$NAWA_TRANSITION_TAG" --repo "$PKG_REPO" \
              --title "Nawa client transition package" \
              --notes "Standalone signed Nawa package for clients that still use the legacy schema-v1 stable index. Download both assets and install the archive locally with: sudo nawa install ./<archive>.nawa.tar.zst. The updated package defaults to stable-v3."
          fi
          upload "$NAWA_TRANSITION_TAG" "$repo/$nawa_archive" "$repo/$nawa_archive.sig"

          # Keep only the current Nawa pair in this small transition release.
          gh api "repos/$PKG_REPO/releases/tags/$NAWA_TRANSITION_TAG" --jq '.assets[].name' |
            while IFS= read -r old; do
              [[ "$old" == "$nawa_archive" || "$old" == "$nawa_archive.sig" ]] && continue
              gh release delete-asset "$NAWA_TRANSITION_TAG" "$old" --repo "$PKG_REPO" --yes || {
                echo "::warning::could not remove old transition asset $old"
              }
            done

          # Publish group metadata before the index that authenticates its digest.
          upload "$PKG_V3_TAG" "$repo/groups.toml"
          # Publish the v3 index only after every referenced asset exists.
          upload "$PKG_V3_TAG" "$repo/index.toml" "$repo/index.toml.sig"

          # Remove stale shard assets only after the v3 index points elsewhere.
          while IFS=$'\t' read -r tag asset; do
            [[ -n "$tag" && -n "$asset" ]] || continue
            gh release delete-asset "$tag" "$asset" --repo "$PKG_REPO" --yes || {
              echo "::warning::could not delete stale asset $tag/$asset"
            }
          done < <(python3 -I scripts/distributed-releases.py cleanup --plan "$plan" --kind shards)
          # The old $PKG_TAG release is frozen. Keep its archives, index and
          # detached signatures intact for already-installed schema-v1 clients.

          archive_count="$(python3 -I - "$plan" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["archive_count"])
          PY
          )"
          shard_count="$(python3 -I - "$plan" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          print(len(set(p["assignments"].values())))
          PY
          )"
          {
            echo "### Published schema-v3 index to $PKG_REPO ($PKG_V3_TAG)"
            echo "Legacy schema-v1 endpoint retained at $PKG_TAG; transition package: $NAWA_TRANSITION_TAG."
            echo
            echo "Package archives: $archive_count"
            echo "New this run: ${#new[@]}"
            echo "Storage shards used: $shard_count (maximum 900 assets per shard)"
            echo "Each archive URL is authenticated by the signed index and its SHA-256."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: ${{ inputs.mode == 'shard' && always() && steps.published.conclusion == 'success' }}
        run: |
          {
            echo "### Build report: shard $SHARD_ID"
            echo '```'
            sudo cat "$T/build/report.txt" 2>/dev/null || echo "(no report: the build did not get that far)"
            sudo cat "$T/build/status" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Time ran out with packages left: run the workflow again - what was
      # published now counts as done, so it continues with the rest. Only when
      # this run made progress, otherwise two runs would loop forever.
      - name: Continue with the remaining packages
        if: ${{ inputs.mode == 'finalize' && github.event_name != 'pull_request' && github.ref != 'refs/heads/feat/cosmic-desktop-support' && always() && steps.publish.outputs.built != '' && steps.publish.outputs.built != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INCOMPLETE: ${{ steps.merge.outputs.incomplete }}
        run: |
          set -euo pipefail
          [[ "$INCOMPLETE" == 1 ]] || { echo "nothing left over"; exit 0; }
          if [[ "$AUTO_CONTINUE" != 1 ]]; then
            echo "::notice::packages are left over - run the workflow again with the same list to continue"
            exit 0
          fi
          gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f packages="$PKGS" -f toolchain=false -f toolchain_packages="" \
            -f rootfs="$ROOTFS_KIND" -f isolation="$ISOLATION" \
            -f budget="$BUDGET_MIN" -f keep_going="$([[ $KEEP_GOING == 1 ]] && echo true || echo false)" \
            -f prune="$([[ $PRUNE == 1 ]] && echo true || echo false)" -f auto_continue=true
          echo "### Time budget used up: started a continuation run for the rest" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect build logs
        if: ${{ inputs.mode == 'shard' && always() }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          sudo cp -r "$T"/build/logs ci-logs/ 2>/dev/null || true
          sudo cp "$T"/build/report.txt "$T"/build/status ci-logs/ 2>/dev/null || true
          if [[ -d /mnt/.faseela-bootstrap.build/logs ]]; then
            mkdir -p ci-logs/bootstrap
            sudo cp -a /mnt/.faseela-bootstrap.build/logs/. ci-logs/bootstrap/
          fi

          # Nawa writes per-package phase logs directly under build/<package-id>,
          # not under build/logs. Preserve them for failed packages so the
          # artifact contains the configure/compile/install error, not only
          # the short summary.
          if [[ -s "$T/build/report.txt" ]]; then
            while IFS= read -r package_id; do
              [[ -n "$package_id" ]] || continue
              source_dir="$T/build/$package_id"
              [[ -d "$source_dir" ]] || continue
              destination="ci-logs/failed/$package_id"
              mkdir -p "$destination"
              while IFS= read -r -d '' log_file; do
                sudo cp -a "$log_file" "$destination/"
              done < <(sudo find "$source_dir" -maxdepth 2 -type f -name '*.log' -print0)
            done < <(awk '$1 == "FAILED" { print $2 }' "$T/build/report.txt")
          fi

          sudo chown -R "$(id -u):$(id -g)" ci-logs
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'shard' && always() }}
        with:
          name: package-build-logs-${{ inputs.shard_id }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      # Publishing already happened above; this just makes the run red.
      - name: Fail the shard if a package failed
        if: ${{ inputs.mode == 'shard' && steps.build.outcome == 'failure' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_REF" == "refs/heads/feat/cosmic-desktop-support" ]]; then
            echo "::error::some selected packages of shard $SHARD_ID failed - see its Build report and the package-build-logs-$SHARD_ID artifact. Nothing is published from this validation branch."
          else
            echo "::error::some packages of shard $SHARD_ID failed - see its Build report. Everything that succeeded is kept in the build cache and published by the final job."
          fi
          exit 1

      - name: Delete the run's temporary build cache
        if: ${{ inputs.mode == 'finalize' && always() && github.event_name != 'pull_request' && steps.merge.conclusion == 'success' && steps.publish.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/pr-shard-cache.py drop --repo "$PKG_REPO" --prefix "$CACHE_PREFIX"
