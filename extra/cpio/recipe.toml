# extra recipe: GNU cpio — copy file archives in and out
[package]
name = "cpio"
version = "2.15"
rel = 2
arch = ["x86_64"]
summary = "GNU cpio — copy file archives in and out"
license = ["GPL-3.0-or-later"]
source = "https://mirrors.kernel.org/gnu/cpio/cpio-%{version}.tar.gz"
sha256 = "efa50ef983137eefc0a02fdb51509d624b5e3295c980aa127ceee4183455499e"

[depends]
build = []
run = ["tar"]

[build]
# GNU tar and GNU cpio both ship the same remote-tape helper, /usr/libexec/rmt
# (nawa refuses cpio otherwise: "file conflicts ... /usr/libexec/rmt (owned by
# tar)"). tar owns it; --with-rmt makes cpio use that one instead of building
# its own (hence run = ["tar"]), and the install step checks it did.
configure = "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --with-rmt=/usr/libexec/rmt"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install && test ! -e %{pkgdir}/usr/libexec/rmt"
