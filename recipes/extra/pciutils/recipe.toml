# extra recipe: pciutils — PCI bus utilities (lspci, setpci)
[package]
name = "pciutils"
version = "3.13.0"
rel = 2
arch = ["x86_64"]
summary = "pciutils — PCI bus utilities (lspci, setpci)"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "pciutils"
url = "https://kernel.org/pub/software/utils/pciutils/pciutils-%{version}.tar.xz"
sha256 = "77f11f78298502634d1af50308f15a5788629f6cf45cba376f5009aea4cb4926"
strip_components = 1

[depends]
build = ["zlib", "kmod"]
run = ["zlib", "kmod"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
compile = "make -j%{jobs} SHARED=yes PREFIX=/usr"
install = "make SHARED=yes PREFIX=/usr DESTDIR=%{pkgdir} MANDIR=/usr/share/man install"
