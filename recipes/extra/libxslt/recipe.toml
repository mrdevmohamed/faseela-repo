# extra recipe: libxslt — XSLT processing library and xsltproc utility
[package]
name = "libxslt"
version = "1.1.45"
rel = 1
arch = ["x86_64"]
summary = "libxslt — XSLT processing library and xsltproc utility"
license = ["MIT"]
source = "https://download.gnome.org/sources/libxslt/1.1/libxslt-%{version}.tar.xz"
sha256 = "9acfe68419c4d06a45c550321b3212762d92f41465062ca4ea19e632ee5d216e"

[depends]
build = ["pkgconf", "libxml2"]
run = ["libxml2"]

[build]
configure = "./configure --prefix=/usr --disable-static --without-python"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
