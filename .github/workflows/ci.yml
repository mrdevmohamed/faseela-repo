name: CI

# What this repository can check without building any package: the recipe tree
# and the scripts that work on it. Building and publishing is packages.yml.
#
# The distribution (github.com/mrdevmohamed/faseela) takes its recipes from the
# main branch of this repository, so a red main here breaks its builds:
# make "CI passed" a required check in the branch protection of main.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recipes
        run: python3 -I scripts/check-recipes.py
      - name: Package build recipe regression checks
        run: python3 -I scripts/test-package-build-recipes.py
      - name: Podman prerequisite and default-flavor regression checks
        run: python3 -I scripts/test-podman-support.py
      - name: Package selection and multi-select regression checks
        run: python3 -I scripts/test-package-selection.py
      - name: creative recipes install bin/share and usr payload layouts
        run: python3 -I scripts/test-creative-recipes.py
      - name: flavors.toml resolves (every flavor, every dependency)
        run: |
          python3 -I scripts/flavor.py check
          python3 -I scripts/test-flavor.py
      - name: file-conflict checker (synthetic archives)
        run: python3 -I scripts/test-file-conflicts.py
      - name: package records, catalog and catalog-based conflict check (synthetic archives)
        run: python3 -I scripts/test-package-catalog.py
      - name: published-archive downloader (local server that fails on demand)
        run: python3 -I scripts/test-fetch-published-archives.py
      - name: linux-firmware-lite / -extra split the firmware tree
        run: python3 -I scripts/test-firmware-split.py
      - name: kernel sound/laptop-hardware options, SOF firmware and UCM profiles
        run: python3 -I scripts/test-kernel-audio.py
      - name: Mesa Vulkan drivers and Zed runtime closure
        run: python3 -I scripts/test-vulkan-stack.py
      - name: Desktop integration dependencies and session activation
        run: python3 -I scripts/test-desktop-integration.py
      - name: recipe-ids.py lists every recipe
        run: |
          python3 scripts/recipe-ids.py recipes > "$RUNNER_TEMP/ids.txt"
          [ "$(wc -l < "$RUNNER_TEMP/ids.txt")" -eq "$(ls recipes/*/*/recipe.toml | wc -l)" ]
      - name: distributed-release planner (GitHub Releases asset limits)
        run: python3 -I scripts/test-distributed-releases.py
      - name: Telegram notification regression checks
        run: python3 -I scripts/test-telegram-notify.py

  # One required check for branch protection: green only if EVERY job above is.
  ci-ok:
    name: CI passed
    if: always()
    needs: [recipes]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a CI job finished as '$r'"; exit 1; }
          done

  telegram-notify:
    name: Telegram notification
    if: ${{ always() }}
    needs: [recipes, ci-ok]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send workflow result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: recipes=${{ needs.recipes.result }},ci-ok=${{ needs.ci-ok.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 -I scripts/notify-telegram.py
