# creative recipe: gridcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "gridcraft"
version = "0.15.0"
rel = 1
arch = ["x86_64"]
summary = "Native spreadsheet application with XLSX and CSV support"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/gridcraft/releases/download/v0.15.0/gridcraft-0.15.0-linux-x86_64.tar.gz"
sha256 = "6810f8ce7394b5a7cdfaf39838257b6384dceb9f8325024d475db895ee59daaa"
source_dir = "gridcraft-0.15.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland"]

[build]
install = """
set -eu
if [ ! -d usr/bin ]; then
    echo "gridcraft: upstream archive has no usr/bin directory" >&2
    exit 1
fi
install -d -m755 "%{pkgdir}/usr"
cp -a usr/. "%{pkgdir}/usr/"
"""
