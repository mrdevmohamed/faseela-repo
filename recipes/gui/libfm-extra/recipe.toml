# gui recipe: libfm-extra — the small helper library split out of libfm
# menu-cache needs libfm-extra and libfm needs menu-cache, so libfm-extra is built
# first from the libfm tarball with --with-extra-only (libfm itself then drops its
# own copy of these files). sha256 placeholder: scripts/fill-sha256.py -r libfm-extra
[package]
name = "libfm-extra"
version = "1.3.2"
rel = 1
arch = ["x86_64"]
summary = "libfm-extra — menu/XML helper library of the LXDE file-manager stack"
license = ["GPL-2.0-or-later"]
source = "https://deb.debian.org/debian/pool/main/libf/libfm/libfm_%{version}.orig.tar.xz"
sha256 = "a5042630304cf8e5d8cff9d565c6bd546f228b48c960153ed366a34e87cad1e5"
source_dir = "libfm-%{version}"

[depends]
build = ["pkgconf", "glib"]
run = ["glib"]

[build]
configure = '''
# intltool is not packaged (see pavucontrol): satisfy configure with stand-ins that
# live only in the source tree. intltool-merge copies input to output and drops the
# leading underscore of translatable keys (no translations: NLS is off).
stub=$PWD/.intltool-stub
mkdir -p $stub/XML
printf '#!/bin/sh\necho "intltool-update (intltool) 0.51.0"\n' > $stub/intltool-update
printf '#!/bin/sh\nexit 0\n' > $stub/intltool-extract
cat > $stub/intltool-merge <<'IM'
#!/bin/sh
in= out=
for a in "$@"; do in=$out; out=$a; done
sed -e 's/^_\([A-Za-z]*\)=/\1=/' -e 's/_\(name\|label\|tooltip\)=/\1=/g' "$in" > "$out"
IM
chmod +x $stub/intltool-update $stub/intltool-extract $stub/intltool-merge
printf 'package XML::Parser;\n$VERSION = "2.47";\n1;\n' > $stub/XML/Parser.pm
PATH=$stub:$PATH PERL5LIB=$stub ./configure --prefix=/usr --sysconfdir=/etc --disable-static --disable-nls --disable-gtk-doc --with-extra-only
'''
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
