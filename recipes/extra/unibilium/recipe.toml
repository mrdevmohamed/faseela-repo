# extra recipe: unibilium — terminfo parsing library
[package]
name = "unibilium"
version = "2.1.2"
rel = 2
arch = ["x86_64"]
summary = "unibilium — terminfo parsing library"
license = ["LGPL-3.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "unibilium"
url = "https://github.com/neovim/unibilium/archive/refs/tags/v%{version}.tar.gz"
sha256 = "370ecb07fbbc20d91d1b350c55f1c806b06bf86797e164081ccc977fc9b3af7a"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool", "perl"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "autoreconf -fi && ./configure --prefix=/usr"
compile = "make -j%{jobs} PREFIX=/usr"
install = "make PREFIX=/usr DESTDIR=%{pkgdir} install"
