# boot recipe: Generic x86_64 Linux kernel for installed desktops, laptops and guests.
#
# Policy (what decides =y vs =m here):
#   =y  everything needed to see a console, find the root device and mount it
#       before any module can be loaded: initrd, devtmpfs, root storage
#       (AHCI, NVMe, VMD, USB, MMC, virtio), root filesystems, and a
#       firmware-framebuffer console (simpledrm) so that boot messages and the
#       saq rescue shell are visible even if no GPU driver has loaded yet.
#   =m  everything else: native GPU drivers (i915, xe, amdgpu, nouveau), wifi,
#       bluetooth, audio, Type-C/USB4. They load later through udev coldplug,
#       and take over from simpledrm when they do.
#
# defconfig is only the starting point. Anything the system cannot boot
# without is asserted below (require_config) and fails the build; nice-to-have
# options only warn (want_config).
#
# rel 2: force the filesystem/devtmpfs options the live ISO depends on
# rel 3: libelf (objtool/ORC), bc, openssl, kmod (depmod) declared as build deps
# rel 5: no debug info (defconfig turns DWARF on: every .ko carried it) and
#        INSTALL_MOD_STRIP=1, so /lib/modules is a fraction of its size
# rel 6: WIREGUARD and EXFAT_FS as modules (recipes wireguard-tools, exfatprogs)
# rel 7: device-mapper + dm-crypt/XTS (recipes lvm2, cryptsetup)
# rel 8: squashfs xz + zstd decompressors. bootstrap/mkiso.sh compresses the live
#        rootfs with xz (-Xbcj x86) by default and defconfig only has zlib:
#        "Filesystem uses "xz" compression. This is not supported"
# rel 12: SND_SOC must be built-in: SOF's bool menu options are nested under
#         `if SND_SOC` and cannot be enabled when the parent is only a module
# rel 14: enable the distro-required Kconfig options before validating them;
#         x86_64_defconfig intentionally leaves many optional drivers unset
# rel 15: tolerate staging installs where the runtime saq dependency is absent
# rel 16: use KERNELRELEASE for /boot names and /lib/modules; the recipe
#         package version (6.10) is not necessarily the kernel release (6.10.0)
# rel 17: black screen on real hardware after native GPU drivers became modules:
#         there was no built-in display driver, so nothing was drawn (not even
#         the initramfs rescue shell) until udev loaded i915/amdgpu. Now
#         SYSFB_SIMPLEFB + DRM_SIMPLEDRM + fbcon + VT console are built in and
#         asserted. Also: the rel 2 / rel 5 / "simpledrm" claims of earlier
#         revisions were no longer enforced by the script and are again; root
#         storage/filesystems are asserted =y instead of trusting defconfig;
#         Intel VMD (NVMe hidden behind RAID mode) and eMMC added; the
#         validation reports every problem at once, uses POSIX sh, and its
#         error message no longer prints a literal "\n"; the saq hook now
#         fails loudly instead of leaving a half-updated /boot unnoticed.
# rel 18: provide explicit TUN, policy-routing, iptables TPROXY/REDIRECT and
#         native nftables TPROXY/REDIRECT/FIB support for transparent proxies.
# rel 19: no sound on real hardware. x86_64_defconfig only enables the HD-audio
#         *controller* (SND_HDA_INTEL); every codec driver is an unselected,
#         default-less option, so the controller bound but no codec did and no
#         ALSA card appeared. Also, with SOF platform drivers on by default
#         (they default to SND_SOC_SOF_PCI) but SND_SOC_SOF_HDA_LINK /
#         _AUDIO_CODEC and the HDA machine driver left off, snd-intel-dspcfg
#         handed Tiger/Alder/Meteor/Lunar Lake laptops (DMIC present) to SOF,
#         which then had nothing to drive. Now: every HDA codec + speaker-amp
#         companion, SOF with HDA links, SoundWire and the Intel machine
#         drivers, AMD ACP DMIC, USB audio; and the generic-laptop glue that
#         those and the touchpads need (LPSS I2C/SPI, Intel/AMD pinctrl, ISH/SFH
#         sensor hubs), Wi-Fi/Ethernet/Bluetooth chip drivers and platform
#         (Fn key/backlight) drivers. Needs the SOF/Cirrus/TI firmware in
#         linux-firmware-lite rel 2 and the UCM profiles in alsa-ucm-conf.
[package]
name = "linux"
version = "6.10"
rel = 19
arch = ["x86_64"]
summary = "Generic x86_64 Linux kernel for desktop, laptop, workstation and virtual machines"
license = ["GPL-2.0"]
source = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-%{version}.tar.xz"
sha256 = "774698422ee54c5f1e704456f37c65c06b51b4e9a8b0866f34580d86fef8e226"

[depends]
build = ["bison", "flex", "perl", "bc", "openssl", "elfutils", "kmod"]
run = ["saq"]

[build]
configure = '''
make mrproper
make defconfig

# ---- 1. what we ask for ------------------------------------------------------
# Kconfig resolves dependencies afterwards (olddefconfig) and may silently drop
# an option whose dependencies are not met, so section 2 re-checks the result.

# Subsystems the rest depends on.
scripts/config \
    --enable BLOCK --enable NET --enable INET --enable CRYPTO --enable PCI \
    --enable ACPI --enable USB --enable SCSI --enable ATA --enable SATA_PMP \
    --enable INPUT --enable VIRTIO --enable MODULES --enable MODULE_UNLOAD \
    --enable FW_LOADER --enable EFI --enable EFI_STUB

# Transparent proxy support (v2rayA and other TUN/TPROXY/REDIRECT clients).
#
# TUN is built in so /dev/net/tun is available without relying on a module
# load race when a proxy service starts. Policy routing is required by the
# fwmark/table-100 rules used by both the iptables and nftables TPROXY paths.
scripts/config \
    --enable IPV6 \
    --enable IP_ADVANCED_ROUTER --enable IP_MULTIPLE_TABLES \
    --enable IPV6_MULTIPLE_TABLES \
    --enable NETFILTER --enable NETFILTER_ADVANCED \
    --enable TUN \
    --module NETFILTER_XTABLES \
    --module NF_CONNTRACK --module NF_NAT \
    --module IP_NF_IPTABLES --module IP_NF_MANGLE --module IP_NF_NAT \
    --module IP6_NF_IPTABLES --module IP6_NF_MANGLE --module IP6_NF_NAT \
    --module NETFILTER_XT_MATCH_SOCKET \
    --module NETFILTER_XT_MATCH_ADDRTYPE \
    --module NETFILTER_XT_MATCH_CONNTRACK \
    --module NETFILTER_XT_MATCH_MARK \
    --module NETFILTER_XT_TARGET_MARK \
    --module NETFILTER_XT_TARGET_CONNMARK \
    --module NETFILTER_XT_TARGET_TPROXY \
    --module NETFILTER_XT_TARGET_REDIRECT \
    --enable NF_TABLES --enable NF_TABLES_INET \
    --module NFT_CT \
    --module NFT_FIB_IPV4 --module NFT_FIB_IPV6 --module NFT_FIB_INET \
    --module NFT_SOCKET --module NFT_TPROXY \
    --module NFT_REDIR --module NFT_NAT

# Identify the build: uname -r is 6.10.0-faseela, not a bare 6.10.0.
scripts/config --set-str LOCALVERSION "-faseela" --disable LOCALVERSION_AUTO

# x86_64_defconfig is a developer config and sets CONFIG_WERROR=y. With the much
# wider driver set below (rel 19) one new-compiler warning in a driver nobody here
# uses would fail the whole kernel build; a distro kernel does not turn warnings
# into errors.
scripts/config --disable WERROR

# No debug info (see rel 5). DEBUG_INFO_NONE is the "none" choice of a
# Kconfig choice group, the DWARF entries are its siblings.
scripts/config \
    --enable DEBUG_INFO_NONE \
    --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
    --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_DWARF5 \
    --disable DEBUG_INFO_BTF

# Initramfs: saq writes a gzip-compressed newc cpio archive.
scripts/config \
    --enable BLK_DEV_INITRD --enable RD_GZIP \
    --enable DEVTMPFS --enable TMPFS --enable PROC_FS --enable SYSFS \
    --enable BINFMT_ELF --enable BINFMT_SCRIPT

# Root storage, built in: the initramfs may not have the module, and the root
# device has to exist before /init can mount it.
scripts/config \
    --enable BLK_DEV_SD --enable BLK_DEV_SR \
    --enable SATA_AHCI --enable ATA_PIIX \
    --enable BLK_DEV_NVME --enable VMD \
    --enable USB_XHCI_HCD --enable USB_XHCI_PCI \
    --enable USB_EHCI_HCD --enable USB_EHCI_PCI \
    --enable USB_STORAGE --enable USB_UAS \
    --enable MMC --enable MMC_BLOCK --enable MMC_SDHCI --enable MMC_SDHCI_PCI \
    --enable VIRTIO_PCI --enable VIRTIO_BLK --enable SCSI_VIRTIO \
    --module VMWARE_PVSCSI

# Root and live-media filesystems, built in.
scripts/config \
    --enable EXT4_FS --enable VFAT_FS --enable FAT_FS \
    --enable NLS_CODEPAGE_437 --enable NLS_ISO8859_1 \
    --enable ISO9660_FS --enable OVERLAY_FS --enable BLK_DEV_LOOP \
    --enable SQUASHFS --enable SQUASHFS_ZLIB --enable SQUASHFS_XZ \
    --enable SQUASHFS_ZSTD --enable XZ_DEC --enable XZ_DEC_X86 \
    --enable BLK_DEV_DM \
    --module DM_CRYPT --module WIREGUARD --module EXFAT_FS --module NTFS3_FS

# Something must draw on the screen without any module (see rel 17):
# the firmware framebuffer (UEFI GOP / VBE) exposed as simpledrm, plus the
# VT/fbcon console on top of it. Native drivers below replace it when loaded.
scripts/config \
    --enable DRM --enable DRM_KMS_HELPER --enable DRM_FBDEV_EMULATION \
    --enable SYSFB_SIMPLEFB --enable DRM_SIMPLEDRM \
    --enable VT --enable VT_CONSOLE --enable FRAMEBUFFER_CONSOLE \
    --enable DRM_VIRTIO_GPU --module DRM_BOCHS

# Native GPU drivers, modules.
scripts/config \
    --module DRM_I915 --module DRM_XE --module DRM_AMDGPU --module DRM_NOUVEAU

# Input needed to type into the saq rescue shell and to log in.
scripts/config \
    --enable HID --enable HID_GENERIC --enable USB_HID \
    --enable KEYBOARD_ATKBD --enable VIRTIO_INPUT \
    --module I2C_HID_ACPI

# Everything else: audio, wireless, bluetooth, Type-C/USB4 and laptop glue. All
# modules: they load through udev coldplug, and a module this machine does not
# need costs disk space only.

# --- audio (see rel 19) --------------------------------------------------------
# 1. HD-audio: the controller AND the codec drivers. Without a codec driver the
#    controller binds and nothing else happens (defconfig has no codec at all).
#    SND_HDA_GENERIC is what QEMU's hda-duplex and many unknown codecs use.
scripts/config \
    --enable SOUND --enable SND --enable SND_PCI --enable SND_HDA \
    --module SND_HDA_INTEL \
    --module SND_HDA_GENERIC --module SND_HDA_CODEC_REALTEK \
    --module SND_HDA_CODEC_ANALOG --module SND_HDA_CODEC_SIGMATEL \
    --module SND_HDA_CODEC_VIA --module SND_HDA_CODEC_HDMI \
    --module SND_HDA_CODEC_CIRRUS --module SND_HDA_CODEC_CS8409 \
    --module SND_HDA_CODEC_CONEXANT --module SND_HDA_CODEC_CA0110 \
    --module SND_HDA_CODEC_CA0132 --module SND_HDA_CODEC_CMEDIA \
    --module SND_HDA_CODEC_SI3054 \
    --module SND_HDA_SCODEC_CS35L41_I2C --module SND_HDA_SCODEC_CS35L41_SPI \
    --module SND_HDA_SCODEC_CS35L56_I2C --module SND_HDA_SCODEC_CS35L56_SPI \
    --module SND_HDA_SCODEC_TAS2781_I2C \
    --enable SND_USB --module SND_USB_AUDIO

# 2. Intel DSP (SOF): Skylake and newer laptops with a digital microphone are
#    sent to SOF by snd-intel-dspcfg, so SOF must be able to drive the HDA codec
#    (HDA link + HDAudio codec + the "Skylake+ with HDA codecs" machine driver)
#    and SoundWire codecs. The per-platform SOF drivers (TGL, ADL, MTL, LNL, ...)
#    default to SND_SOC_SOF_PCI and so become modules by themselves. Needs the
#    intel/sof* firmware and topologies from linux-firmware-lite.
scripts/config \
    --enable SND_SOC --enable SND_SOC_SOF_TOPLEVEL --module SND_SOC_SOF_PCI \
    --enable SND_SOC_SOF_INTEL_TOPLEVEL --enable SND_SOC_INTEL_MACH \
    --enable SND_SOC_SOF_HDA_LINK --enable SND_SOC_SOF_HDA_AUDIO_CODEC \
    --enable I2C --enable SPI --enable X86_INTEL_LPSS \
    --module SOUNDWIRE --module SOUNDWIRE_INTEL --module SND_SOC_SOF_INTEL_SOUNDWIRE \
    --enable SND_SOC_INTEL_USER_FRIENDLY_LONG_NAMES \
    --module SND_SOC_INTEL_SKL_HDA_DSP_GENERIC_MACH \
    --module SND_SOC_INTEL_SOUNDWIRE_SOF_MACH \
    --module SND_SOC_INTEL_SOF_RT5682_MACH --module SND_SOC_INTEL_SOF_CS42L42_MACH \
    --module SND_SOC_INTEL_SOF_SSP_AMP_MACH --module SND_SOC_INTEL_SOF_ES8336_MACH \
    --module SND_SOC_INTEL_SOF_NAU8825_MACH --module SND_SOC_INTEL_SOF_DA7219_MACH

# 3. AMD: analog audio is plain HD-audio (above); the ACP is the digital
#    microphone path of Ryzen laptops.
scripts/config \
    --module SND_SOC_AMD_RENOIR --module SND_SOC_AMD_RENOIR_MACH \
    --module SND_SOC_AMD_ACP6x --module SND_SOC_AMD_YC_MACH \
    --module SND_SOC_AMD_PS --module SND_SOC_AMD_PS_MACH

# --- laptop glue: what touchpads, keyboards and amplifiers hang off ------------
# Intel LPSS I2C/SPI controllers and the Intel/AMD GPIO (pinctrl) drivers: an
# I2C-HID touchpad and the SPI/I2C speaker amplifiers above do not exist without
# them. Sensor hubs, Fn-key/WMI platform drivers, card readers and webcams.
scripts/config \
    --module MFD_INTEL_LPSS_PCI --module MFD_INTEL_LPSS_ACPI \
    --module I2C_DESIGNWARE_PLATFORM --module I2C_DESIGNWARE_PCI \
    --module SPI_PXA2XX --enable PINCTRL_AMD \
    --module PINCTRL_ALDERLAKE --module PINCTRL_TIGERLAKE \
    --module PINCTRL_METEORLAKE --module PINCTRL_ICELAKE \
    --module PINCTRL_CANNONLAKE --module PINCTRL_JASPERLAKE \
    --module PINCTRL_ELKHARTLAKE --module PINCTRL_GEMINILAKE \
    --module PINCTRL_BROXTON --module PINCTRL_SUNRISEPOINT \
    --module PINCTRL_CHERRYVIEW --module PINCTRL_BAYTRAIL \
    --module HID_MULTITOUCH --module HID_APPLE --module HID_RMI \
    --module HID_LOGITECH_DJ --module HID_LOGITECH_HIDPP \
    --module MOUSE_ELAN_I2C --module HID_SENSOR_HUB \
    --module INTEL_ISH_HID --module AMD_SFH_HID \
    --module UHID --module INPUT_UINPUT \
    --enable X86_PLATFORM_DEVICES --module ACPI_WMI \
    --enable X86_PLATFORM_DRIVERS_DELL --enable X86_PLATFORM_DRIVERS_HP \
    --module THINKPAD_ACPI --module DELL_LAPTOP --module DELL_WMI \
    --module HP_WMI --module ASUS_WMI --module ASUS_NB_WMI \
    --module IDEAPAD_LAPTOP --module ACER_WMI --module MSI_WMI \
    --module MSI_LAPTOP --module LG_LAPTOP --module SAMSUNG_LAPTOP \
    --module SONY_LAPTOP --module FUJITSU_LAPTOP \
    --module INTEL_HID_EVENT --module INTEL_VBTN \
    --module INTEL_PMC_CORE --module AMD_PMC --enable X86_AMD_PSTATE \
    --module MISC_RTSX_PCI --module MISC_RTSX_USB \
    --module MMC_REALTEK_PCI --module MMC_REALTEK_USB \
    --module MEDIA_SUPPORT --enable MEDIA_SUPPORT_FILTER \
    --enable MEDIA_CAMERA_SUPPORT --enable MEDIA_USB_SUPPORT \
    --module USB_VIDEO_CLASS

# --- network ---------------------------------------------------------------------
# Wi-Fi: every chip family with an in-tree PCIe driver, plus the USB ones that
# are common as dongles. Each RTW88/RTW89 chip is its own option and defaults to
# off, so naming only RTW88 built a driver for no chip at all. Firmware for
# these is in linux-firmware-lite (rtw88, rtw89, ath1xk, mediatek, brcm, ...).
scripts/config \
    --enable WLAN --enable CFG80211 --enable MAC80211 \
    --enable WLAN_VENDOR_INTEL --enable WLAN_VENDOR_REALTEK \
    --enable WLAN_VENDOR_ATH --enable WLAN_VENDOR_MEDIATEK \
    --enable WLAN_VENDOR_BROADCOM --enable WLAN_VENDOR_RALINK \
    --module IWLWIFI --module IWLMVM --module IWLDVM \
    --module ATH9K --module ATH10K_PCI --module ATH11K_PCI --module ATH12K \
    --module RTW88 --module RTW88_PCI \
    --module RTW88_8822BE --module RTW88_8822CE \
    --module RTW88_8723DE --module RTW88_8821CE \
    --module RTW88_USB --module RTW88_8822BU --module RTW88_8822CU \
    --module RTW88_8821CU --module RTW88_8723DU \
    --module RTW89 --module RTW89_PCI \
    --module RTW89_8851BE --module RTW89_8852AE --module RTW89_8852BE \
    --module RTW89_8852CE --module RTW89_8922AE \
    --module RTLWIFI --module RTL8821AE --module RTL8192CE --module RTL8192CU \
    --module RTL8XXXU \
    --module MT7921E --module MT7925E --module MT7915E \
    --module BRCMFMAC --enable BRCMFMAC_PCIE --enable BRCMFMAC_USB \
    --module RT2800PCI --module RT2800USB

# Ethernet beyond what defconfig builds in (e1000e, r8169, tg3, sky2, ...):
# Intel I210/I225, Atheros, and USB dongles / phone tethering.
scripts/config \
    --module IGB --module IGC --module ATL1C --module ALX \
    --module USB_USBNET --module USB_RTL8152 \
    --module USB_NET_AX8817X --module USB_NET_AX88179_178A \
    --module USB_NET_CDCETHER --module USB_NET_CDC_NCM \
    --module USB_NET_RNDIS_HOST --module USB_IPHETH

# Bluetooth: the USB controller driver with its vendor helpers, and the protocol
# layers BlueZ needs (HID mice/keyboards, serial profiles, tethering).
scripts/config \
    --enable BT --enable BT_BREDR --enable BT_LE \
    --module BT_HCIBTUSB \
    --enable BT_HCIBTUSB_BCM --enable BT_HCIBTUSB_MTK --enable BT_HCIBTUSB_RTL \
    --module BT_RFCOMM --module BT_BNEP --module BT_HIDP

# --- Type-C / USB4 -----------------------------------------------------------------
scripts/config \
    --enable TYPEC --enable TYPEC_UCSI --module UCSI_ACPI --module USB4

make olddefconfig

# ---- 2. what we verify -------------------------------------------------------
# require_config: the system cannot boot (or the distro's promises break)
#                 without it -> the build fails.
# want_config:    useful, but not worth failing the build -> a warning.
# All problems are collected and reported together. POSIX sh only.
fail=0
cfg_value() {
    awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1); exit }' .config
}
require_config() {
    actual="$(cfg_value "$1")"
    if [ "$actual" != "$2" ]; then
        echo "error: expected $1=$2 in .config, found ${actual:-unset}" >&2
        fail=1
    fi
}
want_config() {
    actual="$(cfg_value "$1")"
    if [ "$actual" != "$2" ]; then
        echo "warning: wanted $1=$2 in .config, found ${actual:-unset}" >&2
    fi
}

# Transparent proxy support: fail the kernel build rather than shipping
# a kernel that silently lacks one of v2rayA's interception backends.
require_config CONFIG_IPV6 y
require_config CONFIG_TUN y
require_config CONFIG_IP_ADVANCED_ROUTER y
require_config CONFIG_IP_MULTIPLE_TABLES y
require_config CONFIG_IPV6_MULTIPLE_TABLES y

# Common Netfilter, conntrack and NAT infrastructure.
require_config CONFIG_NETFILTER y
require_config CONFIG_NETFILTER_ADVANCED y
require_config CONFIG_NETFILTER_XTABLES m
require_config CONFIG_NF_CONNTRACK m
require_config CONFIG_NF_NAT m

# iptables legacy backend: mangle/policy marking for TPROXY and NAT REDIRECT.
require_config CONFIG_IP_NF_IPTABLES m
require_config CONFIG_IP_NF_MANGLE m
require_config CONFIG_IP_NF_NAT m
require_config CONFIG_IP6_NF_IPTABLES m
require_config CONFIG_IP6_NF_MANGLE m
require_config CONFIG_IP6_NF_NAT m
require_config CONFIG_NETFILTER_XT_MATCH_SOCKET m
require_config CONFIG_NETFILTER_XT_MATCH_ADDRTYPE m
require_config CONFIG_NETFILTER_XT_MATCH_CONNTRACK m
require_config CONFIG_NETFILTER_XT_MATCH_MARK m
require_config CONFIG_NETFILTER_XT_TARGET_MARK m
require_config CONFIG_NETFILTER_XT_TARGET_CONNMARK m
require_config CONFIG_NETFILTER_XT_TARGET_TPROXY m
require_config CONFIG_NETFILTER_XT_TARGET_REDIRECT m

# Native nftables backend: V2RayA uses inet tables, ct marks, FIB lookup,
# socket matching, TPROXY and REDIRECT expressions.
require_config CONFIG_NF_TABLES y
require_config CONFIG_NF_TABLES_INET y
require_config CONFIG_NFT_CT m
require_config CONFIG_NFT_FIB_IPV4 m
require_config CONFIG_NFT_FIB_IPV6 m
require_config CONFIG_NFT_FIB_INET m
require_config CONFIG_NFT_SOCKET m
require_config CONFIG_NFT_TPROXY m
require_config CONFIG_NFT_REDIR m
require_config CONFIG_NFT_NAT m

# Initramfs and early userspace.
require_config CONFIG_BLK_DEV_INITRD y
require_config CONFIG_RD_GZIP y
require_config CONFIG_DEVTMPFS y
require_config CONFIG_TMPFS y
require_config CONFIG_PROC_FS y
require_config CONFIG_SYSFS y
require_config CONFIG_BINFMT_ELF y
require_config CONFIG_BINFMT_SCRIPT y
require_config CONFIG_MODULES y
require_config CONFIG_MODULE_UNLOAD y
require_config CONFIG_FW_LOADER y
require_config CONFIG_EFI y
require_config CONFIG_EFI_STUB y

# A console that works without loading any module.
require_config CONFIG_VT y
require_config CONFIG_VT_CONSOLE y
require_config CONFIG_DRM y
require_config CONFIG_DRM_FBDEV_EMULATION y
require_config CONFIG_SYSFB_SIMPLEFB y
require_config CONFIG_DRM_SIMPLEDRM y
require_config CONFIG_FRAMEBUFFER_CONSOLE y

# Root storage and root filesystems.
require_config CONFIG_BLK_DEV_SD y
require_config CONFIG_SATA_AHCI y
require_config CONFIG_BLK_DEV_NVME y
require_config CONFIG_USB_XHCI_HCD y
require_config CONFIG_USB_XHCI_PCI y
require_config CONFIG_USB_EHCI_HCD y
require_config CONFIG_USB_STORAGE y
require_config CONFIG_MMC_BLOCK y
require_config CONFIG_MMC_SDHCI_PCI y
require_config CONFIG_VIRTIO_BLK y
require_config CONFIG_EXT4_FS y
require_config CONFIG_VFAT_FS y
require_config CONFIG_ISO9660_FS y
require_config CONFIG_OVERLAY_FS y
require_config CONFIG_SQUASHFS y
require_config CONFIG_SQUASHFS_ZLIB y
require_config CONFIG_SQUASHFS_XZ y
require_config CONFIG_SQUASHFS_ZSTD y
require_config CONFIG_XZ_DEC_X86 y
require_config CONFIG_BLK_DEV_DM y

# Input: a keyboard for the rescue shell and for login.
require_config CONFIG_HID_GENERIC y
require_config CONFIG_USB_HID y
require_config CONFIG_KEYBOARD_ATKBD y
require_config CONFIG_VIRTIO_INPUT y

# Distro promises: recipes that need these as modules.
require_config CONFIG_WIREGUARD m
require_config CONFIG_EXFAT_FS m
require_config CONFIG_DM_CRYPT m
require_config CONFIG_NTFS3_FS m

# Generic x86_64 hardware coverage.
require_config CONFIG_DRM_I915 m
require_config CONFIG_DRM_XE m
require_config CONFIG_DRM_AMDGPU m
require_config CONFIG_DRM_NOUVEAU m
require_config CONFIG_USB4 m
require_config CONFIG_UCSI_ACPI m
require_config CONFIG_SND_SOC y
require_config CONFIG_SND_SOC_SOF_TOPLEVEL y
require_config CONFIG_SND_SOC_SOF_PCI m
require_config CONFIG_SND_SOC_SOF_INTEL_TOPLEVEL y
require_config CONFIG_VMWARE_PVSCSI m
require_config CONFIG_IWLWIFI m
require_config CONFIG_IWLMVM m
require_config CONFIG_ATH9K m
require_config CONFIG_RTW88 m
require_config CONFIG_BT_HCIBTUSB m
require_config CONFIG_SND_HDA_INTEL m

# Sound on real hardware (rel 19). "A card exists" needs ALL of these: a codec
# driver bound to the HD-audio controller, or SOF able to drive the HDA codec
# and its machine driver. Each of them is an option nothing selects by itself,
# which is how the kernel shipped with a sound controller and no sound.
require_config CONFIG_SND_HDA_GENERIC m
require_config CONFIG_SND_HDA_CODEC_REALTEK m
require_config CONFIG_SND_HDA_CODEC_HDMI m
require_config CONFIG_SND_SOC_SOF_HDA_LINK y
require_config CONFIG_SND_SOC_SOF_HDA_AUDIO_CODEC y
require_config CONFIG_SND_SOC_INTEL_SKL_HDA_DSP_GENERIC_MACH m
require_config CONFIG_SND_USB_AUDIO m
# The Wi-Fi/touchpad pieces that were silently off before (RTW88 alone has no chip).
require_config CONFIG_RTW88_8822CE m
require_config CONFIG_RTW89_8852AE m
require_config CONFIG_I2C_DESIGNWARE_PLATFORM m
require_config CONFIG_MFD_INTEL_LPSS_PCI m
require_config CONFIG_BT_HIDP m

# Worth having; a missing one is reported but does not stop the build.
want_config CONFIG_SND_SOC_SOF_TIGERLAKE m
want_config CONFIG_SND_SOC_SOF_ALDERLAKE m
want_config CONFIG_SND_SOC_SOF_METEORLAKE m
want_config CONFIG_SND_SOC_SOF_INTEL_SOUNDWIRE m
want_config CONFIG_SND_SOC_INTEL_SOUNDWIRE_SOF_MACH m
want_config CONFIG_SND_HDA_CODEC_CONEXANT m
want_config CONFIG_SND_HDA_SCODEC_CS35L41_I2C m
want_config CONFIG_SND_HDA_SCODEC_TAS2781_I2C m
want_config CONFIG_SND_SOC_AMD_YC_MACH m
want_config CONFIG_SND_SOC_AMD_PS_MACH m
want_config CONFIG_PINCTRL_ALDERLAKE m
want_config CONFIG_PINCTRL_AMD y
want_config CONFIG_USB_VIDEO_CLASS m
want_config CONFIG_THINKPAD_ACPI m
want_config CONFIG_MT7921E m
want_config CONFIG_ATH11K_PCI m
want_config CONFIG_VMD y
want_config CONFIG_DRM_VIRTIO_GPU y
want_config CONFIG_DRM_BOCHS m
want_config CONFIG_I2C_HID_ACPI m
want_config CONFIG_DEBUG_INFO_NONE y

if [ "$fail" != 0 ]; then
    echo "linux: the final .config does not meet the boot requirements above" >&2
    exit 1
fi
'''
compile = "make -j%{jobs}"
install = '''
# The package version is a source-version label, not the installed kernel
# release. Use the exact KERNELRELEASE chosen by Kbuild for every installed path.
KVER="$(make -s kernelrelease)"
test -n "$KVER" || {
    echo "linux: could not determine kernel release" >&2
    exit 1
}

make INSTALL_MOD_PATH=%{pkgdir} INSTALL_MOD_STRIP=1 modules_install

# Keep the boot image and module tree on the same release string. saq discovers
# /boot/vmlinuz-* and expects the matching /lib/modules/<release> directory.
test -d "%{pkgdir}/lib/modules/$KVER" || {
    echo "linux: modules_install did not create lib/modules/$KVER" >&2
    exit 1
}
rm -f "%{pkgdir}/lib/modules/$KVER/build" \
      "%{pkgdir}/lib/modules/$KVER/source"

# modules_install already runs depmod when it is available; make sure, because
# saq trusts modules.dep to resolve the storage modules' dependencies.
depmod -b "%{pkgdir}" "$KVER"
test -s "%{pkgdir}/lib/modules/$KVER/modules.dep" || {
    echo "linux: empty modules.dep for $KVER" >&2
    exit 1
}

install -Dm644 arch/x86/boot/bzImage "%{pkgdir}/boot/vmlinuz-$KVER"
install -Dm644 System.map "%{pkgdir}/boot/System.map-$KVER"
install -Dm644 .config "%{pkgdir}/boot/config-$KVER"
'''

[hooks]
# Nawa runs post_install after both a fresh install and an upgrade.
post_install = '''
if [ -x /usr/sbin/saq ]; then
    if ! /usr/sbin/saq --all --prune --update-default; then
        echo "linux: WARNING: saq failed. /boot may hold a kernel without a" >&2
        echo "linux: matching initramfs. Check /boot and re-run saq BEFORE rebooting." >&2
        exit 1
    fi
else
    echo "linux: saq is not present in this root; skipping initramfs refresh"
fi
'''
# Remove stale images after the kernel package payload has been removed.
post_remove = '''
if [ -x /usr/sbin/saq ]; then
    /usr/sbin/saq --prune --update-default
else
    echo "linux: saq is not present in this root; skipping initramfs cleanup"
fi
'''
