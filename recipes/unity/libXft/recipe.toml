# unity recipe: libXft — X FreeType library (X11 font rendering).
# Small X library, listed as a unity-control-center build dep by Debian.
# Note: verified by grep that nothing in the unity-control-center 0ubuntu13
# source actually references Xft — it is a vestigial Debian Build-Depends
# there, so ucc does not depend on this recipe. Kept as a leaf library for
# the wider Unity stack.
[package]
name = "libXft"
version = "2.3.6"
rel = 2
arch = ["x86_64"]
summary = "X FreeType library"
license = ["X11"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libxft"
url = "https://archive.ubuntu.com/ubuntu/pool/main/x/xft/xft_2.3.6.orig.tar.gz"
sha256 = "b7e59f69e0bbabe9438088775f7e5a7c16a572e58b11f9722519385d38192df5"
strip_components = 1

[depends]
build = ["pkgconf", "fontconfig", "freetype", "libX11", "libXrender", "zlib"]
run = ["fontconfig", "freetype", "libX11", "libXrender", "zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = '''export CFLAGS="-O2 -Wno-error"
./configure --prefix=/usr --libdir=/usr/lib --disable-static
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/libXft.so
test -e %{pkgdir}/usr/lib/pkgconfig/xft.pc
'''
