# Development recipe: Rust standard-library source required by rust-analyzer and IDE tooling.
#
# Keep this component version-locked to the base rust recipe. It is installed
# from the same official Rust distribution archive without Rustup.
[package]
name = "rust-src"
version = "1.96.1"
rel = 1
arch = ["x86_64"]
summary = "Rust standard library source code for IDE tooling"
license = ["MIT", "Apache-2.0"]
source = "https://static.rust-lang.org/dist/rust-%{version}-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "d29ccb1559a177c4e72291f6e5f629de7fe8885e7521ca47802627544b121e95"
source_dir = "rust-%{version}-x86_64-unknown-linux-gnu"

[depends]
build = []
run = ["rust"]

[slim]
strip = false

[build]
install = """
if [ ! -f ./install.sh ]; then
    echo "rust-src: install.sh not found in $(pwd); contents:" >&2
    ls -la . >&2
    exit 1
fi

# Install only the standard-library source component.
bash ./install.sh --prefix=/usr --destdir=%{pkgdir} --disable-ldconfig \\
    --components=rust-src

# Shared installer state belongs to the base rust package.
rl=%{pkgdir}/usr/lib/rustlib
rm -f "$rl/install.log" "$rl/uninstall.sh" "$rl/components" "$rl/rust-installer-version"
for f in "$rl"/manifest-*; do
    [ -f "$f" ] || continue
    sed -i "s#%{pkgdir}##g" "$f"
done
"""
