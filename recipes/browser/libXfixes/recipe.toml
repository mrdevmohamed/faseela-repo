# browser recipe: libXfixes — X Fixes extension client library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXfixes"
version = "6.0.1"
rel = 1
arch = ["x86_64"]
summary = "X Fixes extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXfixes-%{version}.tar.xz"
sha256 = "b695f93cd2499421ab02d22744458e650ccc88c1d4c8130d60200213abc02d58"

[depends]
build = ["pkgconf", "xorgproto", "libX11"]
run = ["libX11"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
