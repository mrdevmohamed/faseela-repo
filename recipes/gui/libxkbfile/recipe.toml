# gui recipe: libxkbfile — X11 keyboard file access library (Xwayland dependency)
# Xwayland uses it to compile and load keyboard description files from
# xkeyboard-config; libxkbcommon on the other side of the wire serves the
# Wayland-native clients.
[package]
name = "libxkbfile"
version = "1.2.0"
rel = 1
arch = ["x86_64"]
summary = "libxkbfile — X11 keyboard description file library (Xwayland dependency)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libxkbfile-%{version}.tar.xz"
sha256 = "7f71884e5faf56fb0e823f3848599cf9b5a9afce51c90982baeb64f635233ebf"
source_dir = "libxkbfile-%{version}"

[depends]
build = ["pkgconf", "libX11", "xorgproto"]
run = ["libX11"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-docs --disable-devel-docs"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
