# browser recipe: libwebp — WebP image codec, including the demux API used by WebKitGTK.
[package]
name = "libwebp"
version = "1.6.0"
rel = 1
arch = ["x86_64"]
summary = "WebP image codec and demux library"
license = ["BSD-3-Clause"]
source = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-%{version}.tar.gz"
sha256 = "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564"
source_dir = "libwebp-%{version}"

[depends]
build = ["cmake", "ninja", "zlib", "libpng", "libjpeg-turbo"]
run = ["zlib", "libpng", "libjpeg-turbo"]

[build]
configure = "cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF -DWEBP_BUILD_FUZZTEST=OFF -DWEBP_BUILD_TESTS=OFF"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} ninja -C build install"
