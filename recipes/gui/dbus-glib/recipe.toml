# gui recipe: dbus-glib — legacy GLib bindings for the D-Bus message bus
[package]
name = "dbus-glib"
version = "0.116"
rel = 1
arch = ["x86_64"]
summary = "GLib bindings for D-Bus, required by the XFCE screensaver"
license = ["AFL-2.1", "GPL-2.0-or-later"]
source = "https://dbus.freedesktop.org/releases/dbus-glib/dbus-glib-%{version}.tar.gz"
sha256 = "e3f3d4487e2883800770ed5899ed111bdc4ba7056af34a255c4c46ad8a2486f3"
source_dir = "dbus-glib-%{version}"

[depends]
build = ["pkgconf", "dbus", "glib", "gettext"]
run = ["dbus", "glib"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --disable-static --disable-gtk-doc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
