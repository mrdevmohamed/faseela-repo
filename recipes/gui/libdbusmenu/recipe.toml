# gui recipe: libdbusmenu — D-Bus menu transport used by Waybar's StatusNotifier tray
# Build the GLib and GTK 3 libraries from the same upstream source tree.
# GTK 2, the dumper, tests, introspection, Vala bindings and gtk-doc are not
# needed by the Faseela desktop. Debian's repacked source omits generated
# Autotools files, so regenerate them locally without GNOME-only docs/NLS tools.
[package]
name = "libdbusmenu"
version = "18.10.20180917"
rel = 3
arch = ["x86_64"]
summary = "D-Bus menu transport library (GLib and GTK 3)"
license = ["LGPL-2.1-or-later", "LGPL-3.0-or-later"]
source = "https://deb.debian.org/debian/pool/main/libd/libdbusmenu/libdbusmenu_%{version}~bzr492+repack1.orig.tar.xz"
sha256 = "41298b926573419f21864205317461750b833c596af6ab0bd206e13336f8cee3"
source_dir = "libdbusmenu-%{version}~bzr492"

[depends]
build = ["pkgconf", "glib", "gtk3", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "gtk3"]

[build]
prepare = '''
# The Debian repack intentionally excludes generated configure/Makefile.in.
# Recreate them with packaged Autotools instead of gnome-autogen.sh, which
# requires gnome-common and gtk-doc (neither is part of Faseela).
#
# The recipe ships no translations or API docs. Remove the GNOME-only
# intltool/docs configure macros and docs subdirectory. tests/Makefile.am
# still references ENABLE_GTK_DOC while Automake generates Makefile.in, even
# with tests disabled, so define that conditional explicitly as false. Keep
# the in-tree introspection macro available but disable that feature later.
sed -i \
    -e '/^[[:space:]]*IT_PROG_INTLTOOL(/d' \
    -e 's/^[[:space:]]*GTK_DOC_CHECK(.*/AM_CONDITIONAL([ENABLE_GTK_DOC], [false])/' \
    -e '/^[[:space:]]*docs/d' \
    configure.ac
sed -i '/^[[:space:]]*docs[[:space:]]/d' Makefile.am
autoreconf -fi
'''
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-nls --disable-static --with-gtk=3 --disable-dumper --disable-tests --disable-introspection --disable-vala"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# Waybar's Meson probe is for this exact pkg-config module. Refuse to publish
# an incomplete library package if upstream ever changes the install layout.
test -s %{pkgdir}/usr/lib/pkgconfig/dbusmenu-gtk3-0.4.pc
test -e %{pkgdir}/usr/lib/libdbusmenu-glib.so.4
test -e %{pkgdir}/usr/lib/libdbusmenu-gtk3.so.4
'''
