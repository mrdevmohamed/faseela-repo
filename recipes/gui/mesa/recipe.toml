# Mesa: AMD RADV and Intel ANV Vulkan, plus lavapipe software fallback.
# rel 6 enables the real AMD/Intel Vulkan ICDs and restores the DRI-based GLX ABI
# required by legacy Qt/AppImage clients, while keeping Wayland as a native platform.
# Intel ANV compiles its internal kernels with intel_clc, which needs libclc's
# Mesa SPIR-V builtins and the matching LLVM/SPIR-V translator.
[package]
name = "mesa"
version = "24.3.0"
rel = 7
arch = ["x86_64"]
summary = "OpenGL/GLES/EGL/GBM + AMD/Intel Vulkan and lavapipe fallback"
license = ["MIT"]
source = "https://archive.mesa3d.org/mesa-%{version}.tar.xz"
sha256 = "97813fe65028ef21b4d4e54164563059e8408d8fee3489a2323468d198bf2efc"

[depends]
build = ["meson", "ninja", "pkgconf", "python-mako", "python-markupsafe", "python-pyyaml", "python-packaging", "python-ply", "libdrm", "xorgproto", "libX11", "libXext", "libXfixes", "libxcb", "libxshmfence", "wayland", "wayland-protocols", "expat", "zlib", "zstd", "bison", "flex", "llvm", "spirv-llvm-translator", "libclc", "elfutils", "libva", "vulkan-headers", "glslang"]
run = ["libdrm", "libX11", "libXext", "libXfixes", "libxcb", "libxshmfence", "wayland", "expat", "zlib", "zstd", "llvm", "elfutils", "libva"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D platforms=wayland,x11 -D gallium-drivers=radeonsi,softpipe,llvmpipe,virgl -D vulkan-drivers=amd,intel,intel_hasvk,swrast -D llvm=enabled -D shared-llvm=enabled -D glx=dri -D egl=enabled -D gbm=enabled -D gles1=disabled -D gles2=enabled -D gallium-va=enabled -D video-codecs=h264dec,h264enc,h265dec,h265enc,vc1dec,av1dec,av1enc,vp9dec -D glvnd=disabled -D valgrind=disabled -D libunwind=disabled -D lmsensors=disabled -D build-tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
