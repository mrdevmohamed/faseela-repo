# Pinned GeoIP database required by v2raya_core for routing rules.
[package]
name = "v2raya-geoip"
version = "202611012203"
rel = 1
arch = ["x86_64"]
summary = "GeoIP database for v2rayA (Loyalsoldier rules snapshot)"
license = ["GPL-3.0-only"]
source = "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/%{version}/geoip.dat"
sha256 = "fbf747a085be25eb61ecac8c27140b4ab0bf8181af6fdb104caa325bd93cf117"

[depends]
build = []
run = []

[build]
install = "install -Dm644 geoip.dat %{pkgdir}/usr/share/v2raya/geoip.dat"
