# gui recipe: xcb-proto — XML-XCB protocol descriptions and the python generator
# installs python/xcbgen under /usr/lib/python3.X/site-packages: bump `rel` together
# with the python recipe when its minor version changes (libxcb is generated from it).
[package]
name = "xcb-proto"
version = "1.17.0"
rel = 1
arch = ["x86_64"]
summary = "XML-XCB protocol descriptions and the python generator"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/proto/xcb-proto-%{version}.tar.xz"
sha256 = "2c1bacd2110f4799f74de6ebb714b94cf6f80fb112316b1219480fd22562148c"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
