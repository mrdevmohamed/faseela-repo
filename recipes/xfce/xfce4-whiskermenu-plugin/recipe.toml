# xfce recipe: xfce4-whiskermenu-plugin — Whisker Menu panel plugin
[package]
name = "xfce4-whiskermenu-plugin"
version = "2.9.2"
rel = 1
arch = ["x86_64"]
summary = "Whisker Menu panel plugin (application menu with search)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-whiskermenu-plugin/2.9/xfce4-whiskermenu-plugin-2.9.2.tar.bz2"
sha256 = "e2f28c066709bdcfe30236307026a562ec9aed790f9929a4e40aa411a5c7e3de"

[depends]
build = ["cmake", "pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "garcon", "exo"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme", "garcon", "exo"]

[build]
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DCMAKE_SKIP_RPATH=ON"
compile = "make -C build -j%{jobs}"
install = '''make -C build DESTDIR=%{pkgdir} install'''
