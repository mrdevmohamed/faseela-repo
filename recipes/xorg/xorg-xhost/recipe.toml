# xorg recipe: xorg-xhost — X11 server access control utility
[package]
name = "xorg-xhost"
version = "1.0.10"
rel = 1
arch = ["x86_64"]
summary = "X11 server access control utility"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/app/xhost-1.0.10.tar.xz"
sha256 = "a8afd70059479c712948b895e41c35a4a8bfcede3ba2d5a4b855c88bbb725be1"

[depends]
build = ["pkgconf", "libXmu", "libXau", "libX11", "xorgproto"]
run = ["libXmu", "libXau", "libX11"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --disable-static "
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
