# gui recipe: xdg-desktop-portal-gtk — GTK backend for general desktop portals.
[package]
name = "xdg-desktop-portal-gtk"
version = "1.15.3"
rel = 3
arch = ["x86_64"]
summary = "GTK backend for XDG Desktop Portal"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/flatpak/xdg-desktop-portal-gtk/releases/download/%{version}/xdg-desktop-portal-gtk-%{version}.tar.xz"
sha256 = "47a3743d2419a8601e691db37e85bb5fac5ae4b26842177065cd5f22ada23b37"

[depends]
build = ["meson", "ninja", "pkgconf", "gtk3", "xdg-desktop-portal"]
run = ["gtk3", "xdg-desktop-portal", "gsettings-desktop-schemas"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --buildtype=release -D wallpaper=disabled -D settings=enabled -D appchooser=enabled -D lockdown=enabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
