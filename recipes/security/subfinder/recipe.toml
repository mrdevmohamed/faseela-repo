# ProjectDiscovery subfinder command-line tool; pinned upstream Linux amd64 release.
[package]
name = "subfinder"
version = "2.17.0"
rel = 1
arch = ["x86_64"]
summary = "Passive subdomain discovery tool"
license = ["MIT"]
source = "https://github.com/projectdiscovery/subfinder/releases/download/v2.17.0/subfinder_2.17.0_linux_amd64.zip"
sha256 = "a39c3e5c7a26ef3c430915c4d6cbf7716a00f26769a75e9405aba796142eba37"

[depends]
build = ["unzip"]
run = ["glibc"]

[build]
install = """
unzip -oq "subfinder_2.17.0_linux_amd64.zip" -d .
install -Dm755 subfinder %{pkgdir}/usr/bin/subfinder
"""
