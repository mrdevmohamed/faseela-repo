# Python packaging metadata utilities shared by build tools such as pipx.
[package]
name = "python-packaging"
version = "26.3"
rel = 2
arch = ["x86_64"]
summary = "Core utilities for Python packages"
license = ["Apache-2.0", "BSD-2-Clause"]
source = "https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz"
sha256 = "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"
source_dir = "packaging-%{version}"

[depends]
build = ["python"]
run = ["python"]

[build]
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
install -d "%{pkgdir}$site"
cp -r src/packaging "%{pkgdir}$site/"
find "%{pkgdir}$site/packaging" -name __pycache__ -prune -exec rm -rf {} +
'''
