# system recipe: p11-kit — shared PKCS#11 module configuration and loading
# The optional trust module is disabled in this minimal build; PKCS#11 module
# discovery/loading remains available. Enable it later with libtasn1 support.
[package]
name = "p11-kit"
version = "0.26.5"
rel = 1
arch = ["x86_64"]
summary = "Shared PKCS#11 module configuration and loading"
license = ["BSD-3-Clause"]
source = "https://github.com/p11-glue/p11-kit/releases/download/%{version}/p11-kit-%{version}.tar.xz"
sha256 = "f2cc09111e44bf3fea58f023180b33acea90aa82d042d6fbb623fbc5ba033bb7"

[depends]
build = ["meson", "ninja", "pkgconf", "libffi"]
run = ["libffi"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dsystemd=disabled -Dtrust_module=disabled -Dlibffi=enabled -Dman=false -Dgtk_doc=false -Dnls=false -Dtest=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
