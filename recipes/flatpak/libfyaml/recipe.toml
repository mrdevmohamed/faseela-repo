# flatpak recipe: libfyaml — YAML parser used by AppStream metadata.
[package]
name = "libfyaml"
version = "0.9.4"
rel = 2
arch = ["x86_64"]
summary = "YAML 1.2 parser and emitter library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libfyaml"
url = "https://github.com/pantoniou/libfyaml/releases/download/v%{version}/libfyaml-%{version}.tar.gz"
sha256 = "dac2b0af7b757b32a4fa7c6493d85d0f7dea6effd20ae4352570b6a450b9e5fb"
strip_components = 1

[depends]
build = ["pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
