# flatpak recipe: libassuan — IPC library used by GnuPG and GPGME.
[package]
name = "libassuan"
version = "3.0.2"
rel = 2
arch = ["x86_64"]
summary = "Assuan inter-process communication library"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libassuan"
url = "https://gnupg.org/ftp/gcrypt/libassuan/libassuan-%{version}.tar.bz2"
sha256 = "d2931cdad266e633510f9970e1a2f346055e351bb19f9b78912475b8074c36f6"
strip_components = 1

[depends]
build = ["libgpg-error", "pkgconf"]
run = ["libgpg-error"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
