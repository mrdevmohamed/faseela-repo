# extra recipe: CMake — cross-platform build system generator
[package]
name = "cmake"
version = "4.4.5"
rel = 2
arch = ["x86_64"]
summary = "CMake — cross-platform build system generator"
license = ["BSD-3-Clause"]
source = "https://github.com/Kitware/CMake/releases/download/v%{version}/cmake-%{version}.tar.gz"
sha256 = "a0c54c88abb8078dd8eccadb717fc6bb194bf18e7d44c86309910288886e04e2"

[depends]
build = []
run = []

[build]
# Keep the bootstrap-independent vendored dependencies; no OpenSSL in stage 2.
configure = "./configure --prefix=/usr --parallel=%{jobs} -- -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install && find %{pkgdir}/usr/share -name FindBoost.cmake -exec sed -i 's#/build/sr[c]/#/#g' {} +"
