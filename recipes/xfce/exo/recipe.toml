# xfce recipe: exo — Extension library for Xfce applications
[package]
name = "exo"
version = "4.20.0"
rel = 2
arch = ["x86_64"]
summary = "Extension library for Xfce applications (exo-2)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/xfce/exo/4.20/exo-4.20.0.tar.bz2"
sha256 = "4277f799245f1efde01cd917fd538ba6b12cf91c9f8a73fe2035fd5456ec078d"

[depends]
build = ["pkgconf", "libxfce4ui", "libxfce4util", "gtk3", "glib"]
run = ["libxfce4ui", "libxfce4util", "gtk3", "glib"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
