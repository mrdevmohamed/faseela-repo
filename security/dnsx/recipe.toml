# ProjectDiscovery dnsx command-line tool; pinned upstream Linux amd64 release.
[package]
name = "dnsx"
version = "1.3.1"
rel = 1
arch = ["x86_64"]
summary = "DNS toolkit for querying and resolving records"
license = ["MIT"]
source = "https://github.com/projectdiscovery/dnsx/releases/download/v1.3.1/dnsx_1.3.1_linux_amd64.zip"
sha256 = "438b964653056dd51dcfe614b1a16f8bced3cc48a1d27bc07cc6fdf2ef2a9533"

[depends]
build = ["unzip"]
run = ["glibc"]

[build]
install = """
unzip -oq "dnsx_1.3.1_linux_amd64.zip" -d .
install -Dm755 dnsx %{pkgdir}/usr/bin/dnsx
"""
