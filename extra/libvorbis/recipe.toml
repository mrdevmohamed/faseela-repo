# extra recipe: libvorbis — Vorbis lossy audio codec library
# The codec half of the pair: libcanberra decodes its event sounds from Ogg
# Vorbis through libvorbisfile. Documentation and examples are not built.
[package]
name = "libvorbis"
version = "1.3.7"
rel = 1
arch = ["x86_64"]
summary = "libvorbis — Vorbis audio codec library (libcanberra dependency)"
license = ["BSD-3-Clause"]
source = "https://downloads.xiph.org/releases/vorbis/libvorbis-%{version}.tar.xz"
sha256 = "b33cc4934322bcbf6efcbacf49e3ca01aadbea4114ec9589d1b1e9d20f72954b"
source_dir = "libvorbis-%{version}"

[depends]
build = ["pkgconf", "libogg"]
run = ["libogg"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-docs --disable-examples"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
