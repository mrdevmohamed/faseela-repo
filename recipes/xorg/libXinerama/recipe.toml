strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "libX11", "xorgproto", "libXext"]
run = ["libX11", "xorgproto", "libXext"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release "
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build'''
