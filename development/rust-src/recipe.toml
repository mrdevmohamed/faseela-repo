# Development recipe: Rust standard-library source required by rust-analyzer and IDE tooling.
#
# The standalone rust-src distribution is an installer bundle. Its archive
# root contains rust-src/lib/rustlib/src/rust/; install that component payload
# directly instead of invoking the bundled installer.
[package]
name = "rust-src"
version = "1.96.1"
rel = 4
arch = ["x86_64"]
summary = "Rust standard library source code for IDE tooling"
license = ["MIT", "Apache-2.0"]
source = "https://static.rust-lang.org/dist/2026-06-30/rust-src-%{version}.tar.xz"
sha256 = "b343b6553bc772225f6a2b5be5055017f29794dcf4e08020366b27a0a40fc1c2"
source_dir = "rust-src-1.96.1"

[depends]
build = []
run = ["rust"]

[slim]
strip = false

[build]
install = """
src=rust-src/lib/rustlib/src/rust
if [ ! -d "$src/library" ] || [ ! -f "$src/library/Cargo.toml" ]; then
    echo "rust-src: archive does not contain the expected Rust source tree at $src" >&2
    echo "Archive root: $(pwd)" >&2
    find . -maxdepth 7 -type f -name Cargo.toml -print >&2
    exit 1
fi

dest=%{pkgdir}/usr/lib/rustlib/src/rust
install -d "$dest"
cp -a "$src/." "$dest/"

# Verify the exact path consumed by rust-analyzer and rustc -Z build-std.
installed=%{pkgdir}/usr/lib/rustlib/src/rust/library
if [ ! -d "$installed" ] || [ ! -f "$installed/Cargo.toml" ]; then
    echo "rust-src: expected Rust library sources were not installed at $installed" >&2
    exit 1
fi
"""