# gui recipe: font-util — bitmap font utilities shared by X11 font packages
# Supplies ucs2any and the fontutil.pc pkg-config entry. Xwayland's meson
# reads fontrootdir out of fontutil.pc to build its compiled-in default font
# path, and libXfont2 needs its headers. Installed as the X.Org util package
# it is (it lives under archive/individual/font/ upstream).
[package]
name = "font-util"
version = "1.4.2"
rel = 1
arch = ["x86_64"]
summary = "font-util — X11 bitmap font utilities and fontutil.pc (Xwayland font path)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/font/font-util-%{version}.tar.xz"
sha256 = "02e4f8afdcf03cc8372ca9c37aa104b1e36b47722dbc79531be08f0a4c622999"
source_dir = "font-util-%{version}"

[depends]
build = ["pkgconf", "xorgproto"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
