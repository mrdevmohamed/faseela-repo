# extra recipe: Duktape embeddable JavaScript engine (used by polkit rules).
[package]
name = "duktape"
version = "2.7.0"
rel = 1
arch = ["x86_64"]
summary = "Embeddable JavaScript engine"
license = ["MIT"]
source = "https://github.com/svaarala/duktape/releases/download/v%{version}/duktape-%{version}.tar.xz"
sha256 = "90f8d2fa8b5567c6899830ddef2c03f3c27960b11aca222fa17aa7ac613c2890"

[depends]
build = []
run = []

[build]
compile = "make -j%{jobs} -f Makefile.sharedlibrary"
install = '''
make -f Makefile.sharedlibrary INSTALL_PREFIX=%{pkgdir}/usr install
install -d -m755 %{pkgdir}/usr/lib/pkgconfig
cat > %{pkgdir}/usr/lib/pkgconfig/duktape.pc <<'PC'
prefix=/usr
exec_prefix=${prefix}
libdir=${exec_prefix}/lib
includedir=${prefix}/include

Name: duktape
Description: Embeddable Javascript engine
Version: %{version}
Libs: -L${libdir} -lduktape
Cflags: -I${includedir}/
PC
'''
