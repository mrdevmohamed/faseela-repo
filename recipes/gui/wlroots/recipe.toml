# gui recipe: wlroots — Modular Wayland compositor library
# Xwayland support is now enabled: the xwayland feature pulls in the XCB
# libraries below (wlroots speaks ICCCM/EWMH window management with the
# Xwayland server it spawns). xcb-errors stays off: printing X11 protocol
# errors verbosely is a debugging aid, not a session need. rel 3: pin the
# Debian source metadata records SHA-256 a28061f7...e80cab
# for this exact 469969-byte archive; keep checksum verification enabled.
[package]
name = "wlroots"
version = "0.18.2"
rel = 3
arch = ["x86_64"]
summary = "Modular Wayland compositor library (with Xwayland support)"
license = ["MIT"]
source = "https://deb.debian.org/debian/pool/main/w/wlroots/wlroots_0.18.2.orig.tar.bz2"
sha256 = "a28061f7778f28f7be377fd4d6f0ebd58cb2a63b52460e9fde28e2ab43e80cab"
source_dir = "wlroots-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols", "libdrm", "libxkbcommon", "libinput", "pixman", "seatd", "libdisplay-info", "mesa", "eudev", "libxcb", "xcb-util-wm", "xwayland"]
run = ["wayland", "libdrm", "libxkbcommon", "libinput", "pixman", "seatd", "libdisplay-info", "mesa", "eudev", "libxcb", "xwayland"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D xwayland=enabled -D examples=false -D backends=drm,libinput -D renderers=gles2 -D allocators=gbm -D session=enabled -D xcb-errors=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
