# mate recipe: libmatekbd — MATE keyboard library
# Keyboard-layout handling (libmatekbd) and the layout indicator widget
# (libmatekbdui), used by mate-settings-daemon and mate-screensaver.
# Autotools only: the 1.28.0 tarball ships a prebuilt configure and no
# meson.build. No mate-desktop dependency: configure.ac only checks glib,
# gtk3, and libxklavier.
[package]
name = "libmatekbd"
version = "1.28.0"
rel = 2
arch = ["x86_64"]
summary = "MATE keyboard library and keyboard layout indicator widget"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libmatekbd"
url = "https://github.com/mate-desktop/libmatekbd/releases/download/v%{version}/libmatekbd-%{version}.tar.xz"
sha256 = "5d2e58483c2b23d33503d24c88f8b90a28cc0189d7e4001b3e273a604f6fe80e"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool", "pkgconf", "gettext", "glib", "gtk3", "libxklavier", "libX11"]
run = ["glib", "gtk3", "libxklavier", "libX11"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
