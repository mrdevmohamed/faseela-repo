# gui recipe: Flatpak — sandboxed application deployment and runtime manager.
# Faseela uses runit and elogind. The privileged helper is D-Bus activated;
# systemd units, sysusers, tmpfiles and environment generators are discarded.
[package]
name = "flatpak"
version = "1.18.4"
rel = 1
arch = ["x86_64"]
summary = "Application sandboxing and deployment framework"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/flatpak/flatpak/releases/download/%{version}/flatpak-%{version}.tar.xz"
sha256 = "b899a7a00c48d2c626cb8ec33fe556720b376c25805d7222430c0fdca4c6ac8d"

[depends]
build = ["meson", "ninja", "pkgconf", "bison", "glib", "curl", "libxml2", "zstd", "gpgme", "gnupg", "ostree", "appstream", "json-glib", "gdk-pixbuf", "libseccomp", "fuse3", "libXau", "libarchive", "libcap", "polkit", "python-pyparsing", "bubblewrap", "xdg-dbus-proxy", "dbus"]
run = ["glib", "curl", "libxml2", "zstd", "gpgme", "gnupg", "ostree", "appstream", "json-glib", "gdk-pixbuf", "libseccomp", "fuse3", "libXau", "libarchive", "libcap", "polkit", "dbus", "dbus-system", "bubblewrap", "xdg-dbus-proxy", "base-files", "coreutils"]

[build]
prepare = '''set -eu
service=system-helper/org.freedesktop.Flatpak.SystemHelper.service.in
grep -q '^SystemdService=' "$service"
sed -i '/^SystemdService=/d' "$service"
! grep -q '^SystemdService=' "$service"
'''
configure = "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -D systemd=disabled -D systemdsystemunitdir=lib/flatpak/no-systemd/units -D systemdsystemenvgendir=lib/flatpak/no-systemd/system-generators -D systemduserunitdir=lib/flatpak/no-systemd/user-units -D systemduserenvgendir=lib/flatpak/no-systemd/user-generators -D sysusersdir=lib/flatpak/no-systemd/sysusers -D tmpfilesdir=lib/flatpak/no-systemd/tmpfiles -D auto_sideloading=false -D selinux_module=disabled -D dconf=disabled -D malcontent=disabled -D gir=disabled -D gtkdoc=disabled -D man=disabled -D docbook_docs=disabled -D tests=false -D installed_tests=false -D internal_tests=false -D internal_checks=false -D system_helper=enabled -D system_helper_user=flatpak -D system_install_dir=/var/lib/flatpak -D privileged_group=wheel -D system_bubblewrap=/usr/bin/bwrap -D system_dbus_proxy=/usr/bin/xdg-dbus-proxy -D system_fusermount=/usr/bin/fusermount3 -D system_font_cache_dirs=/var/cache/fontconfig,/usr/lib/fontconfig/cache -D system_fonts_dir=/usr/share/fonts -D run_media_dir=/run/media -D seccomp=enabled -D libzstd=enabled -D xauth=enabled -D wayland_security_context=disabled"
compile = "ninja -C build"
install = '''
DESTDIR=%{pkgdir} meson install -C build

# Remove all output deliberately redirected away from systemd-owned paths.
rm -rf %{pkgdir}/usr/lib/flatpak/no-systemd

# D-Bus activation starts the privileged helper on demand under the system bus.
service=%{pkgdir}/usr/share/dbus-1/system-services/org.freedesktop.Flatpak.SystemHelper.service
test -s "$service"
grep -Fq 'Name=org.freedesktop.Flatpak.SystemHelper' "$service"
grep -Fq 'Exec=/usr/libexec/flatpak-system-helper' "$service"
! grep -q '^SystemdService=' "$service"

# Flathub is a signed static remote. Flatpak reads remotes.d without running a
# network operation during package installation; the official signing key is
# embedded in this .flatpakrepo file.
install -d -m755 %{pkgdir}/usr/share/flatpak/remotes.d
cat > %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo <<'REMOTE'
[Flatpak Repo]
Title=Flathub
Url=https://dl.flathub.org/repo/
Homepage=https://flathub.org/
Comment=Central repository of Flatpak applications
Description=Central repository of Flatpak applications
Icon=https://dl.flathub.org/repo/logo.svg

REMOTE
chmod 644 %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo

test -s %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo
grep -Fq 'Url=https://dl.flathub.org/repo/' %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo
grep -Fq 'GPGKey=' %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo
'''
 
[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account group flatpak
/usr/libexec/faseela/ensure-system-account user flatpak flatpak "Flatpak system helper" /var/lib/flatpak /usr/bin/false
install -d -m755 -o root -g root /var/lib/flatpak
'''
