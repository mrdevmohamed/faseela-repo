# browser recipe: libsoup3 — GLib HTTP client used by WebKitGTK 4.1.
[package]
name = "libsoup3"
version = "3.8.1"
rel = 2
arch = ["x86_64"]
summary = "GLib HTTP client and server library (libsoup 3)"
license = ["LGPL-2.0-only"]
source = "https://download.gnome.org/sources/libsoup/3.8/libsoup-%{version}.tar.xz"
sha256 = "5013dcef9136f6f861e6529fca578af50c1f52a39219027fb5aff652d1371a04"
source_dir = "libsoup-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "sqlite", "libpsl", "libxml2", "brotli", "glib-networking", "nghttp2"]
run = ["glib", "sqlite", "libpsl", "libxml2", "brotli", "glib-networking", "nghttp2"]

[build]
# The TLS backend module is installed under /usr/lib/gio/modules. Set the
# runtime lookup path explicitly for Meson's GIO TLS probe instead of relying
# on the build host's compiled-in GIO module directory.
configure = "GIO_MODULE_DIR=/usr/lib/gio/modules meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=disabled -D vapi=disabled -D docs=disabled -D tests=false -D installed_tests=false -D sysprof=disabled -D gssapi=disabled -D ntlm=disabled -D autobahn=disabled -D brotli=enabled -D tls_check=true"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
