# unity recipe: indicator-session — Unity session indicator service
# Source: Ubuntu archive orig tarball (17.3.20+21.10.20210613.1); Ubuntu's
# patches are vendored under patches/ (ubuntu-resolute.patch disables the
# test suite: gtest no longer supports C++11) plus Faseela additions
# (faseela.patch: cmake_minimum_required 2.8.9 -> 3.10 for CMake 4, drop the
# Upstart job/override installs).
# Runtime schema note: service.c does g_settings_new on
# com.canonical.unity.settings-daemon.plugins.media-keys in a Unity session
# (falling back to org.gnome.settings-daemon.plugins.media-keys elsewhere).
# The Unity-namespaced schema is installed by the unity-settings-daemon
# recipe (its data/Makefile.am lists
# com.canonical.unity.settings-daemon.plugins.media-keys.gschema.xml.in.in),
# so unity-settings-daemon is a run dep here — the org.gnome fallback schema
# is NOT in that recipe and is NOT needed on a Unity session.
[package]
name = "indicator-session"
version = "17.3.20"
rel = 2
arch = ["x86_64"]
summary = "Unity session indicator service"
license = ["GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "indicator-session"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/i/indicator-session/indicator-session_17.3.20+21.10.20210613.1.orig.tar.gz"
sha256 = "f9da6a2f080e67944a71eebb744c3d9f5d7d532428e072c4a3a0fbb0b3bb6ae9"
strip_components = 1

[depends]
build = ["cmake", "pkgconf", "glib", "gettext", "intltool", "cmake-extras", "whoopsie", "unity-settings-daemon"]
run = ["whoopsie", "glib", "libindicator", "gsettings-desktop-schemas", "systemd", "dconf", "unity-settings-daemon"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[assets]
include = ["patches/ubuntu-resolute.patch", "patches/faseela.patch"]

[hooks]
post_install = "glib-compile-schemas /usr/share/glib-2.0/schemas"
post_remove = "glib-compile-schemas /usr/share/glib-2.0/schemas"

[build]
prepare = '''set -eu
patch -p1 < %{assetsdir}/patches/ubuntu-resolute.patch
patch -p1 < %{assetsdir}/patches/faseela.patch
'''
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_LIBEXECDIR=lib -DCMAKE_BUILD_TYPE=Release"
compile = "cmake --build build -j%{jobs}"
install = '''
DESTDIR=%{pkgdir} cmake --install build
rm -f %{pkgdir}/usr/share/glib-2.0/schemas/gschemas.compiled
test -x %{pkgdir}/usr/lib/indicator-session/indicator-session-service
test -e %{pkgdir}/usr/share/unity/indicators/com.canonical.indicator.session
test -e %{pkgdir}/usr/lib/systemd/user/indicator-session.service
test -e %{pkgdir}/usr/share/glib-2.0/schemas/com.canonical.indicator.session.gschema.xml
'''
