# Faseela defaults: crun runtime, Netavark networking, systemd cgroup manager.
# Podman falls back to cgroupfs by itself for a rootless user without a systemd
# user session (for example a login that did not go through pam_systemd).
# Administrators can override these defaults in /etc/containers/containers.conf.

[engine]
cgroup_manager = "systemd"
events_logger = "file"
runtime = "crun"
conmon_path = ["/usr/libexec/podman/conmon"]
helper_binaries_dir = ["/usr/libexec/podman", "/usr/bin", "/usr/sbin"]

[network]
network_backend = "netavark"
default_rootless_network_cmd = "pasta"
