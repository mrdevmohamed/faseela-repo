# extra recipe: GNU which — shows the full path of shell commands
[package]
name = "which"
version = "2.25"
rel = 1
arch = ["x86_64"]
summary = "GNU which — shows the full path of shell commands"
license = ["GPL-3.0-or-later"]
source = "https://mirrors.kernel.org/gnu/which/which-%{version}.tar.gz"
sha256 = "1cb83e4f702e60b8211ab5ec4c2afbab1b1dec80209456a7d2faf7584ed225ea"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
