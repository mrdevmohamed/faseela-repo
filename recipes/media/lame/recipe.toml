# media recipe: lame — MP3 encoder library (libmp3lame, for ffmpeg -c:a libmp3lame)
# Library only: no `lame` frontend (it would pull ncurses/sndfile support).
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r lame` pins it.
[package]
name = "lame"
version = "3.100"
rel = 1
arch = ["x86_64"]
summary = "LAME — MP3 encoder library (libmp3lame)"
license = ["LGPL-2.0-or-later"]
source = "https://download.sourceforge.net/lame/lame-%{version}.tar.gz"
sha256 = "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-frontend --disable-gtktest"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
