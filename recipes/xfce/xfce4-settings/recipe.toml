# xfce recipe: xfce4-settings — Xfce settings manager
[package]
name = "xfce4-settings"
version = "4.20.5"
rel = 2
arch = ["x86_64"]
summary = "Xfce settings manager (xfsettingsd, display, keyboard, appearance dialogs)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/xfce/xfce4-settings/4.20/xfce4-settings-4.20.5.tar.bz2"
sha256 = "a5fbe0e511cce29d603320ade575ad4001bd570e60f37760233237ba478affe8"

[depends]
build = ["pkgconf", "garcon", "exo", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "libX11", "libXrandr", "libnotify", "xorgproto"]
run = ["garcon", "exo", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "libX11", "libXrandr", "libnotify"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug --enable-xrandr --enable-libnotify --disable-colord"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
