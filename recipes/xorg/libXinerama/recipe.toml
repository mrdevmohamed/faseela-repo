# xorg recipe: libXinerama — X11 Xinerama extension client library
[package]
name = "libXinerama"
version = "1.1.6"
rel = 2
arch = ["x86_64"]
summary = "X11 Xinerama extension client library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libxinerama"
url = "https://xorg.freedesktop.org/archive/individual/lib/libXinerama-1.1.6.tar.xz"
