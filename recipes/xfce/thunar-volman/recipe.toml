# xfce recipe: thunar-volman — Thunar volume manager
[package]
name = "thunar-volman"
version = "4.20.0"
rel = 4
arch = ["x86_64"]
summary = "Thunar volume manager for automatic removable-media handling"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "thunar-volman"
url = "https://archive.xfce.org/src/xfce/thunar-volman/4.20/thunar-volman-4.20.0.tar.bz2"
sha256 = "b0dad852959b515b8fbfd1ed552e362340347d26d5246e7f1b973027131eb1da"
strip_components = 1

[depends]
build = ["pkgconf", "exo", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "libgudev"]
run = ["thunar", "gvfs", "udisks2", "dbus", "exo", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "libgudev", "systemd"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
