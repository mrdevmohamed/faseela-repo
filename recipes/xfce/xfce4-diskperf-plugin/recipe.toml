# xfce recipe: xfce4-diskperf-plugin — Disk performance panel plugin
[package]
name = "xfce4-diskperf-plugin"
version = "2.7.1"
rel = 1
arch = ["x86_64"]
summary = "Disk performance panel plugin"
license = ["BSD-3-Clause"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-diskperf-plugin/2.7/xfce4-diskperf-plugin-2.7.1.tar.bz2"
sha256 = "dd5f521cc4ab40a42958dcf59b6bec5da8fafacf71f3266971942e25b43af8ae"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
