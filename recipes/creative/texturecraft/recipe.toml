# creative recipe: texturecraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "texturecraft"
version = "0.2.0"
rel = 2
arch = ["x86_64"]
summary = "Native 3D texture-painting application for PBR materials"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/texturecraft/releases/download/v0.2.0/texturecraft-0.2.0-linux-x86_64.tar.gz"
sha256 = "9919068b13d880d512d6a995433446c9fccb3e0b447fdce2c7716e1393d7cfb2"
source_dir = "texturecraft-0.2.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland"]

[build]
install = """
set -eu

# Upstream release archives may be opened at the package directory or at the
# archive extraction root. Locate the FHS usr tree in either layout.
upstream_usr_bin="$(find . -type d -path '*/usr/bin' -print -quit)"
if [ -z "$upstream_usr_bin" ]; then
    echo "texturecraft: upstream archive has no usr/bin directory below $(pwd)" >&2
    exit 1
fi
upstream_usr="${upstream_usr_bin%/bin}"
install -d -m755 "%{pkgdir}/usr"
cp -a "$upstream_usr/." "%{pkgdir}/usr/"
"""
