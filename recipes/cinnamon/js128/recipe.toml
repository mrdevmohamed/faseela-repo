# cinnamon recipe: js128 — SpiderMonkey JavaScript engine (Firefox 128 ESR)
# Built from the Firefox ESR source tree (there is no standalone mozjs
# tarball): the js shell is built from js/src with mach/mozbuild.
#
# Honest caveats (read before changing flags):
# - js128 is the Firefox 128 ESR line, which is END OF LIFE (last release
#   128.14.0esr). cjs 128.1 / Cinnamon 6.6 need it because cjs 140 requires
#   glib >= 2.86 and Faseela ships glib 2.82.2. The js140 path (glib 2.86
#   bump + GI 1.86 + Firefox 140 ESR) is a later follow-up, not this recipe.
# - Non-PGO, non-LTO build first. The build is heavy (561 MB source,
#   multi-GB objdir); the flags below are the standard standalone
#   SpiderMonkey set and have NOT yet been proven by a real build run in
#   this repo — the first CI build of this recipe is the validation.
# - The linker is bfd, not lld: this repo's llvm builds clang but NOT lld.
# - ICU, NSPR and NSS are the BUNDLED copies from the Firefox tree (no
#   --with-system-* flags): fewer moving parts for the first build.
# - MOZBUILD_STATE_PATH is kept inside the build tree so mach never writes
#   outside the sandbox.
[package]
name = "js128"
version = "128.14.0"
rel = 2
arch = ["x86_64"]
summary = "SpiderMonkey JavaScript engine (Firefox 128 ESR)"
license = ["MPL-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"
workdir = "firefox-128.14.0"

[[package.sources]]
name = "firefox-esr-source"
url = "https://archive.mozilla.org/pub/firefox/releases/128.14.0esr/source/firefox-128.14.0esr.source.tar.xz"
sha256 = "93b9ef6229f41cb22ff109b95bbf61a78395a0fe4b870192eeca22947cb09a53"
strip_components = 1

[depends]
build = ["llvm", "rust", "python", "zip", "cbindgen", "readline", "zlib", "pkgconf", "perl", "unzip"]
run = ["gcc", "glibc", "readline", "zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''
cat > js/src/.mozconfig <<'EOF'
ac_add_options --enable-application=js
ac_add_options --enable-optimize
ac_add_options --disable-debug
ac_add_options --enable-release
ac_add_options --disable-tests
ac_add_options --enable-linker=bfd
ac_add_options --with-system-zlib
ac_add_options --prefix=/usr
EOF
'''
compile = '''
export MOZBUILD_STATE_PATH="$PWD/mozbuild-state"
export CC=clang CXX=clang++
cd js/src && python3 mach build
'''
install = '''
export MOZBUILD_STATE_PATH="$PWD/mozbuild-state"
cd js/src && DESTDIR=%{pkgdir} python3 mach install
test -x %{pkgdir}/usr/bin/js128
test -e %{pkgdir}/usr/include/mozjs-128/js/Value.h
'''
