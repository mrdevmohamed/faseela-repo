# gui recipe: libfontenc — font encoding library (libXfont2 dependency)
# Reads BDF-encoded bitmap fonts; libXfont2 needs it and Xwayland needs
# libXfont2 to render the built-in cursor and misc fonts. zlib is mandatory
# for the compressed BDF files, documentation is not built.
[package]
name = "libfontenc"
version = "1.1.9"
rel = 1
arch = ["x86_64"]
summary = "libfontenc — X11 font encoding library (libXfont2 dependency)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libfontenc-%{version}.tar.xz"
sha256 = "9d8392705cb10803d5fe1d27d236cbab3f664e26841ce01916bbbe430cf273e2"
source_dir = "libfontenc-%{version}"

[depends]
build = ["pkgconf", "zlib", "xorgproto"]
run = ["zlib"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-docs --disable-devel-docs"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
