# gui recipe: libpng — PNG reference library
[package]
name = "libpng"
version = "1.6.44"
rel = 3
arch = ["x86_64"]
summary = "PNG reference library"
license = ["libpng-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libpng"
url = "https://download.sourceforge.net/libpng/libpng-%{version}.tar.xz"
sha256 = "60c4da1d5b7f0aa8d158da48e8f8afa9773c1c8baa5d21974df61f1886b8ce8e"
strip_components = 1

[depends]
build = ["zlib"]
run = ["zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# libtool archive is not needed at runtime and can contain invalid dependency links.
rm -f %{pkgdir}/usr/lib/libpng.la %{pkgdir}/usr/lib64/libpng.la
'''
