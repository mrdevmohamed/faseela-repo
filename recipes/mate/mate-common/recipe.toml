# mate recipe: mate-common — Shared autotools macros for the MATE desktop
# Installs the MATE m4 macros (MATE_COMMON_INIT, MATE_DEBUG_CHECK,
# MATE_COMPILE_WARNINGS) that the other MATE packages expand at autoreconf
# time. Every other mate-* recipe that uses those macros lists this as a
# build dependency, so build mate-common first.
[package]
name = "mate-common"
version = "1.28.0"
rel = 2
arch = ["x86_64"]
summary = "Shared autotools macros and build helpers for the MATE desktop"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "mate-common"
url = "https://github.com/mate-desktop/mate-common/releases/download/v%{version}/mate-common-%{version}.tar.xz"
sha256 = "42b7c2cee268f71d7e1c1ad4f69bcda0ecd65578a96722187c6b76378d26ba0a"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
