# xorg recipe: xorg-xrandr — X11 RandR display configuration utility
[package]
name = "xorg-xrandr"
version = "1.5.4"
rel = 2
arch = ["x86_64"]
summary = "X11 RandR display configuration utility"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/app/xrandr-1.5.4.tar.xz"
sha256 = "2cafccb2aaf2491a4068676117a0d4f90ab307724b96fffc54cd1da953779400"

[depends]
build = ["pkgconf", "libXrandr", "libXrender", "libX11", "xorgproto"]
run = ["libXrandr", "libXrender", "libX11"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
