# creative recipe: deckcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "deckcraft"
version = "0.14.1"
rel = 4
arch = ["x86_64"]
summary = "Native presentation editor with PowerPoint compatibility"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/deckcraft/releases/download/v0.14.1/deckcraft-0.14.1-linux-x86_64.tar.gz"
sha256 = "e86c7fa0ecb55f1a553ee425b93dcfdc806b7b3798f272b41f1d1ff74ac5c12a"
source_dir = "deckcraft-0.14.1-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland", "alsa-lib", "pipewire"]

[build]
install = """
set -eu

# Storytold Linux release archives use bin/ and share/ at their FHS root.
# Accept both that layout and a conventional usr/ tree. Some archives wrap
# the payload in one top-level release directory.
upstream_root=""
if [ -d "bin" ] || [ -d "usr/bin" ]; then
    upstream_root="."
else
    for candidate in */; do
        if [ -d "${candidate}bin" ] || [ -d "${candidate}usr/bin" ]; then
            upstream_root="${candidate%/}"
            break
        fi
    done
fi

if [ -z "$upstream_root" ]; then
    echo "deckcraft: upstream archive has neither bin/ nor usr/bin/ below $(pwd)" >&2
    exit 1
fi

if [ -d "$upstream_root/usr/bin" ]; then
    install -d -m755 "%{pkgdir}/usr"
    cp -a "$upstream_root/usr/." "%{pkgdir}/usr/"
else
    install -d -m755 "%{pkgdir}/usr/bin"
    cp -a "$upstream_root/bin/." "%{pkgdir}/usr/bin/"
    if [ -d "$upstream_root/share" ]; then
        install -d -m755 "%{pkgdir}/usr/share"
        cp -a "$upstream_root/share/." "%{pkgdir}/usr/share/"
    fi
fi

upstream_bin="%{pkgdir}/usr/bin/deckcraft"
if [ ! -x "$upstream_bin" ]; then echo "deckcraft: upstream executable missing from archive" >&2; exit 1; fi
mv "$upstream_bin" "${upstream_bin}.real"
cat > "$upstream_bin" <<'LAUNCHER'
#!/bin/sh
set -eu
app_name="deckcraft"
script_dir=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
upstream="$script_dir/$app_name.real"
[ -x "$upstream" ] || { echo "$app_name: upstream executable is missing: $upstream" >&2; exit 1; }
if [ "${FASEELA_CRAFT_USE_XWAYLAND:-0}" = "1" ]; then
    [ -n "${DISPLAY:-}" ] || { echo "$app_name: XWayland mode requires DISPLAY." >&2; exit 1; }
    export WINIT_UNIX_BACKEND=x11
    unset DECKCRAFT_WAYLAND
    exec "$upstream" "$@"
fi
if [ -n "${WAYLAND_DISPLAY:-}" ]; then
    [ -n "${XDG_RUNTIME_DIR:-}" ] && [ -d "$XDG_RUNTIME_DIR" ] || { echo "$app_name: XDG_RUNTIME_DIR is missing; launch from Faseela's active Sway session." >&2; exit 1; }
    case "$WAYLAND_DISPLAY" in /*) wayland_socket="$WAYLAND_DISPLAY" ;; *) wayland_socket="$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ;; esac
    [ -S "$wayland_socket" ] || { echo "$app_name: Wayland socket is unavailable: $wayland_socket" >&2; exit 1; }
    export WINIT_UNIX_BACKEND=wayland DECKCRAFT_WAYLAND=1
elif [ -n "${WAYLAND_SOCKET:-}" ]; then
    export WINIT_UNIX_BACKEND=wayland DECKCRAFT_WAYLAND=1
elif [ "${XDG_SESSION_TYPE:-}" = "wayland" ]; then
    echo "$app_name: Wayland session variables are missing; re-enter Faseela's Sway session." >&2
    exit 1
elif [ -n "${DISPLAY:-}" ]; then
    exec "$upstream" "$@"
else
    echo "$app_name: no graphical session found; run it from a desktop session or start-sway from a TTY." >&2
    exit 1
fi
unset DISPLAY
exec "$upstream" "$@"
LAUNCHER
chmod 755 "$upstream_bin"
"""