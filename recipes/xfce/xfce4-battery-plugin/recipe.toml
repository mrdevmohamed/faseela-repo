# xfce recipe: xfce4-battery-plugin — Battery status panel plugin
[package]
name = "xfce4-battery-plugin"
version = "1.1.6"
rel = 1
arch = ["x86_64"]
summary = "Battery status panel plugin"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-battery-plugin/1.1/xfce4-battery-plugin-1.1.6.tar.bz2"
sha256 = "327d7304dded8411cd1a48da4f46bac248b44d8b27ffbc2036e0268cb37c3676"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
