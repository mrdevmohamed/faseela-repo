# mate recipe: libmatemixer — MATE audio mixer library
# Abstraction over PulseAudio and ALSA backends, used by mate-media and
# mate-settings-daemon. Autotools only. Do NOT autoreconf: the shipped
# configure works without mate-common. PulseAudio and ALSA backends stay
# on, udev stays on (libudev comes from the systemd package), OSS is off.
# libpulse-mainloop-glib comes from the libpulse recipe, whose client build
# enables glib support.
[package]
name = "libmatemixer"
version = "1.28.0"
rel = 2
arch = ["x86_64"]
summary = "MATE audio mixer abstraction library (PulseAudio/ALSA)"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libmatemixer"
url = "https://github.com/mate-desktop/libmatemixer/releases/download/v%{version}/libmatemixer-%{version}.tar.xz"
sha256 = "5d73b922397f60688e3c9530eb532bce46c30e262db1b5352fa32c40d870a0c7"
strip_components = 1

[depends]
build = ["pkgconf", "gettext", "glib", "libpulse", "alsa-lib", "systemd"]
run = ["glib", "libpulse", "alsa-lib", "systemd"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-gtk-doc --enable-pulseaudio --enable-alsa --enable-udev --disable-oss"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
