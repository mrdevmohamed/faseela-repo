# cosmic recipe: cosmic-store — COSMIC package/app store frontend.
# The Flatpak backend uses libflatpak for both per-user and system
# installations. Keep PackageKit and systemd-scope integrations disabled;
# Faseela uses its existing D-Bus + Polkit + systemd-logind stack. The appstream
# metadata parser (jackpot51/appstream) is pure Rust.
[package]
name = "cosmic-store"
version = "1.11.0"
rel = 4
arch = ["x86_64"]
summary = "COSMIC application store frontend"
license = ["GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-store"
url = "https://codeload.github.com/pop-os/cosmic-store/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "d8c95307e4a865ab4681a0be86fea98f82fb052ecc7bcea98fad2b8165c34e83"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon", "flatpak"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus", "xdg-desktop-portal-cosmic", "flatpak"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[fetch.cargo]
dir = "."

[build]
compile = """
# All optional package backends are disabled on Faseela; with no push() calls
# Rust cannot infer the FuturesUnordered receiver type in upstream mod.rs.
sed -i 's|let backends = futures::stream::FuturesUnordered::new();|let backends = futures::stream::FuturesUnordered::<tokio::sync::oneshot::Receiver<Option<(BackendName, Arc<dyn Backend>)>>>::new();|' src/backend/mod.rs
grep -Fq 'FuturesUnordered::<tokio::sync::oneshot::Receiver<Option<(BackendName, Arc<dyn Backend>)>>>::new()' src/backend/mod.rs
cargo build --release --offline --locked --no-default-features --features dbus-config,desktop,flatpak,logind,notify,single-instance,wgpu,wayland,xdg-portal --bin cosmic-store
"""
install = '''
install -Dm755 target/release/cosmic-store %{pkgdir}/usr/bin/cosmic-store
install -Dm644 target/xdgen/com.system76.CosmicStore.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicStore.desktop
install -Dm644 target/xdgen/com.system76.CosmicStore.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicStore.metainfo.xml
if [ -d res/icons/hicolor ]; then
    find res/icons/hicolor -type f | while read -r f; do
        rel=${f#res/icons/hicolor/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
