# Developer runtime: Go compiler and toolchain, official go.dev Linux amd64 archive.
[package]
name = "golang"
version = "1.27.3"
rel = 2
arch = ["x86_64"]
summary = "Go programming language compiler and toolchain"
license = ["BSD-3-Clause"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "golang"
url = "https://go.dev/dl/go%{version}.linux-amd64.tar.gz"
sha256 = "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
strip_components = 1

[depends]
build = []
run = ["glibc"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = """
install -d %{pkgdir}/usr/lib
cp -a . %{pkgdir}/usr/lib/go
install -d %{pkgdir}/usr/bin
ln -s ../lib/go/bin/go %{pkgdir}/usr/bin/go
ln -s ../lib/go/bin/gofmt %{pkgdir}/usr/bin/gofmt
"""
