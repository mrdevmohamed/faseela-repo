# extra recipe: OpenSSH — Secure Shell client and server
[package]
name = "openssh"
version = "9.9p1"
rel = 3
arch = ["x86_64"]
summary = "OpenSSH — Secure Shell client and server"
license = ["BSD-2-Clause", "BSD-3-Clause", "ISC"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "openssh"
url = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-%{version}.tar.gz"
sha256 = "b343fbcdbff87f15b1986e6e15d6d4fc9a7d36066be6b7fb507087ba8f966c02"
strip_components = 1

[depends]
build = ["openssl", "zlib", "shadow"]
run = ["openssl", "zlib", "shadow", "base-files", "coreutils"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = "install -m700 -d %{pkgdir}/var/lib/sshd"
configure = "./configure --prefix=/usr --sysconfdir=/etc/ssh --with-privsep-path=/var/lib/sshd"
compile = "make -j%{jobs}"
install = """

make DESTDIR=%{pkgdir} install
install -m700 -d %{pkgdir}/var/lib/sshd
install -m755 contrib/ssh-copy-id %{pkgdir}/usr/bin/

"""

[hooks]
post_install = """

/usr/libexec/faseela/ensure-system-account user sshd sshd "OpenSSH privilege separation" /var/lib/sshd /usr/bin/false
install -d -m700 /var/lib/sshd

"""
