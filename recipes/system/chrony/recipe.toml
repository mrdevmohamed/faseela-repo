# system recipe: chrony — NTP daemon, enabled by default through runit.
[package]
name = "chrony"
version = "4.6.1"
rel = 5
arch = ["x86_64"]
summary = "chrony: NTP client/server, keeps the system clock in sync"
license = ["GPL-2.0-only"]
source = "https://chrony-project.org/releases/chrony-%{version}.tar.gz"
sha256 = "571ff73fbf0ae3097f0604eca2e00b1d8bb2e91affe1a3494785ff21d6199c5c"

[depends]
# Linux privilege dropping is implemented through libcap. Keep it in both
# build and runtime dependencies so configure enables FEAT_PRIVDROP and the
# resulting chronyd can load libcap when the runit service starts.
build = ["readline", "ncurses", "shadow", "libcap"]
run = ["readline", "ncurses", "base-files", "coreutils", "libcap"]

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-nts"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
install -d -m755 %{pkgdir}/etc
cat > %{pkgdir}/etc/chrony.conf <<'CONF'
# /etc/chrony.conf — minimal client configuration
pool pool.ntp.org iburst
driftfile /var/lib/chrony/drift
# step the clock if it is off by more than 1 s in the first 3 updates
makestep 1.0 3
# keep the hardware clock in sync (kernel 11-minute mode)
rtcsync
CONF
chmod 0644 %{pkgdir}/etc/chrony.conf
install -d -m755 %{pkgdir}/etc/sv/chronyd
# the state dir is created/owned at service start: the post_install hook also runs in the
# stage2 /sysroot chroot where only bash + shadow exist (no coreutils: install/chown missing)
printf '#!/bin/sh\ninstall -d -m750 -o chrony -g chrony /var/lib/chrony\nexec chronyd -n -u chrony\n' > %{pkgdir}/etc/sv/chronyd/run
chmod 755 %{pkgdir}/etc/sv/chronyd/run
# Start time synchronization on every boot in Faseela's runit service tree.
install -d -m755 %{pkgdir}/etc/runit/runsvdir/default
ln -s /etc/sv/chronyd %{pkgdir}/etc/runit/runsvdir/default/chronyd
'''

[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user chrony chrony "chrony time daemon" /var/lib/chrony /usr/bin/false
echo "chrony: chronyd is enabled by default; check it with: sv status chronyd"
'''
