# xorg recipe: libXinerama — X11 Xinerama extension client library
[package]
name = "libXinerama"
version = "1.1.6"
rel = 1
arch = ["x86_64"]
summary = "X11 Xinerama extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXinerama-1.1.6.tar.xz"
sha256 = "d00fc1599c303dc5cbc122b8068bdc7405d6fcb19060f4597fc51bd3a8be51d7"

[depends]
build = ["meson", "ninja", "pkgconf", "libX11", "xorgproto"]
run = ["libX11"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release "
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build'''
