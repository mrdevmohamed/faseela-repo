# gui recipe: emptty — TUI display/login manager, built without PAM.
[package]
name = "emptty"
version = "0.16.1"
rel = 1
arch = ["x86_64"]
summary = "TUI display manager for Wayland and X11 sessions (no PAM)"
license = ["MIT"]
source = "https://github.com/tvrzna/emptty/archive/refs/tags/v%{version}.tar.gz"
sha256 = "e85d0658fd793ad97be90af241451a9374b299d9525d2aeb57a6f83f10ad4931"
source_dir = "emptty-%{version}"

[depends]
build = ["golang", "gcc", "libxcrypt"]
run = ["gui-session", "libxcrypt", "shadow", "runit", "coreutils"]

[build]
configure = "go test -tags nopam ./..."
compile = 'CGO_ENABLED=1 go build -tags nopam -buildvcs=false -ldflags "-X github.com/tvrzna/emptty/src.buildVersion=v%{version}" -o dist/emptty .'
install = '''
install -D -m755 dist/emptty %{pkgdir}/usr/bin/emptty
install -D -m644 res/conf %{pkgdir}/etc/emptty/conf
install -D -m644 res/emptty.1 %{pkgdir}/usr/share/man/man1/emptty.1
gzip -f %{pkgdir}/usr/share/man/man1/emptty.1
install -D -m755 res/runit-run %{pkgdir}/etc/sv/emptty/run

# Emptty discovers Wayland sessions from this directory. Launch through the
# Faseela wrapper so seatd, XDG_RUNTIME_DIR and the per-session D-Bus are set.
install -d -m755 %{pkgdir}/usr/share/wayland-sessions
cat > %{pkgdir}/usr/share/wayland-sessions/sway.desktop <<'DESKTOP'
[Desktop Entry]
Name=Sway (Faseela)
Comment=Wayland session using Faseela's seatd and D-Bus setup
Exec=/usr/bin/start-sway
Type=Application
DesktopNames=sway
DESKTOP

# Emptty owns tty7; getty services remain untouched on tty1-tty4.
sed -i 's/^TTY_NUMBER=.*/TTY_NUMBER=7/; s/^SWITCH_TTY=.*/SWITCH_TTY=true/; s/^DBUS_LAUNCH=.*/DBUS_LAUNCH=false/' %{pkgdir}/etc/emptty/conf
'''

[hooks]
post_install = '''
echo "emptty: optional runit service; enable with:"
echo "  ln -s /etc/sv/emptty /etc/runit/runsvdir/default/emptty"
echo "emptty: disable with: rm /etc/runit/runsvdir/default/emptty"
'''
