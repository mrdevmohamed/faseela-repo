# creative recipe: designcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "designcraft"
version = "0.17.0"
rel = 4
arch = ["x86_64"]
summary = "Native page-layout and desktop-publishing application"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/designcraft/releases/download/v0.17.0/designcraft-0.17.0-linux-x86_64.tar.gz"
sha256 = "bb6f9cec404655350266e98ee10d9b5a154507ed998ad7af47b25335afad1872"
source_dir = "designcraft-0.17.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland"]

[build]
install = """
set -eu

# Storytold Linux release archives use bin/ and share/ at their FHS root.
# Accept both that layout and a conventional usr/ tree. Some archives wrap
# the payload in one top-level release directory.
upstream_root=""
if [ -d "bin" ] || [ -d "usr/bin" ]; then
    upstream_root="."
else
    for candidate in */; do
        if [ -d "${candidate}bin" ] || [ -d "${candidate}usr/bin" ]; then
            upstream_root="${candidate%/}"
            break
        fi
    done
fi

if [ -z "$upstream_root" ]; then
    echo "designcraft: upstream archive has neither bin/ nor usr/bin/ below $(pwd)" >&2
    exit 1
fi

if [ -d "$upstream_root/usr/bin" ]; then
    install -d -m755 "%{pkgdir}/usr"
    cp -a "$upstream_root/usr/." "%{pkgdir}/usr/"
else
    install -d -m755 "%{pkgdir}/usr/bin"
    cp -a "$upstream_root/bin/." "%{pkgdir}/usr/bin/"
    if [ -d "$upstream_root/share" ]; then
        install -d -m755 "%{pkgdir}/usr/share"
        cp -a "$upstream_root/share/." "%{pkgdir}/usr/share/"
    fi
fi

# Retain the upstream executable beside its resources, but interpose a
# launcher that validates the active Wayland socket and selects Wayland
# explicitly. Without this, winit falls back to X11 when Wayland is missing.
upstream_bin="%{pkgdir}/usr/bin/designcraft"
if [ ! -x "$upstream_bin" ]; then
    echo "designcraft: upstream archive did not install usr/bin/designcraft" >&2
    exit 1
fi
mv "$upstream_bin" "%{pkgdir}/usr/bin/designcraft.real"
cat > "$upstream_bin" <<'LAUNCHER'
#!/bin/sh
# Faseela supports DesignCraft in its Sway/Wayland desktop session.
script_dir=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

if [ -z "${WAYLAND_DISPLAY:-}" ]; then
    echo "designcraft: no active Wayland session detected." >&2
    echo "Open a terminal inside Faseela's Sway desktop, or start it from a TTY with: start-sway" >&2
    exit 1
fi

if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
    echo "designcraft: XDG_RUNTIME_DIR is missing or invalid; start DesignCraft from the active Sway session." >&2
    exit 1
fi

case "$WAYLAND_DISPLAY" in
    /*) wayland_socket="$WAYLAND_DISPLAY" ;;
    *)  wayland_socket="$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ;;
esac

if [ ! -S "$wayland_socket" ]; then
    echo "designcraft: Wayland socket is not available: $wayland_socket" >&2
    echo "Start or re-enter Faseela's Sway session, then try again." >&2
    exit 1
fi

# Do not let winit silently fall back to X11 when the Wayland socket is bad.
export WINIT_UNIX_BACKEND=wayland
exec "$script_dir/designcraft.real" "$@"
LAUNCHER
chmod 755 "$upstream_bin"
"""
