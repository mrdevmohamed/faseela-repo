# gui recipe: cairo — 2D vector graphics library
# rel 1: GTK3 requires libcairo-gobject and the Xlib surface; xcb stays off.
[package]
name = "cairo"
version = "1.18.6"
rel = 1
arch = ["x86_64"]
summary = "2D vector graphics library"
license = ["LGPL-2.1-only", "MPL-1.1"]
source = "https://cairographics.org/releases/cairo-%{version}.tar.xz"
sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "pixman", "freetype", "fontconfig", "libpng", "zlib", "libX11", "libXext", "libXrender"]
run = ["glib", "pixman", "freetype", "fontconfig", "libpng", "zlib", "libX11", "libXext", "libXrender"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=disabled -D xcb=disabled -D xlib=enabled -D xlib-xcb=disabled -D glib=enabled -D spectre=disabled -D symbol-lookup=disabled -D gtk2-utils=disabled -D png=enabled -D zlib=enabled -D freetype=enabled -D fontconfig=enabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
