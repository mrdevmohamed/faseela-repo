# gui recipe: xdg-utils — desktop integration helpers, including xdg-open
[package]
name = "xdg-utils"
version = "1.2.1"
rel = 1
arch = ["x86_64"]
summary = "Desktop integration helpers including xdg-open and xdg-mime"
license = ["MIT"]
source = "https://gitlab.freedesktop.org/xdg/xdg-utils/-/archive/v%{version}/xdg-utils-v%{version}.tar.gz"
sha256 = "f6b648c064464c2636884c05746e80428110a576f8daacf46ef2e554dcfdae75"
source_dir = "xdg-utils-v%{version}"

[depends]
build = ["make"]
run = ["bash", "coreutils", "dbus", "file", "glib", "gawk", "grep", "sed"]

[build]
configure = "./configure --prefix=/usr --mandir=/usr/share/man"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
