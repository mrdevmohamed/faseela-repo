# browser recipe: libtasn1 — ASN.1 library used by GnuTLS for WebKitGTK HTTPS.
[package]
name = "libtasn1"
version = "4.21.0"
rel = 1
arch = ["x86_64"]
summary = "ASN.1 library for certificate and protocol handling"
license = ["LGPL-2.1-or-later"]
source = "https://ftp.gnu.org/gnu/libtasn1/libtasn1-%{version}.tar.gz"
sha256 = "1d8a444a223cc5464240777346e125de51d8e6abf0b8bac742ac84609167dc87"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-doc --disable-gtk-doc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
