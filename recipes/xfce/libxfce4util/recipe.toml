# xfce recipe: libxfce4util — Non-GUI utility library for Xfce
[package]
name = "libxfce4util"
version = "4.20.1"
rel = 1
arch = ["x86_64"]
summary = "Non-GUI utility library for Xfce (libxfce4util-1.0)"
license = ["LGPL-2.0-or-later"]
source = "https://archive.xfce.org/src/xfce/libxfce4util/4.20/libxfce4util-4.20.1.tar.bz2"
sha256 = "84bfc4daab9e466193540c3665eee42b2cf4d24e3f38fc3e8d1e0a2bebe3b8f1"

[depends]
build = ["meson", "ninja", "pkgconf", "xfce4-dev-tools", "glib"]
run = ["glib"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=false -D vala=disabled"
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build'''
