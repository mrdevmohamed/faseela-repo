# gui recipe: python-pyparsing — Python parser toolkit required by Flatpak's Meson build.
[package]
name = "python-pyparsing"
version = "3.3.3"
rel = 1
arch = ["x86_64"]
summary = "Python parsing library"
license = ["MIT"]
source = "https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-%{version}.tar.gz"
sha256 = "928ae7e20211f3b6f3915a72f06a0cfd29ab9d24279dd6346b6b1a7146397d36"
source_dir = "pyparsing-%{version}"

[depends]
build = ["python"]
run = ["python"]

[build]
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
install -d "%{pkgdir}$site"
cp -r src/pyparsing "%{pkgdir}$site/"
find "%{pkgdir}$site/pyparsing" -name __pycache__ -prune -exec rm -rf {} +
'''
