# gui recipe: AppStream — application metadata library and CLI used by Flatpak.
[package]
name = "appstream"
version = "1.2.3"
rel = 1
arch = ["x86_64"]
summary = "Application metadata library and command-line tools"
license = ["LGPL-2.1-or-later"]
source = "https://www.freedesktop.org/software/appstream/releases/AppStream-%{version}.tar.xz"
sha256 = "8daa01a4d66c73f036aa92af9bf76abfe8408eaa76fcda6ca54fa8ef5b93ed17"
source_dir = "AppStream-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "curl", "libxml2", "libfyaml", "libxmlb", "gperf", "zstd"]
run = ["glib", "curl", "libxml2", "libfyaml", "libxmlb", "zstd"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -D systemd=false -D gir=false -D vapi=false -D stemming=false -D qt=false -D compose=false -D bash-completion=false -D apt-support=false -D tools=true -D zstd-support=true -D blake3-support=false -D display-detection=none -D docs=false -D apidocs=false -D install-docs=false -D man=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
