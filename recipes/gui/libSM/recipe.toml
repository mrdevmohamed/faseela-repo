# gui recipe: libSM — X11 Session Management library
[package]
name = "libSM"
version = "1.2.6"
rel = 1
arch = ["x86_64"]
summary = "X11 Session Management library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libSM-%{version}.tar.xz"
sha256 = "be7c0abdb15cbfd29ac62573c1c82e877f9d4047ad15321e7ea97d1e43d835be"

[depends]
build = ["pkgconf", "xorgproto", "xtrans", "libICE"]
run = ["libICE"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
