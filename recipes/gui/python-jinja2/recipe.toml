# gui recipe: python-jinja2 — pure-Python template engine used by elogind build tools.
[package]
name = "python-jinja2"
version = "3.1.6"
rel = 1
arch = ["x86_64"]
summary = "Python Jinja2 template engine"
license = ["BSD-3-Clause"]
source = "https://files.pythonhosted.org/packages/source/j/jinja2/jinja2-%{version}.tar.gz"
source_dir = "jinja2-%{version}"
sha256 = "0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d"

[depends]
build = ["python"]
run = ["python", "python-markupsafe"]

[build]
install = '''
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
install -d "%{pkgdir}$site"
cp -r src/jinja2 "%{pkgdir}$site/"
find "%{pkgdir}$site/jinja2" -name __pycache__ -prune -exec rm -rf {} +
'''
