# xorg recipe: xorg-xrdb — X11 resource database utility
[package]
name = "xorg-xrdb"
version = "1.2.3"
rel = 3
arch = ["x86_64"]
summary = "X11 resource database utility"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
