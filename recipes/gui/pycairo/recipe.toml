strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "python", "cairo"]
run = ["python", "cairo"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -Dtests=false"
