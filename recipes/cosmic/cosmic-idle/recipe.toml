# cosmic recipe: cosmic-idle — COSMIC idle manager (screen blank and
# idle/suspend actions through the ext-idle-notify protocol and login1).
[package]
name = "cosmic-idle"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC idle manager (screen blanking and idle actions)"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-idle"
url = "https://codeload.github.com/pop-os/cosmic-idle/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "81ef78da4cf6811a395962ea9fa817c6288b4164b6057c9dc8e82f6669fde684"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "dbus"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-idle"
install = '''
install -Dm755 target/release/cosmic-idle %{pkgdir}/usr/bin/cosmic-idle
'''
