# xfce recipe: libexif — EXIF metadata parsing library
[package]
name = "libexif"
version = "0.6.25"
rel = 3
arch = ["x86_64"]
summary = "EXIF metadata parsing library (EXIF/IPTC tags of JPEG images)"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libexif"
url = "https://github.com/libexif/libexif/releases/download/v%{version}/libexif-%{version}.tar.xz"
sha256 = "62f74cf3bf673a6e24d2de68f6741643718541f83aca5947e76e3978c25dce83"
strip_components = 1

[depends]
build = ["pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static "
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
