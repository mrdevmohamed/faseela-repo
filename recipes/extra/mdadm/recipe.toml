# extra recipe: mdadm — manage MD (software RAID) devices
[package]
name = "mdadm"
version = "4.3"
rel = 2
arch = ["x86_64"]
summary = "mdadm — manage MD (software RAID) devices"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "mdadm"
url = "https://kernel.org/pub/linux/utils/raid/mdadm/mdadm-%{version}.tar.xz"
sha256 = "416727ae1f1080ea6e3090cea36dd076826fc369151e36ab736557ba92196f9f"
strip_components = 1

[depends]
build = ["systemd"]
run = ["systemd"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} BINDIR=/usr/sbin MANDIR=/usr/share/man UDEVDIR=/usr/lib/udev/rules.d install"
