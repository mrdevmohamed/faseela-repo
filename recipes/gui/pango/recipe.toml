# gui recipe: pango — Text layout and rendering library
[package]
name = "pango"
version = "1.54.0"
rel = 3
arch = ["x86_64"]
summary = "Text layout and rendering library"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "pango"
url = "https://download.gnome.org/sources/pango/1.54/pango-%{version}.tar.xz"
sha256 = "8a9eed75021ee734d7fc0fdf3a65c3bba51dfefe4ae51a9b414a60c70b2d1ed8"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "harfbuzz", "fribidi", "cairo", "fontconfig", "freetype", "gobject-introspection"]
run = ["glib", "harfbuzz", "fribidi", "cairo", "fontconfig", "freetype"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=enabled -D gtk_doc=false -D build-testsuite=false -D build-examples=false -D xft=disabled -D libthai=disabled -D sysprof=disabled -D cairo=enabled -D fontconfig=enabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
