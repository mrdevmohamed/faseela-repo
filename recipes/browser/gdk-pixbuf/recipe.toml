# browser recipe: gdk-pixbuf — image loading library for GTK
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
#
# PNG and JPEG are built INTO the library (builtin_loaders): no loader modules, so no
# loaders.cache to generate at install time, and gio_sniffing=false means no
# shared-mime-info dependency. TIFF and the "other" formats (GIF, ICO, ...) are off.
[package]
name = "gdk-pixbuf"
version = "2.42.12"
rel = 1
arch = ["x86_64"]
summary = "Image loading library for GTK (PNG and JPEG built in)"
license = ["LGPL-2.1-or-later"]
source = "https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-%{version}.tar.xz"
sha256 = "b9505b3445b9a7e48ced34760c3bcb73e966df3ac94c95a148cb669ab748e3c7"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "libpng", "libjpeg-turbo", "gettext"]
run = ["glib", "libpng", "libjpeg-turbo"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D png=enabled -D jpeg=enabled -D tiff=disabled -D others=disabled -D builtin_loaders=png,jpeg -D gio_sniffing=false -D introspection=disabled -D man=false -D gtk_doc=false -D installed_tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
