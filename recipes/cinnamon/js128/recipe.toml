# cinnamon recipe: js128 — SpiderMonkey JavaScript engine (Firefox 128 ESR)
# Built from the Firefox ESR source tree (there is no standalone mozjs
# tarball): the js shell is built from js/src with mach/mozbuild.
#
# Honest caveats (read before changing flags):
# - js128 is the Firefox 128 ESR line, which is END OF LIFE (last release
#   128.14.0esr). cjs 128.1 / Cinnamon 6.6 need it because cjs 140 requires
#   glib >= 2.86 and Faseela ships glib 2.82.2. The js140 path (glib 2.86
#   bump + GI 1.86 + Firefox 140 ESR) is a later follow-up, not this recipe.
# - Non-PGO, non-LTO build first. The build is heavy (561 MB source,
#   multi-GB objdir); the flags below are the standard standalone
#   SpiderMonkey set and have NOT yet been proven by a real build run in
#   this repo — the first CI build of this recipe is the validation.
# - The linker is bfd, not lld: this repo's llvm builds clang but NOT lld.
# - ICU, NSPR and NSS are the BUNDLED copies from the Firefox tree (no
#   --with-system-* flags): fewer moving parts for the first build.
# - MOZBUILD_STATE_PATH is kept inside the build tree so mach never writes
#   outside the sandbox.
# - PR #237 wave 1 (run 46113938187): the first CI build failed with
#   "python3: can't open file '/build/src/js/src/mach'" — mach lives at the
#   TOP of the Firefox tree, there is no js/src/mach. mach is therefore run
#   from the tree root, and MOZCONFIG is exported explicitly so mach finds
#   the js/src/.mozconfig (Firefox Source Docs: mach is "located in the top
#   directory of your checkout").
# - PR #237 waves 1-2 (runs 46126068976 + 46126226861): `mach install` fails
#   with "has_build - Must have a build" even though the build succeeded.
#   Root cause, verified against mozilla-esr128 source
#   (python/mozbuild/mozbuild/base.py: MachCommandConditions.has_build is
#   is_firefox_or_android() or is_thunderbird() — MOZ_BUILD_APP must be
#   "browser"/"comm/mail"/android; a js-shell build has MOZ_BUILD_APP ==
#   "js", so has_build is False BY DESIGN, and `mach install` itself is
#   gated on it (mach_commands.py: @Command("install", ...,
#   conditions=[conditions.has_build])). The command's body is just
#   `_run_make(directory=".", target="install")` — make install in the
#   objdir — so the install step runs that directly instead. The objdir is
#   obj-<config-guess> at the tree root (MOZ_OBJDIR from the configure
#   dump). The shell installs as `js` upstream; it is renamed to `js128`
#   (and js-config to js128-config), the Debian convention, to match the
#   install tests below.
[package]
name = "js128"
version = "128.14.0"
rel = 5
arch = ["x86_64"]
summary = "SpiderMonkey JavaScript engine (Firefox 128 ESR)"
license = ["MPL-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

# NOTE: no workdir — strip_components = 1 strips the tarball's top
# directory, so the staged workspace IS the Firefox tree root (js/,
# browser/, ...). The old workdir = "firefox-128.14.0" named the stripped
# top directory, so nawa failed with "workdir does not exist" (PR #237
# wave 1). The build steps below already run relative to the tree root.

[[package.sources]]
name = "firefox-esr-source"
url = "https://archive.mozilla.org/pub/firefox/releases/128.14.0esr/source/firefox-128.14.0esr.source.tar.xz"
sha256 = "93b9ef6229f41cb22ff109b95bbf61a78395a0fe4b870192eeca22947cb09a53"
strip_components = 1

[depends]
build = ["llvm", "rust", "python", "zip", "cbindgen", "readline", "zlib", "pkgconf", "perl", "unzip"]
run = ["gcc", "glibc", "readline", "zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''
cat > js/src/.mozconfig <<'EOF'
ac_add_options --enable-application=js
ac_add_options --enable-optimize
ac_add_options --disable-debug
ac_add_options --enable-release
ac_add_options --disable-tests
ac_add_options --enable-linker=bfd
ac_add_options --with-system-zlib
ac_add_options --prefix=/usr
EOF
'''
compile = '''
export MOZBUILD_STATE_PATH="$PWD/mozbuild-state"
export MOZCONFIG="$PWD/js/src/.mozconfig"
export CC=clang CXX=clang++
python3 mach build
'''
install = '''
set -eu
objdir="$(ls -d %{srcdir}/obj-*/ | head -n 1)"
test -n "$objdir"
test -f "$objdir/config.status"
DESTDIR=%{pkgdir} make -C "$objdir" install
if [ -x %{pkgdir}/usr/bin/js ] && [ ! -e %{pkgdir}/usr/bin/js128 ]; then
  mv %{pkgdir}/usr/bin/js %{pkgdir}/usr/bin/js128
fi
if [ -e %{pkgdir}/usr/bin/js-config ] && [ ! -e %{pkgdir}/usr/bin/js128-config ]; then
  mv %{pkgdir}/usr/bin/js-config %{pkgdir}/usr/bin/js128-config
fi
test -x %{pkgdir}/usr/bin/js128
test -e %{pkgdir}/usr/include/mozjs-128/js/Value.h
'''
