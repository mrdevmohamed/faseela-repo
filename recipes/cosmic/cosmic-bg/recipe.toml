# cosmic recipe: cosmic-bg — COSMIC wallpaper daemon (layer-shell background).
[package]
name = "cosmic-bg"
version = "1.11.0"
rel = 3
arch = ["x86_64"]
summary = "COSMIC wallpaper/background daemon"
license = ["MPL-2.0"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-bg"
url = "https://codeload.github.com/pop-os/cosmic-bg/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "00e0874b82877378be9cb305139e626f3cd5ef01ad7a1a517de826086adc2652"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon", "dav1d"]
run = ["wayland", "mesa", "dbus", "dav1d"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-bg"
install = '''
install -Dm755 target/release/cosmic-bg %{pkgdir}/usr/bin/cosmic-bg
# Epoch 1.11.0 ships the wallpaper schema only (no desktop/metainfo assets).
# Point the default at Faseela's branded wallpaper directory.
install -Dm644 data/v1/all \
    %{pkgdir}/usr/share/cosmic/com.system76.CosmicBackground/v1/all
sed -i 's|/usr/share/backgrounds/cosmic/orion_nebula_nasa_heic0601a.jpg|/usr/share/backgrounds/faseela/default.png|' \
    %{pkgdir}/usr/share/cosmic/com.system76.CosmicBackground/v1/all
test -f %{pkgdir}/usr/share/cosmic/com.system76.CosmicBackground/v1/all
'''
