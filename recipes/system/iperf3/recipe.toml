# system recipe: iperf3 — the tarball is named iperf-<version>.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r iperf3` pins it.
[package]
name = "iperf3"
version = "3.17.1"
rel = 1
arch = ["x86_64"]
summary = "iperf3: TCP/UDP/SCTP network throughput measurement"
license = ["BSD-3-Clause"]
source = "https://downloads.es.net/pub/iperf/iperf-%{version}.tar.gz"
sha256 = "84404ca8431b595e86c473d8f23d8bb102810001f15feaf610effd3b318788aa"
source_dir = "iperf-%{version}"

[depends]
build = ["openssl"]
run = ["openssl"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
