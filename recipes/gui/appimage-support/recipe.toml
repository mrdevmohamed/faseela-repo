# gui recipe: AppImage runtime support shared by all Faseela desktop sessions.
# FUSE 2 supplies the fusermount name used by legacy Type 2 AppImages;
# FUSE 3 remains available for native FUSE 3 clients and document portals.
[package]
name = "appimage-support"
version = "0.1"
rel = 2
arch = ["x86_64"]
source_date_epoch = 1767225600
summary = "Runtime support for legacy and modern Linux AppImage bundles"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[depends]
build = []
run = ["fuse2", "fuse3"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = '''
install -d -m755 %{pkgdir}/usr/share/appimage-support
cat > %{pkgdir}/usr/share/appimage-support/README <<'EOF'
Faseela AppImage runtime support.

This package pulls in the FUSE 2 and FUSE 3 user-space runtimes.
Make an AppImage executable with chmod +x, then launch it directly.
Use APPIMAGE_EXTRACT_AND_RUN=1 when FUSE mounting is blocked and the
AppImage runtime supports extraction fallback.
EOF
'''
