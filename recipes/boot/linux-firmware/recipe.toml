# boot recipe: linux-firmware — meta package: the FULL firmware set
# (several hundred MB unpacked). It ships no firmware itself: it pulls
#   linux-firmware-lite   curated subset (GPU, wifi, bluetooth, common NICs, AMD microcode)
#   linux-firmware-extra  everything else
# which own disjoint files, so nothing conflicts. Install only
# `linux-firmware-lite` on machines that do not need the rest.
[package]
name = "linux-firmware"
version = "20260910"
rel = 2
arch = ["x86_64"]
summary = "Meta package: all Linux kernel firmware (linux-firmware-lite + linux-firmware-extra)"

[depends]
run = ["linux-firmware-lite", "linux-firmware-extra"]

[build]
# meta package: no sources, ships the manifest so the set is introspectable
install = """
mkdir -p %{pkgdir}/usr/share/nawa
printf '%s\\n' linux-firmware-lite linux-firmware-extra > %{pkgdir}/usr/share/nawa/linux-firmware.list
"""
