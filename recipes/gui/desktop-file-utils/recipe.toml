# gui recipe: desktop-file-utils — desktop entry validation and MIME application cache tools
[package]
name = "desktop-file-utils"
version = "0.29"
rel = 1
arch = ["x86_64"]
summary = "Utilities for desktop entries and MIME application database"
license = ["GPL-2.0-or-later"]
source = "https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-%{version}.tar.xz"
sha256 = "661f225be4c667abc4962f075717db4252b63c84480f6d37b26050d029da8fa0"
source_dir = "desktop-file-utils-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "glib"]
run = ["glib"]

[build]
configure = "meson setup build --prefix=/usr --buildtype=release"
compile = "ninja -C build"
install = '''
DESTDIR=%{pkgdir} meson install -C build

# Nawa runs these distribution triggers once after each package transaction,
# so every newly installed/removed application updates the shared databases.
install -d -m755 %{pkgdir}/usr/lib/nawa/transaction-hooks.d
cat > %{pkgdir}/usr/lib/nawa/transaction-hooks.d/10-desktop-mime-cache.sh <<'TRIGGER'
#!/bin/sh
set -eu

if command -v update-mime-database >/dev/null 2>&1; then
    update-mime-database /usr/share/mime
fi

if command -v update-desktop-database >/dev/null 2>&1; then
    update-desktop-database -q /usr/share/applications
fi
TRIGGER
chmod 755 %{pkgdir}/usr/lib/nawa/transaction-hooks.d/10-desktop-mime-cache.sh
'''

[hooks]
post_install = "update-desktop-database -q /usr/share/applications"
