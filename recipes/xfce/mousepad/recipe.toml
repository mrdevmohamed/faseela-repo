# xfce recipe: mousepad — Xfce text editor
[package]
name = "mousepad"
version = "0.6.3"
rel = 1
arch = ["x86_64"]
summary = "Xfce text editor (simple and fast, based on gtksourceview-4)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/apps/mousepad/0.6/mousepad-0.6.3.tar.bz2"
sha256 = "2ff162c185f18014ab9c82c2ac2dfce4fba20eb0005e7690ee27f00b9cb929b9"

[depends]
build = ["pkgconf", "gtksourceview4", "gtk3", "glib"]
run = ["gtksourceview4", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
