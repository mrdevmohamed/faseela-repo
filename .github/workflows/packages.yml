      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave5) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

