# system recipe: smartmontools — release tag in the URL is RELEASE_7_4 (underscores); change both when bumping.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r smartmontools` pins it.
[package]
name = "smartmontools"
version = "7.4"
rel = 1
arch = ["x86_64"]
summary = "smartctl/smartd: S.M.A.R.T. disk health monitoring"
license = ["GPL-2.0-or-later"]
source = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_4/smartmontools-%{version}.tar.gz"
sha256 = "e9a61f641ff96ca95319edfb17948cd297d0cd3342736b2c49c99d4716fb993d"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --sbindir=/usr/bin --sysconfdir=/etc --with-libcap-ng=no --with-selinux=no"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
