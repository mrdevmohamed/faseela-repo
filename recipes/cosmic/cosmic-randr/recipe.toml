# cosmic recipe: cosmic-randr — CLI and Wayland client to configure COSMIC
# displays (modes, positions, scaling) against cosmic-comp.
[package]
name = "cosmic-randr"
version = "1.11.0"
rel = 3
arch = ["x86_64"]
summary = "Display configuration utility for the COSMIC desktop"
license = ["MPL-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-randr"
url = "https://codeload.github.com/pop-os/cosmic-randr/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "cd04841b780ad13d407a0a3740f827b3fc214dfc198b114d6a83524c2a0ca96e"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland"]
run = ["wayland"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[fetch.cargo]
dir = "."

[build]
# cosmic-randr is a virtual workspace; the CLI crate carries the binary.
compile = "cargo build --release --offline --locked -p cosmic-randr-cli"
install = '''
install -Dm755 target/release/cosmic-randr %{pkgdir}/usr/bin/cosmic-randr
'''
