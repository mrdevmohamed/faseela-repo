# unity recipe: indicator-appmenu — global-menu panel indicator
# Source: Ubuntu's native source tarball (no separate orig/patches).
[package]
name = "indicator-appmenu"
version = "15.02.0"
rel = 2
arch = ["x86_64"]
summary = "Panel indicator that shows the focused application's menu"
license = ["GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "indicator-appmenu"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/i/indicator-appmenu/indicator-appmenu_15.02.0+20.10.20260311-0ubuntu1.tar.gz"
sha256 = "a92e68e17bd36cd676c11a68ce9f964f3f5fb9434b710f5bcf301d70f7ad0afc"
strip_components = 1

[depends]
build = ["pkgconf", "glib", "gtk3", "libindicator", "libappindicator", "libdbusmenu", "bamf", "indicator-application", "gnome-common", "unity-build-shims", "intltool", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "gtk3", "libindicator", "libdbusmenu", "bamf", "indicator-application"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''set -eu
cp /usr/lib/unity-build-shims/gtk-doc.make .
'''
configure = '''export CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types"
autoreconf -fi
./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-gtk-doc --with-gtk=3
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/indicators3/7/libappmenu.so
'''
