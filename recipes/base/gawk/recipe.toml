# base recipe: GNU awk text-processing language
[package]
name = "gawk"
version = "5.4.1"
rel = 3
arch = ["x86_64"]
summary = "GNU awk text-processing language"
license = ["GPL-3.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "gawk"
url = "https://mirrors.kernel.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"
strip_components = 1

[depends]
# gawk -M (bignum) links libmpfr/libgmp; declared so they never leak in from
# the bootstrap seed.
build = ["gmp", "mpfr", "readline"]
run = ["gmp", "mpfr", "readline"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
