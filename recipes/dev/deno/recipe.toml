# Developer runtime: Deno JavaScript/TypeScript runtime.
# The upstream Linux release is a ZIP containing the standalone executable.
[package]
name = "deno"
version = "2.9.8"
rel = 3
arch = ["x86_64"]
source_date_epoch = 1767225600
summary = "Deno JavaScript and TypeScript runtime"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "deno"
url = "https://github.com/denoland/deno/releases/download/v%{version}/deno-x86_64-unknown-linux-gnu.zip"
sha256 = "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609"
unpack = false

[depends]
build = ["unzip"]
run = ["glibc", "gcc"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = """
# Nawa stages ZIP sources as files; unpack the pinned upstream binary archive.
unzip -oq deno-x86_64-unknown-linux-gnu.zip -d .
install -Dm755 deno %{pkgdir}/usr/bin/deno
"""
