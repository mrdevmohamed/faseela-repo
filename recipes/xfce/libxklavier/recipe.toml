# xfce recipe: libxklavier — X keyboard extension high-level API
[package]
name = "libxklavier"
version = "5.3"
rel = 2
arch = ["x86_64"]
summary = "X keyboard extension high-level API (keyboard layout switching)"
license = ["LGPL-2.0-or-later"]
source = "https://download.gnome.org/sources/libxklavier/5.3/libxklavier-5.3.tar.xz"
sha256 = "ebec3bc54b5652838502b96223152fb1cd8fcb14ace5cb02d718fc3276bbd404"

[depends]
build = ["pkgconf", "glib", "libxml2", "libX11", "libXi", "iso-codes", "xorgproto"]
run = ["glib", "libxml2", "libX11", "libXi", "iso-codes"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-static"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
