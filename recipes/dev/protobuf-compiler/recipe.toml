# extra recipe: pinned upstream Protocol Buffers compiler for Rust/Cargo builds.
# The official protoc binary release is used as a build tool, like the pinned Rust toolchain.
[package]
name = "protobuf-compiler"
version = "36.2"
rel = 1
arch = ["x86_64"]
source_date_epoch = 1789666294
summary = "Protocol Buffers compiler and standard .proto definitions"
license = ["BSD-3-Clause"]
source = "https://github.com/protocolbuffers/protobuf/releases/download/v%{version}/protoc-%{version}-linux-x86_64.zip"
sha256 = "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278"

[depends]
build = ["unzip"]
run = []

[build]
install = """
unzip -q "protoc-%{version}-linux-x86_64.zip" -d extracted
install -Dm0755 extracted/bin/protoc "%{pkgdir}/usr/bin/protoc"
mkdir -p "%{pkgdir}/usr/include"
cp -a extracted/include/google "%{pkgdir}/usr/include/"
"""
