name: CI

# What this repository can check without building any package: the recipe tree
# and the scripts that work on it. Building and publishing is packages.yml.
#
# The distribution (github.com/mrdevmohamed/faseela) takes its recipes from the
# master branch of this repository, so a red master here breaks its builds:
# make "CI passed" a required check in the branch protection of master.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recipes
        run: python3 -I scripts/check-recipes.py
      - name: recipe-ids.py lists every recipe
        run: |
          python3 scripts/recipe-ids.py recipes > "$RUNNER_TEMP/ids.txt"
          [ "$(wc -l < "$RUNNER_TEMP/ids.txt")" -eq "$(ls recipes/*/*/recipe.toml | wc -l)" ]

  # One required check for branch protection: green only if EVERY job above is.
  ci-ok:
    name: CI passed
    if: always()
    needs: [recipes]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a CI job finished as '$r'"; exit 1; }
          done
