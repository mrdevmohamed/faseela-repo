# cinnamon recipe: cinnamon-desktop-session — Cinnamon 6.6 X11 session
# integration and core desktop components
# meta package in the gui-session style: no upstream source, only
# configuration and service wiring on top of the real packages.
# Mirrors recipes/xfce/xfce-session/recipe.toml.
[package]
name = "cinnamon-desktop-session"
version = "0.1"
rel = 2
arch = ["x86_64"]
summary = "Cinnamon 6.6 X11 session integration and core desktop components"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[depends]
build = []
# accountsservice: no recipe exists on this branch yet (it is part of the
# Unity work in PR #236); the session needs it at runtime for user
# switching and backgrounds, so it is listed here anyway.
run = ["cinnamon", "muffin", "nemo", "cinnamon-desktop", "cinnamon-menus", "cinnamon-translations", "cinnamon-control-center", "cinnamon-settings-daemon", "cinnamon-screensaver", "cinnamon-session", "libxapp", "gsound", "accountsservice", "polkit", "network-manager", "network-manager-applet", "bluez", "udisks2", "gvfs", "xdg-desktop-portal", "xdg-desktop-portal-gtk", "faseela-branding", "audio-session", "xorg-server", "xf86-input-libinput", "mesa", "libdrm", "libepoxy", "xorg-xauth", "xorg-xrandr", "xorg-xset", "xorg-xrdb", "xorg-xmodmap", "xorg-xhost", "xorg-setxkbmap", "xkeyboard-config", "xkbcomp", "dejavu-fonts", "noto-fonts", "noto-fonts-arabic", "python"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = '''
# --- Xorg keyboard layout: US + Arabic, Alt+Shift toggles --------------------
# Xorg reads /etc/X11/xorg.conf.d/*.conf at server start; this mirrors the
# gui-session sway drop-in so both desktops behave the same.
install -d -m755 %{pkgdir}/etc/X11/xorg.conf.d
cat > %{pkgdir}/etc/X11/xorg.conf.d/00-faseela-keyboard.conf <<'KBD'
Section "InputClass"
    Identifier "faseela-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us,ara"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
KBD
chmod 644 %{pkgdir}/etc/X11/xorg.conf.d/00-faseela-keyboard.conf

# Cinnamon's XDG autostart launches the shared per-user audio supervisor.
install -d -m755 %{pkgdir}/etc/xdg/autostart
cat > %{pkgdir}/etc/xdg/autostart/faseela-audio-session.desktop <<'DESKTOP'
[Desktop Entry]
Type=Application
Name=Faseela Audio Session
Comment=Start PipeWire audio services for this desktop session
Exec=/usr/bin/faseela-audio-session
TryExec=/usr/bin/faseela-audio-session
OnlyShowIn=Cinnamon;
NoDisplay=true
X-GNOME-Autostart-enabled=true
DESKTOP
chmod 644 %{pkgdir}/etc/xdg/autostart/faseela-audio-session.desktop
'''

[hooks]
post_install = '''
for socket_dir in /tmp/.X11-unix /tmp/.ICE-unix; do
    mkdir -p "$socket_dir"
    chown root:root "$socket_dir"
    chmod 1777 "$socket_dir"
done

for group in video render input audio; do
    /usr/libexec/faseela/ensure-system-account group "$group"
done

echo "cinnamon-desktop-session: add your user to video,render,input,audio for Xorg device access."
echo "cinnamon-desktop-session: LightDM is optional; install lightdm and lightdm-gtk-greeter for a graphical login."
# LightDM is packaged but NOT pre-enabled: enable it manually only after
# the Xorg privilege path has been validated, mirroring Xfce and Unity.
'''
