# Faseela image definitions.
#
# Recipes describe how packages are built. This file defines the package sets
# installed into bootstrappable roots and desktop images.
#
# Internal build targets:
#   bootstrap   self-hosting core used by stage 2 and stage 3
#   seed        full rootfs used by the next bootstrap
#   rootfs-min  small package-build environment
#
# User-facing images:
#   iso-nogui   common base system without a desktop
#   iso-sway    common base + Sway Wayland desktop
#   iso-xfce    common base + Xfce desktop on Xorg
#
# Optional applications (media players, editors, messaging, VPN clients,
# peripherals, developer tools) are installed separately through Nawa.
#
# Flavor fields:
#   summary  one-line description
#   include  package names or @category selectors
#   extends  inherit packages from another flavor
#   exclude  omit named packages
#   closure  run (default) or build (build + runtime dependencies)

# Stage 2 and stage 3 build only this self-hosting core.
[flavor.bootstrap]
summary = "Self-hosting core: base-devel, Nawa and repository access"
include = ["base-devel", "nawa", "curl", "ca-certificates"]
closure = "build"

# Full rootfs used to seed a later bootstrap.
[flavor.seed]
summary = "Full rootfs that seeds the next bootstrap"
extends = ["bootstrap"]
closure = "build"

# Small environment used by the package-build workflow.
[flavor.rootfs-min]
summary = "Minimal package-build environment without Rust"
include = ["base-devel", "nawa", "git", "curl", "ca-certificates"]

# Shared live-system base, without a graphical session.
# Keep full firmware out of the ISO; users can install it through Nawa.
[flavor.iso-nogui]
summary = "Base live system without a desktop environment"
include = ["@toolchain", "@base", "@system", "@boot", "@extra"]
exclude = ["linux-firmware", "linux-firmware-extra"]

# Sway desktop image.
[flavor.iso-sway]
summary = "Live system with Sway, PipeWire, Firefox, networking and Bluetooth"
extends = ["iso-nogui"]
include = ["@gui", "firefox"]
exclude = ["zed"]

# Xfce desktop image.
[flavor.iso-xfce]
summary = "Live system with Xfce on Xorg and LightDM"
extends = ["iso-nogui"]
include = [
    "xfce-session",
    "lightdm",
    "lightdm-gtk-greeter",
    "xfce4-terminal",
    "mousepad",
    "ristretto",
    "xfce4-taskmanager",
    "xfce4-screenshooter",
    "xfce4-notifyd",
    "xfce4-power-manager",
    "xfce4-whiskermenu-plugin",
    "xfce4-pulseaudio-plugin",
    "xfce4-clipman-plugin",
    "network-manager-applet",
    "tumbler",
    "thunar-archive-plugin",
    "xarchiver",
    "pavucontrol"
]
