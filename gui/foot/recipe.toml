# gui recipe: foot — Fast, lightweight Wayland terminal emulator
[package]
name = "foot"
version = "1.19.0"
rel = 2
arch = ["x86_64"]
summary = "Fast, lightweight Wayland terminal emulator"
license = ["MIT"]
source = "https://codeberg.org/dnkl/foot/archive/%{version}.tar.gz"
sha256 = "aa537908dff8a573adb68137974f8b317eed3b779d3e6954da84e0baff7b13a0"
source_dir = "foot"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols", "libxkbcommon", "pixman", "fontconfig", "fcft", "tllist", "ncurses"]
run = ["fcft", "fontconfig", "pixman", "libxkbcommon", "wayland", "ncurses"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D docs=disabled -D grapheme-clustering=disabled -D utmp-backend=none -D terminfo=enabled -D b_lto=false"
compile = "ninja -C build"
# ncurses already ships the `foot` and `foot-direct` terminfo entries
# (/usr/share/terminfo/f/): nawa refuses foot otherwise ("file conflicts ...
# terminfo/f/foot (owned by ncurses)"). One owner per file: ncurses keeps them,
# foot drops its copies (TERM=foot keeps working), hence ncurses in run.
install = "DESTDIR=%{pkgdir} meson install -C build && rm -f %{pkgdir}/usr/share/terminfo/f/foot %{pkgdir}/usr/share/terminfo/f/foot-direct"
