# browser recipe: libsoup3 — GLib HTTP client used by WebKitGTK 4.1.
[package]
name = "libsoup3"
version = "3.8.1"
rel = 7
arch = ["x86_64"]
summary = "GLib HTTP client and server library (libsoup 3)"
license = ["LGPL-2.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libsoup3"
url = "https://download.gnome.org/sources/libsoup/3.8/libsoup-%{version}.tar.xz"
sha256 = "5013dcef9136f6f861e6529fca578af50c1f52a39219027fb5aff652d1371a04"
strip_components = 1

[depends]
# setuptools: g-ir-scanner imports distutils (removed in Python 3.13);
# the distutils-precedence.pth shim only activates if setuptools is
# installed in this package's build root, so it must be a build dep
# (PR #239: glib-gir failed with "No module named 'distutils'").
build = ["meson", "ninja", "pkgconf", "glib", "sqlite", "libpsl", "libxml2", "brotli", "glib-networking", "nghttp2", "gobject-introspection", "glib-gir", "setuptools"]
run = ["glib", "glib-gir", "sqlite", "libpsl", "libxml2", "brotli", "glib-networking", "nghttp2"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
# Upstream documents tls_check=false for package builds: glib-networking is
# a runtime backend, not a libsoup compile-time dependency. Keep it explicit
# in depends.run and validate runtime TLS separately after installation.
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=enabled -D vapi=disabled -D docs=disabled -D tests=false -D installed_tests=false -D sysprof=disabled -D gssapi=disabled -D ntlm=disabled -D autobahn=disabled -D brotli=enabled -D tls_check=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
