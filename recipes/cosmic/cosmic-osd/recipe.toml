# cosmic recipe: cosmic-osd — COSMIC on-screen display (volume/brightness
# overlay window, driven through cosmic-comp's OSD D-Bus interface).
[package]
name = "cosmic-osd"
version = "1.11.0"
rel = 3
arch = ["x86_64"]
summary = "COSMIC on-screen display overlay"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-osd"
url = "https://codeload.github.com/pop-os/cosmic-osd/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "98f049d10e9746ae9751d10d556eff73b7270d7d99861445ab9171bd140ba416"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "pipewire", "wayland", "libxkbcommon", "libpulse", "libinput"]
run = ["pipewire", "wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus", "libpulse", "libinput", "polkit"]

[fetch.cargo]
dir = "."

[build]
compile = "POLKIT_AGENT_HELPER_1=/usr/lib/polkit-1/polkit-agent-helper-1 cargo build --release --offline --locked --bin cosmic-osd"
install = '''
install -Dm755 target/release/cosmic-osd %{pkgdir}/usr/bin/cosmic-osd
'''
