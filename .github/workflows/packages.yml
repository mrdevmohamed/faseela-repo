  publish:
    name: publish stable-v5
    needs: [select, plan, build-w0, build-w1, build-w2, build-w3, build-w4, build-w5, build-w6, build-w7, build-w8]
    # Only main publishes, and only when nothing failed or was cancelled: the repository
    # is replaced as a whole (complete, signed set) or not at all.
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NAWA_SIGN_KEY_B64: ${{ secrets.NAWA_SIGN_KEY_B64 }}
      PKG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the repository signing key
        run: |
          set -euo pipefail
          [[ -n "$NAWA_SIGN_KEY_B64" ]] || { echo "::error::secret NAWA_SIGN_KEY_B64 is not set"; exit 1; }
          # the key clients trust must be the one that signs
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/mrdevmohamed/faseela/master/dist/nawa.pub \
            --output "$RUNNER_TEMP/nawa-distro.pub"
          cmp dist/nawa.pub "$RUNNER_TEMP/nawa-distro.pub"

      - name: Require complete schema-v5 metadata
        run: python3 -I scripts/audit-schema-v5-metadata.py --recipes recipes --strict

      - uses: dtolnay/rust-toolchain@stable

      # Signing and indexing use the pinned nawa of the recipe, compiled here.
      - name: Build the recipe-pinned nawa
        run: |
          set -euo pipefail
          pin_env="$RUNNER_TEMP/nawa-source.env"
          python3 -I - <<'PY' > "$pin_env"
          import re
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("recipes/base/nawa/recipe.toml").read_text()).get("package", {})
          matches = [i for i in package.get("sources", []) if isinstance(i, dict) and i.get("name") == "nawa"]
          if package.get("name") != "nawa" or len(matches) != 1:
              raise SystemExit("expected one recipe-pinned Nawa source")
          url, digest = matches[0].get("url", ""), matches[0].get("sha256", "")
          match = re.fullmatch(r"https://github\.com/mrdevmohamed/nawa/archive/([0-9a-f]{40})\.tar\.gz", url)
          if not match or not re.fullmatch(r"[0-9a-f]{64}", digest) or digest == "0" * 64:
              raise SystemExit("invalid Nawa source URL or SHA-256 in the recipe")
          print(f"NAWA_SOURCE_COMMIT={match.group(1)}")
          print(f"NAWA_SOURCE_SHA256={digest}")
          print(f"NAWA_SOURCE_URL={url}")
          PY
          # shellcheck source=/dev/null
          source "$pin_env"
          archive="$RUNNER_TEMP/nawa-source.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 20 "$NAWA_SOURCE_URL" --output "$archive"
          echo "$NAWA_SOURCE_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nawa-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nawa-source"
          source_dir="$RUNNER_TEMP/nawa-source/nawa-$NAWA_SOURCE_COMMIT"
          cargo build --manifest-path "$source_dir/Cargo.toml" --release --locked
          echo "NAWA_BIN=$source_dir/target/release/nawa" >> "$GITHUB_ENV"

      # Everything the shards built in this run.
      - name: Download the archives built in this run
        uses: actions/download-artifact@v4
        with:
          pattern: built-*
          merge-multiple: true
          path: ${{ runner.temp }}/schema-v5/built

      # Everything else of the complete set is already published.
      - name: Fetch the archives that are already published
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/schema-v5"
          built="$root/built"
          mkdir -p "$built"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$root/releases.json"
          python3 -I scripts/distributed-releases.py list \
            --releases-json "$root/releases.json" --stable-tag stable-v5 --index-version 5 > "$root/published.tsv"
          # every archive (main, doc, lang) of every current recipe
          names="$(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path
          print(" ".join(tomllib.loads(p.read_text(encoding="utf-8"))["package"]["name"]
                         for p in sorted(Path("recipes").glob("*/*/recipe.toml"))))
          PY
          )"
          python3 -I scripts/plan-build-shards.py assets --recipes recipes --names "$names" | sort -u > "$root/wanted.txt"
          : > "$root/fetch.nul"
          while IFS=$'\t' read -r tag asset; do
            [[ -n "$asset" ]] || continue
            [[ "$tag" =~ ^packages-v5-[0-9]{4,}$ && "$asset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*[.]nawa[.]tar[.]zst$ ]] || continue
            grep -qxF "$asset" "$root/wanted.txt" || continue
            [[ -s "$built/$asset" ]] && continue
            printf '%s\0%s\0' "$tag" "$asset" >> "$root/fetch.nul"
          done < "$root/published.tsv"
          export T="$root/fetch" PKG_REPO
          mkdir -p "$T/build/out"
          pending="$root/fetch.nul"
          for round in 0 1 2 3; do
            [[ -s "$pending" ]] || break
            (( round == 0 )) || { echo "retry round $round"; sleep $((round * 20)); }
            (( round < 3 )) || export FETCH_VIA_API=1
            : > "$root/fetch.failed"; export failed="$root/fetch.failed"
            # shellcheck disable=SC2016
            xargs -0 -r -n 2 -P 4 bash -c 'bash scripts/fetch-published-package.sh "$1" "$2" || printf "%s\0%s\0" "$1" "$2" >> "$failed"' _ < "$pending"
            mv -f "$root/fetch.failed" "$pending"
          done
          if [[ -s "$pending" ]]; then
            echo "::error::could not download these published archives:"; tr '\0' '\n' < "$pending" | paste - - ; exit 1
          fi
          find "$T/build/out" -maxdepth 1 -name '*.nawa.tar.zst' -exec mv -n -t "$built" {} +
          echo "built here: $(find "$built" -name '*.nawa.tar.zst' | wc -l) archive(s) in total"

      - name: Prepare and verify the complete schema-v5 repository
        id: prepare
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/schema-v5"
          printf '%s' "$NAWA_SIGN_KEY_B64" | base64 --decode > "$root/nawa.sec"
          chmod 600 "$root/nawa.sec"
          python3 -I scripts/publish-schema-v5.py prepare \
            --recipes recipes \
            --source-dir "$root/built" \
            --archive-dir "$root/packages" \
            --nawa "$NAWA_BIN" \
            --signing-key "$root/nawa.sec" \
            --public-key dist/nawa.pub \
            --repository "$GITHUB_REPOSITORY" \
            --stable-tag stable-v5 \
            --revision "$GITHUB_SHA" \
            --releases-json "$root/releases.json" \
            --planner scripts/distributed-releases.py \
            --plan "$root/plan.json" \
            --locations "$root/locations.toml" \
            --existing-dir "$root/existing"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Publish immutable package and recipe shards
        env:
          PLAN_DIR: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes "Immutable schema-v5 package archive shard."
          done < <(python3 -I scripts/distributed-releases.py create --plan "$PLAN_DIR/plan.json")
          mapfile -t tags < <(python3 -I -c 'import json,sys; print("\n".join(sorted(json.load(open(sys.argv[1])).get("uploads", {}))))' "$PLAN_DIR/plan.json")
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] || continue
            mapfile -t assets < <(python3 -I scripts/distributed-releases.py uploads \
              --plan "$PLAN_DIR/plan.json" --repo-dir "$PLAN_DIR/packages" --tag "$tag")
            ((${#assets[@]} > 0)) || continue
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          done

      # The index goes last: until then clients keep seeing the previous, consistent repository.
      - name: Publish the signed stable-v5 index
        env:
          PLAN_DIR: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          if ! gh release view stable-v5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create stable-v5 --repo "$GITHUB_REPOSITORY" \
              --title "Nawa schema-v5 repository" \
              --notes "Signed schema-v5 repository index. Package archives are in immutable packages-v5-NNNN releases."
          fi
          gh release upload stable-v5 --repo "$GITHUB_REPOSITORY" "$PLAN_DIR/packages/index.toml.sig" --clobber
          gh release upload stable-v5 --repo "$GITHUB_REPOSITORY" "$PLAN_DIR/packages/index.toml" --clobber
          {
            echo "### Published stable-v5"
            echo "Revision \`$GITHUB_SHA\`; $(grep -c '^\[\[package\]\]' "$PLAN_DIR/packages/index.toml") package archive(s) in the signed index."
          } >> "$GITHUB_STEP_SUMMARY"

      # nawa refuses to install a package that ships a file another one owns.
      # Reported after publishing: the run turns red and names the files.
      - name: No two packages of a flavor may ship the same file
        if: ${{ always() && steps.prepare.conclusion == 'success' }}
        run: |
          python3 -I scripts/test-file-conflicts.py
          python3 -I scripts/check-file-conflicts.py "$RUNNER_TEMP/schema-v5/packages"

  telegram-notify:
    name: Telegram notification
    if: ${{ always() }}
    needs: [select, plan, build-w0, build-w1, build-w2, build-w3, build-w4, build-w5, build-w6, build-w7, build-w8, publish]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send workflow result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: select=${{ needs.select.result }},plan=${{ needs.plan.result }},build=${{ contains(join(needs.*.result, ','), 'failure') && 'failure' || (contains(join(needs.*.result, ','), 'cancelled') && 'cancelled' || 'success') }},publish=${{ needs.publish.result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 -I scripts/notify-telegram.py
