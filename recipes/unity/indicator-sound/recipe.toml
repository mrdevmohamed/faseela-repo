# unity recipe: indicator-sound — Unity sound indicator service
# Source: Ubuntu archive orig tarball (12.10.2+18.10.20180612); Ubuntu's
# patches are vendored under patches/ (ubuntu-resolute.patch) plus Faseela
# additions (faseela.patch). The service is Vala + C, built with CMake.
# - Ubuntu's -0ubuntu10 diff already drops url-dispatcher (configure + the
#   --pkg reference) and the test suite, bumps cmake_minimum_required to 3.10
#   and carries the valac-0.56 / GCC 15 fixes (LP #2166355).
# - Faseela drops the dbustest-1 TEST pkg_check (tests are skipped), the
#   gmenuharness test helper (needs libunity-api, service never links it),
#   the Upstart job/override installs, and the vapigen-generated
#   accounts-service VAPI: the repo's accountsservice builds with
#   introspection disabled so no AccountsService-1.0.gir exists. A minimal
#   hand-written vapi/accounts-service.vapi (Act.UserManager.get_default,
#   get_user, Act.User.is_loaded, get_object_path — the only Act API the
#   service uses) is vendored in faseela.patch instead.
# - CMAKE_INSTALL_LOCALSTATEDIR=/var (Debian's /usr/var default is wrong:
#   the polkit .pkla must land in /var/lib/polkit-1).
[package]
name = "indicator-sound"
version = "12.10.2"
rel = 2
arch = ["x86_64"]
summary = "Unity sound indicator service"
license = ["GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "indicator-sound"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/i/indicator-sound/indicator-sound_12.10.2+18.10.20180612.orig.tar.gz"
sha256 = "d37f5db1a683be45a6f6e515603745183867edb984ca06905e121c7d3432dfc2"
strip_components = 1

[depends]
build = ["cmake", "pkgconf", "glib", "libpulse", "libnotify", "libxml2", "accountsservice", "gettext", "intltool", "vala", "gnome-common", "gsettings-ubuntu-touch-schemas", "cmake-extras", "libgee-0.8"]
run = ["libpulse", "libnotify", "accountsservice", "libgee-0.8", "glib", "gsettings-ubuntu-touch-schemas", "libindicator", "dconf", "polkit", "pipewire"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[assets]
include = ["patches/ubuntu-resolute.patch", "patches/faseela.patch"]

[hooks]
post_install = "glib-compile-schemas /usr/share/glib-2.0/schemas"
post_remove = "glib-compile-schemas /usr/share/glib-2.0/schemas"

[build]
prepare = '''set -eu
patch -p1 < %{assetsdir}/patches/ubuntu-resolute.patch
patch -p1 < %{assetsdir}/patches/faseela.patch
'''
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_LIBEXECDIR=lib -DCMAKE_INSTALL_LOCALSTATEDIR=/var -DCMAKE_BUILD_TYPE=Release"
compile = "cmake --build build -j%{jobs}"
install = '''
DESTDIR=%{pkgdir} cmake --install build
rm -f %{pkgdir}/usr/share/glib-2.0/schemas/gschemas.compiled
test -x %{pkgdir}/usr/lib/indicator-sound/indicator-sound-service
test -e %{pkgdir}/usr/share/unity/indicators/com.canonical.indicator.sound
test -e %{pkgdir}/usr/lib/systemd/user/indicator-sound.service
test -e %{pkgdir}/usr/share/glib-2.0/schemas/com.canonical.indicator.sound.gschema.xml
'''
