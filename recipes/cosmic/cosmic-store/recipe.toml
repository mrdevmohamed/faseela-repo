# cosmic recipe: cosmic-store — COSMIC package/app store frontend.
# The appstream metadata parser (jackpot51/appstream) is pure Rust — it reads
# catalog XML files; repository backends are queried over D-Bus. Keep Flatpak,
# PackageKit and systemd-scope integrations disabled: Faseela has no Flatpak or
# PackageKit service and uses elogind/runit rather than systemd.
[package]
name = "cosmic-store"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC application store frontend"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-store"
url = "https://codeload.github.com/pop-os/cosmic-store/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "c73221fe4c26a52b965f6fbd4f7feb1ea18edf23778a91964c0172133ef67e3b"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus", "xdg-desktop-portal-cosmic"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --no-default-features --features dbus-config,desktop,logind,notify,single-instance,wgpu,wayland,xdg-portal --bin cosmic-store"
install = '''
install -Dm755 target/release/cosmic-store %{pkgdir}/usr/bin/cosmic-store
install -Dm644 target/xdgen/com.system76.CosmicStore.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicStore.desktop
install -Dm644 target/xdgen/com.system76.CosmicStore.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicStore.metainfo.xml
if [ -d res/icons/hicolor ]; then
    find res/icons/hicolor -type f | while read -r f; do
        rel=${f#res/icons/hicolor/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
