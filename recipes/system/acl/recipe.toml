# system recipe: POSIX Access Control List utilities and shared library.
[package]
name = "acl"
version = "2.4.0"
rel = 1
arch = ["x86_64"]
summary = "POSIX Access Control List library and utilities"
license = ["GPL-2.0-or-later", "LGPL-2.1-or-later"]
source = "https://download.savannah.nongnu.org/releases/acl/acl-%{version}.tar.xz"
sha256 = "e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3"

[depends]
build = ["attr"]
run = ["attr"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --docdir=/usr/share/doc/acl-%{version} --disable-static --disable-nls"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
