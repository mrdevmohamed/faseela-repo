# base recipe: nawa — this distribution's source-based package manager (self-hosting build)
#
# The source is pinned to one upstream commit and verified independently by
# SHA-256. The multi-source schema extracts the GitHub archive directly into
# the source workspace (strip_components = 1); Cargo dependencies are fetched
# from Cargo.lock by Nawa's fetch phase, not bundled in a vendor directory.
#
# The commit, version, and source hash are maintained by:
#   python3 scripts/pin-nawa-source.py [<nawa commit>]
# bootstrap/fetch-nawa.sh reads the same pin from this recipe.
[package]
name = "nawa"
version = "1.0.0"
rel = 36
arch = ["x86_64"]
summary = "nawa — this distribution's source-based package manager (self-hosting build)"
license = ["GPL-3.0"]
# Fail closed on Nawa versions that predate the multi-source recipe schema.
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[depends]
# Nawa is bootstrapped with a pinned Rust toolchain by packages.yml; keep that
# bootstrap separate from the package dependency graph. Its ELF runtime links
# against glibc and libgcc.
build = []
run = ["gcc", "glibc"]

[capabilities]
provides = []

# This recipe is schema-v5-only. The previously published stable-v3 Nawa
# archive and the standalone signed nawa-transition release remain the
# bootstrap path; this relation-aware build is published only in stable-v5.
[relations]
schema = 1
conflicts = []
replaces = []
[[package.sources]]
name = "nawa"
url = "https://github.com/mrdevmohamed/nawa/archive/1a8d457421fef48ae6953ca081c2479340700cdb.tar.gz"
sha256 = "9222c5b903f04b455188600ef5f6f0e82d9cc4cbd8bf414d971ee362af9fe4fa"
strip_components = 1

[fetch.cargo]
dir = "."

[build]
# Nawa fetches the locked Cargo dependency graph before this offline build.
compile = "cargo build --release --offline --locked"
install = """
install -Dm755 target/release/nawa %{pkgdir}/usr/bin/nawa
# system-wide configuration: default repository + install mode
install -Dm644 dist/nawa.toml %{pkgdir}/etc/nawa/nawa.toml
# Faseela's active package endpoint uses the signed schema-v3 index.
# Keep the old stable endpoint available for already-installed schema-v1 clients.
sed -i 's|releases/download/stable"|releases/download/stable-v3"|' %{pkgdir}/etc/nawa/nawa.toml
"""
