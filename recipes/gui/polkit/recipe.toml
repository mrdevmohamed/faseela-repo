# gui recipe: PolicyKit authorization framework (systemd-logind session tracking, shadow authentication).
[package]
name = "polkit"
version = "126"
rel = 10
arch = ["x86_64"]
summary = "PolicyKit authorization framework and privileged action helper"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "polkit"
url = "https://github.com/polkit-org/polkit/archive/refs/tags/%{version}.tar.gz"
sha256 = "2814a7281989f6baa9e57bd33bbc5e148827e2721ccef22aaf28ab2b376068e8"
strip_components = 1

[depends]
# setuptools: g-ir-scanner imports distutils (removed in Python 3.13);
# the distutils-precedence.pth shim only activates if setuptools is
# installed in this package's build root, so it must be a build dep
# (PR #239: glib-gir failed with "No module named 'distutils'").
build = ["meson", "ninja", "pkgconf", "glib", "expat", "duktape", "libxcrypt", "systemd", "gobject-introspection", "glib-gir", "setuptools"]
run = ["glib", "glib-gir", "expat", "duktape", "libxcrypt", "dbus-system", "base-files", "coreutils", "systemd"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''set -eu
# Polkit 126 selects the logind library for session tracking, but its polkitd target
# does not inherit that dependency from the static backend library. The daemon
# itself includes systemd/sd-daemon.h and calls sd_notify(), so give the target
# the selected logind dependency directly (headers + link flags).
python3 - <<'PY'
from pathlib import Path

path = Path("src/polkitbackend/meson.build")
data = path.read_text(encoding="utf-8")
old = """  dependencies: libpolkit_gobject_dep,
  c_args: c_flags,
  link_with: libpolkit_backend,
"""
new = """  dependencies: [libpolkit_gobject_dep, logind_dep],
  c_args: c_flags,
  link_with: libpolkit_backend,
"""
count = data.count(old)
if count != 1:
    raise SystemExit(
        f"Polkit 126 polkitd dependency block: expected exactly one match, found {count}"
    )
path.write_text(data.replace(old, new, 1), encoding="utf-8")
PY
'''
configure = "meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dauthfw=shadow -Dsession_tracking=logind -Dpolkitd_user=polkitd -Dprivileged_group=wheel -Dos_type=lfs -Dintrospection=true -Dgettext=false -Dgtk_doc=false -Dman=false -Dexamples=false -Dtests=false -Dsystemdsystemunitdir=no"
compile = "ninja -C build"
install = '''
DESTDIR=%{pkgdir} meson install -C build
install -d -m755 %{pkgdir}/usr/lib/systemd/system
cat > %{pkgdir}/usr/lib/systemd/system/polkit.service <<'EOF'
[Unit]
Description=Authorization Manager
Documentation=man:polkit(8)
After=dbus.service
Wants=dbus.service

[Service]
Type=dbus
BusName=org.freedesktop.PolicyKit1
ExecStart=/usr/lib/polkit-1/polkitd --no-debug
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF
chmod 644 %{pkgdir}/usr/lib/systemd/system/polkit.service
install -d -m755 %{pkgdir}/usr/lib/systemd/system-preset
printf '%s\n' 'enable polkit.service' > %{pkgdir}/usr/lib/systemd/system-preset/85-polkit.preset
# Setuid programs must be root-owned on the installed system. Keep the mode
# in the archive as well; post_install reasserts ownership and mode.
chmod 4755 %{pkgdir}/usr/bin/pkexec %{pkgdir}/usr/lib/polkit-1/polkit-agent-helper-1
'''

[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user polkitd polkitd "PolicyKit daemon" /var/lib/polkit-1 /usr/bin/false
install -d -m755 -o polkitd -g polkitd /var/lib/polkit-1
chown root:root /usr/bin/pkexec /usr/lib/polkit-1/polkit-agent-helper-1
chmod 4755 /usr/bin/pkexec /usr/lib/polkit-1/polkit-agent-helper-1
'''
