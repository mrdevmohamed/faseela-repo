# xfce recipe: xfce4-systemload-plugin — System load panel plugin
[package]
name = "xfce4-systemload-plugin"
version = "1.3.3"
rel = 2
arch = ["x86_64"]
summary = "System load panel plugin (CPU, memory, swap and uptime)"
license = ["BSD-3-Clause"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-systemload-plugin/1.3/xfce4-systemload-plugin-1.3.3.tar.bz2"
sha256 = "6852d5d9c9a74d0e0db582c6f5fe7390ebe48a2eb5692177ae12e1c4ccc6efc9"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
