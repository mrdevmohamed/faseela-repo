# unity recipe: indicator-application — Panel indicator hosting application indicators
# Source: Ubuntu archive orig tarball (12.10.1+19.04.20190308.1); Ubuntu's patches are vendored under patches/.
[package]
name = "indicator-application"
version = "12.10.1"
rel = 2
arch = ["x86_64"]
summary = "Panel indicator hosting application indicators"
license = ["GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "indicator-application"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/i/indicator-application/indicator-application_12.10.1+19.04.20190308.1.orig.tar.gz"
sha256 = "f701326a6cfb6fd963d398b649353d68acdffad9f8cdcdca7a8b8cb0a60d6da2"
strip_components = 1

[depends]
build = ["pkgconf", "glib", "gtk3", "libindicator", "libappindicator", "libdbusmenu", "dbus-glib", "json-glib", "gnome-common", "unity-build-shims", "intltool", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "gtk3", "libindicator", "libappindicator", "libdbusmenu", "dbus-glib", "json-glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[assets]
include = ["patches/ubuntu-upstream.patch"]

[build]
prepare = '''set -eu
patch -p1 < %{assetsdir}/patches/ubuntu-upstream.patch
cp /usr/share/gtk-doc/data/gtk-doc.make .
'''
configure = '''export CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types"
autoreconf -fi
./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-gtk-doc --disable-introspection --with-gtk=3
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/indicators3/7/libapplication.so
'''
