# xfce recipe: lightdm-gtk-greeter — LightDM GTK+ greeter
# --disable-libindicator: no libindicator in the recipe tree; the indicators
# row is simply not built. The greeter font comes from dejavu-fonts (pulled
# by xfce-session)
[package]
name = "lightdm-gtk-greeter"
version = "2.0.9"
rel = 4
arch = ["x86_64"]
summary = "LightDM GTK+ greeter (login screen for LightDM)"
license = ["GPL-2.0-or-later"]
source = "https://github.com/Xubuntu/lightdm-gtk-greeter/releases/download/lightdm-gtk-greeter-%{version}/lightdm-gtk-greeter-%{version}.tar.gz"
sha256 = "c8fdf198aa9a3f9d0dad0b48dfe23c2277b79107e8fcfc62965290f1081f645d"
source_dir = "lightdm-gtk-greeter-%{version}"

[depends]
build = ["pkgconf", "lightdm", "gtk3", "libxklavier", "libX11", "glib", "xfce4-dev-tools"]
run = ["faseela-branding", "lightdm", "gtk3", "libxklavier", "libX11", "glib", "hicolor-icon-theme", "dejavu-fonts"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --disable-static --disable-libindicator"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
# Without --sysconfdir=/etc the greeter looked in /usr/etc/lightdm. The drop-in below
# is read from <sysconfdir>/lightdm/lightdm-gtk-greeter.conf.d/*.conf. The icon is the
# hicolor "faseela" entry (PNG sizes) from faseela-branding, used as the default avatar.
install -d -m755 %{pkgdir}/etc/lightdm/lightdm-gtk-greeter.conf.d
cat > %{pkgdir}/etc/lightdm/lightdm-gtk-greeter.conf.d/50-faseela.conf <<'GREETER'
[greeter]
background=/usr/share/backgrounds/faseela/default.png
default-user-image=#faseela
GREETER
chmod 644 %{pkgdir}/etc/lightdm/lightdm-gtk-greeter.conf.d/50-faseela.conf
'''
