# xfce recipe: libnotify — Desktop notification library
[package]
name = "libnotify"
version = "0.8.9"
rel = 1
arch = ["x86_64"]
summary = "Desktop notification library (client side of org.freedesktop.Notifications)"
license = ["LGPL-2.1-or-later"]
source = "https://download.gnome.org/sources/libnotify/0.8/libnotify-0.8.9.tar.xz"
sha256 = "c906bb084027ea512f94a60fbfc0cc8d4f17e4b4d525bed370d07a6d8714c923"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "gdk-pixbuf"]
run = ["glib", "gdk-pixbuf"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=false -D introspection=false -D man=false -D gtk_doc=false -D docbook_docs=false"
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build'''
