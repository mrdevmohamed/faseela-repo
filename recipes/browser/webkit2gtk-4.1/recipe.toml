# browser recipe: WebKitGTK 4.1 (GTK3 API) for Telegram Desktop Web Apps.
# Multimedia/GStreamer, spellchecking, AVIF/JPEG XL, WOFF2 and credential storage
# are disabled to keep the optional package buildable on Faseela's hosted runners.
# HTTPS remains enabled through libsoup3 + glib-networking/GnuTLS.
[package]
name = "webkit2gtk-4.1"
version = "2.54.2"
rel = 2
arch = ["x86_64"]
summary = "WebKitGTK 4.1 web rendering engine for GTK3 applications"
license = ["LGPL-2.1-or-later", "BSD-2-Clause", "MPL-2.0"]
source = "https://webkitgtk.org/releases/webkitgtk-%{version}.tar.xz"
sha256 = "a76345b391bef6211fb5ab6cfab2e86b285d18cda17cbb9ade595f1252b86065"
source_dir = "webkitgtk-%{version}"

[depends]
build = ["cmake", "ninja", "pkgconf", "ruby", "which", "gtk3", "glib", "cairo", "icu", "harfbuzz", "fontconfig", "freetype", "mesa", "libdrm", "libgudev", "libsoup3", "libwebp", "lcms2", "openjpeg", "sqlite", "libxml2", "libxslt", "zlib", "brotli", "libpng", "libjpeg-turbo", "gdk-pixbuf", "libepoxy", "at-spi2-core", "libxkbcommon", "wayland", "wayland-protocols", "libX11", "libXext", "libXrender", "libxcb", "libgcrypt", "libtasn1", "glib-networking"]
run = ["gcc", "glibc", "gtk3", "glib", "cairo", "icu", "harfbuzz", "fontconfig", "freetype", "mesa", "libdrm", "libgudev", "libsoup3", "glib-networking", "gnutls", "libtasn1", "nettle", "libwebp", "lcms2", "openjpeg", "sqlite", "libxml2", "libxslt", "zlib", "brotli", "libpng", "libjpeg-turbo", "gdk-pixbuf", "libepoxy", "at-spi2-core", "libxkbcommon", "wayland", "libX11", "libXext", "libXrender", "libxcb", "bubblewrap", "libgcrypt", "hicolor-icon-theme"]

[slim]
strip = false

[build]
configure = '''cmake -S . -B build -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR=lib \
  -DLIB_INSTALL_DIR=/usr/lib \
  -DCMAKE_SKIP_INSTALL_RPATH=ON \
  -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
  -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
  -DPORT=GTK \
  -DUSE_GTK4=OFF \
  -DENABLE_X11_TARGET=ON \
  -DENABLE_WAYLAND_TARGET=ON \
  -DENABLE_DOCUMENTATION=OFF \
  -DENABLE_INTROSPECTION=OFF \
  -DENABLE_MINIBROWSER=OFF \
  -DENABLE_WEBDRIVER=OFF \
  -DENABLE_GAMEPAD=OFF \
  -DENABLE_SPEECH_SYNTHESIS=OFF \
  -DENABLE_SPELLCHECK=OFF \
  -DENABLE_VIDEO=OFF \
  -DENABLE_WEB_AUDIO=OFF \
  -DENABLE_WEB_CODECS=OFF \
  -DENABLE_WEB_RTC=OFF \
  -DENABLE_MEDIA_STREAM=OFF \
  -DENABLE_MEDIA_RECORDER=OFF \
  -DUSE_AVIF=OFF \
  -DUSE_JPEGXL=OFF \
  -DUSE_WOFF2=OFF \
  -DUSE_LIBHYPHEN=OFF \
  -DUSE_LIBSECRET=OFF \
  -DUSE_LCMS=ON \
  -DUSE_LIBDRM=ON \
  -DUSE_GBM=ON \
  -DUSE_LIBBACKTRACE=OFF \
  -DUSE_SYSPROF_CAPTURE=OFF \
  -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF \
  -DUSE_SYSTEM_UNIFDEF=OFF \
  -DENABLE_BUBBLEWRAP_SANDBOX=ON \
  -DENABLE_API_TESTS=OFF \
  -DENABLE_LAYOUT_TESTS=OFF'''
compile = "ninja -C build -j2"
install = '''DESTDIR=%{pkgdir} ninja -C build install
test -e "%{pkgdir}/usr/lib/libwebkit2gtk-4.1.so" || test -e "%{pkgdir}/usr/lib/libwebkit2gtk-4.1.so.0" || {
    echo "webkit2gtk-4.1: the GTK 4.1 API library was not installed" >&2
    exit 1
}'''
