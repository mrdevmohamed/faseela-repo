# extra recipe: SBC Bluetooth audio codec library (A2DP).
[package]
name = "sbc"
version = "2.1"
rel = 1
arch = ["x86_64"]
summary = "Bluetooth low-complexity subband audio codec library"
license = ["LGPL-2.1-or-later"]
source = "https://www.kernel.org/pub/linux/bluetooth/sbc-%{version}.tar.xz"
sha256 = "426633cabd7c798236443516dfa8335b47e004b0ef37ff107e0c7ead3299fcc2"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-tools --disable-tester"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
