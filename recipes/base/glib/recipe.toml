# gui recipe: glib — Low-level core library of GNOME
# Two-stage bootstrap: gobject-introspection is built FIRST against the
# stage-1 glib (introspection disabled), then glib is rebuilt with
# introspection enabled. The build dep on gobject-introspection is
# deliberately NOT declared here: declaring it would create a
# glib -> gobject-introspection -> glib cycle, which check-recipes.py
# rejects as a hard error. Build order must be: glib (stage 1) ->
# gobject-introspection -> glib (stage 2, this recipe) -> GIR consumers.
[package]
name = "glib"
version = "2.82.2"
rel = 3
arch = ["x86_64"]
summary = "Low-level core library of GNOME"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "glib"
url = "https://download.gnome.org/sources/glib/2.82/glib-%{version}.tar.xz"
sha256 = "ab45f5a323048b1659ee0fbda5cecd94b099ab3e4b9abf26ae06aeb3e781fd63"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "libffi", "pcre2", "zlib", "util-linux", "gettext", "python-packaging"]
run = ["libffi", "pcre2", "zlib", "util-linux"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=false -D introspection=enabled -D man-pages=disabled -D documentation=false -D selinux=disabled -D sysprof=disabled -D libmount=enabled -D glib_debug=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
