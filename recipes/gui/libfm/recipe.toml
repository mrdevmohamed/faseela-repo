# gui recipe: libfm — file-management library behind PCManFM (GTK3 build)
# libfm-extra is a separate package (needed by menu-cache first); the copy this build
# installs is removed so the two packages do not own the same files.
# No Vala, libexif or gvfs here: tarball ships generated C, thumbnails/EXIF and
# trash/mount integration are simply absent. sha256 placeholder:
#   python3 scripts/fill-sha256.py -r libfm
[package]
name = "libfm"
version = "1.3.2"
rel = 2
arch = ["x86_64"]
summary = "libfm — file-management library (GTK3) used by PCManFM"
license = ["GPL-2.0-or-later", "LGPL-2.1-or-later"]
source = "https://deb.debian.org/debian/pool/main/libf/libfm/libfm_%{version}.orig.tar.xz"
sha256 = "a5042630304cf8e5d8cff9d565c6bd546f228b48c960153ed366a34e87cad1e5"
source_dir = "libfm-%{version}"

[depends]
build = ["pkgconf", "glib", "gtk3", "pango", "cairo", "menu-cache", "libfm-extra", "shared-mime-info"]
run = ["glib", "gtk3", "pango", "cairo", "menu-cache", "libfm-extra", "shared-mime-info", "adwaita-icon-theme"]

[build]
configure = '''
# intltool is not packaged (see pavucontrol): satisfy configure with stand-ins that
# live only in the source tree. intltool-merge copies input to output and drops the
# leading underscore of translatable keys (no translations: NLS is off).
stub=$PWD/.intltool-stub
mkdir -p $stub/XML
printf '#!/bin/sh\necho "intltool-update (intltool) 0.51.0"\n' > $stub/intltool-update
printf '#!/bin/sh\nexit 0\n' > $stub/intltool-extract
cat > $stub/intltool-merge <<'IM'
#!/bin/sh
in= out=
for a in "$@"; do in=$out; out=$a; done
sed -e 's/^_\([A-Za-z]*\)=/\1=/' -e 's/_\(name\|label\|tooltip\)=/\1=/g' "$in" > "$out"
IM
chmod +x $stub/intltool-update $stub/intltool-extract $stub/intltool-merge
printf 'package XML::Parser;\n$VERSION = "2.47";\n1;\n' > $stub/XML/Parser.pm
# GCC 14+ diagnoses this generated-source const mismatch as an error.
# Keep the warning visible but do not make the legacy generated C unbuildable.
CFLAGS="${CFLAGS:-} -Wno-error=incompatible-pointer-types" \
  PATH=$stub:$PATH PERL5LIB=$stub \
  ./configure --prefix=/usr --sysconfdir=/etc --disable-static --disable-nls --disable-gtk-doc --disable-demo --with-gtk=3
'''
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# libfm-extra owns its helper headers and the shared /usr/include/libfm alias.
find %{pkgdir}/usr -name 'libfm-extra*' -delete
rm -f %{pkgdir}/usr/include/libfm-1.0/fm-extra.h %{pkgdir}/usr/include/libfm-1.0/fm-version.h %{pkgdir}/usr/include/libfm-1.0/fm-xml-file.h
rm -f %{pkgdir}/usr/include/libfm
'''
