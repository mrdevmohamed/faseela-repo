# cosmic recipe: cosmic-screenshot — COSMIC screenshot service and UI.
# The session portal routes org.freedesktop.portal.Screenshot requests for
# the COSMIC desktop to this app (via xdg-desktop-portal-cosmic).
[package]
name = "cosmic-screenshot"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC screenshot tool"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-screenshot"
url = "https://codeload.github.com/pop-os/cosmic-screenshot/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "7749217855319a1bf09d041fcc3be6198df7864e52dea1f371fe1864deee5b58"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus", "xdg-desktop-portal-cosmic"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-screenshot"
install = '''
install -Dm755 target/release/cosmic-screenshot %{pkgdir}/usr/bin/cosmic-screenshot
install -Dm644 resources/com.system76.CosmicScreenshot.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicScreenshot.desktop
if [ -d resources/icons ]; then
    find resources/icons -type f | while read -r f; do
        rel=${f#resources/icons/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
