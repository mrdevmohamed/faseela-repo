# gui recipe: libblockdev — block-device and filesystem operations for UDisks2.
# Build only the filesystem and partition plugins needed for normal removable
# media. Optional RAID, LVM, encryption, NVMe and SMART plugins stay disabled.
[package]
name = "libblockdev"
version = "3.5.0"
rel = 2
arch = ["x86_64"]
summary = "Library for low-level block-device, partition and filesystem operations"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/storaged-project/libblockdev/releases/download/%{version}/libblockdev-%{version}.tar.gz"
sha256 = "bccd30e6b5d11504de60d9889ff6a2a25b07a4ec8f04070f2387e168301b3e3a"

[depends]
build = ["pkgconf", "glib", "eudev", "kmod", "util-linux", "e2fsprogs"]
run = ["glib", "eudev", "kmod", "util-linux", "e2fsprogs"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --with-part --with-fs --without-btrfs --without-crypto --without-dm --with-loop --without-lvm --without-lvm_dbus --without-mdraid --without-mpath --without-swap --without-nvdimm --without-nvme --without-smart --without-smartmontools --without-tools --without-s390 --without-python3 --without-gtk-doc --disable-introspection --disable-tests"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
