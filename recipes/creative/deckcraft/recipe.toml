# creative recipe: deckcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "deckcraft"
version = "0.14.1"
rel = 1
arch = ["x86_64"]
summary = "Native presentation editor with PowerPoint compatibility"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/deckcraft/releases/download/v0.14.1/deckcraft-0.14.1-linux-x86_64.tar.gz"
sha256 = "e86c7fa0ecb55f1a553ee425b93dcfdc806b7b3798f272b41f1d1ff74ac5c12a"
source_dir = "deckcraft-0.14.1-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland", "alsa-lib", "pipewire"]

[build]
install = """
set -eu
if [ ! -d usr/bin ]; then
    echo "deckcraft: upstream archive has no usr/bin directory" >&2
    exit 1
fi
install -d -m755 "%{pkgdir}/usr"
cp -a usr/. "%{pkgdir}/usr/"
"""
