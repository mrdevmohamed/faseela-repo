# xfce recipe: xfce4-power-manager — Xfce power manager
[package]
name = "xfce4-power-manager"
version = "4.20.1"
rel = 1
arch = ["x86_64"]
summary = "Xfce power manager (brightness, suspend, battery status service)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/xfce/xfce4-power-manager/4.20/xfce4-power-manager-4.20.1.tar.bz2"
sha256 = "4fe18ef5f89c5ca9b96dde84dbd88ca7e36af1caf70ddd6429dc72128007edf7"

[depends]
build = ["pkgconf", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "upower", "polkit", "libX11", "xorgproto"]
run = ["libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "upower", "polkit", "dbus-system"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug --enable-polkit"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
