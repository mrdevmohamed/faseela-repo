# cosmic recipe: cosmic-settings-daemon — COSMIC settings daemon.
# Applies keyboard/input/shortcuts configuration, handles system actions
# (shortcuts) and geonames timezone data. It talks to elogind (login1) and
# UPower over the session/system D-Bus buses.
[package]
name = "cosmic-settings-daemon"
version = "1.11.0"
rel = 3
arch = ["x86_64"]
summary = "COSMIC settings daemon (shortcuts, input configuration, system actions)"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-settings-daemon"
url = "https://codeload.github.com/pop-os/cosmic-settings-daemon/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "1cc494c028a59a0356547c834421495da326622f837221726c15fceb14f3f9f0"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "eudev", "libxkbcommon", "wayland", "libpulse", "pipewire"]
run = ["eudev", "libxkbcommon", "wayland", "mesa", "dbus", "upower", "elogind", "libpulse", "pipewire"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-settings-daemon"
install = '''
install -Dm755 target/release/cosmic-settings-daemon %{pkgdir}/usr/bin/cosmic-settings-daemon
# System shortcut actions live in the cosmic-config schema directory; the
# polkit rule guards the privileged system-action D-Bus methods.
# Faseela's elogind package already ships /usr/bin/busctl, so retain the
# upstream D-Bus calls unchanged. Only replace the systemd-specific suspend
# command with loginctl, which is provided by elogind.
install -d -m755 %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1
sed 's|systemctl suspend|loginctl suspend|g' \
    data/system_actions.ron \
    > %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
chmod 644 %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
if grep -q 'systemctl' %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions; then
    echo "cosmic-settings-daemon: unsupported systemctl command remains in system_actions" >&2
    exit 1
fi
grep -Fq 'busctl --user call' %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
grep -Fq 'loginctl suspend' %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
install -Dm644 data/polkit-1/rules.d/cosmic-settings-daemon.rules \
    %{pkgdir}/usr/share/polkit-1/rules.d/cosmic-settings-daemon.rules
# The geonames timezone cache is embedded in the binary (include_bytes!),
# so no separate geodata file is installed.
'''
