# browser recipe: libepoxy — OpenGL function pointer management (GTK3 draws through it)
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
#
# GLX dispatch is built in although mesa here has no GLX (see recipes/gui/mesa): GTK3's X11
# backend includes <epoxy/glx.h> unconditionally, so a libepoxy without it breaks gtk3
# ("epoxy/glx.h: No such file"). The header is self-contained (needs only libX11/xorgproto at
# build time); libGL.so.1 is dlopen()ed only when something calls a GLX function, and
# epoxy_has_glx() then just reports false. Wayland sessions use EGL (libEGL.so.1 from mesa).
[package]
name = "libepoxy"
version = "1.5.9"
rel = 2
arch = ["x86_64"]
summary = "OpenGL function pointer management library (EGL + GLX dispatch)"
license = ["MIT"]
source = "https://github.com/anholt/libepoxy/releases/download/%{version}/libepoxy-%{version}.tar.xz"
sha256 = "d168a19a6edfdd9977fef1308ccf516079856a4275cf876de688fb7927e365e4"

[depends]
build = ["meson", "ninja", "pkgconf", "mesa", "libX11", "xorgproto"]
run = ["mesa", "libX11"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=false -D docs=false -D glx=yes -D egl=yes -D x11=true"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
