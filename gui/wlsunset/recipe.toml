# gui recipe: wlsunset — e.g.  wlsunset -l 30.0 -L 31.2  (Cairo)
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r wlsunset` pins it.
[package]
name = "wlsunset"
version = "0.4.0"
rel = 1
arch = ["x86_64"]
summary = "wlsunset — day/night gamma adjustment (night light) for Wayland"
license = ["MIT"]
source = "https://git.sr.ht/~kennylevinsen/wlsunset/archive/%{version}.tar.gz"
sha256 = "a86ffb1793fe622802ec25795b69df864715986ecc175f7734e739c9e264ed72"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols"]
run = ["wayland"]

[build]
configure = '''
opts=
for o in man-pages; do
    if grep -qs "'$o'" meson_options.txt; then opts="$opts -D $o=disabled"; fi
done
meson setup build --prefix=/usr --libdir=lib --buildtype=release $opts
'''
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
