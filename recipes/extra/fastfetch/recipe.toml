# extra recipe: Fastfetch, branded for Faseela.
# Local config and logo files live beside this recipe and are staged by Nawa assets.
[package]
name = "fastfetch"
version = "2.30.1"
rel = 2
arch = ["x86_64"]
summary = "Fastfetch — system information tool with Faseela branding"
license = ["MIT"]
# Fail closed on Nawa versions that predate the recipe-local assets schema.
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "fastfetch"
url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/%{version}.tar.gz"
sha256 = "5248311a3d8ce65f6f48756dfc0df9f8922d64f5201ee8d980497d52e924906e"
strip_components = 1

[assets]
include = ["config.jsonc", "logos/faseela.txt"]

[depends]
build = ["cmake", "pkgconf"]
run = []

[build]
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTS=OFF"
compile = "cmake --build build -j %{jobs}"
install = '''
DESTDIR=%{pkgdir} cmake --install build
install -Dm644 "%{assetsdir}/config.jsonc" "%{pkgdir}/etc/xdg/fastfetch/config.jsonc"
install -Dm644 "%{assetsdir}/logos/faseela.txt" "%{pkgdir}/usr/share/fastfetch/logos/faseela.txt"
'''
