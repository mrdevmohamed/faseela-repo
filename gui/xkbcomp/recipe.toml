# gui recipe: xkbcomp — X.Org XKB keyboard description compiler
# Xwayland invokes xkbcomp at startup to compile the configured keyboard map.
[package]
name = "xkbcomp"
version = "1.5.0"
rel = 1
arch = ["x86_64"]
summary = "X.Org XKB keyboard description compiler"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/app/xkbcomp-%{version}.tar.xz"
sha256 = "2ac31f26600776db6d9cd79b3fcd272263faebac7eb85fb2f33c7141b8486060"
source_dir = "xkbcomp-%{version}"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libxkbfile"]
run = ["libX11", "libxkbfile"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
