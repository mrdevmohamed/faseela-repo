# extra recipe: zsh — no PCRE (zsh 5.9 only knows PCRE1; pcre2 is what we ship).
# CFLAGS downgrade two GCC 14 errors that zsh 5.9's old configure trips over (no-op on older gcc).
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r zsh` pins it.
[package]
name = "zsh"
version = "5.9.2"
rel = 1
arch = ["x86_64"]
summary = "zsh — powerful interactive shell"
license = ["MIT-Modern-Variant"]
source = "https://www.zsh.org/pub/zsh-%{version}.tar.xz"
sha256 = "36fa734374b44783582cec09bcd67822e2f992c779ec1624ab5596df078d2f81"

[depends]
build = ["ncurses"]
run = ["ncurses"]

[build]
configure = '''
CFLAGS="-O2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion" \
./configure --prefix=/usr --sysconfdir=/etc/zsh --enable-etcdir=/etc/zsh --enable-multibyte --enable-function-subdirs --with-tcsetpgrp --disable-pcre
'''
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"

[hooks]
post_install = '''
grep -qx /usr/bin/zsh /etc/shells 2>/dev/null || echo /usr/bin/zsh >> /etc/shells
echo "zsh: make it your login shell with:  chsh -s /usr/bin/zsh"
'''
