# gui recipe: libdisplay-info — EDID and DisplayID library
[package]
name = "libdisplay-info"
version = "0.2.0"
rel = 2
arch = ["x86_64"]
summary = "EDID and DisplayID library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libdisplay-info"
url = "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/%{version}/libdisplay-info-%{version}.tar.gz"
sha256 = "f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "hwdata"]
run = ["hwdata"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
