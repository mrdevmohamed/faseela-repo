# extra recipe: bash-completion — loaded by /etc/profile.d/bash_completion.sh.
# Interactive bash picks it up from /etc/bash.bashrc or ~/.bashrc: `. /usr/share/bash-completion/bash_completion`.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r bash-completion` pins it.
[package]
name = "bash-completion"
version = "2.14.0"
rel = 1
arch = ["x86_64"]
summary = "Programmable completion for bash"
license = ["GPL-2.0-or-later"]
source = "https://github.com/scop/bash-completion/releases/download/%{version}/bash-completion-%{version}.tar.xz"
sha256 = "5c7494f968280832d6adb5aa19f745a56f1a79df311e59338c5efa6f7285e168"

[depends]
build = []
run = ["bash"]

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
