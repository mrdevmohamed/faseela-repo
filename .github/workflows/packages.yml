name: Build packages

# Builds the packages of this repository and publishes the signed schema-v5
# repository `stable-v5`:
#
#   nawa upgrade --repo https://github.com/<PKG_REPO>/releases/download/stable-v5
#
# Package archives live in the immutable `packages-v5-NNNN` releases; `stable-v5`
# carries only the signed index. This repository must be PUBLIC for the URLs to work
# without a token. Publishing uses this workflow's GITHUB_TOKEN (contents: write).
#
# One-time setup (Settings > Secrets and variables > Actions):
#   secret   NAWA_SIGN_KEY_B64   base64 of nawa.sec
#   variable DISTRO_REPO         distribution repository (default mrdevmohamed/faseela)
#   variable DISTRO_REF          distribution tooling ref (default master)
#

# PACKAGE SELECTION (Actions > Build packages > Run workflow)
#   all   all recipe categories except toolchain
#   base + system + boot + extra can be selected by ticking those four category boxes
#   category boxes include Xorg, Xfce and peripherals
#   optional applications can be selected by exact package name; desktop image profiles are iso-sway and iso-xfce
#   toolchain      rebuild the full Toolchain using Faseela Bootstrap Stage 3
#   toolchain_packages  rebuild selected Toolchain recipe names, e.g. glibc gcc
#   packages       exact recipe names; Toolchain names are rerouted to Bootstrap
#   flavors        multiple names from flavors.toml, separated by spaces or commas
#   exclude        recipe names or @categories removed from selected targets
# Selectors are additive. Pushes automatically select recipes changed by that push.
# ALL discovers categories from recipes, so new non-toolchain categories join automatically.
# GitHub Actions has no dynamic multi-select input: checkboxes select categories,
# while the packages/flavors text fields accept any number of names.

# HOW A RUN WORKS
#   push to main   selects EVERY recipe; whatever stable-v5 already publishes is skipped,
#                  so only new or bumped recipes are built, then the result is published.
#   pull request   builds only the recipes the PR changes (verification, never publishes).
#   manual         the selection below; publishes too when run on main.
#
#   select      which packages
#   plan        drops what stable-v5 already publishes and splits the rest into waves of
#               dependency levels (scripts/plan-build-shards.py); the shards of a wave
#               run in parallel as a matrix, each with its own 6 h limit
#   build-w0    Bootstrap Toolchain targets (only when they are not published yet)
#   build-w1..8 package shards; archives pass between waves as workflow artifacts
#               (built-<shard>); a failing package never stops the others
#   publish     main only, and only when nothing failed: gathers the artifacts and the
#               already published archives, signs and checks the COMPLETE set and
#               publishes it. A failed run publishes nothing: stable-v5 never goes partial.
# "Re-run failed jobs" repeats only the failed shards. One shard is built by
# .github/workflows/packages-build.yml.
#
# Build environment: the rootfs of the newest release of DISTRO_REPO
#   seed  faseela-x86_64-rootfs.tar.zst         the full system incl. rust (always used:
#         every shard compiles the recipe-pinned nawa)

on:
  push:
    branches: [main, master]
    paths: ["recipes/**", "groups.toml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "recipes/**"
      - ".github/workflows/packages.yml"
      - ".github/workflows/packages-build.yml"
      - "flavors.toml"
      - "scripts/flavor.py"
  workflow_dispatch:
    inputs:
      all:
        description: "WARNING: Selects every non-toolchain package (hundreds). For a few changes, use Packages instead."
        type: boolean
        default: false
      base:
        description: "Select every package in the base category"
        type: boolean
        default: false
      system:
        description: "Select every package in the system category"
        type: boolean
        default: false
      boot:
        description: "Select every package in the boot category"
        type: boolean
        default: false
      extra:
        description: "Select every package in the extra category"
        type: boolean
        default: false
      gui:
        description: "Select every package in the GUI category"
        type: boolean
        default: false
      xorg:
        description: "Select every package in the X.Org category"
        type: boolean
        default: false
      xfce:
        description: "Select every package in the Xfce category"
        type: boolean
        default: false
      peripherals:
        description: "Select optional hardware integrations such as the Huion tablet control panel"
        type: boolean
        default: false
      browser:
        description: "Select every package in the browser category"
        type: boolean
        default: false
      media:
        description: "Select every package in the media category"
        type: boolean
        default: false
      creative:
        description: "Select every package in the creative category"
        type: boolean
        default: false
      security:
        description: "Select every ProjectDiscovery security tool package"
        type: boolean
        default: false
      toolchain:
        description: "Rebuild the FULL Toolchain through Bootstrap Stage 3 (safe self-hosting path)"
        type: boolean
        default: false
      packages:
        description: "Exact recipe names; Toolchain names are automatically routed through Bootstrap"
        type: string
        default: ""
      toolchain_packages:
        description: "Selected Toolchain recipe names, e.g. glibc gcc (rebuilt with Bootstrap dependency ordering)"
        type: string
        default: ""
      flavors:
        description: "One or more flavor names from flavors.toml, separated by spaces or commas"
        type: string
        default: ""
      exclude:
        description: "Optional package names or @categories to remove from selected targets"
        type: string
        default: ""
      dry_run:
        description: "Resolve and display the package plan without downloading or building anything"
        type: boolean
        default: false
      rootfs:
        description: "Build environment (always the seed rootfs)"
        type: choice
        options: [auto, seed]
        default: auto
      isolation:
        description: "nawa build isolation"
        type: choice
        options: [sandbox, env, closure, none]
        default: sandbox
      budget:
        description: "Minutes after which no NEW package is started (the hard limit of a run is 6 h)"
        type: string
        default: "270"
      keep_going:
        description: "Keep building the other packages when one fails"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # select from the last successfully published push, not only the latest push event

# Only one publisher may rewrite the signed index at a time. GitHub may replace
# an older pending run; the selector below therefore diffs from the last
# successful push run so the surviving run includes every unpublished recipe change.
concurrency:
  group: ${{ github.ref == 'refs/heads/feat/cosmic-desktop-support' && 'packages-cosmic-epoch' || (github.event_name == 'pull_request' && format('packages-pr-{0}', github.event.pull_request.number) || 'packages-publish') }}
  cancel-in-progress: false

jobs:
  select:
    name: which packages
    runs-on: ubuntu-24.04
    outputs:
      pkgs: ${{ steps.s.outputs.pkgs }}
      toolchain_pkgs: ${{ steps.s.outputs.toolchain_pkgs }}
      toolchain_all: ${{ steps.s.outputs.toolchain_all }}
      rootfs: ${{ steps.s.outputs.rootfs }}
      dry_run: ${{ steps.s.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit schema-v5 metadata across every recipe
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/schema-v5-metadata.json"
          python3 -I scripts/audit-schema-v5-metadata.py --recipes recipes --json "$report"
          python3 -I - "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = Path(sys.argv[2])
          lines = [
              "## Schema-v5 metadata audit",
              "",
              f"- Recipes audited: **{report['recipe_count']}**",
              f"- Missing declarations: **{report['missing_count']}**",
              f"- Missing by field: `{report['missing_by_field']}`",
              f"- Invalid declarations/references: **{report['error_count']}**",
              f"- Relation entries: `{report['relation_entries']}`",
              "",
              "This is report-only until every recipe has been reviewed; missing metadata is never inferred as an empty list.",
          ]
          summary.open("a", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
      - id: s
        env:
          INPUT_ALL: ${{ inputs.all }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_SYSTEM: ${{ inputs.system }}
          INPUT_BOOT: ${{ inputs.boot }}
          INPUT_EXTRA: ${{ inputs.extra }}
          INPUT_GUI: ${{ inputs.gui }}
          INPUT_XORG: ${{ inputs.xorg }}
          INPUT_XFCE: ${{ inputs.xfce }}
          INPUT_BROWSER: ${{ inputs.browser }}
          INPUT_MEDIA: ${{ inputs.media }}
          INPUT_CREATIVE: ${{ inputs.creative }}
          INPUT_PERIPHERALS: ${{ inputs.peripherals }}
          INPUT_SECURITY: ${{ inputs.security }}
          INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
          INPUT_TOOLCHAIN_PACKAGES: ${{ inputs.toolchain_packages }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_FLAVORS: ${{ inputs.flavors }}
          INPUT_EXCLUDE: ${{ inputs.exclude }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ROOTFS: ${{ inputs.rootfs || 'auto' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/package-selection.json"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Select every recipe: the planner skips what stable-v5 already
            # publishes, so the run builds exactly what is missing. There is no
            # "since the last successful run" bookkeeping to get wrong.
            toolchain_names="$(find recipes/toolchain -mindepth 2 -maxdepth 2 -name recipe.toml -printf '%h\n' \
              | xargs -r -n1 basename | sort | paste -sd ' ' -)"
            python3 -I scripts/select-packages.py \
              --recipes recipes --flavors-file flavors.toml \
              --all --toolchain-packages "$toolchain_names" --output "$selection"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::pull request base/head SHA is invalid"; exit 1;
            }
            git cat-file -e "$base^{commit}" 2>/dev/null || {
              echo "::error::cannot resolve pull request base commit $base"; exit 1;
            }
            git cat-file -e "$head^{commit}" 2>/dev/null || {
              echo "::error::cannot resolve pull request head commit $head"; exit 1;
            }
            git merge-base --is-ancestor "$base" "$head" || {
              echo "::error::pull request head is not based on the supplied base commit"; exit 1;
            }
            echo "Pull request verification: selecting only recipes changed between $base and $head."
            python3 -I scripts/select-packages.py \
              --recipes recipes --flavors-file flavors.toml \
              --changed-from "$base" --changed-to "$head" \
              --output "$selection"
          else
            categories=()
            [[ "$INPUT_BASE" == true ]] && categories+=(base)
            [[ "$INPUT_SYSTEM" == true ]] && categories+=(system)
            [[ "$INPUT_BOOT" == true ]] && categories+=(boot)
            [[ "$INPUT_EXTRA" == true ]] && categories+=(extra)
            [[ "$INPUT_GUI" == true ]] && categories+=(gui)
            [[ "$INPUT_XORG" == true ]] && categories+=(xorg)
            [[ "$INPUT_XFCE" == true ]] && categories+=(xfce)
            [[ "$INPUT_BROWSER" == true ]] && categories+=(browser)
            [[ "$INPUT_MEDIA" == true ]] && categories+=(media)
            [[ "$INPUT_CREATIVE" == true ]] && categories+=(creative)
            [[ "$INPUT_PERIPHERALS" == true ]] && categories+=(peripherals)
            [[ "$INPUT_SECURITY" == true ]] && categories+=(security)

            args=()
            [[ "$INPUT_ALL" == true ]] && args+=(--all)
            [[ "$INPUT_TOOLCHAIN" == true ]] && args+=(--toolchain-all)
            (( ${#categories[@]} == 0 )) || args+=(--categories "${categories[@]}")
            args+=(--packages "$INPUT_PACKAGES" --toolchain-packages "$INPUT_TOOLCHAIN_PACKAGES" \
              --flavors "$INPUT_FLAVORS" --exclude "$INPUT_EXCLUDE")
            python3 -I scripts/select-packages.py \
              --recipes recipes --flavors-file flavors.toml "${args[@]}" \
              --output "$selection"
          fi
          mapfile -t selected < <(python3 - "$selection" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(" ".join(data["packages"]))
          print(" ".join(data["toolchain_packages"]))
          print("true" if data["toolchain_all"] else "false")
          PY
          )
          pkgs="${selected[0]:-}"
          toolchain_pkgs="${selected[1]:-}"
          toolchain_all="${selected[2]:-false}"

          for p in $pkgs; do
            [[ "$p" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "::error::bad package name '$p'"; exit 1; }
            compgen -G "recipes/*/$p/recipe.toml" >/dev/null || { echo "::error::no recipe named '$p'"; exit 1; }
            [[ ! -f "recipes/toolchain/$p/recipe.toml" ]] || {
              echo "::error::$p is a Toolchain recipe and cannot enter the ordinary package build"; exit 1;
            }
          done
          for p in $toolchain_pkgs; do
            [[ "$p" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "::error::bad Toolchain package name '$p'"; exit 1; }
            [[ -f "recipes/toolchain/$p/recipe.toml" ]] || {
              echo "::error::$p is not a recipe under recipes/toolchain"; exit 1;
            }
          done
          [[ "$toolchain_all" == true || "$toolchain_all" == false ]] || {
            echo "::error::invalid Toolchain selection mode"; exit 1;
          }

          # Every shard compiles the recipe-pinned Nawa, which needs the Rust toolchain:
          # the build environment is always the seed rootfs.
          [[ "$INPUT_ROOTFS" != min ]] || {
            echo "::error::the pinned Nawa is compiled in every shard and needs the seed rootfs; choose rootfs=auto or seed"
            exit 1
          }
          rootfs=seed
          dry_run="${INPUT_DRY_RUN:-false}"
          {
            echo "pkgs=$pkgs"
            echo "toolchain_pkgs=$toolchain_pkgs"
            echo "toolchain_all=$toolchain_all"
            echo "rootfs=$rootfs"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          python3 - "$selection" "$pkgs" "$toolchain_pkgs" "$toolchain_all" "$rootfs" "$dry_run" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          regular = sys.argv[2].split()
          toolchain = sys.argv[3].split()
          print(f"### Package selection: {len(regular)} regular + {len(toolchain)} Toolchain target(s)")
          print(f"Source: `{data['source']}`")
          for category, count in data["category_counts"].items():
              print(f"- {category}: {count}")
          if data["excluded_count"]:
              print(f"- Excluded: {', '.join(data['excluded'])}")
          mode = "FULL Bootstrap rebuild" if sys.argv[4] == "true" else ("Selective Bootstrap rebuild" if toolchain else "Not selected")
          print(f"- Toolchain mode: {mode}")
          print(f"- RootFS: `{sys.argv[5]}`")
          print(f"- Mode: {'DRY RUN (no build started)' if sys.argv[6] == 'true' else 'Build'}")
          print()
          print("Regular package targets:")
          print("`" + " ".join(regular) + "`" if regular else "`none`")
          print()
          print("Bootstrap Toolchain targets:")
          print("`" + " ".join(toolchain) + "`" if toolchain else "`none`")
          PY


  # A full build takes longer than one runner may run (6 h), so the build is split by
  # scripts/plan-build-shards.py into waves of dependency levels; the shards of a wave
  # run in parallel (matrix, fail-fast off) on their own runners and hand their archives
  # to the next waves and to the publish job as workflow artifacts.
  plan:
    name: plan shards
    needs: select
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.select.outputs.pkgs != '' || needs.select.outputs.toolchain_pkgs != '') && needs.select.outputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      toolchain_done: ${{ steps.p.outputs.toolchain_done }}
      todo_count: ${{ steps.p.outputs.todo_count }}

      wave0: ${{ steps.p.outputs.wave0 }}
      wave0_count: ${{ steps.p.outputs.wave0_count }}
      wave1: ${{ steps.p.outputs.wave1 }}
      wave1_count: ${{ steps.p.outputs.wave1_count }}
      wave2: ${{ steps.p.outputs.wave2 }}
      wave2_count: ${{ steps.p.outputs.wave2_count }}
      wave3: ${{ steps.p.outputs.wave3 }}
      wave3_count: ${{ steps.p.outputs.wave3_count }}
      wave4: ${{ steps.p.outputs.wave4 }}
      wave4_count: ${{ steps.p.outputs.wave4_count }}
      wave5: ${{ steps.p.outputs.wave5 }}
      wave5_count: ${{ steps.p.outputs.wave5_count }}
      wave6: ${{ steps.p.outputs.wave6 }}
      wave6_count: ${{ steps.p.outputs.wave6_count }}
      wave7: ${{ steps.p.outputs.wave7 }}
      wave7_count: ${{ steps.p.outputs.wave7_count }}
      wave8: ${{ steps.p.outputs.wave8 }}
      wave8_count: ${{ steps.p.outputs.wave8_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      PKGS: ${{ needs.select.outputs.pkgs }}
      TOOLCHAIN_PKGS: ${{ needs.select.outputs.toolchain_pkgs }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the waves and shards
        id: p
        run: |
          set -euo pipefail
          # What stable-v5 already publishes is up to date and is not built again.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 -I scripts/distributed-releases.py list \
            --releases-json "$RUNNER_TEMP/releases.json" --stable-tag stable-v5 --index-version 5 > "$RUNNER_TEMP/published.tsv"
          python3 -I scripts/plan-build-shards.py plan --recipes recipes \
            --pkgs "$PKGS" --toolchain-pkgs "$TOOLCHAIN_PKGS" \
            --published "$RUNNER_TEMP/published.tsv" \
            --times scripts/build-times.json --output "$RUNNER_TEMP/plan.json"
          python3 -I scripts/plan-build-shards.py emit --plan "$RUNNER_TEMP/plan.json" --github-output "$GITHUB_OUTPUT"
          python3 -I scripts/plan-build-shards.py summary --plan "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

  build-w0:
    name: Bootstrap Toolchain
    needs: [select, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave0_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.keep_going || !contains(needs.*.result, 'failure')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave0) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

  build-w1:
    name: wave 1
    needs: [select, plan, build-w0]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave1_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.keep_going || !contains(needs.*.result, 'failure')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave1) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

  build-w2:
    name: wave 2
    needs: [select, plan, build-w0, build-w1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave2_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.keep_going || !contains(needs.*.result, 'failure')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave2) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

  build-w3:
    name: wave 3
    needs: [select, plan, build-w0, build-w1, build-w2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave3_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.keep_going || !contains(needs.*.result, 'failure')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave3) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

  build-w4:
    name: wave 4
    needs: [select, plan, build-w0, build-w1, build-w2, build-w3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wave4_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.keep_going || !contains(needs.*.result, 'failure')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave4) }}
    uses: ./.github/workflows/packages-build.yml
    secrets: inherit
    with:
      shard_id: ${{ matrix.id }}
      shard_pkgs: ${{ matrix.pkgs }}
      shard_needs: ${{ matrix.needs }}
      shard_waits: ${{ matrix.waits }}
      toolchain_pkgs: ${{ needs.select.outputs.toolchain_pkgs }}
      toolchain_all: ${{ needs.select.outputs.toolchain_all }}
      rootfs_kind: ${{ needs.select.outputs.rootfs }}
      rootfs_requested: ${{ inputs.rootfs || 'auto' }}
      isolation: ${{ inputs.isolation || 'sandbox' }}
      budget: ${{ github.event_name == 'pull_request' && '300' || inputs.budget || '270' }}
      keep_going: ${{ github.event_name == 'workflow_dispatch' && !inputs.keep_going && '0' || '1' }}
      toolchain_done: ${{ needs.plan.outputs.toolchain_done }}

  build-w5:
    name: wave 5
