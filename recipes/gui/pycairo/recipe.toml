# gui recipe: pycairo — Python bindings for the cairo graphics library
[package]
name = "pycairo"
version = "1.29.2"
rel = 2
arch = ["x86_64"]
summary = "Python bindings for the cairo graphics library"
license = ["LGPL-2.1-only", "MPL-1.1"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "pycairo"
url = "https://files.pythonhosted.org/packages/bb/5e/19ab2572981a996ce96b853a189d2dcced40506b67d9555a7568457abcf2/pycairo-%{version}.tar.gz"
