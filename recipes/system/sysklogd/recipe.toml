# system recipe: Syslog daemon and logger
[package]
name = "sysklogd"
version = "2.7.2"
rel = 3
arch = ["x86_64"]
summary = "Syslog daemon and logger"
license = ["BSD-3-Clause", "GPL-2.0"]
source = "https://github.com/troglobit/sysklogd/releases/download/v2.7.2/sysklogd-2.7.2.tar.gz"
sha256 = "bc410ca64551a11fac6518b418fb6b8afbd888a70af2c5eb353334a706727bca"

[depends]
build = []
run = []

[build]
# logger(1) belongs to util-linux (one owner per file: nawa refuses to install
# sysklogd otherwise, "file conflicts ... /usr/bin/logger (owned by util-linux)").
# sysklogd's own logger is left out; the install step then checks it really is.
configure = "./configure --prefix=/usr --sysconfdir=/etc --without-logger"
compile = "make -j%{jobs}"
# upstream installs no /etc/syslog.conf here; without one syslogd falls back to
# its built-in defaults, so ship a small one
install = '''
make DESTDIR=%{pkgdir} install && test ! -e %{pkgdir}/usr/bin/logger
install -d -m755 %{pkgdir}/etc
[ -e %{pkgdir}/etc/syslog.conf ] || cat > %{pkgdir}/etc/syslog.conf <<'CONF'
# /etc/syslog.conf — sysklogd; a leading '-' means do not fsync every line
kern.*                  -/var/log/kern.log
auth,authpriv.*         /var/log/auth.log
*.*;auth,authpriv.none  -/var/log/syslog
CONF
chmod 644 %{pkgdir}/etc/syslog.conf
'''
