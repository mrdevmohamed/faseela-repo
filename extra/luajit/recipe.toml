# extra recipe: luajit — just-in-time compiler for Lua 5.1 (OpenResty fork)
# Neovim needs LuaJIT (or Lua 5.1 + bit); the OpenResty fork is built from a tagged release,
# because upstream LuaJIT has no release tarballs. Provides luajit.pc and libluajit-5.1.so.
[package]
name = "luajit"
version = "2.1-20250117"
rel = 1
arch = ["x86_64"]
summary = "luajit — just-in-time compiler for Lua 5.1 (OpenResty fork)"
license = ["MIT"]
source = "https://github.com/openresty/luajit2/archive/refs/tags/v%{version}.tar.gz"
sha256 = "68ff3dc2cc97969f7385679da7c9ff96738aa9cc275fa6bab77316eb3340ea8e"
source_dir = "luajit2-%{version}"

[depends]
build = []
run = []

[build]
compile = """
# The tag archive has no git metadata; LuaJIT derives its version from .relver.
echo 1737090214 > .relver
make -j%{jobs} PREFIX=/usr amalg
"""
install = """
make DESTDIR=%{pkgdir} PREFIX=/usr install
ln -sf luajit-2.1.1737090214 %{pkgdir}/usr/bin/luajit
"""
