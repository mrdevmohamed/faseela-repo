# xfce recipe: ristretto — Xfce image viewer
[package]
name = "ristretto"
version = "0.13.3"
rel = 1
arch = ["x86_64"]
summary = "Xfce image viewer (fast browsing, rotate, slideshow)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/apps/ristretto/0.13/ristretto-0.13.3.tar.bz2"
sha256 = "5b9172ef704ae192a5338df6bee4e91a59edc65618c375bb4433ffb38e2126cb"

[depends]
build = ["pkgconf", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "cairo", "libexif"]
run = ["libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "cairo", "libexif", "shared-mime-info", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
