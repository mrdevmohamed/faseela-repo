# flatpak recipe: Flatpak runtime, libflatpak API, OSTree integration and system helper.
# System installations are authorized by Polkit through a system-D-Bus activated
# helper. Faseela runs systemd and logind; the helper is started by D-Bus activation, so no
# systemd unit or generator is installed.
[package]
name = "flatpak"
version = "1.18.4"
rel = 3
arch = ["x86_64"]
summary = "Application sandbox framework, CLI and libflatpak"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "flatpak"
url = "https://github.com/flatpak/flatpak/releases/download/%{version}/flatpak-%{version}.tar.xz"
sha256 = "b899a7a00c48d2c626cb8ec33fe556720b376c25805d7222430c0fdca4c6ac8d"
strip_components = 1

[assets]
include = ["assets/flathub.flatpakrepo"]

[depends]
build = ["meson", "ninja", "pkgconf", "python-pyparsing", "bison", "gettext", "glib", "libarchive", "curl", "libxml2", "libcap", "json-glib", "appstream", "ostree", "gpgme", "fuse3", "libseccomp", "polkit", "libXau", "bubblewrap", "xdg-dbus-proxy", "p11-kit", "zstd", "gdk-pixbuf"]
run = ["glib", "libarchive", "curl", "libxml2", "libcap", "json-glib", "appstream", "ostree", "gpgme", "gnupg", "fuse3", "libseccomp", "polkit", "dbus-system", "p11-kit", "bubblewrap", "xdg-dbus-proxy", "zstd", "libXau", "gdk-pixbuf"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --libexecdir=/usr/libexec --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dsystemd=disabled -Dsystemdsystemunitdir=no -Dsystemdsystemenvgendir=no -Dsystemduserunitdir=no -Dsystemduserenvgendir=no -Dsysusersdir=/usr/share/flatpak/nosystemd -Dtmpfilesdir=/usr/share/flatpak/nosystemd -Dsystem_helper=enabled -Dsystem_helper_user=flatpak -Dprivileged_group=wheel -Dsystem_install_dir=/var/lib/flatpak -Dsystem_bubblewrap=bwrap -Dsystem_dbus_proxy=xdg-dbus-proxy -Dsystem_fusermount=/usr/bin/fusermount3 -Ddbus_config_dir=/usr/share/dbus-1/system.d -Ddbus_service_dir=/usr/share/dbus-1/system-services -Drun_media_dir=/run/media -Dauto_sideloading=false -Dgdm_env_file=false -Dgir=disabled -Dgtkdoc=disabled -Ddocbook_docs=disabled -Dman=disabled -Dtests=false -Dinstalled_tests=false -Dselinux_module=disabled -Ddconf=disabled -Dmalcontent=disabled -Dxauth=enabled -Dwayland_security_context=disabled -Dseccomp=enabled"
compile = "ninja -C build"
install = '''
set -eu
DESTDIR=%{pkgdir} meson install -C build
# The only system-helper activation path on Faseela is system D-Bus. Remove
# the upstream systemd unit hint so dbus-daemon executes the helper directly.
service=%{pkgdir}/usr/share/dbus-1/system-services/org.freedesktop.Flatpak.SystemHelper.service
test -s "$service"
sed -i '/^SystemdService=/d' "$service"
grep -Fqx 'Name=org.freedesktop.Flatpak.SystemHelper' "$service"
grep -Fqx 'Exec=/usr/libexec/flatpak-system-helper' "$service"
grep -Fqx 'User=root' "$service"
# Discard systemd-only unit/sysusers/tmpfiles artifacts generated by Meson.
rm -rf %{pkgdir}/usr/share/flatpak/nosystemd
rm -f %{pkgdir}/usr/share/flatpak/systemd-disabled/flatpak-system-helper.service
rm -rf %{pkgdir}/usr/share/flatpak/systemd-disabled
# Ship Flathub's official remote descriptor and signing key as a static
# system-wide source. COSMIC Store embeds the same descriptor for user scope.
install -Dm644 %{assetsdir}/assets/flathub.flatpakrepo \
    %{pkgdir}/usr/share/flatpak/remotes.d/flathub.flatpakrepo
install -d -m755 %{pkgdir}/var/lib/flatpak
'''
[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user flatpak flatpak "Flatpak system helper" /nonexistent /usr/bin/false
install -d -m755 -o root -g root /var/lib/flatpak
# Flathub is not imported here: the hook runs in a chroot without /proc or /dev
# (mkflavor, image builds), where OSTree cannot create /var/lib/flatpak/repo and
# a failing hook aborts the install. The signed descriptor shipped in
# /usr/share/flatpak/remotes.d is Flatpak's static system-wide remote source.
'''
