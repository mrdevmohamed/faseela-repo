# xorg recipe: libXmu — X11 miscellaneous utility library
[package]
name = "libXmu"
version = "1.2.1"
rel = 2
arch = ["x86_64"]
summary = "X11 miscellaneous utility library (libXmu and libXmuu)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.2.1.tar.xz"
sha256 = "fcb27793248a39e5fcc5b9c4aec40cc0734b3ca76aac3d7d1c264e7f7e14e8b2"

[depends]
build = ["pkgconf", "libXt", "libXext", "libX11", "xorgproto"]
run = ["libXt", "libXext", "libX11"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
