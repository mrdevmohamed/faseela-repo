# gui recipe: grim — PNG only (libjpeg is not packaged).
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r grim` pins it.
[package]
name = "grim"
version = "1.4.1"
rel = 1
arch = ["x86_64"]
summary = "Screenshot tool for Wayland (PNG, with slurp for regions)"
license = ["MIT"]
source = "https://git.sr.ht/~emersion/grim/refs/download/v%{version}/grim-%{version}.tar.gz"
sha256 = "93dbbc6608ae541a209c82d7e3cf1035d93844b99d2e40592d0b355f088d9ac5"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols", "pixman", "libpng"]
run = ["wayland", "pixman", "libpng"]

[build]
configure = '''
opts=
for o in man-pages jpeg; do
    if grep -qs "'$o'" meson_options.txt; then opts="$opts -D $o=disabled"; fi
done
meson setup build --prefix=/usr --libdir=lib --buildtype=release $opts
'''
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
