# gui recipe: xdg-user-dirs — manages ~/Desktop, ~/Downloads, ... directories
# xdg-user-dirs-update (started once per session by gui-session) creates the
# well-known directories and keeps ~/.config/user-dirs.dirs in sync with the
# locale. 0.20 builds with meson; systemd is not found (and not used) on this
# runit system, docs need the xml toolchain, and nls is off together with the
# rest of the gettext stack (user-dirs.defaults stays English).
[package]
name = "xdg-user-dirs"
version = "0.20"
rel = 1
arch = ["x86_64"]
summary = "xdg-user-dirs — well-known user directories (~/Desktop, ~/Downloads, ...)"
license = ["GPL-2.0-only"]
source = "https://deb.debian.org/debian/pool/main/x/xdg-user-dirs/xdg-user-dirs_%{version}.orig.tar.xz"
sha256 = "b8e34286278f4fef3e1bfe9685c395ccc0eb50c14d3a2fb4953dd00fbfd3af39"
source_dir = "xdg-user-dirs-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf"]
run = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D docs=false -D nls=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
