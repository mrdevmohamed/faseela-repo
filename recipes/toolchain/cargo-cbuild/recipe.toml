# toolchain recipe: cargo-cbuild — Cargo subcommand to build and install C-ABI libraries
#
# librsvg's meson.build requires cargo-cbuild >= 0.10.10 (find_program
# 'cargo-cbuild'). The crate itself is named `cargo-c` on crates.io; the
# binary it ships is cargo-cbuild (plus cargo-capi, cargo-cinstall,
# cargo-ctest), which is what cargo looks for as a subcommand.
#
# Version pin: cargo-c versions track the cargo library API
# (0.10.22+cargo-0.96.0 needs cargo 0.96.0), and the repo's rust is 1.96.1
# (cargo 1.96.0), so 0.10.22 is the matching release. The `+` is valid
# semver build metadata and the crates.io download endpoint accepts it
# literally (verified by download).
#
# BUILD NOTE (PR #237, run 46113938187): the `cargo` library crate pulls
# in libgit2-sys and libssh2-sys, which link the SYSTEM libgit2/libssh2
# via pkg-config by default. That breaks the build in two places, because
# nawa enforces a package's run deps whenever it is installed into a
# rootfs: the Bootstrap Toolchain job installs cargo-cbuild into the
# bootstrap rootfs, and every wave shard installs the toolchain the same
# way — and neither rootfs has libgit2/libssh2 installed (they are ordinary
# packages built by the waves, not base packages). Both -sys crates honor
# an opt-out env var, so the build below vendors libgit2/libssh2 instead
# (statically linked from the crates' bundled C sources, no pkg-config,
# no system libs at build or run time). The run deps therefore list only
# glibc/openssl/curl/zlib, which the seed rootfs already provides.
[package]
name = "cargo-cbuild"
version = "0.10.22+cargo-0.96.0"
rel = 3
arch = ["x86_64"]
summary = "Cargo subcommand to build and install C-ABI compatible libraries"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"
workdir = "."

[[package.sources]]
name = "cargo-c"
url = "https://crates.io/api/v1/crates/cargo-c/%{version}/download"
sha256 = "608749b7bc6c26638c676215e35603a8eeff40d87feb7d65375b0445a110a1c8"
into = "."
strip_components = 1

[depends]
build = ["rust", "openssl", "curl", "zlib"]
run = ["glibc", "openssl", "curl", "zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[fetch.cargo]
dir = "."

[build]
compile = "LIBGIT2_SYS_USE_PKG_CONFIG=0 LIBSSH2_SYS_USE_PKG_CONFIG=0 cargo build --release --locked --offline"
install = '''install -Dm0755 target/release/cargo-cbuild "%{pkgdir}/usr/bin/cargo-cbuild"
install -Dm0755 target/release/cargo-capi "%{pkgdir}/usr/bin/cargo-capi"
install -Dm0755 target/release/cargo-cinstall "%{pkgdir}/usr/bin/cargo-cinstall"
install -Dm0755 target/release/cargo-ctest "%{pkgdir}/usr/bin/cargo-ctest"
'''
