# unity recipe: zeitgeist — Zeitgeist activity log (library and daemon, without FTS/telepathy)
# Source: Ubuntu archive orig tarball (1.0.4); Ubuntu's patches are vendored under patches/.
[package]
name = "zeitgeist"
version = "1.0.4"
rel = 2
arch = ["x86_64"]
summary = "Zeitgeist activity log (library and daemon, without FTS/telepathy)"
license = ["LGPL-2.1-or-later", "GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "zeitgeist"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/z/zeitgeist/zeitgeist_1.0.4.orig.tar.bz2"
sha256 = "b61d53cc4235317b3d9c62d04e50c64b88821041301daae2cfb75ce224656ee8"
strip_components = 1

[depends]
build = ["pkgconf", "glib", "gtk3", "dee", "sqlite", "json-glib", "vala", "gnome-common", "unity-build-shims", "intltool", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "dee", "sqlite", "json-glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[assets]
include = ["patches/020220909~1be2a5f.patch", "patches/020230111~33ab4cc.patch", "patches/add_german_translation.patch", "patches/fix-monitor-test.patch", "patches/nodisplay_autostart.patch", "patches/pre_populator.patch", "patches/series", "patches/skip-failing-tests.patch", "patches/startup-database-vacuum.patch", "no-rdflib.patch", "ontology.vala", "ontology-uris.vala"]

[build]
prepare = '''set -eu
for p in $(cat %{assetsdir}/patches/series); do
    patch -p1 < %{assetsdir}/patches/$p
done
cp /usr/lib/unity-build-shims/gtk-doc.make .
# rdflib/python are not part of Faseela: ship the generated ontology sources instead
patch -p1 < %{assetsdir}/no-rdflib.patch
cp %{assetsdir}/ontology.vala %{assetsdir}/ontology-uris.vala libzeitgeist/
'''
configure = '''export CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types"
autoreconf -fi
./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-gtk-doc --disable-introspection --disable-fts --disable-telepathy --disable-datahub --disable-docs --disable-downloads-monitor
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/libzeitgeist-2.0.so
'''
