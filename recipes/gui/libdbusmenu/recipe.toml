# gui recipe: libdbusmenu — D-Bus menu transport used by Waybar's StatusNotifier tray
# Build the GLib and GTK 3 libraries from the same upstream source tree.
# GTK 2, the dumper, tests, introspection, Vala bindings and gtk-doc are not
# needed by the Faseela desktop. intltool is not packaged, so configure gets
# the same source-local stand-ins used by pavucontrol; translations stay off.
[package]
name = "libdbusmenu"
version = "18.10.20180917"
rel = 1
arch = ["x86_64"]
summary = "D-Bus menu transport library (GLib and GTK 3)"
license = ["LGPL-2.1-or-later", "LGPL-3.0-or-later"]
source = "https://deb.debian.org/debian/pool/main/libd/libdbusmenu/libdbusmenu_%{version}~bzr492+repack1.orig.tar.xz"
sha256 = "41298b926573419f21864205317461750b833c596af6ab0bd206e13336f8cee3"
source_dir = "libdbusmenu-%{version}~bzr492+repack1"

[depends]
build = ["pkgconf", "glib", "gtk3"]
run = ["glib", "gtk3"]

[build]
configure = '''
# intltool is not packaged. The configure check is only needed for translated
# templates; keep the helper local to the source tree and disable NLS.
stub=$PWD/.intltool-stub
mkdir -p "$stub/XML"
printf '#!/bin/sh\necho "intltool-update (intltool) 0.51.0"\n' > "$stub/intltool-update"
printf '#!/bin/sh\nexit 0\n' > "$stub/intltool-merge"
printf '#!/bin/sh\nexit 0\n' > "$stub/intltool-extract"
chmod 755 "$stub/intltool-update" "$stub/intltool-merge" "$stub/intltool-extract"
printf 'package XML::Parser;\n$VERSION = "2.47";\n1;\n' > "$stub/XML/Parser.pm"
PATH="$stub:$PATH" PERL5LIB="$stub" ./configure \
    --prefix=/usr --libdir=/usr/lib --disable-nls --disable-static \
    --with-gtk=3 --disable-dumper --disable-tests \
    --disable-introspection --disable-vala --disable-gtk-doc
'''
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# Waybar's Meson probe is for this exact pkg-config module. Refuse to publish
# an incomplete library package if upstream ever changes the install layout.
test -s %{pkgdir}/usr/lib/pkgconfig/dbusmenu-gtk3-0.4.pc
test -e %{pkgdir}/usr/lib/libdbusmenu-glib.so.4
test -e %{pkgdir}/usr/lib/libdbusmenu-gtk3.so.4
'''
