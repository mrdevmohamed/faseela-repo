# xfce recipe: xfce4-taskmanager — Xfce task manager
# the X11 monitor window requires xmu (shipped by libXmu)
[package]
name = "xfce4-taskmanager"
version = "1.6.0"
rel = 4
arch = ["x86_64"]
summary = "Xfce task manager (process list with CPU and memory graphs)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/apps/xfce4-taskmanager/1.6/xfce4-taskmanager-1.6.0.tar.xz"
sha256 = "29bdc7840ab8b9025f6c0e456a83a31090d1c9fd9e26b359baa4a4010cfb0b90"

[depends]
build = ["meson", "ninja", "pkgconf", "xfce4-dev-tools", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "gdk-pixbuf", "cairo", "libwnck3", "libXmu", "libX11", "xorgproto"]
run = ["libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "gdk-pixbuf", "cairo", "libwnck3", "libXmu", "libX11"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release"
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build'''
