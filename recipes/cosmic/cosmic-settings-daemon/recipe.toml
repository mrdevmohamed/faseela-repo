# cosmic recipe: cosmic-settings-daemon — COSMIC settings daemon.
# Applies keyboard/input/shortcuts configuration, handles system actions
# (shortcuts) and geonames timezone data. It talks to elogind (login1) and
# UPower over the session/system D-Bus buses.
[package]
name = "cosmic-settings-daemon"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC settings daemon (shortcuts, input configuration, system actions)"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-settings-daemon"
url = "https://codeload.github.com/pop-os/cosmic-settings-daemon/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "1113ba5462a0a0d60ff8d4ef7f465b775b13b1e3533aeefa5f492d5f98183e63"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "eudev", "libxkbcommon", "wayland", "libpulse"]
run = ["eudev", "libxkbcommon", "wayland", "mesa", "dbus", "upower", "elogind", "libpulse"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-settings-daemon"
install = '''
install -Dm755 target/release/cosmic-settings-daemon %{pkgdir}/usr/bin/cosmic-settings-daemon
# System shortcut actions live in the cosmic-config schema directory; the
# polkit rule guards the privileged system-action D-Bus methods.
install -Dm644 data/system_actions.ron \
    %{pkgdir}/usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
install -Dm644 data/polkit-1/rules.d/cosmic-settings-daemon.rules \
    %{pkgdir}/usr/share/polkit-1/rules.d/cosmic-settings-daemon.rules
# The geonames timezone cache is embedded in the binary (include_bytes!),
# so no separate geodata file is installed.
'''
