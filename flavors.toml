# flavors.toml — what each flavor of the distribution contains.
#
# ONE source of truth: the recipes (recipes/) say how a package is built, this
# file says which packages make up which image. The faseela repository builds
# the bootstrap and then only INSTALLS the other flavors from the package
# repository (packages.yml publishes it); nothing here is compiled per flavor.
#
#   scripts/flavor.py list                 the flavors
#   scripts/flavor.py resolve NAME         their packages, dependencies first
#   scripts/flavor.py check                every flavor resolves (run by ci.yml)
#
# Keys of a [flavor.NAME] table
#   summary   one line
#   include   package names, or @category (toolchain base system boot extra gui browser media creative)
#   extends   other flavors whose packages are included too
#   exclude   packages left out of the result (nothing else is dropped)
#   closure   "run"   (default) add every [depends].run dependency, transitively:
#                     what has to be INSTALLED for the packages to work
#             "build" add [depends].build AND .run: what has to exist so the
#                     packages can be BUILT (the bootstrap)

# What stage 2 and stage 3 of faseela build with the seed toolchain, and the
# only thing they build. `nawa` is written in Rust, so its build dependencies
# (rust, cmake, ...) are in the closure; `curl` and `ca-certificates` let the finished root fetch from https (the
# package repository). This is also
# the seed of the next bootstrap (faseela-x86_64-rootfs.tar.zst).
[flavor.bootstrap]
summary = "the self-hosting core: base-devel + nawa + curl + ca-certificates (and what builds them)"
include = ["base-devel", "nawa", "curl", "ca-certificates"]
closure = "build"

# The rootfs a later build uses instead of the Debian seed.
[flavor.seed]
summary = "rootfs that seeds the next bootstrap"
extends = ["bootstrap"]
closure = "build"

# The small build environment: packages.yml builds the rest of the packages in it.
[flavor.rootfs-min]
summary = "base-devel + nawa + git + curl: a build environment without rust"
include = ["base-devel", "nawa", "git", "curl", "ca-certificates"]

[flavor.docker]
summary = "rootfs-min imported as a container image (ghcr.io/<owner>/faseela-build)"
extends = ["rootfs-min"]

# The live ISO without a graphical session. Firmware is the bulk of an ISO:
# linux-firmware-lite stays, the full set is installed on demand
# (`nawa install linux-firmware`).
[flavor.iso-nogui]
summary = "live ISO, no GUI"
include = ["@toolchain", "@base", "@system", "@boot", "@extra"]
exclude = ["linux-firmware", "linux-firmware-extra"]

[flavor.iso-gui]
summary = "live ISO with Sway, PipeWire audio, Firefox ESR, NetworkManager, Bluetooth and polkit"
extends = ["iso-nogui"]
# Browser recipes stay in their own category, but Firefox is part of the standard GUI ISO.
# zed lives in gui/ (stage2/stage3 skip that category) but is opt-in: see iso-gui-zed.
include = ["@gui", "firefox"]
exclude = ["zed"]

# Backwards-compatible flavor name for existing build workflow invocations.
# The standard iso-gui now already includes Firefox and its runtime dependency closure.
[flavor.iso-gui-firefox]
summary = "compatibility alias for iso-gui (includes Firefox ESR)"
extends = ["iso-gui"]

# iso-gui plus the Zed editor. It does NOT extend iso-gui: `exclude` is inherited and cannot be
# undone further down, so this repeats iso-gui's include list on top of iso-nogui.
# Zed renders through Vulkan, which mesa here is not built with (see recipes/gui/zed).
[flavor.iso-gui-zed]
summary = "iso-gui plus the Zed code editor (needs a Vulkan driver, see recipes/gui/zed)"
extends = ["iso-nogui"]
include = ["@gui", "firefox", "zed"]

# --- media (recipes/media): opt-in, on top of the images above ----------------------------
# ffmpeg needs no GUI, so it comes on top of iso-nogui; mpv plays through Wayland/DRM and
# comes on top of iso-gui. Neither grows the plain ISOs.
[flavor.iso-nogui-ffmpeg]
summary = "iso-nogui plus ffmpeg (libav*, x264/x265/vpx/opus/lame, VA-API with the Intel driver)"
extends = ["iso-nogui"]
include = ["ffmpeg", "intel-media-driver"]

[flavor.iso-gui-mpv]
summary = "iso-gui plus the mpv media player (+ ffmpeg, libass, libplacebo, Intel VA-API driver; AMD's is in mesa)"
extends = ["iso-gui"]
include = ["mpv", "intel-media-driver"]


# --- creative (recipes/creative): optional Storytold Craft desktop apps ------------------
# Prebuilt upstream Linux x86_64 bundles for Faseela's Wayland session. Kept
# separate from the standard ISO and ALL package set; build/install on demand.
[flavor.creative]
summary = "15 optional Storytold Craft desktop applications for Wayland"
include = ["@creative"]
