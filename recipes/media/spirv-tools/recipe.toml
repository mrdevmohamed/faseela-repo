# SPIRV-Tools pinned to the matching commit in Khronos SDK 1.3.296.0's glslang known_good.json.
# It consumes the separately installed SPIRV-Headers package rather than an absent submodule.
[package]
name = "spirv-tools"
version = "1.3.296"
rel = 2
arch = ["x86_64"]
summary = "Khronos SPIR-V tools and shared libraries"
license = ["Apache-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "spirv-tools"
url = "https://github.com/KhronosGroup/SPIRV-Tools/archive/6dcc7e350a0b9871a825414d42329e44b0eb8109.tar.gz"
sha256 = "e3665378ab0ae8efb327027ee103d10c3c9e05823dea8b28893c00886ffe1a23"
strip_components = 1

[depends]
build = ["cmake", "ninja", "python", "spirv-headers"]
run = ["glibc"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = '''
cmake -S . -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DSPIRV-Headers_SOURCE_DIR=/usr \
    -DSPIRV_WERROR=OFF \
    -DBUILD_SHARED_LIBS=ON \
    -DSPIRV_TOOLS_BUILD_STATIC=OFF \
    -DSPIRV_SKIP_TESTS=ON
'''
compile = "cmake --build build --parallel %{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
