# flatpak recipe: libksba — X.509 and CMS support for GnuPG.
[package]
name = "libksba"
version = "1.8.1"
rel = 2
arch = ["x86_64"]
summary = "X.509 certificate and CMS protocol library"
license = ["GPL-2.0-or-later", "LGPL-3.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libksba"
url = "https://gnupg.org/ftp/gcrypt/libksba/libksba-%{version}.tar.bz2"
sha256 = "c2f84393011827219ae117131dba8e7684c2bed0961eed11b0642c2acba440b5"
strip_components = 1

[depends]
build = ["libgpg-error", "pkgconf"]
run = ["libgpg-error"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
