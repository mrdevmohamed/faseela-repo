# system recipe: conmon — OCI container monitor used by Podman.
[package]
name = "conmon"
version = "2.2.1"
rel = 1
arch = ["x86_64"]
summary = "OCI container monitor"
license = ["Apache-2.0"]
source = "https://github.com/containers/conmon/archive/refs/tags/v%{version}.tar.gz"
sha256 = "814fb5979a3a4b8576b1f901e606b482bebb41cb7e57926e6d5765ee786b96d3"

[depends]
build = ["gcc", "make", "pkgconf", "glib", "libseccomp"]
run = ["glib", "libseccomp"]

[build]
compile = "make -j%{jobs} DISABLE_SYSTEMD=1"
install = "make DISABLE_SYSTEMD=1 PREFIX=/usr DESTDIR=%{pkgdir} BINDIR=/usr/bin LIBEXECDIR=/usr/libexec install.podman"
