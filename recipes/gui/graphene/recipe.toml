# gui recipe: graphene — Thin layer of graphic data types
[package]
name = "graphene"
version = "1.10.8"
rel = 2
arch = ["x86_64"]
summary = "Thin layer of graphic data types"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "graphene"
url = "https://download.gnome.org/sources/graphene/1.10/graphene-%{version}.tar.xz"
sha256 = "a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "python"]
run = ["glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
# gobject_types must stay on: muffin fails to build without graphene-gobject.
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D gobject_types=true -D introspection=disabled -D tests=false -D gtk_doc=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
