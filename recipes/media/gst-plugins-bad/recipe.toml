# media recipe: GStreamer bad plug-ins, restricted to MPEG-TS support.
# WebKitGTK 2.54.2 probes the MPEG-TS library whenever HTML video is enabled.
[package]
name = "gst-plugins-bad"
version = "1.28.9"
rel = 1
arch = ["x86_64"]
summary = "GStreamer MPEG-TS helper library and demuxer"
license = ["LGPL-2.1-or-later"]
source = "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-%{version}.tar.xz"
sha256 = "4a4e0b7bf84f868378c48f143a7ac3a98923b488a5b74f1a35ba46bc3c43f6b1"
source_dir = "gst-plugins-bad-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "gstreamer", "gst-plugins-base"]
run = ["gstreamer", "gst-plugins-base"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release --wrap-mode=nodownload -Dauto_features=disabled -Dtests=disabled -Dexamples=disabled -Dintrospection=disabled -Ddoc=disabled -Dnls=disabled -Dorc=disabled -Dmpegtsdemux=enabled -Dmpegtsmux=disabled"
compile = "ninja -C build"
install = '''DESTDIR=%{pkgdir} meson install -C build
test -e "%{pkgdir}/usr/lib/libgstmpegts-1.0.so" || {
    echo "gst-plugins-bad: MPEG-TS helper library was not installed" >&2
    exit 1
}'''
