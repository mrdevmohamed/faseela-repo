# base recipe: TLS/SSL and general-purpose cryptography library
[package]
name = "openssl"
version = "3.5.7"
rel = 2
arch = ["x86_64"]
summary = "TLS/SSL and general-purpose cryptography library"
license = ["Apache-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "openssl"
url = "https://www.openssl.org/source/openssl-3.5.7.tar.gz"
sha256 = "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
strip_components = 1

[depends]
build = ["zlib"]
run = ["zlib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} MANSUFFIX=ssl install"
