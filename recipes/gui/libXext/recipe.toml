# gui recipe: libXext — X11 miscellaneous extensions library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXext"
version = "1.3.6"
rel = 1
arch = ["x86_64"]
summary = "X11 miscellaneous extensions library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXext-%{version}.tar.xz"
sha256 = "edb59fa23994e405fdc5b400afdf5820ae6160b94f35e3dc3da4457a16e89753"

[depends]
build = ["pkgconf", "xorgproto", "libX11"]
run = ["libX11"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
