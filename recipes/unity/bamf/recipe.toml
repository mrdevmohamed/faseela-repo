# unity recipe: bamf — Bamf: application-matching framework for Unity
# Source: Ubuntu archive orig tarball (0.5.6+22.04.20220217); Ubuntu's patches are vendored under assets/patches.
[package]
name = "bamf"
version = "0.5.6"
rel = 2
arch = ["x86_64"]
summary = "Bamf: application-matching framework for Unity"
license = ["LGPL-3.0-only", "GPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "bamf"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/b/bamf/bamf_0.5.6+22.04.20220217.orig.tar.gz"
sha256 = "d0460f1c0ad7fd797e1b34696740a38ffb6152664e07368a0f25f1505eee7ede"
strip_components = 1

[depends]
build = ["pkgconf", "glib", "gtk3", "libwnck3", "libgtop", "startup-notification", "libX11", "libxml2", "dbus-glib", "vala", "gnome-common", "unity-build-shims", "intltool", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "gtk3", "libwnck3", "libgtop", "startup-notification", "libxml2"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''set -eu
cp /usr/share/gtk-doc/data/gtk-doc.make .
'''
configure = '''export CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types"
autoreconf -fi
./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-gtk-doc --disable-introspection --disable-headless-tests
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/libbamf3.so
'''
