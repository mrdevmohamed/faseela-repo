# cosmic recipe: cosmic-launcher — COSMIC launcher (pop-launcher frontend).
[package]
name = "cosmic-launcher"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC application launcher"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-launcher"
url = "https://codeload.github.com/pop-os/cosmic-launcher/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "5dcecd911dceb5b360f6cc9f4cc4401aff3f58710f9c6d96b277c58653b05ce3"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-launcher"
install = '''
install -Dm755 target/release/cosmic-launcher %{pkgdir}/usr/bin/cosmic-launcher
# The APPID data (desktop entry, metainfo, scalable icon) is installed the
# same way the upstream data/install + data/icons/install helpers do.
install -Dm644 data/com.system76.CosmicLauncher.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicLauncher.desktop
install -Dm644 data/com.system76.CosmicLauncher.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicLauncher.metainfo.xml
install -Dm644 data/icons/com.system76.CosmicLauncher.svg \
    %{pkgdir}/usr/share/icons/hicolor/scalable/apps/com.system76.CosmicLauncher.svg
'''
