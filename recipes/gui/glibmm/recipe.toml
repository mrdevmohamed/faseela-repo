# gui recipe: glibmm — C++ bindings for glib (gtkmm dependency)
# giomm (the GObject-introspection half) is part of the same tarball and ships
# in this package: gtkmm's build finds it through the glibmm-2.4 pkg-config
# entry next to giomm-2.4. The 2.66 series is the one paired with gtkmm 3.24.
[package]
name = "glibmm"
version = "2.66.10"
rel = 1
arch = ["x86_64"]
summary = "glibmm / giomm — C++ bindings for glib and gobject (gtkmm dependency)"
license = ["LGPL-2.1-or-later"]
source = "https://download.gnome.org/sources/glibmm/2.66/glibmm-%{version}.tar.xz"
sha256 = "2b61780203aed98e701d3ea57c8f353e7c8ada9706a79be782f6c5153dd035c0"
source_dir = "glibmm-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "libsigc++"]
run = ["glib", "libsigc++", "gcc", "glibc"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D maintainer-mode=false -D build-examples=false -D build-documentation=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
