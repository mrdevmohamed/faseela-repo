# boot recipe: GRand Unified Bootloader
# rel 2: BOTH platforms. Only the default (i386-pc) used to be built, so inside the live
#        system `grub-install --target=x86_64-efi` (the disk installer on any UEFI
#        machine, i.e. nearly all real hardware) failed with "x86_64-efi platform not
#        available". The EFI platform is built out of tree and installed over the same
#        prefix (the tools are identical; only /usr/lib/grub/x86_64-efi is new).
[package]
name = "grub"
version = "2.14"
rel = 2
arch = ["x86_64"]
summary = "GRand Unified Bootloader"
license = ["GPL-3.0"]
source = "https://mirrors.kernel.org/gnu/grub/grub-2.14.tar.xz"
sha256 = "bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43"

[depends]
build = ["bison", "flex"]
run = []

[build]
# EFI first: autoconf refuses an out-of-tree configure once the source directory has been
# configured in tree. --target=x86_64 with --with-platform=efi is the x86_64-efi platform
# (the tools come from the host compiler; there is no x86_64- prefixed one).
configure = """
mkdir build-efi
(cd build-efi && ../configure --prefix=/usr --sysconfdir=/etc --disable-werror --disable-efiemu --disable-nls --with-platform=efi --target=x86_64)
./configure --prefix=/usr --sysconfdir=/etc --disable-werror --disable-efiemu --disable-nls
"""
compile = """
make -j%{jobs}
make -C build-efi -j%{jobs}
"""
install = """
make DESTDIR=%{pkgdir} install
make -C build-efi DESTDIR=%{pkgdir} install
# both platforms must be there: the installer needs i386-pc for BIOS and x86_64-efi for UEFI
test -d %{pkgdir}/usr/lib/grub/i386-pc && test -d %{pkgdir}/usr/lib/grub/x86_64-efi
"""
