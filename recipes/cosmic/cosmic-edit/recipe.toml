# cosmic recipe: cosmic-edit — COSMIC text editor (libcosmic + cosmic-text).
[package]
name = "cosmic-edit"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC text editor"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-edit"
url = "https://codeload.github.com/pop-os/cosmic-edit/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "d8dcd072b07523e27c114ff81787ed7cb0fb9a635900d1d368859c1759dfd5a3"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-edit"
install = '''
install -Dm755 target/release/cosmic-edit %{pkgdir}/usr/bin/cosmic-edit
install -Dm644 target/xdgen/com.system76.CosmicEdit.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicEdit.desktop
install -Dm644 target/xdgen/com.system76.CosmicEdit.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicEdit.metainfo.xml
if [ -d res/icons/hicolor ]; then
    find res/icons/hicolor -type f | while read -r f; do
        rel=${f#res/icons/hicolor/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
