# gui recipe: libfyaml — YAML parser used by AppStream metadata.
[package]
name = "libfyaml"
version = "0.9.4"
rel = 1
arch = ["x86_64"]
summary = "YAML 1.2 parser and emitter library"
license = ["MIT"]
source = "https://github.com/pantoniou/libfyaml/releases/download/v%{version}/libfyaml-%{version}.tar.gz"
sha256 = "dac2b0af7b757b32a4fa7c6493d85d0f7dea6effd20ae4352570b6a450b9e5fb"
source_dir = "libfyaml-%{version}"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
