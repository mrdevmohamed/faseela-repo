# gui recipe: json-glib — JSON parser and generator for GLib.
[package]
name = "json-glib"
version = "1.10.8"
rel = 4
arch = ["x86_64"]
summary = "JSON parser and generator for GLib"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "json-glib"
url = "https://download.gnome.org/sources/json-glib/1.10/json-glib-%{version}.tar.xz"
sha256 = "55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd"
strip_components = 1

[depends]
# setuptools: g-ir-scanner imports distutils (removed in Python 3.13);
# the distutils-precedence.pth shim only activates if setuptools is
# installed in this package's build root, so it must be a build dep
# (PR #239: glib-gir failed with "No module named 'distutils'").
build = ["meson", "ninja", "pkgconf", "gettext", "glib", "gobject-introspection", "glib-gir", "setuptools"]
run = ["glib", "glib-gir"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D introspection=enabled -D documentation=disabled -D man=false -D tests=false -D conformance=false -D installed_tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
