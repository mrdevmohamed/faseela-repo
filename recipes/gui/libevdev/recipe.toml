# gui recipe: libevdev — Wrapper library for evdev input devices
[package]
name = "libevdev"
version = "1.13.3"
rel = 2
arch = ["x86_64"]
summary = "Wrapper library for evdev input devices"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libevdev"
url = "https://www.freedesktop.org/software/libevdev/libevdev-%{version}.tar.xz"
sha256 = "abf1aace86208eebdd5d3550ffded4c8d73bb405b796d51c389c9d0604cbcfbf"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D tests=disabled -D documentation=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
