# system recipe: BIND DNS client utilities only.
# This deliberately builds the client tools and their libraries, not named(8).
# Provides dig, host, nslookup, nsupdate and rndc.
[package]
name = "bind-tools"
version = "9.20.30"
rel = 1
arch = ["x86_64"]
summary = "DNS client utilities: dig, host, nslookup, nsupdate and rndc (no DNS server)"
license = ["MPL-2.0", "BSD-3-Clause"]
source = "https://ftp.isc.org/isc/bind9/%{version}/bind-%{version}.tar.xz"
sha256 = "9e1443a40a72a30272cbc3196d020a6b2e26937111c83e59e101e82e1e3b4fef"

[depends]
build = ["libuv", "liburcu", "openssl", "perl", "pkgconf"]
run = ["libuv", "liburcu", "openssl"]

[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc --disable-doh"
compile = """
set -eu
for dir in lib/isc lib/dns lib/ns lib/isccfg lib/isccc bin/dig bin/nsupdate bin/rndc; do
    make -C "$dir" -j%{jobs}
done
"""
install = """
set -eu
for dir in lib/isc lib/dns lib/ns lib/isccfg lib/isccc bin/dig bin/nsupdate bin/rndc; do
    make -C "$dir" DESTDIR=%{pkgdir} install
done
test -x "%{pkgdir}/usr/bin/dig"
test -x "%{pkgdir}/usr/bin/host"
test -x "%{pkgdir}/usr/bin/nslookup"
"""
