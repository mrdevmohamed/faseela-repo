name: Publish schema-v5 repository

# This is deliberately separate from packages.yml: the schema-v3 publisher
# continues to own stable-v3 and packages-NNNN without any schema-v5 writes.
on:
  workflow_dispatch:
    inputs:
      publish_confirmation:
        description: Type the publishing confirmation to authorize stable-v5 updates
        required: true
        type: choice
        options:
          - NO
          - PUBLISH_SCHEMA_V5
      build_run_id:
        description: Successful same-repository Build packages PR run ID whose merged PR draft-release cache contains the complete package set
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: schema-v5-publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation on main
        run: |
          if [[ "${{ inputs.publish_confirmation }}" == "PUBLISH_SCHEMA_V5" && \
                "${{ github.ref }}" == "refs/heads/main" ]]; then
            exit 0
          fi
          echo "::error::Schema-v5 publishing requires the explicit confirmation on main."
          exit 1

  publish:
    if: ${{ inputs.publish_confirmation == 'PUBLISH_SCHEMA_V5' && github.ref == 'refs/heads/main' }}
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      NAWA_SIGN_KEY_B64: ${{ secrets.NAWA_SIGN_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the existing repository signing key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NAWA_SIGN_KEY_B64" ]] || {
            echo "::error::Secret NAWA_SIGN_KEY_B64 is required."
            exit 1
          }

      - name: Ensure the trusted Nawa key matches the distribution key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/mrdevmohamed/faseela/master/dist/nawa.pub \
            --output "$RUNNER_TEMP/nawa-distro.pub"
          cmp dist/nawa.pub "$RUNNER_TEMP/nawa-distro.pub"

      - uses: dtolnay/rust-toolchain@stable

      - name: Read and verify the recipe-pinned Nawa source
        shell: bash
        run: |
          set -euo pipefail
          pin_env="$RUNNER_TEMP/nawa-source.env"
          python3 -I - <<'PY' > "$pin_env"
          import re
          import tomllib
          from pathlib import Path

          recipe = tomllib.loads(Path("recipes/base/nawa/recipe.toml").read_text())
          package = recipe.get("package", {})
          sources = package.get("sources", [])
          matches = [item for item in sources if isinstance(item, dict) and item.get("name") == "nawa"]
          if package.get("name") != "nawa" or len(matches) != 1:
              raise SystemExit("expected one recipe-pinned Nawa source")
          source = matches[0]
          url = source.get("url", "")
          match = re.fullmatch(
              r"https://github\.com/mrdevmohamed/nawa/archive/([0-9a-f]{40})\.tar\.gz", url
          )
          digest = source.get("sha256", "")
          if not match or not re.fullmatch(r"[0-9a-f]{64}", digest) or digest == "0" * 64:
              raise SystemExit("invalid Nawa source URL or SHA-256 in the recipe")
          print(f"NAWA_SOURCE_COMMIT={match.group(1)}")
          print(f"NAWA_SOURCE_SHA256={digest}")
          print(f"NAWA_SOURCE_URL={url}")
          PY
          cat "$pin_env" >> "$GITHUB_ENV"
          source "$pin_env"

          archive="$RUNNER_TEMP/nawa-source.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 20 \
            "$NAWA_SOURCE_URL" --output "$archive"
          echo "$NAWA_SOURCE_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nawa-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nawa-source"
          source_dir="$RUNNER_TEMP/nawa-source/nawa-$NAWA_SOURCE_COMMIT"
          cargo build --manifest-path "$source_dir/Cargo.toml" --release --locked
          echo "NAWA_BIN=$source_dir/target/release/nawa" >> "$GITHUB_ENV"

      - name: Validate the successful package-build run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::build_run_id must be a numeric GitHub Actions run ID"
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/schema-v5-build-run.json"
          python3 -I - "$RUNNER_TEMP/schema-v5-build-run.json" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          repository = sys.argv[2]
          failures = []
          workflow_path = str(run.get("path", "")).split("@", 1)[0]
          if workflow_path != ".github/workflows/packages.yml":
              failures.append("run is not from .github/workflows/packages.yml")
          if run.get("event") != "pull_request":
              failures.append("run must be a pull_request build, not a publishing/manual run")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              failures.append("package-build run must have completed successfully")
          head_repository = run.get("head_repository") or {}
          if head_repository.get("full_name") != repository:
              failures.append("package-build run must come from a branch in this repository")
          pull_requests = run.get("pull_requests") or []
          if len(pull_requests) != 1 or not isinstance(pull_requests[0].get("number"), int):
              failures.append("package-build run must identify exactly one pull request")
          if failures:
              raise SystemExit("invalid schema-v5 build artifact source:\n- " + "\n- ".join(failures))
          print(f"PR_NUMBER={pull_requests[0]['number']}")
          PY
          pr_number="$(python3 -I - "$RUNNER_TEMP/schema-v5-build-run.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          prs = value.get("pull_requests") or []
          if len(prs) != 1:
              raise SystemExit("expected exactly one associated pull request")
          print(prs[0]["number"])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/schema-v5-build-pr.json"
          python3 -I - "$RUNNER_TEMP/schema-v5-build-run.json" \
            "$RUNNER_TEMP/schema-v5-build-pr.json" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pr = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          repository = sys.argv[3]
          failures = []
          run_pr = (run.get("pull_requests") or [{}])[0]
          if pr.get("state") != "closed" or pr.get("merged") is not True:
              failures.append("the package-build pull request must already be merged")
          if (pr.get("base") or {}).get("ref") != "main":
              failures.append("the package-build pull request must target main")
          if (pr.get("base") or {}).get("repo", {}).get("full_name") != repository:
              failures.append("the package-build pull request base must be this repository")
          if (pr.get("head") or {}).get("repo", {}).get("full_name") != repository:
              failures.append("the package-build pull request must come from this repository")
          if (pr.get("head") or {}).get("sha") != (run_pr.get("head") or {}).get("sha"):
              failures.append("the package-build run is not from the pull request's final head")
          merge_sha = pr.get("merge_commit_sha")
          if not isinstance(merge_sha, str) or len(merge_sha) != 40:
              failures.append("the merged pull request has no valid merge commit")
          if failures:
              raise SystemExit("untrusted schema-v5 build artifact source:\n- " + "\n- ".join(failures))
          Path(sys.argv[1]).with_name("schema-v5-merge-sha").write_text(merge_sha + "\n", encoding="utf-8")
          print(f"Accepted merged package-build PR #{pr['number']} at {merge_sha}.")
          PY
          merge_sha="$(cat "$RUNNER_TEMP/schema-v5-merge-sha")"
          gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$GITHUB_SHA" \
            > "$RUNNER_TEMP/schema-v5-merge-compare.json"
          python3 -I - "$RUNNER_TEMP/schema-v5-merge-compare.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          comparison = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if comparison.get("status") not in {"ahead", "identical"} or comparison.get("behind_by") != 0:
              raise SystemExit("the merged build PR is not an ancestor of the current main branch")
          print("Verified: the build PR merge commit is contained in current main.")
          PY

      - name: Restore and authenticate the package-build cache from draft releases
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/schema-v5"
          mkdir -p "$root/build-cache" "$root/built" "$root/packages"
          pr_number="$(python3 -I - "$RUNNER_TEMP/schema-v5-build-run.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          prs = value.get("pull_requests") or []
          if len(prs) != 1:
              raise SystemExit("expected exactly one pull request on build run")
          print(prs[0]["number"])
          PY
          )"
          pr_head_sha="$(python3 -I - "$RUNNER_TEMP/schema-v5-build-run.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          prs = value.get("pull_requests") or []
          print((prs[0].get("head") or {}).get("sha", ""))
          PY
          )"
          manifest_tag="schema-v5-build-pr-$pr_number-manifest"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$manifest_tag" \
            > "$root/build-cache-release.json"
          python3 -I - "$root/build-cache-release.json" "$manifest_tag" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("tag_name") != sys.argv[2] or value.get("draft") is not True:
              raise SystemExit("PR build cache manifest must be an authenticated draft Release")
          PY
          gh release download "$manifest_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.json --pattern candidate.json --dir "$root/build-cache"
          python3 -I scripts/pr-build-release-cache.py verify-candidate \
            --candidate "$root/build-cache/candidate.json" \
            --manifest "$root/build-cache/manifest.json" \
            --pr-number "$pr_number" \
            --build-run-id "$BUILD_RUN_ID" \
            --head-sha "$pr_head_sha"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$root/cache-shard-release.json"
            python3 -I - "$root/cache-shard-release.json" "$tag" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("tag_name") != sys.argv[2] or value.get("draft") is not True:
              raise SystemExit(f"PR build cache shard is not a draft Release: {sys.argv[2]}")
          PY
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$root/build-cache"
          done < <(python3 - "$root/build-cache/candidate.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for tag in value["shards"]:
              print(tag)
          PY
          )
          python3 -I scripts/pr-build-cache.py restore \
            --recipes recipes \
            --cache-dir "$root/build-cache" \
            --out-dir "$root/built"
          echo "Restored and SHA-256-verified candidate archives from merged PR #$pr_number, run $BUILD_RUN_ID."

      - name: Require complete schema-v5 metadata before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/audit-schema-v5-metadata.py --recipes recipes --strict

      - name: Prepare and verify the complete isolated schema-v5 candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/schema-v5"
          printf '%s' "$NAWA_SIGN_KEY_B64" | base64 --decode > "$root/nawa.sec"
          chmod 600 "$root/nawa.sec"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$root/releases.json"
          python3 -I scripts/publish-schema-v5.py prepare \
            --recipes recipes \
            --source-dir "$root/built" \
            --archive-dir "$root/packages" \
            --nawa "$NAWA_BIN" \
            --signing-key "$root/nawa.sec" \
            --public-key dist/nawa.pub \
            --repository "$GITHUB_REPOSITORY" \
            --stable-tag stable-v5 \
            --revision "$GITHUB_SHA" \
            --releases-json "$root/releases.json" \
            --planner scripts/distributed-releases.py \
            --plan "$root/plan.json" \
            --locations "$root/locations.toml" \
            --existing-dir "$root/existing"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Publish immutable package and recipe shards
        shell: bash
        env:
          PLAN_DIR: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes "Immutable schema-v5 package archive shard."
          done < <(python3 -I scripts/distributed-releases.py create --plan "$PLAN_DIR/plan.json")

          mapfile -t tags < <(python3 - "$PLAN_DIR/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          print("\n".join(sorted(plan.get("uploads", {}))))
          PY
          )
          for tag in "${tags[@]}"; do
            mapfile -t assets < <(python3 -I scripts/distributed-releases.py uploads \
              --plan "$PLAN_DIR/plan.json" --repo-dir "$PLAN_DIR/packages" --tag "$tag")
            ((${#assets[@]} > 0)) || continue
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          done

      - name: Publish the signed stable-v5 index last
        shell: bash
        env:
          PLAN_DIR: ${{ steps.prepare.outputs.root }}
        run: |
          set -euo pipefail
          if ! gh release view stable-v5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create stable-v5 --repo "$GITHUB_REPOSITORY" \
              --title "Nawa schema-v5 repository" \
              --notes "Signed schema-v5 repository index. Package archives are in immutable packages-v5-NNNN releases."
          fi
          gh release upload stable-v5 --repo "$GITHUB_REPOSITORY" \
            "$PLAN_DIR/packages/index.toml.sig" --clobber
          gh release upload stable-v5 --repo "$GITHUB_REPOSITORY" \
            "$PLAN_DIR/packages/index.toml" --clobber
