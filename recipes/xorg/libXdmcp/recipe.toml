# xorg recipe: libXdmcp — X Display Manager Control Protocol client library
# no libbsd: glibc 2.36+ ships arc4random_buf, so the libbsd fallback path
# stays off
[package]
name = "libXdmcp"
version = "1.1.5"
rel = 2
arch = ["x86_64"]
summary = "X Display Manager Control Protocol client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXdmcp-1.1.5.tar.xz"
sha256 = "d8a5222828c3adab70adf69a5583f1d32eb5ece04304f7f8392b6a353aa2228c"

[depends]
build = ["pkgconf", "xorgproto"]
run = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static "
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
