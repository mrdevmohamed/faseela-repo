# cosmic recipe: cosmic-locker — COSMIC user-session lock screen.
# This is the normal-user mode of cosmic-greeter, not the greetd login UI.
# cosmic-session launches it inside the session; it listens for elogind Lock
# and Unlock signals and creates the compositor's Wayland session-lock surface.
# Keep it separate from the optional greetd package so a basic COSMIC install
# can lock its screen without installing or enabling another login manager.
[package]
name = "cosmic-locker"
version = "1.11.0"
rel = 1
arch = ["x86_64"]
summary = "COSMIC Wayland session lock screen using elogind"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-greeter"
url = "https://codeload.github.com/pop-os/cosmic-greeter/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "f31c5bac8e50ed5df75cb7d07fb8167e7835dc22b3438a48c8c1f27e7de36e48"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "linux-pam", "wayland", "libxkbcommon", "mesa", "eudev", "libinput", "dav1d"]
run = ["linux-pam", "wayland", "mesa", "libxkbcommon", "eudev", "dbus", "elogind", "network-manager", "bluez", "upower", "cosmic-icons", "hicolor-icon-theme", "libinput", "dav1d"]

[fetch.cargo]
dir = "."

[build]
compile = """
# The source archive has no .git directory. Supply the exact tag metadata
# required by vergen. Build the regular-user locker executable.
export VERGEN_GIT_COMMIT_DATE=2026-10-20T19:54:44Z
export VERGEN_GIT_SHA=80e8a104b75a01ab8df52bca7b8bde6dbcdb8133
cargo build --release --offline --locked --no-default-features --features logind,networkmanager,upower -p cosmic-greeter
"""
install = '''
install -Dm755 target/release/cosmic-greeter %{pkgdir}/usr/bin/cosmic-greeter

# The locker authenticates through the "cosmic-greeter" PAM service. Faseela
# uses linux-pam + pam_elogind, never pam_systemd or a systemd session stack.
install -d -m755 %{pkgdir}/etc/pam.d
cat > %{pkgdir}/etc/pam.d/cosmic-greeter <<'PAM'
#%PAM-1.0
auth      required pam_nologin.so
auth      required pam_env.so
auth      required pam_unix.so
account   required pam_unix.so
password  required pam_unix.so
session   required pam_unix.so
session   optional pam_elogind.so class=user type=wayland desktop=COSMIC
PAM
chmod 644 %{pkgdir}/etc/pam.d/cosmic-greeter

test -x %{pkgdir}/usr/bin/cosmic-greeter
test -s %{pkgdir}/etc/pam.d/cosmic-greeter
'''
