# extra recipe: pv
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r pv` pins it.
[package]
name = "pv"
version = "1.9.31"
rel = 1
arch = ["x86_64"]
summary = "pv — pipe viewer: progress bar for data through a pipe"
license = ["Artistic-2.0"]
source = "https://www.ivarch.com/programs/sources/pv-%{version}.tar.gz"
sha256 = "a35e92ec4ac0e8f380e8e840088167ae01014bfa008a3a9d6506b848079daedf"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
