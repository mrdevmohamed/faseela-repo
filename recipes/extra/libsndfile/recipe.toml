# extra recipe: libsndfile — sampled-audio I/O library.
# Keep the build minimal: PulseAudio's client support library links libpulsecommon
# against libsndfile, but Firefox does not need the optional codec integrations.
[package]
name = "libsndfile"
version = "1.2.2"
rel = 1
arch = ["x86_64"]
summary = "Library for reading and writing sampled audio files"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/libsndfile/libsndfile/releases/download/%{version}/libsndfile-%{version}.tar.xz"
sha256 = "3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e"

[depends]
build = ["cmake", "python"]
run = []

[build]
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DENABLE_EXTERNAL_LIBS=OFF -DENABLE_MPEG=OFF -DENABLE_EXPERIMENTAL=OFF -DINSTALL_MANPAGES=OFF"
compile = "cmake --build build --parallel %{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
