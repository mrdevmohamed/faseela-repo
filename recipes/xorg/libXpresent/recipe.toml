# xorg recipe: libXpresent — Present extension client library (VSync page flips for xfwm4's compositor)
[package]
name = "libXpresent"
version = "1.0.2"
rel = 1
arch = ["x86_64"]
summary = "libXpresent — X Present extension client library"
license = ["MIT", "HPND-sell-variant"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz"
sha256 = "4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602"
source_dir = "libXpresent-1.0.2"
[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXext", "libXfixes", "libXrandr"]
run = ["libX11", "libXext", "libXfixes", "libXrandr"]
[build]
configure = "./configure --prefix=/usr --sysconfdir=/etc --disable-static --disable-nls"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
