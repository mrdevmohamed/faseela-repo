# gui recipe: mtdev — Multitouch protocol translation library
[package]
name = "mtdev"
version = "1.1.6"
rel = 2
arch = ["x86_64"]
summary = "Multitouch protocol translation library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "mtdev"
url = "https://bitmath.org/code/mtdev/mtdev-%{version}.tar.bz2"
sha256 = "15d7b28da8ac71d8bc8c9287c2045fd174267bc740bec10cfda332dc1204e0e0"
# bitmath.org's TLS certificate has expired; the mirror must serve identical bytes.
mirrors = ["https://repository.timesys.com/buildsources/m/mtdev/mtdev-%{version}/mtdev-%{version}.tar.bz2"]
strip_components = 1

[depends]
build = ["pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
