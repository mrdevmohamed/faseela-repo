# gui recipe: libfyaml — fast YAML parser used by AppStream.
[package]
name = "libfyaml"
version = "0.9.6"
rel = 1
arch = ["x86_64"]
summary = "Fast YAML parser and emitter library"
license = ["MIT"]
source = "https://github.com/pantoniou/libfyaml/releases/download/v%{version}/libfyaml-%{version}.tar.gz"
sha256 = "a59cc3331e2eb903ec36933ad52a45888041cac31e44f553a00511131242c483"

[depends]
build = ["cmake"]
run = []

[build]
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF -DENABLE_NETWORK=OFF -DENABLE_LIBCLANG=OFF"
compile = "cmake --build build --parallel %{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
