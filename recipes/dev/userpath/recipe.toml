# Pure-Python runtime dependency for pipx, pinned to its upstream wheel.
[package]
name = "userpath"
version = "1.9.2"
rel = 1
arch = ["x86_64"]
summary = "userpath Python runtime dependency"
license = ["MIT"]
source = "https://files.pythonhosted.org/packages/43/99/3ec6335ded5b88c2f7ed25c56ffd952546f7ed007ffb1e1539dc3b57015a/userpath-1.9.2-py3-none-any.whl"
sha256 = "2cbf01a23d655a1ff8fc166dfb78da1b641d1ceabf0fe5f970767d380b14e89d"

[depends]
build = ["python"]
run = ["python", "click"]

[build]
install = """
site=%{pkgdir}/usr/lib/python3.13/site-packages
install -d "$site"
python3 -m zipfile -e %{srcdir}/userpath-1.9.2-py3-none-any.whl "$site"
"""
