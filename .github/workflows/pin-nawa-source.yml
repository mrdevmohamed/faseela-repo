name: Pin latest Nawa source

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full 40-character Nawa commit SHA (leave empty to pin the latest default-branch commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-nawa-source
  cancel-in-progress: false

jobs:
  pin:
    name: Update Nawa source pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Faseela package recipes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pin Nawa source
        env:
          NAWA_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [[ -n "$NAWA_COMMIT" ]]; then
            python3 -I scripts/pin-nawa-source.py "$NAWA_COMMIT"
          else
            python3 -I scripts/pin-nawa-source.py
          fi

          python3 -I scripts/check-recipes.py
          git diff --check

      - name: Create or update pinning pull request
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/pin-nawa-source
          delete-branch: true
          commit-message: "chore(nawa): pin upstream source"
          title: "chore(nawa): pin latest upstream source"
          body: |
            ## Nawa source pin update

            Updates recipes/base/nawa/recipe.toml using scripts/pin-nawa-source.py.

            The script resolves the latest Nawa default-branch commit unless an
            explicit commit SHA was supplied, downloads the GitHub source archive,
            calculates its SHA-256, and updates the package version and release.

            Recipe validation and git diff --check passed before this PR was created.

            Merge after the repository CI checks pass.

      - name: Dispatch package reconciliation when pin is unchanged
        if: ${{ steps.cpr.outputs.pull-request-operation == 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh workflow run packages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f all=true

          {
            echo "### Package reconciliation queued"
            echo
            echo "The Nawa pin already matches upstream, so no pinning PR was needed."
            echo "Dispatched **Build packages** with `all=true` to reconcile all non-Toolchain packages."
            echo "Already-published package archives are skipped by the package builder."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report pin result and PR link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          set -euo pipefail

          pr_url="$PR_URL"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr view automation/pin-nawa-source \
              --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null || true)"
          fi

          if [[ -n "$pr_url" ]]; then
            {
              echo "### Nawa source pin is ready"
              echo
              echo "Pinning Pull Request: $pr_url"
              echo
              echo "Package builds will start automatically after this recipe PR is merged."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PR_OPERATION" == none ]]; then
            {
              echo "### Nawa source is already up to date"
              echo
              echo "The recipe already points to the latest upstream Nawa commit."
              echo "The full non-Toolchain package reconciliation was dispatched."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            compare_url="https://github.com/$GITHUB_REPOSITORY/compare/main...automation/pin-nawa-source?expand=1"
            {
              echo "### Nawa source pin needs attention"
              echo
              echo "No pull-request URL was returned. Check the create/update PR step."
              echo
              echo "[Open the branch comparison]($compare_url)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No pinning pull-request URL was returned; inspect the create/update PR step."
          fi
