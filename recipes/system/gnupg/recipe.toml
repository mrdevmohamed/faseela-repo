# system recipe: GnuPG — OpenPGP engine used by GPGME and Flatpak signature verification.
[package]
name = "gnupg"
version = "2.5.24"
rel = 1
arch = ["x86_64"]
summary = "GNU Privacy Guard OpenPGP implementation"
license = ["GPL-3.0-or-later"]
source = "https://gnupg.org/ftp/gcrypt/gnupg/gnupg-%{version}.tar.bz2"
sha256 = "bf149d01a2b9fcc0e4589b8ae8697d3d5c557ea48ed95a3fa55dd3b1187e6039"
source_dir = "gnupg-%{version}"

[depends]
build = ["libgpg-error", "libgcrypt", "libassuan", "libksba", "npth", "gettext", "zlib", "bzip2"]
run = ["libgpg-error", "libgcrypt", "libassuan", "libksba", "npth", "zlib", "bzip2"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-dirmngr --disable-scdaemon --disable-g13 --disable-tpm2d --disable-wks-tools"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
