# cinnamon recipe: cinnamon-session — Cinnamon session manager
[package]
name = "cinnamon-session"
version = "6.6.4"
rel = 2
arch = ["x86_64"]
summary = "Cinnamon session manager"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "cinnamon-session"
url = "https://github.com/linuxmint/cinnamon-session/archive/refs/tags/%{version}.tar.gz"
sha256 = "a5a2e5674671921f51f4dbbceb3cb2ac1088c0591c011078f75a214bcbfd641c"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "gtk3", "cinnamon-desktop", "libcanberra", "pango", "libSM", "libICE", "libX11", "libXext", "libxapp", "libXau", "libXcomposite", "mesa", "systemd"]
run = ["glib", "gtk3", "cinnamon-desktop", "libcanberra", "pango", "libSM", "libICE", "libX11", "libxapp", "mesa", "systemd"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D systemd=enabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
