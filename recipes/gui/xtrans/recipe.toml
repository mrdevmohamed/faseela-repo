# gui recipe: xtrans — X transport library (headers only, build-time)
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
# header-only: libX11 needs it to build, nothing needs it at run time.
[package]
name = "xtrans"
version = "1.5.0"
rel = 1
arch = ["x86_64"]
summary = "X transport library (headers only, build-time)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/xtrans-%{version}.tar.xz"
sha256 = "1ba4b703696bfddbf40bacf25bce4e3efb2a0088878f017a50e9884b0c8fb1bd"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
