# extra recipe: double-conversion — shared IEEE double conversion library
[package]
name = "double-conversion"
version = "3.4.0"
rel = 1
arch = ["x86_64"]
summary = "Binary-decimal and decimal-binary conversion library for IEEE doubles"
license = ["BSD-3-Clause"]
source = "https://github.com/google/double-conversion/archive/refs/tags/v%{version}.tar.gz"
sha256 = "42fd4d980ea86426e457b24bdfa835a6f5ad9517ddb01cdb42b99ab9c8dd5dc9"
source_dir = "double-conversion-%{version}"

[depends]
build = ["cmake"]
run = ["gcc", "glibc"]

[build]
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF"
compile = "cmake --build build --parallel %{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
