# base recipe: Portable foreign-function-interface library
[package]
name = "libffi"
version = "3.5.2"
rel = 2
arch = ["x86_64"]
summary = "Portable foreign-function-interface library"
license = ["MIT"]
source = "https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz"
sha256 = "f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc"

[depends]
build = []
run = []

[build]
# libffi appends `gcc -print-multi-os-directory` to libdir (/usr/lib/../lib64 with
# a gcc that names it lib64), and this distro's loader only searches /usr/lib, so
# python's _ctypes could not load libffi.so.8. `--libdir=/usr/lib` alone does not
# help (the suffix is added on top); switch the suffix off.
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-multi-os-directory --disable-static --with-gcc-arch=x86-64"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
