# cosmic recipe: cosmic-term — COSMIC terminal emulator (libcosmic + alacritty).
# build.rs generates the desktop entry and metainfo into target/xdgen.
[package]
name = "cosmic-term"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC terminal emulator"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-term"
url = "https://codeload.github.com/pop-os/cosmic-term/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "4aee40b909c5a935a7a3eb31713dbbd73837a833786aec5617dc98a4ed560492"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland", "libxkbcommon"]
run = ["wayland", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus"]

[fetch.cargo]
dir = "."

[build]
compile = "cargo build --release --offline --locked --bin cosmic-term"
install = '''
install -Dm755 target/release/cosmic-term %{pkgdir}/usr/bin/cosmic-term
install -Dm644 target/xdgen/com.system76.CosmicTerm.desktop \
    %{pkgdir}/usr/share/applications/com.system76.CosmicTerm.desktop
install -Dm644 target/xdgen/com.system76.CosmicTerm.metainfo.xml \
    %{pkgdir}/usr/share/metainfo/com.system76.CosmicTerm.metainfo.xml
if [ -d res/icons/hicolor ]; then
    find res/icons/hicolor -type f | while read -r f; do
        rel=${f#res/icons/hicolor/}
        install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
    done
fi
'''
