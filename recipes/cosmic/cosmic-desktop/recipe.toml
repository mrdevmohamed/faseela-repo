# cosmic recipe: cosmic-desktop — COSMIC desktop session integration for
# Faseela (meta package in the gui-session/xfce-session style: no upstream
# source, only configuration and service wiring on top of the real packages).
#
# Faseela runs systemd as PID 1 with the system D-Bus and logind, so this
# package wires COSMIC into that stack:
#   * the per-session bus starts via dbus-run-session inside start-cosmic
#     (upstream script; its systemd branches are guarded by `command -v`)
#   * cosmic-session's login1 calls resolve to systemd-logind
#   * seatd-systemd provides the shared libseat daemon and DRM device rules
#   * PipeWire/WirePlumber start per session through faseela-audio-session
#     (XDG autostart entry below, OnlyShowIn=COSMIC)
[package]
name = "cosmic-desktop"
version = "0.1"
rel = 4
arch = ["x86_64"]
source_date_epoch = 1767225600
summary = "COSMIC Wayland desktop session integration for Faseela (systemd + dbus)"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[depends]
build = []
run = ["appimage-support", "flatpak", "mate-polkit", "cosmic-session", "cosmic-osk", "cosmic-comp", "cosmic-panel", "cosmic-applets", "cosmic-launcher", "cosmic-notifications", "cosmic-workspaces", "cosmic-osd", "cosmic-bg", "cosmic-idle", "cosmic-settings", "cosmic-settings-daemon", "cosmic-screenshot", "cosmic-randr", "cosmic-icons", "xdg-desktop-portal-cosmic", "mesa", "dbus", "dbus-system", "systemd", "polkit", "pipewire", "wireplumber", "network-manager", "bluez", "upower", "seatd-systemd", "base-files", "faseela-branding", "coreutils", "audio-session", "alsa-utils", "brightnessctl", "gnome-keyring", "udisks2", "gvfs", "xdg-desktop-portal", "xdg-desktop-portal-gtk", "xdg-utils", "xdg-user-dirs", "shared-mime-info", "desktop-file-utils", "hicolor-icon-theme", "adwaita-icon-theme", "dejavu-fonts", "nerd-fonts-symbols", "noto-fonts", "noto-fonts-arabic", "noto-naskh-arabic", "noto-color-emoji"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = '''
# --- XDG runtime directory + libseat backend for the compositor --------------
install -d -m755 %{pkgdir}/etc/profile.d
cat > %{pkgdir}/etc/profile.d/cosmic-session.sh <<'EOF'
# /etc/profile.d/cosmic-session.sh — environment for running COSMIC from a tty
if [ -z "$XDG_RUNTIME_DIR" ]; then
    _uid=$(id -u)
    if [ -d "/run/user/$_uid" ] && [ -O "/run/user/$_uid" ]; then
        XDG_RUNTIME_DIR=/run/user/$_uid
    elif [ "$_uid" = 0 ]; then
        XDG_RUNTIME_DIR=/run/user/0
        mkdir -p "$XDG_RUNTIME_DIR" 2>/dev/null && chmod 700 "$XDG_RUNTIME_DIR"
    else
        XDG_RUNTIME_DIR=/tmp/runtime-$_uid
        mkdir -p "$XDG_RUNTIME_DIR" 2>/dev/null && chmod 700 "$XDG_RUNTIME_DIR"
    fi
    if [ -d "$XDG_RUNTIME_DIR" ] && [ -O "$XDG_RUNTIME_DIR" ]; then
        export XDG_RUNTIME_DIR
    else
        unset XDG_RUNTIME_DIR
    fi
    unset _uid
fi
# cosmic-comp takes the DRM seat through libseat; Faseela builds libseat with
# the seatd backend only (no systemd), so pin the backend selection.
export LIBSEAT_BACKEND=seatd
EOF
chmod 644 %{pkgdir}/etc/profile.d/cosmic-session.sh

# --- per-session audio: PipeWire/WirePlumber via the shared helper -----------
# Same autostart entry the Sway and Xfce sessions use; audio-session is
# idempotent, so it coexists with the other desktops.
install -d -m755 %{pkgdir}/etc/xdg/autostart
cat > %{pkgdir}/etc/xdg/autostart/faseela-audio-session-cosmic.desktop <<'DESKTOP'
[Desktop Entry]
Type=Application
Name=Faseela Audio Session
Comment=Start PipeWire audio services for this desktop session
Exec=/usr/bin/faseela-audio-session
TryExec=/usr/bin/faseela-audio-session
OnlyShowIn=COSMIC;
NoDisplay=true
X-GNOME-Autostart-enabled=true
DESKTOP
chmod 644 %{pkgdir}/etc/xdg/autostart/faseela-audio-session-cosmic.desktop

# --- keyboard layouts: US + Arabic, Alt+Shift toggles --------------------------
# Same defaults the Sway session ships (gui-session). cosmic-comp reads this
# system default from cosmic-config; a layout list the user saves in COSMIC
# Settings overrides it. Super+Space (InputSourceSwitch) also cycles these.
install -d -m755 %{pkgdir}/usr/share/cosmic/com.system76.CosmicComp/v1
cat > %{pkgdir}/usr/share/cosmic/com.system76.CosmicComp/v1/xkb_config <<'EOF'
(rules: "", model: "", layout: "us,ara", variant: ",", options: Some("grp:alt_shift_toggle"), repeat_delay: 600, repeat_rate: 25)
EOF
chmod 644 %{pkgdir}/usr/share/cosmic/com.system76.CosmicComp/v1/xkb_config

# --- portal preference sanity -------------------------------------------------
# xdg-desktop-portal-cosmic already ships /usr/share/xdg-desktop-portal/
# cosmic-portals.conf (default=cosmic;gtk, Secret=gnome-keyring); nothing to
# add here.
'''

[hooks]
post_install = '''
# The shared seatd-systemd package creates seat/video/render/input groups.
# COSMIC's per-user audio helper needs the audio group.
/usr/libexec/faseela/ensure-system-account group audio

echo "cosmic-desktop: add your user to the desktop groups:"
echo "cosmic-desktop:   usermod -aG seat,video,render,input,audio <user>"
echo "cosmic-desktop: start the session from a tty:  start-cosmic"
echo "cosmic-desktop: optional login greeter: install cosmic-greeter, then enable its unit (systemctl enable cosmic-greeter)"
echo "cosmic-desktop: disable getty-tty1 first if it owns VT 1"
'''
