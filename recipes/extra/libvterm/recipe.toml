# extra recipe: libvterm — terminal emulator state machine (Neovim :terminal)
[package]
name = "libvterm"
version = "0.3.3"
rel = 1
arch = ["x86_64"]
summary = "libvterm — terminal emulator state machine (Neovim :terminal)"
license = ["MIT"]
source = "https://www.leonerd.org.uk/code/libvterm/libvterm-%{version}.tar.gz"
sha256 = "09156f43dd2128bd347cbeebe50d9a571d32c64e0cf18d211197946aff7226e0"
source_dir = "libvterm-%{version}"

[depends]
build = ["libtool", "perl"]
run = []

[build]
compile = "make -j%{jobs} PREFIX=/usr"
install = "make PREFIX=/usr DESTDIR=%{pkgdir} install"
