# system recipe: GPGME — GnuPG Made Easy API used by Flatpak and OSTree.
[package]
name = "gpgme"
version = "2.2.0"
rel = 1
arch = ["x86_64"]
summary = "GnuPG Made Easy library and C API"
license = ["LGPL-2.1-or-later"]
source = "https://www.gnupg.org/ftp/gcrypt/gpgme/gpgme-%{version}.tar.bz2"
sha256 = "7160e80e84dafd00d956c84891c533bb7ab16a6a54fbe1574b2f3acf0496977b"

[depends]
build = ["libgpg-error", "libassuan"]
run = ["libgpg-error", "libassuan", "gnupg"]

[build]
configure = "./configure --prefix=/usr --disable-static --enable-languages=cl --disable-gpgconf-test --disable-gpg-test --disable-gpgsm-test --disable-g13-test"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
