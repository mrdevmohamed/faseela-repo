# gui recipe: libXpresent — X Present extension client library for X11 applications.
[package]
name = "libXpresent"
version = "1.0.2"
rel = 1
arch = ["x86_64"]
summary = "X Present extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXpresent-%{version}.tar.xz"
sha256 = "4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXext", "libXfixes", "libXrandr"]
run = ["libX11", "libXext", "libXfixes", "libXrandr"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
