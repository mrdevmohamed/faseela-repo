# gui recipe: fcft — Simple font loading and glyph rasterization library
[package]
name = "fcft"
version = "3.1.9"
rel = 2
arch = ["x86_64"]
summary = "Simple font loading and glyph rasterization library"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "fcft"
url = "https://codeberg.org/dnkl/fcft/archive/%{version}.tar.gz"
sha256 = "ae6872d42c96e6ca4fa35e4e6ef86e2458e4119fc7393dadd06a36c86bb3def2"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "tllist", "freetype", "fontconfig", "pixman"]
run = ["freetype", "fontconfig", "pixman"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D grapheme-shaping=disabled -D run-shaping=disabled -D test-text-shaping=false -D docs=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
