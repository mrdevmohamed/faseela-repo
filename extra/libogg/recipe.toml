# extra recipe: libogg — Ogg container bitstream library
# Container half of Xiph's codec pair; libvorbis needs it, and libcanberra
# plays its .ogg event sounds through it. Documentation is not built.
[package]
name = "libogg"
version = "1.3.5"
rel = 1
arch = ["x86_64"]
summary = "libogg — Ogg bitstream container library (libvorbis dependency)"
license = ["BSD-3-Clause"]
source = "https://downloads.xiph.org/releases/ogg/libogg-%{version}.tar.xz"
sha256 = "c4d91be36fc8e54deae7575241e03f4211eb102afb3fc0775fbbc1b740016705"
source_dir = "libogg-%{version}"

[depends]
build = ["pkgconf"]
run = []

[build]
configure = "./configure --prefix=/usr --disable-static --disable-docs"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
