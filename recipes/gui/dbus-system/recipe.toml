# gui recipe: system D-Bus daemon supervised by systemd.
# The existing dbus recipe supplies the binaries and configuration; this small
# integration package adds the system-bus account and the dbus.service unit.
#
# The dbus recipe is built with -D systemd=disabled (no libsystemd, so no
# socket activation and no --address=systemd:). The daemon therefore creates
# its own socket, and ExecStartPost holds dbus.service in "activating" until the
# socket exists so that units ordered After=dbus.service really find the bus.
[package]
name = "dbus-system"
version = "1.0"
rel = 5
arch = ["x86_64"]
summary = "System D-Bus service and messagebus account for systemd"
license = ["MIT"]

[depends]
build = []
run = ["dbus", "base-files", "coreutils"]

[build]
install = '''
install -d -m755 %{pkgdir}/usr/lib/systemd/system
cat > %{pkgdir}/usr/lib/systemd/system/dbus.service <<'EOF'
[Unit]
Description=D-Bus System Message Bus
Documentation=man:dbus-daemon(1)

[Service]
Type=simple
RuntimeDirectory=dbus
ExecStart=/usr/bin/dbus-daemon --system --nofork --nopidfile
ExecStartPost=/bin/sh -c 'i=0; while [ ! -S /run/dbus/system_bus_socket ] && [ "$$i" -lt 100 ]; do sleep 0.1; i=$$(($$i + 1)); done'
ExecReload=/usr/bin/dbus-send --print-reply --system --type=method_call --dest=org.freedesktop.DBus / org.freedesktop.DBus.ReloadConfig
Restart=on-failure
OOMScoreAdjust=-900

[Install]
WantedBy=multi-user.target
EOF
chmod 644 %{pkgdir}/usr/lib/systemd/system/dbus.service
'''

[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user messagebus messagebus "D-Bus Message Bus" /nonexistent /usr/bin/false
# System-bus activation (UPower and any other on-demand system service) goes
# through this helper. dbus-daemon refuses it with "The permission of the setuid
# helper is not correct" unless it is root:messagebus and setuid (4750). An
# unprivileged package build cannot set that, so it is done here on the target.
if [ -e /usr/libexec/dbus-daemon-launch-helper ]; then
    chown root:messagebus /usr/libexec/dbus-daemon-launch-helper
    chmod 4750 /usr/libexec/dbus-daemon-launch-helper
fi
'''
