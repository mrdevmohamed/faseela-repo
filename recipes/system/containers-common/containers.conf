# Faseela defaults: runit host, crun runtime, Netavark networking.
# Administrators can override these defaults in /etc/containers/containers.conf.

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
conmon_path = ["/usr/libexec/podman/conmon"]
helper_binaries_dir = ["/usr/libexec/podman", "/usr/bin", "/usr/sbin"]

[network]
network_backend = "netavark"
default_rootless_network_cmd = "pasta"
