# unity recipe: libappindicator — Application indicators library (GTK3)
# Source: Ubuntu archive orig tarball (12.10.1+20.10.20200706.1); Ubuntu's patches are vendored under patches/.
[package]
name = "libappindicator"
version = "12.10.1"
rel = 2
arch = ["x86_64"]
summary = "Application indicators library (GTK3)"
license = ["LGPL-2.1-only", "LGPL-3.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libappindicator"
url = "https://archive.ubuntu.com/ubuntu/pool/universe/liba/libappindicator/libappindicator_12.10.1+20.10.20200706.1.orig.tar.gz"
sha256 = "94e7096a49c400628ecddcafe313d63bf917d95a90ab994930909de724604e0a"
strip_components = 1

[depends]
build = ["pkgconf", "glib", "gtk3", "libindicator", "libdbusmenu", "dbus-glib", "gnome-common", "unity-build-shims", "intltool", "autoconf", "automake", "libtool", "gettext"]
run = ["glib", "gtk3", "libindicator", "libdbusmenu", "dbus-glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''set -eu
cp /usr/share/gtk-doc/data/gtk-doc.make .
'''
configure = '''export CFLAGS="-O2 -Wno-error -Wno-deprecated-declarations -Wno-incompatible-pointer-types"
autoreconf -fi
./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-gtk-doc --disable-introspection --with-gtk=3
'''
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install
test -e %{pkgdir}/usr/lib/libappindicator3.so
'''
