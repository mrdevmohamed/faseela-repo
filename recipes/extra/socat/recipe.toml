# extra recipe: socat — TCP/UDP/UNIX/TLS/serial relay and debugging swiss-army knife.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r socat` pins it.
[package]
name = "socat"
version = "1.8.0.3"
rel = 1
arch = ["x86_64"]
summary = "socat — multipurpose relay (SOcket CAT)"
license = ["GPL-2.0-only"]
source = "http://www.dest-unreach.org/socat/download/socat-%{version}.tar.gz"
sha256 = "a9f9eb6cfb9aa6b1b4b8fe260edbac3f2c743f294db1e362b932eb3feca37ba4"

[depends]
build = ["openssl", "readline", "ncurses"]
run = ["openssl", "readline", "ncurses"]

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
