# unity recipe: accountsservice — D-Bus service for user account information
[package]
name = "accountsservice"
version = "26.27.3"
rel = 2
arch = ["x86_64"]
summary = "D-Bus interface for querying and manipulating user accounts"
license = ["GPL-3.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "accountsservice"
url = "https://archive.ubuntu.com/ubuntu/pool/main/a/accountsservice/accountsservice_%{version}.orig.tar.bz2"
sha256 = "77e26080fd644df3e339fef561bb77f901e43557dc73e620afb6c10789b9a9e8"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "glib", "polkit", "systemd", "json-c", "libxcrypt", "dbus", "gettext"]
run = ["glib", "polkit", "systemd", "json-c", "libxcrypt", "dbus"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
prepare = '''set -eu
# the version script needs a git checkout or a specially named directory
printf '#!/bin/sh\necho %{version}\n' > generate-version.sh
'''
configure = "meson setup build --prefix=/usr --libdir=lib --libexecdir=/usr/libexec --sysconfdir=/etc --localstatedir=/var --buildtype=release -Dintrospection=false -Dvapi=false -Dtests=false -Dgtk_doc=false -Ddocbook=false -Dsystemdsystemunitdir=/usr/lib/systemd/system -Dadmin_group=wheel -Dlibxcrypt=true -Dminimum_uid=1000"
compile = "ninja -C build"
install = '''
DESTDIR=%{pkgdir} meson install -C build
rm -rf %{pkgdir}/var
test -x %{pkgdir}/usr/libexec/accounts-daemon
test -e %{pkgdir}/usr/lib/libaccountsservice.so
'''
