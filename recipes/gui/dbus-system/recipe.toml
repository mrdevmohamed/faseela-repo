# gui recipe: system D-Bus daemon supervised by runit.
# The existing dbus recipe supplies the binaries and configuration; this small
# integration package adds the system-bus account and a persistent service.
[package]
name = "dbus-system"
version = "1.0"
rel = 4
arch = ["x86_64"]
summary = "System D-Bus service and messagebus account for runit systems"
license = ["MIT"]

[depends]
build = []
run = ["dbus", "runit", "base-files", "coreutils"]

[build]
install = '''
install -d -m755 %{pkgdir}/etc/sv/dbus %{pkgdir}/etc/runit/runsvdir/default
cat > %{pkgdir}/etc/sv/dbus/run <<'RUN'
#!/bin/sh
install -d -m755 /run/dbus
dbus-uuidgen --ensure=/etc/machine-id
exec dbus-daemon --system --nofork --nopidfile
RUN
chmod 755 %{pkgdir}/etc/sv/dbus/run
ln -s /etc/sv/dbus %{pkgdir}/etc/runit/runsvdir/default/dbus
'''

[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user messagebus messagebus "D-Bus Message Bus" /nonexistent /usr/bin/false
# System-bus activation (UPower and any other on-demand system service) goes
# through this helper. dbus-daemon refuses it with "The permission of the setuid
# helper is not correct" unless it is root:messagebus and setuid (4750). An
# unprivileged package build cannot set that, so it is done here on the target.
if [ -e /usr/libexec/dbus-daemon-launch-helper ]; then
    chown root:messagebus /usr/libexec/dbus-daemon-launch-helper
    chmod 4750 /usr/libexec/dbus-daemon-launch-helper
fi
'''
