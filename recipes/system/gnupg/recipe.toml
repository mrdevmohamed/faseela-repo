# system recipe: GnuPG — OpenPGP tools and agent used for repository signatures.
# The build keeps the OpenPGP tools and GnuTLS-backed keyserver support, while
# dropping optional smart-card, LDAP and TOFU/SQLite integrations.
[package]
name = "gnupg"
version = "2.5.24"
rel = 1
arch = ["x86_64"]
summary = "OpenPGP tools and agent for signature verification"
license = ["GPL-3.0-or-later"]
source = "https://www.gnupg.org/ftp/gcrypt/gnupg/gnupg-%{version}.tar.bz2"
sha256 = "bf149d01a2b9fcc0e4589b8ae8697d3d5c557ea48ed95a3fa55dd3b1187e6039"

[depends]
build = ["pkgconf", "libgpg-error", "libgcrypt", "libassuan", "libksba", "npth", "gnutls", "zlib", "bzip2", "xz"]
run = ["libgpg-error", "libgcrypt", "libassuan", "libksba", "npth", "gnutls", "zlib", "bzip2", "xz"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-card-support --disable-ccid-driver --disable-ldap --disable-tofu --disable-sqlite --disable-doc --disable-nls"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
