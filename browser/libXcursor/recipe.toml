# browser recipe: libXcursor — X cursor management library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXcursor"
version = "1.2.2"
rel = 1
arch = ["x86_64"]
summary = "X cursor management library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXcursor-%{version}.tar.xz"
sha256 = "53d071bd2cc56e517a30998d5e685c8a74556ddada43c6985d14da9a023a88ee"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXrender", "libXfixes"]
run = ["libX11", "libXrender", "libXfixes"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
