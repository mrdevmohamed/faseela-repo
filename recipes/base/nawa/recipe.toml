# base recipe: nawa — this distribution's source-based package manager (self-hosting build)
#
# The source lives in its own repository (github.com/mrdevmohamed/nawa) and is
# pinned here to ONE commit by sha256. The crates are vendored in that
# repository (vendor/ + .cargo/config.toml), so the build needs no network
# beyond fetching this tarball, and runs with the distro's own `rust` recipe
# (cargo on the sandbox PATH).
#
# The commit, `version` and `sha256` are written by
#   python3 scripts/pin-nawa-source.py [<nawa commit>]
# bootstrap/fetch-nawa.sh reads this same pin to unpack the source for the
# stage-2 bootstrap build, so there is exactly one place that says which nawa
# the distribution ships.
[package]
name = "nawa"
version = "1.0.0"
rel = 10
arch = ["x86_64"]
summary = "nawa — this distribution's source-based package manager (self-hosting build)"
license = ["GPL-3.0"]
source = "https://github.com/mrdevmohamed/nawa/archive/c9261d12c89402fdeb5200a3bb0a0fa8f3be252b.tar.gz"
sha256 = "084de9f0345a04dc09c8bdbc725f8bb764a2c9a991d2391253422c82c45d8614"
source_dir = "nawa-c9261d12c89402fdeb5200a3bb0a0fa8f3be252b"

[depends]
build = ["rust"]
run = []

[build]
compile = "cargo build --release --offline --locked"
install = """
install -Dm755 target/release/nawa %{pkgdir}/usr/bin/nawa
# system-wide configuration: default repository + install mode
install -Dm644 dist/nawa.toml %{pkgdir}/etc/nawa/nawa.toml
# Faseela's active package endpoint uses the signed schema-v3 index.
# Keep the old stable endpoint available for already-installed schema-v1 clients.
sed -i 's|releases/download/stable"|releases/download/stable-v3"|' %{pkgdir}/etc/nawa/nawa.toml
"""
