# xfce recipe: xfconf — Xfce configuration system
[package]
name = "xfconf"
version = "4.20.0"
rel = 1
arch = ["x86_64"]
summary = "Xfce configuration system (xfconfd daemon and libxfconf client library)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/xfce/xfconf/4.20/xfconf-4.20.0.tar.bz2"
sha256 = "8bc43c60f1716b13cf35fc899e2a36ea9c6cdc3478a8f051220eef0f53567efd"

[depends]
build = ["pkgconf", "libxfce4util", "glib", "dbus"]
run = ["libxfce4util", "glib", "dbus"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
