# gui recipe: xcb-util-renderutil — convenience functions for the XCB Render extension
[package]
name = "xcb-util-renderutil"
version = "0.3.10"
rel = 1
arch = ["x86_64"]
summary = "Convenience functions for the XCB Render extension"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/xcb/xcb-util-renderutil-%{version}.tar.xz"
sha256 = "3e15d4f0e22d8ddbfbb9f5d77db43eacd7a304029bf25a6166cc63caa96d04ba"

[depends]
build = ["pkgconf", "libxcb", "xcb-util", "xcb-proto", "xorgproto"]
run = ["libxcb", "xcb-util"]

[build]
configure = "./configure --prefix=/usr --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
