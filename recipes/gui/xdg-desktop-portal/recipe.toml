# gui recipe: xdg-desktop-portal — desktop-agnostic D-Bus portal frontend.
# 1.18.4 is intentionally used with the current Faseela GLib 2.82 baseline.
[package]
name = "xdg-desktop-portal"
version = "1.18.4"
rel = 2
arch = ["x86_64"]
summary = "Desktop-agnostic portal frontend for D-Bus applications"
license = ["LGPL-2.1-or-later"]
source = "https://github.com/flatpak/xdg-desktop-portal/releases/download/%{version}/xdg-desktop-portal-%{version}.tar.xz"
sha256 = "b858aa1e74e80c862790dbb912906e6eab8b1e4db9339cd759473af62b461e65"

[depends]
build = ["meson", "ninja", "pkgconf", "dbus", "pipewire", "fuse3", "json-glib", "gdk-pixbuf", "bubblewrap"]
run = ["dbus", "pipewire", "fuse3", "json-glib", "gdk-pixbuf", "bubblewrap"]

[build]
# PipeWire 1.6 exposes pw_registry_add_listener() with a struct pw_registry*
# parameter. Upstream 1.18.4 stores the result as struct pw_proxy* and passes
# it without a cast; upstream 1.20.4 contains this exact compatibility cast.
configure = "sed -i 's/pw_registry_add_listener (remote->registry,/pw_registry_add_listener ((struct pw_registry*)remote->registry,/' src/pipewire.c && meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --buildtype=release -D systemd=disabled -D geoclue=disabled -D libportal=disabled -D docbook-docs=disabled -D pytest=disabled -D man-pages=disabled -D installed-tests=false -D sandboxed-image-validation=true"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
