# gui recipe: GCR/GCK — GNOME crypto and PKCS#11 base libraries
# GTK UI, introspection, SSH agent and systemd integration are disabled. The
# base/GCK libraries are the interfaces needed by gnome-keyring's Secret Service.
[package]
name = "gcr"
version = "3.41.2"
rel = 3
arch = ["x86_64"]
summary = "GNOME crypto and PKCS#11 base libraries"
license = ["LGPL-2.1-or-later"]
source = "https://download.gnome.org/sources/gcr/3.41/gcr-%{version}.tar.xz"
sha256 = "bad10f3c553a0e1854649ab59c5b2434da22ca1a54ae6138f1f53961567e1ab7"

[depends]
build = ["meson", "ninja", "pkgconf", "gettext", "glib", "libgcrypt", "p11-kit"]
run = ["glib", "libgcrypt", "p11-kit"]

[build]
configure = '''
# GCR 3.41.2 calls .path() on find_program(..., required: false) even when
# ssh_agent is disabled. Meson then fails if ssh-add/ssh-agent are absent.
# The paths are unused unless ssh_agent=true, so use empty values here.
python3 - <<'PY'
from pathlib import Path

path = Path("meson.build")
source = path.read_text(encoding="utf-8")
replacements = {
    "ssh_add_path = find_program('ssh-add', required: get_option('ssh_agent')).path()": "ssh_add_path = ''",
    "ssh_agent_path = find_program('ssh-agent', required: get_option('ssh_agent')).path()": "ssh_agent_path = ''",
}
for old, new in replacements.items():
    if source.count(old) != 1:
        raise SystemExit(f"expected exactly one occurrence of {old!r}")
    source = source.replace(old, new, 1)
path.write_text(source, encoding="utf-8")
PY

meson setup build --prefix=/usr --libdir=lib --sysconfdir=/etc --buildtype=release -Dintrospection=false -Dgtk=false -Dgtk_doc=false -Dssh_agent=false -Dsystemd=disabled -Dgpg_path=/usr/bin/false
'''
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
