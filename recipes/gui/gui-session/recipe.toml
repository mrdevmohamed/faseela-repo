# gui recipe: gui-session — Wayland desktop session: seatd service, start-sway, default fonts/terminal
[package]
name = "gui-session"
version = "0.1"
rel = 26
arch = ["x86_64"]
summary = "Wayland desktop session: seatd service, start-sway, default fonts/terminal/wallpaper/file manager"
license = ["MIT"]

[depends]
build = ["shadow"]
run = ["sway", "swaybg", "foot", "wmenu", "swaylock", "swayidle", "grim", "slurp", "wl-clipboard", "brightnessctl", "alsa-utils", "pipewire", "wireplumber", "audio-session", "network-manager", "bluez", "polkit", "dbus-system", "seatd", "mesa", "dejavu-fonts", "nerd-fonts-symbols", "eudev", "runit", "shadow", "base-files", "faseela-branding", "coreutils", "xdg-utils", "gnome-keyring", "upower", "rsync", "xdg-desktop-portal-gtk", "xdg-desktop-portal-wlr", "mako", "waybar", "xdg-user-dirs", "pavucontrol", "pcmanfm", "noto-fonts", "noto-fonts-arabic", "noto-naskh-arabic", "noto-color-emoji"]

[build]
install = '''
# --- DRM render-node permissions for Vulkan/OpenGL clients -------------------
install -d -m755 %{pkgdir}/etc/udev/rules.d
cat > %{pkgdir}/etc/udev/rules.d/70-faseela-drm.rules <<'DRM'
# Render nodes are safe for unprivileged GPU command submission; keep access
# limited to members of the render group.
SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0660"
DRM
chmod 644 %{pkgdir}/etc/udev/rules.d/70-faseela-drm.rules

# --- seatd supervised by runit (enabled by default) -------------------------
install -d -m755 %{pkgdir}/etc/sv/seatd %{pkgdir}/etc/runit/runsvdir/default
printf '#!/bin/sh\nexec seatd -g seat\n' > %{pkgdir}/etc/sv/seatd/run
chmod 755 %{pkgdir}/etc/sv/seatd/run
ln -s /etc/sv/seatd %{pkgdir}/etc/runit/runsvdir/default/seatd

# --- default wallpaper (the image comes from faseela-branding): sway's stock config has its own wallpaper line disabled;
#     this drop-in is read through its `include /etc/sway/config.d/*` -----------
install -d -m755 %{pkgdir}/etc/sway/config.d

# --- Xwayland: start the X11 server immediately -----------------------------
# Sway's default "enable" mode starts Xwayland lazily. The bundled Qt runtime
# used by Nekoray ships the xcb plugin but no Wayland QPA plugin, so ensure
# Xwayland is ready before the user launches X11-only desktop applications.
cat > %{pkgdir}/etc/sway/config.d/00-xwayland.conf <<'XWAYLAND'
xwayland force
XWAYLAND
chmod 644 %{pkgdir}/etc/sway/config.d/00-xwayland.conf

printf '# default wallpaper (needs swaybg)\noutput * bg /usr/share/backgrounds/faseela/default.png fill\n' \
    > %{pkgdir}/etc/sway/config.d/10-wallpaper.conf

# --- keyboard layouts: US + Arabic, Alt+Shift toggles (sway reads the drop-in) -
cat > %{pkgdir}/etc/sway/config.d/20-keyboard.conf <<'KBD'
# keyboard layouts (first one is the default); Alt+Shift switches
input type:keyboard {
    xkb_layout "us,ara"
    xkb_options "grp:alt_shift_toggle"
}
KBD
chmod 644 %{pkgdir}/etc/sway/config.d/20-keyboard.conf

# --- lock, idle, screenshots, brightness, volume (drop-in, read through sway's
#     `include /etc/sway/config.d/*`; $mod comes from sway's stock config) -----
cat > %{pkgdir}/etc/sway/config.d/30-session.conf <<'SES'
# lock the screen: $mod+Escape; also before suspend and after 5 min idle
set $lock swaylock -f -c 000000
bindsym $mod+Escape exec $lock
exec swayidle -w timeout 300 '$lock' before-sleep '$lock'

# screenshots to the clipboard (paste with wl-paste > file.png)
unbindsym Print
bindsym Print exec grim - | wl-copy -t image/png
bindsym $mod+Print exec grim -g "$(slurp)" - | wl-copy -t image/png

# brightness (needs group `video`) and volume (needs group `audio`)
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym XF86AudioRaiseVolume exec amixer -q sset Master 5%+ unmute
bindsym XF86AudioLowerVolume exec amixer -q sset Master 5%- unmute
bindsym XF86AudioMute exec amixer -q sset Master toggle
SES
chmod 644 %{pkgdir}/etc/sway/config.d/30-session.conf

# --- XDG Desktop Portal: GTK for the general interfaces, wlr for ScreenCast --
# Sway's XDG_CURRENT_DESKTOP value is set by start-sway. Keep this config in
# the vendor data directory so the portal frontend can select its backends:
# the GTK backend answers the file chooser and friends, xdg-desktop-portal-wlr
# answers ScreenCast through PipeWire (semicolon-separated preference list).
install -d -m755 %{pkgdir}/usr/share/xdg-desktop-portal
cat > %{pkgdir}/usr/share/xdg-desktop-portal/sway-portals.conf <<'PORTALS'
[preferred]
default=gtk;wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
PORTALS
chmod 644 %{pkgdir}/usr/share/xdg-desktop-portal/sway-portals.conf

# D-Bus activation happens in the per-session bus created by dbus-run-session.
# Import the compositor-created Wayland variables so portal backends inherit
# the correct display and desktop identity.
cat >> %{pkgdir}/etc/sway/config.d/30-session.conf <<'PORTALENV'
# Make the active Wayland session visible to D-Bus-activated desktop portals.
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
PORTALENV
# Audio must start for every Sway entry path, not only start-sway. The helper
# is idempotent so the explicit start-sway preflight and Sway autostart coexist.
cat >> %{pkgdir}/etc/sway/config.d/30-session.conf <<'AUDIO'
# Start the per-user PipeWire stack even when Sway is launched directly.
exec /usr/bin/faseela-audio-session
AUDIO

# --- desktop services: notifications, status bar, XDG user directories ------
# mako owns org.freedesktop.Notifications (the portal frontend routes its
# Notification interface there); waybar gives the session a bar with clock,
# workspaces, network and volume; xdg-user-dirs-update creates ~/Desktop,
# ~/Downloads, ... once per session and exits.
cat >> %{pkgdir}/etc/sway/config.d/30-session.conf <<'DESKTOP'
# Notification daemon (org.freedesktop.Notifications, also used by the portals)
exec mako
# Status bar: workspaces, tray-enabled clock, network and PulseAudio volume
exec waybar
# Create the XDG user directories (~/Desktop, ~/Downloads, ...) once
exec xdg-user-dirs-update
DESKTOP

# --- start-sway: launch a Sway session from a text console ------------------
install -d -m755 %{pkgdir}/usr/bin
cat > %{pkgdir}/usr/bin/start-sway <<'EOF'
#!/bin/sh
# start-sway — start a Sway session from a tty.
# Needs: the seatd service running and your user in groups seat,video,input.
uid=$(id -u)
if [ -z "$XDG_RUNTIME_DIR" ]; then
    if [ -d "/run/user/$uid" ] && [ -O "/run/user/$uid" ]; then
        XDG_RUNTIME_DIR=/run/user/$uid
    else
        XDG_RUNTIME_DIR=/tmp/runtime-$uid
        mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
    fi
    [ -O "$XDG_RUNTIME_DIR" ] || { echo "start-sway: $XDG_RUNTIME_DIR is not yours" >&2; exit 1; }
    export XDG_RUNTIME_DIR
fi
export XDG_SESSION_TYPE=wayland
export XDG_CURRENT_DESKTOP=sway
# Start per-user audio services; system services are supervised by runit.
if command -v dbus-run-session >/dev/null 2>&1; then
    exec dbus-run-session -- sh -c '
        pw= wp= pp=
        cleanup() {
            [ -z "$pp" ] || kill "$pp" 2>/dev/null
            [ -z "$wp" ] || kill "$wp" 2>/dev/null
            [ -z "$pw" ] || kill "$pw" 2>/dev/null
        }
        trap cleanup EXIT INT TERM

        pipewire & pw=$!
        # pipewire-pulse and WirePlumber are clients; wait for the core socket first.
        i=0
        while [ ! -S "$XDG_RUNTIME_DIR/pipewire-0" ] &&
              [ "$i" -lt 50 ] && kill -0 "$pw" 2>/dev/null; do
            sleep 0.1
            i=$((i + 1))
        done
        if [ ! -S "$XDG_RUNTIME_DIR/pipewire-0" ]; then
            echo "start-sway: PipeWire did not create its native socket" >&2
            exit 1
        fi

        wireplumber & wp=$!
        pipewire-pulse & pp=$!
        # Do not start the desktop before the PulseAudio-compatible socket exists.
        i=0
        while [ ! -S "$XDG_RUNTIME_DIR/pulse/native" ] &&
              [ "$i" -lt 50 ] && kill -0 "$pp" 2>/dev/null; do
            sleep 0.1
            i=$((i + 1))
        done
        if [ ! -S "$XDG_RUNTIME_DIR/pulse/native" ]; then
            echo "start-sway: pipewire-pulse did not create its native socket" >&2
            exit 1
        fi
        sway "$@"
    ' sh "$@"
fi
export LIBSEAT_BACKEND=seatd
# mesa here ships software rendering only (llvmpipe, softpipe) plus virgl; wlroots
# refuses software GL unless this is set
: "${WLR_RENDERER_ALLOW_SOFTWARE:=1}"
export WLR_RENDERER_ALLOW_SOFTWARE
exec sway "$@"
EOF
chmod 755 %{pkgdir}/usr/bin/start-sway

# --- /etc/profile.d: make a plain `sway` work from a login shell ------------
#     (without XDG_RUNTIME_DIR sway aborts immediately)
install -d -m755 %{pkgdir}/etc/profile.d
cat > %{pkgdir}/etc/profile.d/gui-session.sh <<'EOF'
# /etc/profile.d/gui-session.sh — environment for running sway from a tty
if [ -z "$XDG_RUNTIME_DIR" ]; then
    _uid=$(id -u)
    if [ -d "/run/user/$_uid" ] && [ -O "/run/user/$_uid" ]; then
        XDG_RUNTIME_DIR=/run/user/$_uid
    elif [ "$_uid" = 0 ]; then
        XDG_RUNTIME_DIR=/run/user/0
        mkdir -p "$XDG_RUNTIME_DIR" 2>/dev/null && chmod 700 "$XDG_RUNTIME_DIR"
    else
        XDG_RUNTIME_DIR=/tmp/runtime-$_uid
        mkdir -p "$XDG_RUNTIME_DIR" 2>/dev/null && chmod 700 "$XDG_RUNTIME_DIR"
    fi
    if [ -d "$XDG_RUNTIME_DIR" ] && [ -O "$XDG_RUNTIME_DIR" ]; then
        export XDG_RUNTIME_DIR
    else
        unset XDG_RUNTIME_DIR
    fi
    unset _uid
fi
export LIBSEAT_BACKEND=seatd
# mesa here ships software rendering only (llvmpipe, softpipe) plus virgl; wlroots
# refuses software GL unless this is set
: "${WLR_RENDERER_ALLOW_SOFTWARE:=1}"
export WLR_RENDERER_ALLOW_SOFTWARE
EOF
chmod 644 %{pkgdir}/etc/profile.d/gui-session.sh
'''

[hooks]
post_install = '''for g in seat video render input audio; do
    /usr/libexec/faseela/ensure-system-account group "$g"
done
# Apply the DRM node rule immediately when installing into a running system.
udevadm control --reload-rules 2>/dev/null || true
udevadm trigger --subsystem-match=drm 2>/dev/null || true
udevadm settle 2>/dev/null || true
echo "gui-session: add your user:  usermod -aG seat,video,render,input,audio <user>"
echo "gui-session: then log in on a tty and run:  start-sway"

# Xtrans requires the shared X11 socket directory to be root-owned and sticky.
# Keep this safe across installs even if a previous user-launched Xwayland
# created /tmp/.X11-unix with the wrong owner.
mkdir -p /tmp/.X11-unix
chown root:root /tmp/.X11-unix
chmod 1777 /tmp/.X11-unix
'''
