# gui recipe: harfbuzz — OpenType text shaping engine
[package]
name = "harfbuzz"
version = "10.0.1"
rel = 3
arch = ["x86_64"]
summary = "OpenType text shaping engine"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "harfbuzz"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/%{version}/harfbuzz-%{version}.tar.xz"
sha256 = "b2cb13bd351904cb9038f907dc0dee0ae07127061242fe3556b2795c4e9748fc"
strip_components = 1

[depends]
# glib + gobject + introspection enabled so HarfBuzz-0.0.gir is generated:
# pango's GIR scan --include=HarfBuzz-0.0 and gtk3's GIR need it. The
# scanner itself needs setuptools (distutils .pth) in the build root.
build = ["meson", "ninja", "pkgconf", "freetype", "glib", "gobject-introspection", "glib-gir", "setuptools"]
run = ["freetype", "glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D glib=enabled -D gobject=enabled -D icu=disabled -D cairo=disabled -D freetype=enabled -D tests=disabled -D docs=disabled -D introspection=enabled -D benchmark=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
