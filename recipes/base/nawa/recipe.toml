# base recipe: nawa — this distribution's source-based package manager (self-hosting build)
#
# The source is pinned to one upstream commit and verified independently by
# SHA-256. The multi-source schema extracts the GitHub archive directly into
# the source workspace (strip_components = 1).
#
# The commit, version, and source hash are maintained by:
#   python3 scripts/pin-nawa-source.py [<nawa commit>]
# bootstrap/fetch-nawa.sh reads the same pin from this recipe.
[package]
name = "nawa"
version = "1.0.0"
rel = 16
arch = ["x86_64"]
summary = "nawa — this distribution's source-based package manager (self-hosting build)"
license = ["GPL-3.0"]
# Fail closed on Nawa versions that predate the multi-source recipe schema.
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "nawa"
url = "https://github.com/mrdevmohamed/nawa/archive/b2802092ee1fb9c97b05f2d55dc6b02b00a75c7b.tar.gz"
sha256 = "25e307282ffd1149f5f0364e73d47a6b21c0489b90ffbf4fe15fb9fff3f01d30"
strip_components = 1

[depends]
build = ["rust"]
run = []

[build]
# All Rust crates are included in vendor/ and selected by .cargo/config.toml.
# Keep the build fully offline; no [fetch.cargo] phase is necessary.
compile = "cargo build --release --offline --locked"
install = """
install -Dm755 target/release/nawa %{pkgdir}/usr/bin/nawa
# system-wide configuration: default repository + install mode
install -Dm644 dist/nawa.toml %{pkgdir}/etc/nawa/nawa.toml
# Faseela's active package endpoint uses the signed schema-v3 index.
# Keep the old stable endpoint available for already-installed schema-v1 clients.
sed -i 's|releases/download/stable"|releases/download/stable-v3"|' %{pkgdir}/etc/nawa/nawa.toml
"""
