name: Temporary Huion package inspection

on:
  push:
    branches:
      - add/huion-hs64-driver
    paths:
      - .github/workflows/huion-package-inspection.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect the official Huion package
        shell: bash
        run: |
          set -euo pipefail
          url='https://driverdl.huion.com/driver/Linux/HuionTablet_LinuxDriver_v15.0.0.193.x86_64.deb'
          deb="$RUNNER_TEMP/huiontablet.deb"
          curl --fail --location --retry 3 --connect-timeout 20 "$url" --output "$deb"
          echo '=== SHA-256 ==='
          sha256sum "$deb"
          echo '=== File type ==='
          file "$deb"
          echo '=== Debian metadata ==='
          dpkg-deb --field "$deb" Package Version Architecture Depends
          echo '=== Payload files (first 250) ==='
          dpkg-deb --contents "$deb" | head -n 250
