# creative recipe: designcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "designcraft"
version = "0.16.0"
rel = 2
arch = ["x86_64"]
summary = "Native page-layout and desktop-publishing application"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/designcraft/releases/download/v0.16.0/designcraft-0.16.0-linux-x86_64.tar.gz"
sha256 = "a486fc43cdc8f245edaf737cbb1c9a32860ee18a8dca1bafe08111014e2f1576"
source_dir = "designcraft-0.16.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland"]

[build]
install = """
set -eu

# Upstream release archives may be opened at the package directory or at the
# archive extraction root. Locate the FHS usr tree in either layout.
upstream_usr_bin="$(find . -type d -path '*/usr/bin' -print -quit)"
if [ -z "$upstream_usr_bin" ]; then
    echo "designcraft: upstream archive has no usr/bin directory below $(pwd)" >&2
    exit 1
fi
upstream_usr="${upstream_usr_bin%/bin}"
install -d -m755 "%{pkgdir}/usr"
cp -a "$upstream_usr/." "%{pkgdir}/usr/"
"""
