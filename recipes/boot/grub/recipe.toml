# boot recipe: GRand Unified Bootloader
# BIOS and EFI are configured out of tree in separate directories. GRUB's
# configure links include/grub/{cpu,machine} into the build directory; sharing
# a configured source tree makes the second platform pick up the wrong headers.
[package]
name = "grub"
version = "2.14"
rel = 11
arch = ["x86_64"]
summary = "GRand Unified Bootloader"
license = ["GPL-3.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "grub"
url = "https://mirrors.kernel.org/gnu/grub/grub-2.14.tar.xz"
sha256 = "bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43"
strip_components = 1

[depends]
build = ["autoconf", "automake", "bison", "flex", "gettext", "libtool"]
run = ["efibootmgr"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
# Revert the two upstream configure changes used by Yocto/OpenEmbedded and
# Buildroot for GRUB 2.14: the --image-base probe can move the BIOS entry point
# away from 0x9000, and its follow-up diagnostic unnecessarily requires
# autoconf-archive. Regenerate configure from the patched configure.ac.
prepare = '''
set -eu
# Revert GRUB 2.14's linker --image-base probe. This is the distro workaround
# carried by Yocto/OpenEmbedded and Buildroot for the 0x9074 BIOS entry issue.
patch -p1 <<'PATCH'
From 3a9d2dd2f5fb07b75a74c307d61b9b9fc5d20a62 Mon Sep 17 00:00:00 2001
From: Yi Zhao <yi.zhao@windriver.com>
Date: Fri, 27 Feb 2026 11:46:54 +0800
Subject: [PATCH] Revert "configure: Check linker for --image-base support"

---
 acinclude.m4 |  5 -----
 configure.ac | 14 ++------------
 2 files changed, 2 insertions(+), 17 deletions(-)

diff --git a/acinclude.m4 b/acinclude.m4
index 70c1912f8..fa7840f09 100644
--- a/acinclude.m4
+++ b/acinclude.m4
@@ -79,11 +79,6 @@ AC_DEFUN([grub_PROG_OBJCOPY_ABSOLUTE],
 [AC_MSG_CHECKING([whether ${TARGET_OBJCOPY} works for absolute addresses])
 AC_CACHE_VAL(grub_cv_prog_objcopy_absolute,
 [cat > conftest.c <<\EOF
-asm (
-    ".globl start, _start, __start\n"
-    ".ifdef cmain; .set start = _start = __start = cmain\n.endif\n"
-    ".ifdef _cmain; .set start = _start = __start = _cmain\n.endif\n"
-);
 void cmain (void);
 void
 cmain (void)
diff --git a/configure.ac b/configure.ac
index d8ca1b7c1..041cfbab4 100644
--- a/configure.ac
+++ b/configure.ac
@@ -1461,6 +1461,7 @@ elif test x$grub_cv_target_cc_link_format = x-mi386pe || test x$grub_cv_target_c
   TARGET_IMG_LDSCRIPT='$(top_srcdir)'"/conf/i386-cygwin-img-ld.sc"
   TARGET_IMG_LDFLAGS="-Wl,-T${TARGET_IMG_LDSCRIPT}"
   TARGET_IMG_LDFLAGS_AC="-Wl,-T${srcdir}/conf/i386-cygwin-img-ld.sc"
+  TARGET_IMG_BASE_LDOPT="-Wl,-Ttext"
   TARGET_IMG_CFLAGS=
 else
   TARGET_APPLE_LINKER=0
@@ -1468,6 +1469,7 @@ else
   TARGET_IMG_LDSCRIPT=
   TARGET_IMG_LDFLAGS='-Wl,-N'
   TARGET_IMG_LDFLAGS_AC='-Wl,-N'
+  TARGET_IMG_BASE_LDOPT="-Wl,-Ttext"
   TARGET_IMG_CFLAGS=
 fi

@@ -1798,18 +1800,6 @@ grub_PROG_TARGET_CC
 m4_ifndef([AX_CHECK_LINK_FLAG], [m4_fatal([autoconf-archive is missing. You
 must install it to generate the configure script.])])

 if test "x$TARGET_APPLE_LINKER" != x1 ; then
-AX_CHECK_LINK_FLAG([-Wl,--image-base,0x400000],
-    [TARGET_IMG_BASE_LDOPT="-Wl,--image-base"],
-    [TARGET_IMG_BASE_LDOPT="-Wl,-Ttext"],
-    [],
-    [AC_LANG_SOURCE([
-asm (".globl start; start:");
-asm (".globl _start; _start:");
-asm (".globl __start; __start:");
-void __main (void);
-void __main (void) {}
-int main (void);
-    ])])
 grub_PROG_OBJCOPY_ABSOLUTE
 fi
 grub_PROG_LD_BUILD_ID_NONE
PATCH
# The companion Yocto revert removes the archive-only fatal check. The
# source tarball's surrounding comments differ, so remove the two-line macro
# block by its exact macro name rather than depending on line-number context.
sed -i '/^[[:space:]]*m4_ifndef.*AX_CHECK_LINK_FLAG/,+1d' configure.ac
if grep -q 'm4_ifndef.*AX_CHECK_LINK_FLAG' configure.ac; then
    echo "grub: autoconf-archive fatal check remains after the configure revert" >&2
    exit 1
fi
autoreconf -fi
'''

configure = """
set -eu
mkdir build-pc build-efi
# Preserve Nawa's native compiler/toolchain environment for configure's
# executable test. Freestanding flags here can produce a test binary that the
# configure probe cannot run; GRUB's own target flags control its image code.
# BIOS: native pc platform. EFI: a separate x86_64-efi target build.
#
# BIOS kernel.img must start with startup.S's `_start` (entry point 0x9000): lzma_decompress
# jumps to the first byte of the decompressed kernel. Nawa builds with CFLAGS="-O2 -pipe", and
# GCC then splits functions into .text.unlikely / .text.startup / hot-cold parts that GNU ld
# places BEFORE .text, i.e. before startup.S. The published grub 2.14-3, 2.14-4 and 2.14-9 all
# have `Entry point address: 0x9023` and a 35-byte cold fragment (`sub $0xc,%esp; push ...;
# call`) at 0x9000, so a BIOS-installed disk executes that instead of startup.S and dies before
# GRUB's first message (UEFI is unaffected: its image is relocated, not a flat binary).
# TARGET_CC is the compiler GRUB uses for the i386-pc image code only; the wrapper adds the two
# flags LAST so they win however configure composes its own flags. Host tools are untouched.
cat > $PWD/target-cc <<'WRAP'
#!/bin/sh
exec gcc "$@" -fno-reorder-functions -fno-reorder-blocks-and-partition
WRAP
chmod +x $PWD/target-cc
(cd build-pc && TARGET_CC=$PWD/../target-cc ../configure --prefix=/usr --sysconfdir=/etc --disable-werror --disable-efiemu --disable-nls)
(cd build-efi && ../configure --prefix=/usr --sysconfdir=/etc --disable-werror --disable-efiemu --disable-nls --with-platform=efi --target=x86_64)
# The source tree must remain unconfigured; otherwise EFI can consume i386 headers.
if [ -e include/grub/cpu ] || [ -e include/grub/machine ]; then
    echo "grub: source tree was configured in tree; EFI would use the wrong headers" >&2
    exit 1
fi
"""

compile = """
set -eu
make -C build-pc -j%{jobs}
make -C build-efi -j%{jobs}
# The invariant above, checked where it breaks: fail the package build instead of publishing a
# bootloader that cannot start. readelf runs on the unstripped build output.
entry=$(readelf -h build-pc/grub-core/kernel.exec | awk '/Entry point address/ {print $4}')
if [ "$entry" != 0x9000 ]; then
    echo "grub: i386-pc kernel.exec entry point is '$entry', not 0x9000: code was linked before startup.S (see configure)" >&2
    exit 1
fi
# Exercise GRUB's own BIOS image validation path.
build-pc/grub-mkimage -d build-pc/grub-core -O i386-pc -o build-pc/grub-core/test-core.img -p /boot/grub biosdisk part_msdos ext2 normal
test -s build-pc/grub-core/test-core.img
"""

# BIOS: install tools and i386-pc modules. EFI: install into a scratch tree and
# retain only x86_64-efi modules so host tools from the BIOS build stay intact.
install = """
set -eu
make -C build-pc DESTDIR=%{pkgdir} install
# modinfo.sh records the target compiler; with the configure wrapper that is a sandbox path,
# which Nawa's lint rejects. Nothing at run time uses it, so record the plain compiler name.
sed -i "s|^grub_target_cc='[^']*target-cc'|grub_target_cc='gcc'|" %{pkgdir}/usr/lib/grub/i386-pc/modinfo.sh
if grep -q /build/src %{pkgdir}/usr/lib/grub/i386-pc/modinfo.sh; then
    echo "grub: modinfo.sh still records a sandbox path" >&2
    exit 1
fi
efi_stage=$PWD/efi-stage
make -C build-efi DESTDIR=$efi_stage install
cp -a $efi_stage/usr/lib/grub/x86_64-efi %{pkgdir}/usr/lib/grub/
rm -rf $efi_stage
test -f %{pkgdir}/usr/lib/grub/i386-pc/modinfo.sh
test -f %{pkgdir}/usr/lib/grub/x86_64-efi/modinfo.sh
test -f %{pkgdir}/usr/lib/grub/x86_64-efi/kernel.img
"""
