# base recipe: GNU pattern matcher (grep)
[package]
name = "grep"
version = "3.12"
rel = 2
arch = ["x86_64"]
summary = "GNU pattern matcher (grep)"
license = ["GPL-3.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
