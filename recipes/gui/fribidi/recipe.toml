# gui recipe: fribidi — Unicode bidirectional algorithm library
[package]
name = "fribidi"
version = "1.0.16"
rel = 2
arch = ["x86_64"]
summary = "Unicode bidirectional algorithm library"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "fribidi"
url = "https://github.com/fribidi/fribidi/releases/download/v%{version}/fribidi-%{version}.tar.xz"
sha256 = "1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf"]
run = []

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D docs=false -D tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
