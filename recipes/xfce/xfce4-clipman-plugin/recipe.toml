# xfce recipe: xfce4-clipman-plugin — Clipboard manager panel plugin with history
[package]
name = "xfce4-clipman-plugin"
version = "1.6.7"
rel = 3
arch = ["x86_64"]
summary = "Clipboard manager panel plugin with history"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-clipman-plugin/1.6/xfce4-clipman-plugin-1.6.7.tar.bz2"
sha256 = "9bae27808a50e959e0912b7202ea5d651ed7401a6fc227f811d9bdaf2e44178c"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''
set -eu
make DESTDIR=%{pkgdir} install

# Clipman's panel plugin loads this stock icon through GTK's hicolor theme.
# Validate all upstream icon variants so a partial install cannot ship blank.
icon_root="%{pkgdir}/usr/share/icons/hicolor"
for icon in \
    "$icon_root/16x16/apps/xfce4-clipman-plugin.png" \
    "$icon_root/24x24/apps/xfce4-clipman-plugin.png" \
    "$icon_root/32x32/apps/xfce4-clipman-plugin.png" \
    "$icon_root/48x48/apps/xfce4-clipman-plugin.png" \
    "$icon_root/64x64/apps/xfce4-clipman-plugin.png" \
    "$icon_root/scalable/apps/xfce4-clipman-plugin.svg" \
    "$icon_root/16x16/apps/clipman-symbolic.svg"; do
    test -s "$icon" || {
        echo "xfce4-clipman-plugin: missing installed icon: $icon" >&2
        exit 1
    }
done
'''

[hooks]
post_install = '''
set -eu
# Refresh the hicolor lookup cache so the panel can resolve the plugin icon.
gtk-update-icon-cache --force /usr/share/icons/hicolor
'''
