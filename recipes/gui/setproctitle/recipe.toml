# gui recipe: setproctitle — Set the process title from Python (C extension)
# Cinnamon's Python helpers import setproctitle at runtime.
#
# Build approach: pip with --no-build-isolation (setuptools from the repo's
# setuptools recipe, pip from the repo's pip recipe). Verified empirically
# against the repo's exact toolchain (setuptools 84.2.1 + pip 26.3, no wheel
# package installed): `pip install --no-build-isolation --no-deps` builds
# the wheel and installs it under --prefix/--root correctly. The legacy
# `python3 setup.py install` also runs, but it lands in /usr/local on
# Debian-style sysconfig layouts instead of respecting --prefix, so pip is
# the reliable path. --no-index/--no-cache-dir keep the build offline.
[package]
name = "setproctitle"
version = "1.3.8"
rel = 2
arch = ["x86_64"]
summary = "Set the process title from Python"
license = ["BSD-3-Clause"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "setproctitle"
url = "https://files.pythonhosted.org/packages/49/b0/6b8a516c5a9e9630bd5293db78314ac012f690305fe93beadea388626efb/setproctitle-%{version}.tar.gz"
sha256 = "cafe209d064a6efb88cb45a03e97981ff8832802b2b5d009dde0197a3b7b41c8"
strip_components = 1

[depends]
build = ["python", "pip", "setuptools"]
run = ["python"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
install = '''
python3 -m pip install --no-build-isolation --no-deps --no-index --no-cache-dir --disable-pip-version-check --prefix=/usr --root=%{pkgdir} .
find %{pkgdir} -name __pycache__ -prune -exec rm -rf {} +
'''
