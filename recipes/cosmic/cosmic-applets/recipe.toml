# cosmic recipe: cosmic-applets — panel applets: audio, battery, bluetooth,
# network, time, workspaces, notifications, power, tiling, minimize, a11y,
# input sources, status area, app library, panel buttons.
# Upstream builds every applet from one workspace. The installed binaries are
# symlinks to the single `cosmic-applets` multi-call binary, exactly like the
# upstream `just install` target (_link_applet): the applet identity is
# selected through argv[0]. Default RON schemas keep the
# /usr/share/cosmic/<app-id>/v1/<key> layout that cosmic-config reads.
[package]
name = "cosmic-applets"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "COSMIC panel applets (audio, network, bluetooth, battery, time, ...)"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-applets"
url = "https://codeload.github.com/pop-os/cosmic-applets/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "75738474a60447922412e771d7cdf691218143c3acc22c8ebd0174ba78354790"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "eudev", "wayland", "libxkbcommon"]
run = ["eudev", "wayland", "libxkbcommon", "mesa", "cosmic-icons", "hicolor-icon-theme", "dbus", "network-manager", "bluez", "upower", "pipewire"]

[fetch.cargo]
dir = "."

[build]
# Applet symlink set mirrors the upstream install recipe: _install_applet
# entries link the applet name, _install_button entries the panel buttons.
# The argv[0] names handled by the cosmic-applets multi-call binary get
# symlinks; the panel-button desktop entries (cosmic-panel-{app,launcher,
# workspaces}-button) are resolved by the panel through their desktop files
# and ship data only, like the upstream _install_button helper.
compile = "cargo build --release --offline --locked -p cosmic-applets"
install = '''
bindir=%{pkgdir}/usr/bin
install -Dm755 target/release/cosmic-applets "$bindir/cosmic-applets"
for name in cosmic-app-list cosmic-panel-button \
            cosmic-applet-a11y cosmic-applet-audio cosmic-applet-input-sources \
            cosmic-applet-battery cosmic-applet-bluetooth cosmic-applet-minimize \
            cosmic-applet-network cosmic-applet-notifications cosmic-applet-power \
            cosmic-applet-status-area cosmic-applet-tiling cosmic-applet-time \
            cosmic-applet-workspaces; do
    ln -sf cosmic-applets "$bindir/$name"
done

# Desktop entries, icons and default schemas per applet member. The three
# cosmic-panel-*-button members only carry desktop entries and icons.
for name in cosmic-app-list cosmic-panel-button \
            cosmic-applet-a11y cosmic-applet-audio cosmic-applet-input-sources \
            cosmic-applet-battery cosmic-applet-bluetooth cosmic-applet-minimize \
            cosmic-applet-network cosmic-applet-notifications cosmic-applet-power \
            cosmic-applet-status-area cosmic-applet-tiling cosmic-applet-time \
            cosmic-applet-workspaces \
            cosmic-panel-app-button cosmic-panel-launcher-button \
            cosmic-panel-workspaces-button; do
    if [ -d "$name/data/icons" ]; then
        find "$name/data/icons" -type f | while read -r f; do
            rel=${f#*/icons/}
            install -Dm644 "$f" "%{pkgdir}/usr/share/icons/hicolor/$rel"
        done
    fi
    for d in "$name"/data/*.desktop; do
        [ -f "$d" ] && install -Dm644 "$d" \
            "%{pkgdir}/usr/share/applications/$(basename "$d")"
    done
    if [ -d "$name/data/default_schema" ]; then
        find "$name/data/default_schema" -type f | while read -r f; do
            rel=${f#*/default_schema/}
            install -Dm644 "$f" "%{pkgdir}/usr/share/cosmic/$rel"
        done
    fi
done

# Root metainfo shipped by the workspace.
for d in data/*.metainfo.xml; do
    [ -f "$d" ] && install -Dm644 "$d" \
        "%{pkgdir}/usr/share/metainfo/$(basename "$d")"
done

# Status-area tray support: D-Bus activation for the StatusNotifierWatcher
# (the @bindir@ placeholder upstream substitutes with the prefix). The
# SystemdService= key is only meaningful under systemd and is ignored by
# dbus-daemon on a runit system, so it ships as upstream wrote it.
install -d -m755 %{pkgdir}/usr/share/dbus-1/services
sed "s|@bindir@|/usr/bin|" \
    cosmic-applet-status-area/data/dbus-1/com.system76.CosmicStatusNotifierWatcher.service.in \
    > %{pkgdir}/usr/share/dbus-1/services/com.system76.CosmicStatusNotifierWatcher.service
chmod 644 %{pkgdir}/usr/share/dbus-1/services/com.system76.CosmicStatusNotifierWatcher.service
test -x %{pkgdir}/usr/bin/cosmic-applet-audio
test -f %{pkgdir}/usr/share/cosmic/com.system76.CosmicAppList/v1/favorites
'''
