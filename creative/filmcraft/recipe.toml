# creative recipe: filmcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "filmcraft"
version = "0.16.0"
rel = 4
arch = ["x86_64"]
summary = "Native video editor with timeline, colour grading and effects"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz"
sha256 = "588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9"
source_dir = "filmcraft-0.16.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland", "alsa-lib", "pipewire"]

[build]
install = """
set -eu

# Storytold Linux release archives use bin/ and share/ at their FHS root.
# Accept both that layout and a conventional usr/ tree. Some archives wrap
# the payload in one top-level release directory.
upstream_root=""
if [ -d "bin" ] || [ -d "usr/bin" ]; then
    upstream_root="."
else
    for candidate in */; do
        if [ -d "${candidate}bin" ] || [ -d "${candidate}usr/bin" ]; then
            upstream_root="${candidate%/}"
            break
        fi
    done
fi

if [ -z "$upstream_root" ]; then
    echo "filmcraft: upstream archive has neither bin/ nor usr/bin/ below $(pwd)" >&2
    exit 1
fi

if [ -d "$upstream_root/usr/bin" ]; then
    install -d -m755 "%{pkgdir}/usr"
    cp -a "$upstream_root/usr/." "%{pkgdir}/usr/"
else
    install -d -m755 "%{pkgdir}/usr/bin"
    cp -a "$upstream_root/bin/." "%{pkgdir}/usr/bin/"
    if [ -d "$upstream_root/share" ]; then
        install -d -m755 "%{pkgdir}/usr/share"
        cp -a "$upstream_root/share/." "%{pkgdir}/usr/share/"
    fi
fi

# Preserve the upstream executable, but route Faseela's Wayland session to
# the native Wayland backend. Several Craft apps otherwise prefer XWayland
# whenever DISPLAY is set, even when that X server is not reachable.
upstream_bin="%{pkgdir}/usr/bin/filmcraft"
if [ ! -x "$upstream_bin" ]; then
    echo "filmcraft: upstream archive did not install usr/bin/filmcraft" >&2
    exit 1
fi
mv "$upstream_bin" "${upstream_bin}.real"
cat > "$upstream_bin" <<'LAUNCHER'
#!/bin/sh
set -eu

app_name="filmcraft"
script_dir=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
upstream="$script_dir/$app_name.real"

if [ ! -x "$upstream" ]; then
    echo "$app_name: upstream executable is missing: $upstream" >&2
    exit 1
fi

# Explicit escape hatch for users who need XWayland-only features such as
# file drag-and-drop. This requires a working X server in DISPLAY.
if [ "${FASEELA_CRAFT_USE_XWAYLAND:-0}" = "1" ]; then
    if [ -z "${DISPLAY:-}" ]; then
        echo "$app_name: FASEELA_CRAFT_USE_XWAYLAND=1 requires a working DISPLAY." >&2
        exit 1
    fi
    export WINIT_UNIX_BACKEND=x11
    case "$app_name" in
    filmcraft) unset FILMCRAFT_WAYLAND ;;
    esac
    exec "$upstream" "$@"
fi

wayland_active=0
if [ -n "${WAYLAND_DISPLAY:-}" ]; then
    if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
        echo "$app_name: XDG_RUNTIME_DIR is missing; start the app from Faseela's active Sway session." >&2
        exit 1
    fi
    case "$WAYLAND_DISPLAY" in
        /*) wayland_socket="$WAYLAND_DISPLAY" ;;
        *)  wayland_socket="$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ;;
    esac
    if [ ! -S "$wayland_socket" ]; then
        echo "$app_name: Wayland socket is unavailable: $wayland_socket" >&2
        exit 1
    fi
    wayland_active=1
elif [ -n "${WAYLAND_SOCKET:-}" ]; then
    # Wayland may hand the compositor connection to the app as an inherited FD.
    wayland_active=1
elif [ "${XDG_SESSION_TYPE:-}" = "wayland" ]; then
    echo "$app_name: this is marked as a Wayland session, but WAYLAND_DISPLAY and WAYLAND_SOCKET are missing." >&2
    echo "Start or re-enter Faseela's Sway session, then launch the app from its terminal or menu." >&2
    exit 1
elif [ -n "${DISPLAY:-}" ]; then
    # Preserve normal X11 launches outside Faseela's Wayland session.
    exec "$upstream" "$@"
else
    echo "$app_name: no graphical session found (DISPLAY, WAYLAND_DISPLAY and WAYLAND_SOCKET are all missing)." >&2
    echo "Launch it from a desktop session, or run start-sway from a Faseela TTY first." >&2
    exit 1
fi

if [ "$wayland_active" -eq 1 ]; then
    export WINIT_UNIX_BACKEND=wayland
    # Tell each upstream app not to force its optional XWayland path merely
    # because DISPLAY was inherited from the compositor.
    case "$app_name" in
    filmcraft) FILMCRAFT_WAYLAND=1; export FILMCRAFT_WAYLAND ;;
    esac
fi

unset DISPLAY
exec "$upstream" "$@"
LAUNCHER
chmod 755 "$upstream_bin"
"""