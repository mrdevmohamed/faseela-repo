# browser recipe: libXcomposite — X Composite extension client library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXcomposite"
version = "0.4.6"
rel = 1
arch = ["x86_64"]
summary = "X Composite extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXcomposite-%{version}.tar.xz"
sha256 = "fe40bcf0ae1a09070eba24088a5eb9810efe57453779ec1e20a55080c6dc2c87"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXfixes"]
run = ["libX11", "libXfixes"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
