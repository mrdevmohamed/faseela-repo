# xorg recipe: libXt — X11 Toolkit Intrinsics library
[package]
name = "libXt"
version = "1.3.1"
rel = 1
arch = ["x86_64"]
summary = "X11 Toolkit Intrinsics library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXt-1.3.1.tar.xz"
sha256 = "e0a774b33324f4d4c05b199ea45050f87206586d81655f8bef4dba434d931288"

[depends]
build = ["pkgconf", "libSM", "libICE", "libX11", "xorgproto"]
run = ["libSM", "libICE", "libX11"]

[build]
configure = "./configure --prefix=/usr --libdir=lib --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
