# extra recipe: libpulse — PulseAudio-compatible client libraries and CLI tools.
# Faseela uses PipeWire as its sound server; do not build/install the PulseAudio
# daemon. The client build provides pactl/pacat and their aliases against
# PipeWire's pipewire-pulse compatibility endpoint.
[package]
name = "libpulse"
version = "17.0"
rel = 3
arch = ["x86_64"]
summary = "PulseAudio-compatible client libraries and command-line tools"
license = ["LGPL-2.1-or-later"]
source = "https://freedesktop.org/software/pulseaudio/releases/pulseaudio-%{version}.tar.xz"
sha256 = "053794d6671a3e397d849e478a80b82a63cb9d8ca296bd35b73317bb5ceb87b5"
source_dir = "pulseaudio-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "m4", "glib", "libsndfile"]
run = ["glib", "libsndfile"]

[build]
configure = """
# The upstream client utilities (pactl and pacat) use libsndfile for sample
# upload and file playback/recording. Keep the dependency enabled for the
# client build even though the PulseAudio daemon itself is disabled.
python3 - <<'PY'
from pathlib import Path

p = Path("meson.build")
s = p.read_text()
old = "sndfile_dep = dependency('sndfile', version : '>= 1.0.20')"
new = "sndfile_dep = dependency('sndfile', version : '>= 1.0.20', required : (get_option('daemon') or get_option('client')))"
assert s.count(old) == 1, "unexpected PulseAudio top-level Meson layout"
p.write_text(s.replace(old, new, 1))
PY

meson setup build --prefix=/usr --libdir=lib --buildtype=release -D daemon=false -D client=true -D database=simple -D doxygen=false -D man=false -D tests=false -D alsa=disabled -D asyncns=disabled -D avahi=disabled -D bluez5=disabled -D bluez5-gstreamer=disabled -D consolekit=disabled -D dbus=disabled -D elogind=disabled -D fftw=disabled -D glib=enabled -D gsettings=disabled -D gstreamer=disabled -D gtk=disabled -D jack=disabled -D lirc=disabled -D openssl=disabled -D orc=disabled -D oss-output=disabled -D soxr=disabled -D speex=disabled -D systemd=disabled -D tcpwrap=disabled -D udev=disabled -D valgrind=disabled -D x11=disabled -D webrtc-aec=disabled
"""
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} ninja -C build install"
