# system recipe: tools and library for extended filesystem attributes.
[package]
name = "attr"
version = "2.6.0"
rel = 1
arch = ["x86_64"]
summary = "Extended filesystem attributes library and utilities"
license = ["GPL-2.0-or-later", "LGPL-2.1-or-later"]
source = "https://download.savannah.nongnu.org/releases/attr/attr-%{version}.tar.xz"
sha256 = "6c8a2148a7b85043b68492bce43316b0e2e214fc4e628c7ede078e76e216330b"

[depends]
build = []
run = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --docdir=/usr/share/doc/attr-%{version} --disable-static --disable-nls"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
