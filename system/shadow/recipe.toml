# system recipe: Shadow password suite (useradd, passwd, ...)
[package]
name = "shadow"
version = "4.18.0"
rel = 3
arch = ["x86_64"]
summary = "Shadow password suite (useradd, passwd, ...)"
license = ["BSD-3-Clause"]
source = "https://github.com/shadow-maint/shadow/releases/download/4.18.0/shadow-4.18.0.tar.xz"
sha256 = "add4604d3bc410344433122a819ee4154b79dd8316a56298c60417e637c07608"

[depends]
build = ["libxcrypt"]
run = ["libxcrypt"]

[build]
configure = "./configure --sysconfdir=/etc --disable-static --without-libbsd --with-group-name-max-length=32 --enable-subids"
compile = "make -j%{jobs}"
install = """
make DESTDIR=%{pkgdir} exec_prefix=/usr install
for helper in newuidmap newgidmap; do
    test -x "%{pkgdir}/usr/bin/$helper" || {
        echo "shadow: required rootless-container helper $helper was not installed" >&2
        exit 1
    }
    chmod 4755 "%{pkgdir}/usr/bin/$helper"
done
"""
