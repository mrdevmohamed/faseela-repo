# mate recipe: engrampa — MATE archive manager
# AUTOTOOLS, not meson: the meson.build in the tarball falls back to a git
# fetch of mate-submodules, which is forbidden offline. The shipped
# configure works as-is. PackageKit is off. Engrampa shells out to external
# archive tools and does not link libarchive (no libarchive reference in
# configure.ac or the sources), so no libarchive dependency is listed.
# The Caja extension stays on (caja is built in this same category).
[package]
name = "engrampa"
version = "1.28.5"
rel = 2
arch = ["x86_64"]
summary = "MATE archive manager"
license = ["GPL-2.0-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "engrampa"
url = "https://github.com/mate-desktop/engrampa/releases/download/v%{version}/engrampa-%{version}.tar.xz"
sha256 = "38df10e6b0d7e54adc9b03d707518544871535669267b4d39d85d1ed985dd013"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool", "pkgconf", "gettext", "glib", "gtk3", "libSM", "libICE", "caja", "json-glib", "mate-common"]
run = ["glib", "gtk3", "libSM", "libICE", "caja", "json-glib"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-packagekit"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
