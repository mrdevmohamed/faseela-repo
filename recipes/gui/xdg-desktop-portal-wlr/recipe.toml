# gui recipe: xdg-desktop-portal-wlr — ScreenCast portal backend for wlroots compositors
# The GTK backend (xdg-desktop-portal-gtk) covers the file chooser and friends;
# this backend implements ScreenCast (and ScreenCapture on wlroots compositors
# like sway) through PipeWire. sd-bus comes from basu — no systemd here; the
# systemd user unit and man pages are not built (scdoc is not packaged).
[package]
name = "xdg-desktop-portal-wlr"
version = "0.8.5"
rel = 1
arch = ["x86_64"]
summary = "xdg-desktop-portal backend for screen sharing on sway (PipeWire screencast)"
license = ["MIT"]
source = "https://github.com/emersion/xdg-desktop-portal-wlr/releases/download/v%{version}/xdg-desktop-portal-wlr-%{version}.tar.gz"
sha256 = "5d36f3c031d9c750f83a17a9468770df12f1ddc9d9d60eea81ad4062f7d71614"
source_dir = "xdg-desktop-portal-wlr-%{version}"

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols", "libdrm", "mesa", "pipewire", "inih", "basu"]
run = ["xdg-desktop-portal", "wayland", "libdrm", "mesa", "pipewire", "inih", "basu"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D sd-bus-provider=basu -D systemd=disabled -D man-pages=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
