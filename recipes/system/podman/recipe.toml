# system recipe: Podman CLI and container engine.
# Upstream ships its own vendor/ tree; use it as published and do not maintain
# a downstream vendor copy or fetch modules during the offline build.
[package]
name = "podman"
version = "6.1.4"
rel = 1
arch = ["x86_64"]
summary = "Daemonless OCI container engine"
license = ["Apache-2.0"]
source = "https://github.com/containers/podman/archive/refs/tags/v%{version}.tar.gz"
sha256 = "200fd9b4b6d820cae24fc99d8e290ec945512365cf3cda8283b3905c0c284ea8"

[depends]
build = ["golang", "make", "gcc", "libseccomp", "sqlite"]
run = [
  "catatonit",
  "conmon",
  "containers-common",
  "crun",
  "libseccomp",
  "netavark",
  "aardvark-dns",
  "passt",
  "fuse-overlayfs",
  "shadow",
  "sqlite",
  "nftables",
]

[build]
compile = "GOFLAGS='-mod=vendor -trimpath' make -j%{jobs} podman BUILDTAGS='seccomp libsqlite3 containers_image_openpgp exclude_graphdriver_btrfs' PREFIX=/usr LIBEXECDIR=/usr/libexec GIT_COMMIT='v%{version}'"
install = 'install -Dm0755 "bin/podman" "%{pkgdir}/usr/bin/podman"'
