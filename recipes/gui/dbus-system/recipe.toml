# gui recipe: system D-Bus integration for systemd.
# The dbus recipe is built with libsystemd and ships upstream's dbus.socket and
# dbus.service (socket activation, `--systemd-activation`); dbus.socket is wanted by
# sockets.target out of the box. This small package adds the `messagebus` account
# the daemon drops to, and fixes the launch helper's mode on the target.
[package]
name = "dbus-system"
version = "1.0"
rel = 6
arch = ["x86_64"]
summary = "System D-Bus messagebus account and launch-helper setup for systemd"
license = ["MIT"]

[depends]
build = []
run = ["dbus", "base-files", "coreutils"]

[build]
install = '''
# Nothing to stage: the units come from the dbus package. Keep an empty marker so
# the package is not empty.
install -d -m755 %{pkgdir}/usr/share/doc/dbus-system
printf '%s\n' 'System bus units: dbus.socket and dbus.service (from dbus).' > %{pkgdir}/usr/share/doc/dbus-system/README
'''

[hooks]
post_install = '''
/usr/libexec/faseela/ensure-system-account user messagebus messagebus "D-Bus Message Bus" /nonexistent /usr/bin/false
# System-bus activation (UPower and any other on-demand system service) goes
# through this helper. dbus-daemon refuses it with "The permission of the setuid
# helper is not correct" unless it is root:messagebus and setuid (4750). An
# unprivileged package build cannot set that, so it is done here on the target.
if [ -e /usr/libexec/dbus-daemon-launch-helper ]; then
    chown root:messagebus /usr/libexec/dbus-daemon-launch-helper
    chmod 4750 /usr/libexec/dbus-daemon-launch-helper
fi
'''
