# gui recipe: libxcb — X protocol C-language binding (XCB)
# no libXdmcp: XDM-AUTHORIZATION-1 is irrelevant without an X server, and
# libxcb simply builds without it when it is not installed.
[package]
name = "libxcb"
version = "1.17.0"
rel = 1
arch = ["x86_64"]
summary = "X protocol C-language binding (XCB)"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libxcb-%{version}.tar.xz"
sha256 = "599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55"

[depends]
build = ["pkgconf", "xcb-proto", "libXau", "xorgproto"]
run = ["libXau"]

[build]
configure = "./configure --prefix=/usr --disable-static --enable-xinput --enable-xkb --disable-devel-docs --without-doxygen"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
