# gui recipe: swaybg — wallpaper tool for Wayland compositors (used by sway's `output * bg`)
[package]
name = "swaybg"
version = "1.2.1"
rel = 2
arch = ["x86_64"]
summary = "Wallpaper tool for Wayland compositors"
license = ["MIT"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "swaybg"
url = "https://github.com/swaywm/swaybg/releases/download/v%{version}/swaybg-%{version}.tar.gz"
sha256 = "6af1fdf0e57b1cc5345febed786b761fea0e170943a82639f94cfaed7df84f8f"
strip_components = 1

[depends]
build = ["meson", "ninja", "pkgconf", "wayland", "wayland-protocols", "cairo"]
run = ["wayland", "cairo"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
# gdk-pixbuf is not packaged: only PNG (via cairo) and solid colours are supported
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D man-pages=disabled -D gdk-pixbuf=disabled"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
