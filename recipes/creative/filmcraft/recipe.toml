# creative recipe: filmcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "filmcraft"
version = "0.16.0"
rel = 1
arch = ["x86_64"]
summary = "Native video editor with timeline, colour grading and effects"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/filmcraft/releases/download/v0.16.0/filmcraft-0.16.0-linux-x86_64.tar.gz"
sha256 = "588390eee5d7e1634f05794c4f877ddf29494d9cf74405111d67c16cbe215ae9"
source_dir = "filmcraft-0.16.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland", "alsa-lib", "pipewire"]

[build]
install = """
set -eu
if [ ! -d usr/bin ]; then
    echo "filmcraft: upstream archive has no usr/bin directory" >&2
    exit 1
fi
install -d -m755 "%{pkgdir}/usr"
cp -a usr/. "%{pkgdir}/usr/"
"""
