# system recipe: legacy network interface, routing and statistics tools.
# Keep the modern iproute2 package as the primary interface; this adds
# ifconfig/netstat/route compatibility for scripts and administration guides.
[package]
name = "net-tools"
version = "2.10"
rel = 1
arch = ["x86_64"]
summary = "Legacy network utilities including ifconfig, netstat, route and arp"
license = ["GPL-2.0-or-later"]
source = "https://downloads.sourceforge.net/project/net-tools/net-tools-%{version}.tar.xz"
sha256 = "b262435a5241e89bfa51c3cabd5133753952f7a7b7b93f32e08cb9d96f580d69"

[depends]
build = []
run = []

[build]
configure = '''
yes "" | make config
# These protocol families have been removed or are not enabled by current
# Linux kernels. Disabling them avoids building obsolete protocol handlers.
sed -i -e '/ROM/s/1/0/' -e '/X25/s/1/0/' -e '/ROSE/s/1/0/' config.h
'''
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} BINDIR=/usr/bin SBINDIR=/usr/sbin install

# coreutils owns hostname in Faseela. Do not ship net-tools' duplicate
# implementation or its compatibility symlinks.
rm -f %{pkgdir}/usr/bin/hostname \
      %{pkgdir}/usr/bin/dnsdomainname \
      %{pkgdir}/usr/bin/domainname \
      %{pkgdir}/usr/bin/nisdomainname \
      %{pkgdir}/usr/bin/ypdomainname

# Fail the build if the tools requested by this package are not staged.
for tool in ifconfig netstat route; do
    test -x "%{pkgdir}/usr/bin/$tool" || {
        echo "net-tools: missing expected executable: $tool" >&2
        exit 1
    }
done
'''
