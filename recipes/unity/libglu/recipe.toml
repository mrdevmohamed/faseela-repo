# unity recipe: libglu — Mesa OpenGL Utility library (GLU)
# GLEW's header and Nux's text rendering include GL/glu.h.
[package]
name = "libglu"
version = "9.0.2"
rel = 2
arch = ["x86_64"]
summary = "Mesa OpenGL Utility library"
license = ["SGI-B-2.0"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libglu"
url = "https://archive.ubuntu.com/ubuntu/pool/main/libg/libglu/libglu_%{version}.orig.tar.gz"
sha256 = "24effdfb952453cc00e275e1c82ca9787506aba0282145fff054498e60e19a65"
strip_components = 1

[depends]
build = ["pkgconf", "mesa", "libX11", "xorgproto"]
run = ["mesa"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-static"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
test -s %{pkgdir}/usr/lib/pkgconfig/glu.pc
'''
