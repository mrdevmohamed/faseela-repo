# mate recipe: libmateweather — MATE weather library
# Weather forecasts and conditions, used by the mate-panel clock applet.
# Autotools only: the 1.28.2 tarball ships a prebuilt configure and no
# meson.build. Needs the libsoup 2.x API (libsoup2 recipe), not libsoup3.
[package]
name = "libmateweather"
version = "1.28.2"
rel = 2
arch = ["x86_64"]
summary = "MATE weather library (forecasts and conditions)"
license = ["LGPL-2.1-or-later"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "libmateweather"
url = "https://github.com/mate-desktop/libmateweather/releases/download/v%{version}/libmateweather-%{version}.tar.xz"
sha256 = "d2cb300f97da7268855e7506cae4417a88ef296093c79013f79909f70bbee3cb"
strip_components = 1

[depends]
build = ["autoconf", "automake", "libtool", "pkgconf", "gettext", "glib", "gtk3", "libxml2", "libsoup2"]
run = ["glib", "gtk3", "libxml2", "libsoup2"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
