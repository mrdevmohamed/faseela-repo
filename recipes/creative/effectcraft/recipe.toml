# creative recipe: effectcraft — upstream Linux x86_64 release bundle.
# This is a pinned upstream binary release, not a source build. Its SHA-256
# comes from GitHub's release-asset metadata; see recipes/creative/README.md.
[package]
name = "effectcraft"
version = "0.20.0"
rel = 2
arch = ["x86_64"]
summary = "Native motion-graphics and visual-effects compositor"
license = ["MIT", "Apache-2.0"]
source = "https://github.com/storytold/effectcraft/releases/download/v0.20.0/effectcraft-0.20.0-linux-x86_64.tar.gz"
sha256 = "2573100a0a2ce07a69257bda7fa6a7d5252d3b4d32dfef3a1f6d2c95bcb8da23"
source_dir = "effectcraft-0.20.0-linux-x86_64"

[depends]
build = []
run = ["gcc", "glibc", "libxkbcommon", "mesa", "wayland", "alsa-lib", "pipewire"]

[build]
install = """
set -eu

# Upstream release archives may be opened at the package directory or at the
# archive extraction root. Locate the FHS usr tree in either layout.
upstream_usr_bin="$(find . -type d -path '*/usr/bin' -print -quit)"
if [ -z "$upstream_usr_bin" ]; then
    echo "effectcraft: upstream archive has no usr/bin directory below $(pwd)" >&2
    exit 1
fi
upstream_usr="${upstream_usr_bin%/bin}"
install -d -m755 "%{pkgdir}/usr"
cp -a "$upstream_usr/." "%{pkgdir}/usr/"
"""
