name: Pin latest Nawa source

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full 40-character Nawa commit SHA (leave empty to pin the latest default-branch commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pin-nawa-source
  cancel-in-progress: false

jobs:
  pin:
    name: Update Nawa source pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Faseela package recipes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pin Nawa source
        env:
          NAWA_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [[ -n "$NAWA_COMMIT" ]]; then
            python3 -I scripts/pin-nawa-source.py "$NAWA_COMMIT"
          else
            python3 -I scripts/pin-nawa-source.py
          fi

          python3 -I scripts/check-recipes.py
          git diff --check

      - name: Create or update pinning pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/pin-nawa-source
          delete-branch: true
          commit-message: "chore(nawa): pin upstream source"
          title: "chore(nawa): pin latest upstream source"
          body: |
            ## Nawa source pin update

            Updates recipes/base/nawa/recipe.toml using scripts/pin-nawa-source.py.

            The script resolves the latest Nawa default-branch commit unless an
            explicit commit SHA was supplied, downloads the GitHub source archive,
            calculates its SHA-256, and updates the package version and release.

            Recipe validation and git diff --check passed before this PR was created.

            Merge after the repository CI checks pass.
