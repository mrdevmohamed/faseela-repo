# ProjectDiscovery httpx command-line tool; pinned upstream Linux amd64 release.
[package]
name = "httpx"
version = "1.12.0"
rel = 1
arch = ["x86_64"]
summary = "HTTP probing and web technology detection toolkit"
license = ["MIT"]
source = "https://github.com/projectdiscovery/httpx/releases/download/v1.12.0/httpx_1.12.0_linux_amd64.zip"
sha256 = "9d8439e8b6c9aa7d1e2314817a392e00d5178da3af5652f7475f88868f418f76"

[depends]
build = ["unzip"]
run = ["glibc"]

[build]
install = """
unzip -oq "httpx_1.12.0_linux_amd64.zip" -d .
install -Dm755 httpx %{pkgdir}/usr/bin/httpx
"""
