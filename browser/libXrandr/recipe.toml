# browser recipe: libXrandr — X Resize, Rotate and Reflect extension client library
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py` pins it.
[package]
name = "libXrandr"
version = "1.5.4"
rel = 1
arch = ["x86_64"]
summary = "X Resize, Rotate and Reflect extension client library"
license = ["MIT"]
source = "https://xorg.freedesktop.org/archive/individual/lib/libXrandr-%{version}.tar.xz"
sha256 = "1ad5b065375f4a85915aa60611cc6407c060492a214d7f9daf214be752c3b4d3"

[depends]
build = ["pkgconf", "xorgproto", "libX11", "libXext", "libXrender"]
run = ["libX11", "libXext", "libXrender"]

[build]
configure = "./configure --prefix=/usr --disable-static --disable-specs --without-xmlto --without-fop --without-xsltproc"
compile = "make -j%{jobs}"
install = "make DESTDIR=%{pkgdir} install"
