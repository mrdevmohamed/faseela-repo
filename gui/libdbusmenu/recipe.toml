# gui recipe: libdbusmenu — D-Bus menu transport used by Waybar's StatusNotifier tray
# Build the GLib and GTK 3 libraries from the same upstream source tree.
# GTK 2, the dumper, tests, introspection, Vala bindings and gtk-doc are not
# needed by the Faseela desktop. Debian's repacked source omits generated
# Autotools files, so regenerate them locally without GNOME-only docs/NLS tools.
[package]
name = "libdbusmenu"
version = "18.10.20180917"
rel = 3
arch = ["x86_64"]
summary = "D-Bus menu transport library (GLib and GTK 3)"
license = ["LGPL-2.1-or-later", "LGPL-3.0-or-later"]
source = "https://deb.debian.org/debian/pool/main/libd/libdbusmenu/libdbusmenu_%{version}~bzr492+repack1.orig.tar.xz"
sha256 = "41298b926573419f21864205317461750b833c596af6ab0bd206e13336f8cee3"
source_dir = "libdbusmenu-%{version}~bzr492"

[depends]
build = ["pkgconf", "glib", "gtk3", "autoconf", "automake", "libtool", "gettext", "python"]
run = ["glib", "gtk3"]

[build]
prepare = '''
# The Debian repack intentionally excludes generated configure/Makefile.in.
# Recreate them with packaged Autotools instead of gnome-autogen.sh, which
# requires gnome-common and gtk-doc (neither is part of Faseela).
#
# The recipe ships no translations or API docs. Remove the GNOME-only
# intltool/docs configure macros and docs subdirectory. tests/Makefile.am
# still references ENABLE_GTK_DOC while Automake generates Makefile.in, even
# with tests disabled, so define that conditional explicitly as false. Keep
# the in-tree introspection macro available but disable that feature later.
sed -i \
    -e '/^[[:space:]]*IT_PROG_INTLTOOL(/d' \
    -e 's/^[[:space:]]*GTK_DOC_CHECK(.*/AM_CONDITIONAL([ENABLE_GTK_DOC], [false])/' \
    -e '/^[[:space:]]*docs/d' \
    configure.ac
sed -i '/^[[:space:]]*docs[[:space:]]/d' Makefile.am
# Same class of failure again: upstream's configure.ac defines some
# AM_CONDITIONALs (HAVE_VALGRIND, ...) only inside the --enable-tests branch,
# while the Makefile.am files test them unconditionally. Autoconf 2.72 then
# aborts configure with `conditional "HAVE_VALGRIND" was never defined`, even
# with --disable-tests. Give every conditional the Makefile.am files use a
# top-level default of false, right after AM_INIT_AUTOMAKE. A real definition
# later in configure.ac still overrides it at run time.
conds="$(find . -name Makefile.am -print0 | xargs -0 sed -n -E 's/^[[:space:]]*(if|else)[[:space:]]+!?([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*(#.*)?$/\2/p' | sort -u)"
for c in $conds; do
    sed -i "/^AM_INIT_AUTOMAKE/a AM_CONDITIONAL([$c], [false])" configure.ac
done
# The recipe ships no translations (--disable-nls), but configure.ac still
# lists po/Makefile.in in AC_CONFIG_FILES. The Debian repack has no
# po/Makefile.in.in (intltoolize/glib-gettextize never ran), so config.status
# aborts with "cannot find input file: 'po/Makefile.in.in'". Drop the po
# subdirectory from the build entirely.
sed -i -E 's#[[:space:]]*po/Makefile(\.in)?##g' configure.ac
# Join the backslash-continued SUBDIRS list onto one line before removing the
# word: deleting a line from the middle of the list can leave a trailing
# backslash before a blank line, which automake rejects.
find . -name Makefile.am -print0 | xargs -0 sed -i -E \
    -e '/^[[:space:]]*SUBDIRS[[:space:]]*[+:]?=/{:a;/\\$/{N;s/\\\n[[:space:]]*/ /;ta};s/(^|[[:space:]=])po([[:space:]]|$)/\1\2/g}'
autoreconf -fi
# libdbusmenu-glib/Makefile.am runs `$(XSLTPROC) clean-namespaces.xslt
# dbus-menu.xml`. xsltproc (libxslt) is not packaged, so configure leaves
# XSLTPROC empty and make tries to execute the .xslt file itself ("Permission
# denied"). Generate dbus-menu-clean.xml here with the same transformation
# (drop everything in the dox namespace, strip element namespaces, keep
# attributes/text, drop comments) and refresh its timestamp so make keeps it.
python3 - libdbusmenu-glib/dbus-menu.xml libdbusmenu-glib/dbus-menu-clean.xml <<'PY'
import sys
import xml.etree.ElementTree as ET
DOX = "{http://www.canonical.com/dbus/dox.dtd}"
src, dst = sys.argv[1:3]
def clean(e):
    for c in list(e):
        if c.tag.startswith(DOX):
            e.remove(c)
        else:
            clean(c)
    for k in list(e.attrib):
        if k.startswith(DOX):
            del e.attrib[k]
    e.tag = e.tag.rsplit("}", 1)[-1]
root = ET.parse(src).getroot()
clean(root)
ET.ElementTree(root).write(dst, encoding="UTF-8", xml_declaration=True)
PY
test -s libdbusmenu-glib/dbus-menu-clean.xml
touch libdbusmenu-glib/dbus-menu-clean.xml
'''
configure = "./configure --prefix=/usr --libdir=/usr/lib --disable-nls --disable-static --with-gtk=3 --disable-dumper --disable-tests --disable-introspection --disable-vala"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
# Waybar's Meson probe is for this exact pkg-config module. Refuse to publish
# an incomplete library package if upstream ever changes the install layout.
test -s %{pkgdir}/usr/lib/pkgconfig/dbusmenu-gtk3-0.4.pc
test -e %{pkgdir}/usr/lib/libdbusmenu-glib.so.4
test -e %{pkgdir}/usr/lib/libdbusmenu-gtk3.so.4
'''
