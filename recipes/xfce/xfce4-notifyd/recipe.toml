# xfce recipe: xfce4-notifyd — Xfce notification daemon
[package]
name = "xfce4-notifyd"
version = "0.9.7"
rel = 3
arch = ["x86_64"]
summary = "Xfce notification daemon (org.freedesktop.Notifications implementation)"
license = ["GPL-2.0-or-later"]
source = "https://archive.xfce.org/src/apps/xfce4-notifyd/0.9/xfce4-notifyd-0.9.7.tar.bz2"
sha256 = "170d18fd5f40cce823ffc7ae3d7e21644007c3f45808ab4835f0401d21b3516a"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "libnotify", "gtk3", "glib", "sqlite"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "libnotify", "gtk3", "glib", "sqlite", "dbus"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
