# xfce recipe: xfce4-genmon-plugin — Generic monitor panel plugin
[package]
name = "xfce4-genmon-plugin"
version = "4.2.1"
rel = 2
arch = ["x86_64"]
summary = "Generic monitor panel plugin (renders command output and icons)"
license = ["LGPL-2.1-or-later"]
source = "https://archive.xfce.org/src/panel-plugins/xfce4-genmon-plugin/4.2/xfce4-genmon-plugin-4.2.1.tar.bz2"
sha256 = "de540562e1ea58f35a9c815e20736d26af541a0a9372011148cb75b5f0b65951"

[depends]
build = ["pkgconf", "xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib"]
run = ["xfce4-panel", "libxfce4ui", "libxfce4util", "xfconf", "gtk3", "glib", "hicolor-icon-theme"]

[build]
configure = "./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --disable-static --disable-debug"
compile = "make -j%{jobs}"
install = '''make DESTDIR=%{pkgdir} install'''
