# extra recipe: fastfetch — optional libraries (wayland, drm, ...) are dlopen()ed at run time, no hard deps.
# sha256 is an all-zero placeholder until `python3 scripts/fill-sha256.py -r fastfetch` pins it.
[package]
name = "fastfetch"
version = "2.30.1"
rel = 1
arch = ["x86_64"]
summary = "fastfetch — system information tool (neofetch replacement)"
license = ["MIT"]
source = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/%{version}.tar.gz"
sha256 = "5248311a3d8ce65f6f48756dfc0df9f8922d64f5201ee8d980497d52e924906e"

[depends]
build = ["cmake", "pkgconf"]
run = []

[build]
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTS=OFF"
compile = "cmake --build build -j %{jobs}"
install = "DESTDIR=%{pkgdir} cmake --install build"
