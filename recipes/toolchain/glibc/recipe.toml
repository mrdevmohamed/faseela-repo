# Toolchain recipe: the GNU C Library.
# Built right after linux-headers; everything else links against it.
# (LFS 12.2 chapter 6 equivalent, out-of-tree build)
[package]
name = "glibc"
version = "2.40"
rel = 4
arch = ["x86_64"]
summary = "The GNU C Library (glibc)"
license = ["LGPL-2.1"]
source = "https://mirrors.kernel.org/gnu/glibc/glibc-%{version}.tar.xz"
# canonical: https://ftp.gnu.org/gnu/glibc/
sha256 = "19a890175e9263d748f627993de6f4b1af9cd21e03f080e4bfb3a1fac10205a2"

[depends]
build = ["linux-headers","bison"]
run = []

[build]
prepare = "mkdir -v build"
# glibc must NOT be built with _FORTIFY_SOURCE. Ubuntu's gcc (the stage-2 seed
# compiler) enables -D_FORTIFY_SOURCE=3 by default, and glibc's own
# `-Wp,-U_FORTIFY_SOURCE` does not cancel it (the driver only suppresses its
# default when it sees a plain -U). The result is
#   syslog.c: error: inlining failed in call to 'always_inline' 'syslog'
# so pass -U at driver level via CC (config.make keeps it for the compile).
configure = """
cd build && CC="gcc -U_FORTIFY_SOURCE" ../configure --prefix=/usr \
    --disable-werror                         \
    --enable-kernel=5.4                      \
    --enable-stack-protector=strong          \
    --disable-nscd                           \
    libc_cv_slibdir=/usr/lib
"""
compile = "cd build && make -j%{jobs}"
check = "cd build && make check"
install = """
# INSTALL_INFO=: — during stage2 /usr/bin/makeinfo is the seed stand-in
# (bootstrap/stage2-inner.sh) which leaves libc.info EMPTY; on hosts whose seed
# ships install-info, glibc's manual/Makefile then dies with
# "install-info: libc.info: empty file". Skip the dir-file registration here;
# the real texinfo package is built later.
cd build && make DESTDIR=%{pkgdir} install INSTALL_INFO=:
# Binaries are linked with PT_INTERP=/lib64/ld-linux-x86-64.so.2. With
# slibdir=/usr/lib glibc does not create that link, so on a host/seed root it
# keeps pointing at the OLD loader (seed's /lib/x86_64-linux-gnu) and new
# binaries (getent, ...) run with a loader/libc mismatch and segfault.
mkdir -p %{pkgdir}/usr/lib64
ln -sfv ../lib/ld-linux-x86-64.so.2 %{pkgdir}/usr/lib64/ld-linux-x86-64.so.2

# C.UTF-8: `make install` does not ship a compiled locale, and without a UTF-8
# locale foot (and anything that checks nl_langinfo(CODESET)) refuses to start.
# Compile it at BUILD time with the localedef we just built, straight from the
# source tree, so it is part of the package (/usr/lib/locale/C.utf8) and nothing
# has to be generated on the target. The new loader is invoked explicitly
# because the staged binaries cannot find their libc under DESTDIR otherwise.
if [ -f ../localedata/locales/C ]; then _src=C; else _src=POSIX; fi
mkdir -p %{pkgdir}/usr/lib/locale
%{pkgdir}/usr/lib/ld-linux-x86-64.so.2 --library-path %{pkgdir}/usr/lib \
    %{pkgdir}/usr/bin/localedef --prefix=%{pkgdir} --no-archive \
    -i ../localedata/locales/$_src -f ../localedata/charmaps/UTF-8 C.UTF-8
[ -d %{pkgdir}/usr/lib/locale/C.utf8 ] || { echo "glibc: C.UTF-8 was not generated" >&2; exit 1; }
"""

[hooks]
# runs on the target system after install
post_install = """
# search the new glibc's /usr/lib before any seed multiarch directory
[ -d /etc/ld.so.conf.d ] && echo /usr/lib > /etc/ld.so.conf.d/00-usrlib.conf
ldconfig
# The seed (Debian/Ubuntu) ships binaries with RUNPATH=/usr/lib/x86_64-linux-gnu.
# RUNPATH is searched BEFORE /etc/ld.so.cache, so after our loader is in place
# those binaries (expr, ...) would load the seed's OLD libc.so.6 with the NEW
# ld.so — a loader/libc mismatch that shows up as "stack smashing detected".
# Point the seed's copies of the glibc libraries at ours. Atomic (ln + mv -T),
# idempotent, and a no-op where no seed multiarch dir exists (the final root).
if [ -d /usr/lib/x86_64-linux-gnu ]; then
    for b in ld-linux-x86-64.so.2 libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1 libutil.so.1 libresolv.so.2 libanl.so.1 libBrokenLocale.so.1 libmvec.so.1 libthread_db.so.1 libc_malloc_debug.so.0 libnss_files.so.2 libnss_dns.so.2 libnss_compat.so.2 libnss_hesiod.so.2 libnss_db.so.2; do
        new=/usr/lib/$b; old=/usr/lib/x86_64-linux-gnu/$b
        if [ -e "$new" ] && { [ -e "$old" ] || [ -L "$old" ]; }; then
            if [ "$(readlink -f "$old")" != "$(readlink -f "$new")" ]; then
                ln -s "$new" "$old.nawa-tmp" && mv -T "$old.nawa-tmp" "$old"
            fi
        fi
    done
fi
"""
