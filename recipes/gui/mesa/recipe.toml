# gui recipe: mesa — OpenGL/GLES/EGL/GBM implementation (radeonsi + llvmpipe + softpipe + virgl)
# rel 3: radeonsi (AMD GCN/RDNA GPUs; needs llvm's AMDGPU target, libelf and libdrm's amdgpu)
#        and the gallium VA-API video driver (radeonsi_drv_video.so in /usr/lib/dri, loaded by
#        libva): h264/h265/av1/vp9/vc1 decode, h264/h265/av1 encode. Intel graphics (iris)
#        is NOT built: it needs mesa_clc, i.e. clang + libclc, which the llvm recipe lacks.
# rel 2: llvmpipe (recipe `llvm`). wlroots is gles2-only, so all drawing goes through
#        mesa's GL; with softpipe alone the GUI was unusably slow in QEMU. softpipe stays
#        as the last-resort fallback (llvmpipe falls back to it if the JIT cannot start).
[package]
name = "mesa"
version = "24.3.0"
rel = 3
arch = ["x86_64"]
summary = "OpenGL/GLES/EGL/GBM implementation + VA-API (radeonsi for AMD, llvmpipe, softpipe, virgl)"
license = ["MIT"]
source = "https://archive.mesa3d.org/mesa-%{version}.tar.xz"
sha256 = "97813fe65028ef21b4d4e54164563059e8408d8fee3489a2323468d198bf2efc"

[depends]
build = ["meson", "ninja", "pkgconf", "python-mako", "python-markupsafe", "python-pyyaml", "python-packaging", "libdrm", "wayland", "wayland-protocols", "expat", "zlib", "zstd", "bison", "flex", "llvm", "elfutils", "libva"]
run = ["libdrm", "wayland", "expat", "zlib", "zstd", "llvm", "elfutils", "libva"]

[build]
configure = "meson setup build --prefix=/usr --libdir=lib --buildtype=release -D platforms=wayland -D gallium-drivers=radeonsi,softpipe,llvmpipe,virgl -D vulkan-drivers= -D llvm=enabled -D shared-llvm=enabled -D glx=disabled -D egl=enabled -D gbm=enabled -D gles1=disabled -D gles2=enabled -D gallium-va=enabled -D video-codecs=h264dec,h264enc,h265dec,h265enc,vc1dec,av1dec,av1enc,vp9dec -D glvnd=disabled -D valgrind=disabled -D libunwind=disabled -D lmsensors=disabled -D build-tests=false"
compile = "ninja -C build"
install = "DESTDIR=%{pkgdir} meson install -C build"
