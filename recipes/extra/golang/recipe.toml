# extra recipe: Go programming language toolchain.
# Official go.dev Linux amd64 binary archive and published SHA-256.
[package]
name = "golang"
version = "1.27.3"
rel = 1
arch = ["x86_64"]
summary = "Go programming language compiler and toolchain"
license = ["BSD-3-Clause"]
source = "https://go.dev/dl/go%{version}.linux-amd64.tar.gz"
sha256 = "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
source_dir = "go"

[depends]
build = []
run = ["glibc"]

[build]
install = """
install -d %{pkgdir}/usr/lib
cp -a . %{pkgdir}/usr/lib/go
install -d %{pkgdir}/usr/bin
ln -s ../lib/go/bin/go %{pkgdir}/usr/bin/go
ln -s ../lib/go/bin/gofmt %{pkgdir}/usr/bin/gofmt
"""
