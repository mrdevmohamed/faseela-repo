# cosmic recipe: cosmic-randr — CLI and Wayland client to configure COSMIC
# displays (modes, positions, scaling) against cosmic-comp.
[package]
name = "cosmic-randr"
version = "1.0.8"
rel = 1
arch = ["x86_64"]
summary = "Display configuration utility for the COSMIC desktop"
license = ["MPL-2.0"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-randr"
url = "https://codeload.github.com/pop-os/cosmic-randr/tar.gz/refs/tags/epoch-1.0.8"
sha256 = "ea8f96ce37566e85b61f0397d06940702db01d83cffbf9ca33ff6e3a38cbff2e"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "wayland"]
run = ["wayland"]

[fetch.cargo]
dir = "."

[build]
# cosmic-randr is a virtual workspace; the CLI crate carries the binary.
compile = "cargo build --release --offline --locked -p cosmic-randr-cli"
install = '''
install -Dm755 target/release/cosmic-randr %{pkgdir}/usr/bin/cosmic-randr
'''
