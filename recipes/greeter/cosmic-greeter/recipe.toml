# cosmic recipe: cosmic-greeter — COSMIC login greeter for greetd.
# This optional package contains only the root-owned D-Bus daemon and greetd
# integration. The regular-user cosmic-greeter locker executable and its PAM
# service are supplied by the mandatory cosmic-locker package.
[package]
name = "cosmic-greeter"
version = "1.11.0"
rel = 8
arch = ["x86_64"]
summary = "COSMIC login greeter (greetd session with PAM authentication)"
license = ["GPL-3.0-only"]
source = "local:/nawa-schema-2-requires-a-newer-nawa"

[[package.sources]]
name = "cosmic-greeter"
url = "https://codeload.github.com/pop-os/cosmic-greeter/tar.gz/refs/tags/epoch-1.11.0"
sha256 = "f31c5bac8e50ed5df75cb7d07fb8167e7835dc22b3438a48c8c1f27e7de36e48"
strip_components = 1

[depends]
build = ["rust", "pkgconf", "systemd", "libinput"]
run = ["cosmic-locker", "cosmic-comp", "cosmic-randr", "dbus", "dbus-system", "systemd", "greetd", "seatd-runit", "base-files", "coreutils", "libinput"]

[fetch.cargo]
dir = "."

[build]
# Keep the greeter's logind, NetworkManager and UPower D-Bus integrations.
# The upstream logind feature also enables the optional journald tracing sink;
# it does not link libsystemd. Avoid the compositor-only systemd backend.
compile = """
# Build only the optional root-owned D-Bus daemon. The locker UI is built by
# cosmic-locker, which is installed as part of every COSMIC session.
export VERGEN_GIT_COMMIT_DATE=2026-10-20T19:54:44Z
export VERGEN_GIT_SHA=80e8a104b75a01ab8df52bca7b8bde6dbcdb8133
cargo build --release --offline --locked --no-default-features -p cosmic-greeter-daemon
"""
install = '''
install -Dm755 target/release/cosmic-greeter-daemon %{pkgdir}/usr/bin/cosmic-greeter-daemon
# cosmic-greeter-start is a shell script: greetd runs it as the greeter
# session; it clears stale settings-daemon state and starts cosmic-comp
# followed by the greeter UI on the greetd VT.
install -m755 cosmic-greeter-start.sh %{pkgdir}/usr/bin/cosmic-greeter-start
# greetd session definition and per-user greeter configuration.
install -Dm644 cosmic-greeter.toml %{pkgdir}/etc/greetd/cosmic-greeter.toml
# System-bus policy that lets the greeter talk to its root daemon.
install -Dm644 dbus/com.system76.CosmicGreeter.conf \
    %{pkgdir}/usr/share/dbus-1/system.d/com.system76.CosmicGreeter.conf
# On runit there is no systemd Type=dbus unit. Let the system bus
# activate the privileged daemon when the greeter first requests its API.
install -d -m755 %{pkgdir}/usr/share/dbus-1/system-services
cat > %{pkgdir}/usr/share/dbus-1/system-services/com.system76.CosmicGreeter.service <<'DBUS'
[D-BUS Service]
Name=com.system76.CosmicGreeter
Exec=/usr/bin/cosmic-greeter-daemon
User=root
DBUS
chmod 644 %{pkgdir}/usr/share/dbus-1/system-services/com.system76.CosmicGreeter.service
# The "cosmic-greeter" PAM service is installed by cosmic-locker so the
# normal-user locker and this optional login UI share the same auth policy.

# Optional runit service. Ship it disabled so installing the greeter never
# unexpectedly takes over VT 1 or conflicts with the active getty.
install -d -m755 %{pkgdir}/etc/sv/cosmic-greeter
cat > %{pkgdir}/etc/sv/cosmic-greeter/run <<'RUN'
#!/bin/sh
exec 2>&1
set -eu
[ -S /run/dbus/system_bus_socket ] || { sleep 2; exit 1; }

# Provision accounts at service runtime, not in the package-build hook.
# Nawa executes post_install in its isolated build root; only this runit
# service runs against the installed machine's real passwd/group databases.
/usr/libexec/faseela/ensure-system-account group video
/usr/libexec/faseela/ensure-system-account user cosmic-greeter video "Cosmic Greeter Account" /var/lib/cosmic-greeter /usr/bin/false

greeter_uid=
while IFS=: read -r account_name _ account_uid _; do
    if [ "$account_name" = cosmic-greeter ]; then
        greeter_uid=$account_uid
        break
    fi
done < /etc/passwd
[ -n "$greeter_uid" ] || {
    echo "cosmic-greeter: account provisioning failed: cosmic-greeter has no passwd entry" >&2
    exit 1
}

video_gid=
while IFS=: read -r group_name _ group_id _; do
    if [ "$group_name" = video ]; then
        video_gid=$group_id
        break
    fi
done < /etc/group
[ -n "$video_gid" ] || {
    echo "cosmic-greeter: required video group is missing; reinstall seatd-runit" >&2
    exit 1
}

install -d -m750 /var/lib/cosmic-greeter /run/cosmic-greeter
chown "$greeter_uid:$video_gid" /var/lib/cosmic-greeter /run/cosmic-greeter
exec greetd
RUN
chmod 755 %{pkgdir}/etc/sv/cosmic-greeter/run
'''

[hooks]
post_install = '''
# Do not provision system accounts here: package hooks run in Nawa's build
# root during builds. The optional runit service creates the account on the
# installed system immediately before starting greetd.

# Use the COSMIC greeter only while greetd still has its stock agreety sample.
# Preserve any administrator-authored greetd configuration.
if [ -f /etc/greetd/config.toml ] && [ -f /etc/greetd/cosmic-greeter.toml ] \
   && grep -q 'agreety' /etc/greetd/config.toml; then
    cp /etc/greetd/cosmic-greeter.toml /etc/greetd/config.toml
    chmod 644 /etc/greetd/config.toml
    echo "cosmic-greeter: configured greetd to start the COSMIC greeter"
fi

echo "cosmic-greeter: enable with: nawa service enable cosmic-greeter"
echo "cosmic-greeter: disable getty-tty1 first if it owns VT 1."
'''
