# system recipe: Distributed version-control system
[package]
name = "git"
version = "2.56.0"
rel = 2
arch = ["x86_64"]
summary = "Distributed version-control system"
license = ["GPL-2.0"]
source = "https://cdn.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz"
sha256 = "26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3"

[depends]
build = ["curl", "expat", "gettext", "openssl", "pcre2", "perl", "rust", "zlib"]
run = ["curl", "expat", "gettext", "openssl", "pcre2", "perl", "zlib"]

[build]
configure = "./configure --prefix=/usr --with-gitconfig=/etc/gitconfig"
# git's Makefile runs cargo without make's `+` prefix, so make closes its
# jobserver fds while MAKEFLAGS still names them, and cargo warns "failed to
# connect to jobserver" on every build. A PATH shim hands cargo a clean
# environment (cargo gets its job count from CARGO_BUILD_JOBS instead).
compile = '''
real_cargo=$(command -v cargo)
mkdir -p .nawa-shim
printf '#!/bin/sh\nexec env -u MAKEFLAGS -u MFLAGS -u CARGO_MAKEFLAGS %s "$@"\n' "$real_cargo" > .nawa-shim/cargo
chmod +x .nawa-shim/cargo
PATH="$PWD/.nawa-shim:$PATH" CARGO_BUILD_JOBS=%{jobs} make -j%{jobs}
'''
install = '''
PATH="$PWD/.nawa-shim:$PATH" make DESTDIR=%{pkgdir} install
'''
