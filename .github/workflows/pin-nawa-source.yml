name: Compute Nawa bootstrap source pin (one-time)

on:
  push:
    branches:
      - chore/nawa-v3-bootstrap-pin
    paths:
      - .github/workflows/pin-nawa-source.yml

permissions:
  contents: write

jobs:
  pin:
    name: Calculate and record the exact GitHub source archive SHA-256
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin the requested Nawa commit
        run: |
          set -euo pipefail
          python3 scripts/pin-nawa-source.py c9261d12c89402fdeb5200a3bb0a0fa8f3be252b
      - name: Commit the verified source pin
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes/base/nawa/recipe.toml
          if git diff --cached --quiet; then
            echo "Source pin is already current."
            exit 0
          fi
          git commit -m "chore(nawa): pin distributed-repository source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
