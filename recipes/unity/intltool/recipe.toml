# unity recipe: intltool — translation tooling used by Compiz, Unity and the indicators
[package]
name = "intltool"
version = "0.51.0"
rel = 2
arch = ["x86_64"]
summary = "Internationalization tools for XML, desktop-file and schema translation"
license = ["GPL-2.0-only"]
source = "local:/nawa-package-relations-1-requires-a-newer-nawa"

[[package.sources]]
name = "intltool"
url = "https://archive.ubuntu.com/ubuntu/pool/main/i/intltool/intltool_%{version}.orig.tar.gz"
sha256 = "67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd"
strip_components = 1

[depends]
build = ["perl", "perl-xml-parser"]
run = ["perl", "perl-xml-parser", "gettext"]

[capabilities]
provides = []

[relations]
schema = 1
conflicts = []
replaces = []

[build]
configure = "./configure --prefix=/usr"
compile = "make -j%{jobs}"
install = '''
make DESTDIR=%{pkgdir} install
test -x %{pkgdir}/usr/bin/intltool-merge
test -s %{pkgdir}/usr/share/aclocal/intltool.m4
'''
